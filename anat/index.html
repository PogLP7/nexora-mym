{n:"Long palmaire",d:"Poignet · fléchisseur",o:"Fléchisseur du carpe · absent chez environ 30 % de la population",i:"I : aponévrose palmaire et rétinaculum des fléchisseurs"},
{n:"Long extenseur radial du carpe",d:"Poignet · extenseur",o:"Extension du poignet (+ abduction du poignet, + flexion du coude)",i:"O : crête supracondylaire latérale de l’humérus → I : base du 2e métacarpien"},
{n:"Court extenseur radial du carpe",d:"Poignet · extenseur",o:"Extension du poignet (+ abduction du poignet)",i:"I : base du 3e métacarpien"},
{n:"Extenseur ulnaire du carpe",d:"Poignet · extenseur",o:"Extension du poignet · adduction de la main",i:"I : base du 5e métacarpien"},
{n:"Droit fémoral",d:"Hanche / genou · bi-articulaire",o:"Hanche : flexion de la cuisse · Genou : extension de la jambe",i:"O : épine iliaque antéro-inférieure, sillon supra-acétabulaire → I : tubérosité tibiale via le ligament patellaire, patella"},
{n:"Grand glutéal",d:"Hanche · extenseur",o:"Extension et rotation externe de la hanche · fibres supérieures : abduction · fibres inférieures : adduction",i:"O : face externe de la fosse iliaque, crête sacrée, coccyx, fascia thoraco-lombaire, ligament sacro-tubéral → I : tubérosité glutéale du fémur, tractus ilio-tibial"},
{n:"Moyen glutéal",d:"Hanche · abducteur",o:"Abduction et rotation interne de la hanche",i:"I : face latérale du grand trochanter du fémur"},
{n:"Petit glutéal",d:"Hanche · abducteur",o:"Abduction et rotation interne de la hanche",i:"I : face antérieure du grand trochanter du fémur"},
{n:"Biceps fémoral",d:"Ischio-jambier",o:"Extension de la hanche (chef long) · flexion du genou · rotation externe du genou",i:"O : chef long sur la tubérosité ischiatique → I : tête de la fibula"},
{n:"Semi-tendineux",d:"Ischio-jambier",o:"Extension de la hanche (pied au sol) · flexion du genou (pied décollé) · rotation interne du genou",i:"O : tubérosité ischiatique → I : face supérieure et médiale du tibia"},
{n:"Semi-membraneux",d:"Ischio-jambier",o:"Extension de la hanche (bassin en antéversion) · rotateur interne de la hanche (bassin neutre) · flexion et rotation interne du genou",i:"O : tubérosité ischiatique → I : condyle médial tibial"},
{n:"Long adducteur",d:"Hanche · adducteur",o:"Adduction · rotation externe de la hanche (+ flexion)",i:"O : face antérieure du pubis → I : tiers moyen de la ligne âpre du fémur"},
{n:"Court adducteur",d:"Hanche · adducteur",o:"Adduction · rotation externe de la hanche (+ flexion)",i:"O : face externe de la branche ischio-pubienne → I : tiers moyen de la ligne âpre du fémur"},
{n:"Grand adducteur",d:"Hanche · adducteur",o:"Adduction · rotation externe · chef antérieur : flexion · chef postérieur : extension",i:"O : tubérosité ischiatique, branche inférieure du pubis → I : chef antérieur sur le tiers inférieur de la ligne âpre, chef postérieur sur le tubercule de l’adducteur"},
{n:"Gracile",d:"Hanche · adducteur",o:"Adduction · flexion de la hanche · flexion et rotation interne du genou",i:"O : bord inférieur de la branche ischio-pubienne → I : face antéro-médiale du tibia"},
{n:"Vaste médial",d:"Genou · quadriceps",o:"Extension du genou",i:"O : ligne intertrochantérique, ligne pectinée, ligne âpre, ligne supracondylaire médiale du fémur → I : tubérosité tibiale via le ligament patellaire, patella"},
{n:"Vaste latéral",d:"Genou · quadriceps",o:"Extension du genou",i:"O : ligne intertrochantérique, grand trochanter, tubérosité glutéale, ligne âpre du fémur → I : tubérosité tibiale, patella"},
{n:"Vaste intermédiaire",d:"Genou · quadriceps",o:"Extension du genou",i:"O : face antérieure de la diaphyse fémorale → I : tubérosité tibiale via le ligament patellaire, patella"},
{n:"Poplité",d:"Genou · rotateur interne",o:"Rotation interne du genou · initiation de la flexion",i:"O : condyle latéral → I : surface postérieure du tibia proximal"},
{n:"Sartorius",d:"Hanche / genou · bi-articulaire",o:"Hanche : flexion, abduction, rotation externe · Genou : flexion, rotation interne",i:"O : épine iliaque antéro-supérieure → I : extrémité proximale du tibia"},
{n:"Tenseur du fascia lata",d:"Hanche / genou · bi-articulaire",o:"Hanche : flexion, abduction, rotation interne · Genou : déjà fléchi → flexion, déjà étendu → extension",i:"O : épine iliaque antéro-supérieure, crête iliaque → I : fascia lata, condyle latéral du tibia"},
{n:"Tibial antérieur",d:"Cheville · fléchisseur dorsal",o:"Cheville : flexion dorsale du pied · Subtalaire : inversion du pied",i:"O : condyle et face latérale du tibia, membrane interosseuse → I : os cunéiforme médial, base du 1er métatarsien"},
{n:"Long extenseur des orteils",d:"Cheville · fléchisseur dorsal",o:"Extension des orteils 2 à 5 · flexion dorsale du pied · éversion du pied",i:"O : face médiale en antérieur de la fibula → I : face dorsale des orteils 2 à 5"},
{n:"Long extenseur de l’hallux",d:"Cheville · fléchisseur dorsal",o:"Extension de l’hallux · flexion dorsale · éversion du pied",i:"O : milieu de la face antérieure du tibia → I : hallux"},
{n:"Gastrocnémiens",d:"Cheville · fléchisseur plantaire",o:"Cheville : flexion plantaire · Genou : flexion (bi-articulaire)",i:"O : chef latéral sur le condyle fémoral latéral, chef médial sur le condyle fémoral médial → I : face postérieure du calcanéus via le tendon calcanéen"},
{n:"Soléaire",d:"Cheville · fléchisseur plantaire",o:"Cheville : flexion plantaire uniquement (mono-articulaire)",i:"O : ligne du muscle soléaire et bord médial du tibia, tête et bord postérieur de la fibula → I : face postérieure du calcanéus via le tendon calcanéen"},
{n:"Tibial postérieur",d:"Cheville · inverseur",o:"Inversion du pied (principal) · flexion plantaire accessoire",i:"O : faces postérieures du tibia et de la fibula → I : naviculaire, cunéiformes, cuboïde, bases des métatarsiens 2 à 4"},
{n:"Long fibulaire",d:"Cheville · éverseur",o:"Éversion du pied · flexion plantaire accessoire",i:"O : fibula → I : 1er métatarsien"},
{n:"Court fibulaire",d:"Cheville · éverseur",o:"Éversion du pied",i:"O : fibula → I : 5e métatarsien"}

var FICHES = [
{c:"c1",t:"★ Ce qui est évalué — et ce qui ne l’est pas",b:"<div class=\"evbox\"><b>Ce n’est pas qu’un QCM</b><span>Diapo 67, mot pour mot : « <b>Questions de cours (QCM, schémas à remplir, questions à trou etc.)</b> ». Le « etc. » laisse la porte ouverte. Entraîne-toi donc aussi en <b>Schémas</b> et en <b>Révision express</b>, pas seulement en QCM.</span></div><p><b>Date</b> : diapo 67, « à confirmer mais serait le <b>23/10 de 8h45 à 10h</b> ».</p><p><b>MCC</b> : 1 contrôle intermédiaire (<b>1h, coef 0,4</b>) + 1 contrôle terminal en janvier (<b>1h, coef 0,6</b>). 5 CM de 2h + 5 TD de 2h. Supports de cours <b>et QCMs sur Moodle</b> — pense à les faire, c’est la source la plus proche du contrôle.</p><h4 style=\"margin:16px 0 6px\">Les 3 compétences visées (diapo 5)</h4><ul><li>Connaitre le <b>nom des os et muscles principaux</b> du corps humain</li><li>Connaitre les <b>mouvements que favorisent les muscles</b></li><li>Être capable de <b>déterminer quels sont les principaux muscles sollicités lors d’une activité et leur mode de contraction</b></li></ul><p>Les deux premières sont couvertes par les flashcards, le tableau des muscles et les schémas. La troisième est une <b>analyse</b> : voir la fiche « Analyser une activité ».</p><h4 style=\"margin:16px 0 6px\">Deux phrases qui cadrent tout</h4><ul><li>Diapo 3 : « <b>Tout ce qui a été vu en L1 est considéré comme acquis</b> » — les bases ne seront pas réexpliquées, mais restent évaluables.</li><li>Diapo 6 : « Un tri est fait pour que vous ayez les connaissances/compétences principales à votre formation. <b>Certaines informations sont parfois données mais ne seront pas évaluées</b>. »</li></ul><h4 style=\"margin:16px 0 6px\">Le hors-programme a été retiré de l’app</h4><p><b>30 diapos sur 205</b> portent un badge noir « Pour information » en haut à droite, et il couvre <b>toute la diapo</b>, encadrés Fonction compris. Tout ce qui en venait a été <b>supprimé</b> : splénius, scalènes, transversaires épineux, muscles segmentaires, le « oui / non » atlanto-occipital, les origines-insertions détaillées de l’iliocostal, du longissimus et de l’épineux, les ligaments du rachis et du pelvis, les muscles des doigts et intrinsèques du pied. Ce qui reste dans l’app est évaluable.</p><p><b>Une nuance</b> : « pour information » ne veut pas dire inutile. Les repères du pelvis (EIAS, crête iliaque, tubérosité ischiale) sont tamponnés, mais ils reviennent partout comme <b>origines de muscles</b> — et là, c’est évalué. Ils sont donc restés.</p><h4 style=\"margin:16px 0 6px\">La seule diapo tamponnée « À retenir »</h4><p>Diapo 37, les <b>ligaments de la hanche</b> : capsulaires <b>ilio-fémoral, pubo-fémoral, ischio-fémoral</b> ; intracapsulaires <b>ligament transverse acétabulaire</b> et <b>ligament de la tête du fémur</b>. C’est le seul endroit du cours où elle écrit explicitement « à retenir ».</p>"},
{c:"c6",t:"★ Analyser une activité (compétence 3)",b:"<p>Troisième compétence annoncée diapo 5 : <b>déterminer quels sont les principaux muscles sollicités lors d’une activité et leur mode de contraction</b>. Les modes de contraction ne sont pas détaillés dans les diapos du CM (L1 acquis), voici la méthode.</p><h4 style=\"margin:14px 0 6px\">Les 3 modes de contraction</h4><table><tr><th>Mode</th><th>Longueur du muscle</th><th>Exemple</th></tr><tr><td><b>Concentrique</b></td><td>Il <b>raccourcit</b>, les insertions se rapprochent</td><td>Montée du squat (quadriceps), phase de traction</td></tr><tr><td><b>Excentrique</b></td><td>Il <b>s’allonge en freinant</b> la charge</td><td>Descente du squat (quadriceps), réception de saut</td></tr><tr><td><b>Isométrique</b></td><td><b>Longueur constante</b>, pas de mouvement</td><td>Gainage, maintien d’une posture</td></tr></table><h4 style=\"margin:16px 0 6px\">La méthode en 4 temps</h4><ul><li><b>1. L’articulation</b> et le <b>mouvement</b> observé (flexion, abduction, rotation…).</li><li><b>2. Le groupe</b> qui produit ce mouvement : va chercher la ligne correspondante dans l’onglet <b>Muscles</b>.</li><li><b>3. Le sens</b> : si le segment va <b>dans le sens</b> du muscle → <b>concentrique</b> ; s’il part dans l’autre sens et que le muscle <b>freine</b> → <b>excentrique</b> ; s’il ne bouge pas → <b>isométrique</b>.</li><li><b>4. Le point fixe</b> : rappel du CM, un muscle produit une force <b>à son origine ET à son insertion</b> ; c’est la <b>configuration du corps</b> et les forces extérieures qui décident du segment qui bouge. Jambe posée au sol, le psoas tire les lombaires ; allongé, il tire le fémur.</li></ul><h4 style=\"margin:16px 0 6px\">Trois exemples montés de bout en bout</h4><ul><li><b>Squat, phase de descente</b> — genou en flexion, hanche en flexion. Ce sont les <b>extenseurs</b> qui freinent : <b>quadriceps</b> et <b>grand glutéal</b> en <b>excentrique</b>, érecteurs du rachis en <b>isométrique</b> pour tenir le tronc.</li><li><b>Traction à la barre</b> — épaule en extension-adduction, coude en flexion : <b>grand dorsal</b>, <b>grand rond</b>, <b>biceps brachial</b> et <b>brachial</b> en <b>concentrique</b> à la montée, les mêmes en <b>excentrique</b> à la descente.</li><li><b>Gainage ventral</b> — rien ne bouge : <b>transverse de l’abdomen</b>, <b>droit de l’abdomen</b> et <b>obliques</b> en <b>isométrique</b>, érecteurs du rachis en <b>isométrique</b> aussi.</li></ul><p><b>Le réflexe du cours</b> : <i>Os → Articulation → Muscle → Mouvement</i>, puis le sens de la contraction.</p>"},
{c:"c1",t:"1 · Le rachis en chiffres",b:"<ul><li><b>24 vertèbres mobiles</b> : <b>7 cervicales</b>, <b>12 thoraciques</b>, <b>5 lombaires</b>.</li><li><b>Sacrum</b> = <b>fusion de 5 vertèbres</b>. <b>Coccyx</b> = <b>fusion de 3 à 5 vertèbres</b>.</li><li>La <b>taille des vertèbres est croissante de haut en bas</b> : la charge supportée est de plus en plus importante.</li><li>La <b>forme</b> des vertèbres est <b>légèrement différente</b> selon l’étage du rachis.</li><li><b>Cage thoracique</b> = <b>sternum</b> + <b>côtes</b> + <b>rachis thoracique</b>. Les <b>fausses côtes ne sont pas directement fixées au sternum</b>.</li></ul>"},
{c:"c1",t:"1 · Disque, appuis et degrés de liberté",b:"<ul><li><b>Disque intervertébral</b> (entre les corps vertébraux) : <b>noyau pulpeux</b> gélatineux au centre + <b>anneau fibreux</b> en périphérie.</li><li><b>3 appuis</b> par étage : le <b>disque intervertébral</b> + les <b>deux processus articulaires inférieurs</b>.</li><li><b>6 degrés de liberté</b> au rachis, <b>mais certains de très faible amplitude</b>.</li><li>De <b>nombreux ligaments</b> entourent et lient les vertèbres (pour information).</li></ul>"},
{c:"c1",t:"1 · Courbures et mouvements du tronc",b:"<p><b>Plan sagittal : 4 courbures</b>, alternées de haut en bas.</p><table><tr><th>Étage</th><th>Courbure</th></tr><tr><td>Cervical</td><td><b>Lordose</b> cervicale</td></tr><tr><td>Thoracique</td><td><b>Cyphose</b> dorsale / thoracique</td></tr><tr><td>Lombaire</td><td><b>Lordose</b> lombale</td></tr><tr><td>Sacré</td><td><b>Cyphose</b> sacrale</td></tr></table><p><b>Plan frontal</b> : rachis <b>globalement rectiligne</b>.</p><p><b>Mouvements du tronc</b> : <b>flexion / extension</b>, <b>inclinaison médiale / latérale</b>, <b>rotation interne / externe</b>. Les <b>angulations maximales</b> diffèrent aux niveaux cervical, thoracique et lombaire.</p>"},
{c:"c1",t:"1 · Tête et pelvis",b:"<ul><li><b>Atlanto-occipitale</b> (occiput / C1) → <b>flexion de la tête</b>, le « <b>oui</b> ».</li><li><b>C1 / C2</b> → <b>rotation de la tête</b>, le « <b>non</b> ».</li><li><b>Temporo-mandibulaire</b> : crâne / mandibule.</li><li><b>Pelvis</b> = <b>2 os coxaux</b> + <b>sacrum</b> + <b>coccyx</b>. Repères : <b>crête iliaque</b>, <b>EIAS</b>, <b>EIPS</b>, <b>tubérosité ischiale</b>.</li><li><b>Sacro-iliaques</b> : <b>synoviales mais peu mobiles</b>. <b>Symphyse pubienne</b> : <b>cartilagineuse</b>.</li></ul>"},
{c:"c2",t:"2 · Membre inférieur : os et repères",b:"<ul><li><b>Fémur</b>, <b>patella</b>, <b>tibia</b>, <b>fibula</b>.</li><li><b>7 tarses</b> + <b>5 métatarses</b> + <b>14 phalanges</b>.</li><li>Repères : <b>col du fémur</b>, <b>grand trochanter</b>, <b>malléole interne</b> (tibiale) et <b>malléole externe</b> (fibulaire).</li></ul>"},
{c:"c2",t:"2 · Hanche, genou, cheville",b:"<table><tr><th>Région</th><th>Articulation(s)</th></tr><tr><td>Hanche</td><td><b>coxo-fémorale</b></td></tr><tr><td>Genou</td><td><b>fémoro-tibiale + fémoro-patellaire</b></td></tr><tr><td>Cheville</td><td><b>talo-crurale</b></td></tr></table><ul><li><b>Hanche</b> — ligaments <b>capsulaires</b> : <b>ilio-fémoral</b>, <b>pubo-fémoral</b>, <b>ischio-fémoral</b> ; <b>intracapsulaires</b> : <b>ligament transverse acétabulaire</b>, <b>ligament de la tête du fémur</b>. Flexion plus ample <b>genou fléchi</b>.</li><li><b>Genou</b> — en réalité <b>rotation du fémur sur le plateau tibial + translation (glissement)</b>. La <b>tibio-fibulaire proximale</b> a une <b>mobilité très limitée</b>.</li><li><b>Cheville</b> — <b>tibia + fibula + talus</b> : la fibula et le tibia « <b>coincent</b> » le talus.</li></ul>"},
{c:"c2",t:"2 · Les mouvements du pied",b:"<ul><li>À la <b>talo-crurale</b> : surtout <b>flexion dorsale / plantaire</b>. Les <b>abd/add</b> et <b>prono/supination</b> y sont <b>légers (moins de 10 degrés)</b> et <b>accentués par les articulations du pied</b> (surtout <b>intertarsiennes</b>).</li><li><b>Inversion</b> = <b>adduction + supination + flexion plantaire</b>.</li><li><b>Éversion</b> = <b>abduction + pronation + flexion dorsale</b>.</li><li><b>Articulation transverse du tarse (Chopart)</b> = <b>talo-calcanéo-naviculaire</b> + <b>calcanéo-cuboïdienne</b>.</li><li><b>Orteils</b> : flexion / extension aux <b>métatarso-phalangiennes</b> et <b>interphalangiennes</b>.</li></ul>"},
{c:"c3",t:"3 · Ceinture scapulaire : les articulations",b:"<ul><li><b>Sterno-claviculaire</b> : surtout une <b>rotation</b> entre <b>manubrium et clavicule</b>.</li><li><b>Acromio-claviculaire</b> : surfaces <b>planes, elliptiques, juxtaposées sans emboîtement</b>, avec un <b>ménisque</b> → <b>mobile dans toutes les directions mais aucune stabilité</b>.</li><li><b>Scapulo-thoracique</b> : <b>plan de glissement</b> (bourse séreuse / couche cellulo-graisseuse), <b>pas synoviale</b> ; scapula <b>plaquée au thorax</b> par les muscles. <b>2 translations + 3 rotations</b> → <b>élévation / dépression</b>, <b>abduction (protraction) / adduction (rétraction)</b>.</li><li><b>Subacromiale</b> : plan de glissement. <b>Complexe coraco-claviculaire</b>.</li><li><b>Gléno-humérale</b> : <b>glène de la scapula / tête humérale</b>, congruence augmentée par le <b>labrum (bourrelet) glénoïdien</b>, anneau de <b>fibrocartilage</b>. <b>3 rotations</b>.</li></ul>"},
{c:"c3",t:"3 · Épaule : amplitudes et rythme",b:"<table><tr><th>Plan</th><th>Mouvement</th><th>Amplitude</th></tr><tr><td>Sagittal</td><td>Flexion / extension</td><td><b>180 / 60</b></td></tr><tr><td>Frontal</td><td>Abduction / adduction</td><td><b>180 / 45</b></td></tr><tr><td>Transverse</td><td>Rotation interne / externe</td><td><b>95 / 40</b></td></tr></table><p><b>Rythme scapulo-huméral</b> : de <b>0 à ~30 degrés</b>, mouvements <b>principalement à la gléno-humérale</b> ; <b>après ~30 degrés</b>, humérus et scapula bougent avec un rapport <b>~2:1</b>.</p>"},
{c:"c3",t:"3 · Coude, poignet, main",b:"<ul><li><b>Coude</b> = <b>huméro-ulnaire</b> + <b>huméro-radiale</b> (+ <b>radio-ulnaire proximale</b>). <b>Flexion max 140-150</b>, <b>extension max 0-10</b>. Le radius <b>glisse</b> le long de l’humérus.</li><li><b>Prono-supination</b> : <b>radio-ulnaires proximale et distale</b>. Le <b>col du radius pivote</b>. <b>Pronation max 90</b>, <b>supination max 90</b>.</li><li><b>Poignet</b> = <b>radio-carpiennes</b> + <b>médio-carpiennes</b>. <b>Flexion ~90</b> (surtout <b>médiocarpienne, 60 %</b>), <b>extension ~90</b> (surtout <b>radiocarpienne, ~66 %</b>). Déviations <b>réparties</b> entre les deux.</li><li><b>Doigts</b> : <b>MCP</b> (flexion max 90, extension max 30), <b>IPP</b> et <b>IPD</b>.</li><li><b>Pouce</b> : <b>trapézo-métacarpienne</b> (spéciale), <b>MCP max 60</b>, <b>IP max 60</b>.</li></ul>"},
{c:"c3",t:"3 · Le craquement articulaire",b:"<ul><li>Mécanisme : la <b>tribonucléation</b>. Deux surfaces unies par un <b>liquide visqueux</b> sont <b>séparées brusquement</b> : la <b>pression négative</b> couplée à la <b>vitesse de séparation</b> crée <b>temporairement une cavité</b>.</li><li><b>Unger (1998)</b>, <b>prix IgNobel 2007</b> : <b>50 ans</b> de craquements de la <b>main gauche</b> (<b>au moins 36 500 fois</b>) contre une main droite témoin → <b>aucune arthrite dans les deux mains</b>.</li><li>Pour le <b>rachis</b> : pas encore de certitudes sur le bruit lié à la manipulation.</li></ul>"},
{c:"c4",t:"4 · Classer les muscles + convention O/I",b:"<ul><li>Quatre entrées de classement : par <b>vue</b> (antérieure / postérieure), par <b>zone</b> (rachis, abdomen, thorax), par <b>profondeur</b> (superficiel ou extrinsèque, intermédiaire, profond ou intrinsèque), par <b>fonction</b>.</li><li><b>Convention du CM</b> : les <b>origines</b> = <b>jonctions proximales</b> (près de la tête) ; les <b>insertions</b> = <b>jonctions distales</b> (loin de la tête). <i>Certains manuels inversent.</i></li><li>Règle d’or : un muscle qui se contracte <b>produit une force à son origine ET à son insertion</b> → le mouvement observé dépend de la <b>configuration du corps</b> et des <b>forces extérieures</b>.</li></ul>"},
{c:"c4",t:"4 · Muscles du rachis : fonctions par groupe",b:"<table><tr><th>Groupe</th><th>Bilatéral</th><th>Unilatéral</th></tr><tr><td><b>Érecteurs</b> (iliocostal, longissimus, épineux)</td><td><b>Extension</b> de la zone</td><td><b>Inclinaison latérale</b></td></tr><tr><td><b>Splénius</b></td><td><b>Extension</b> tête et cou</td><td>Inclinaison + <b>rotation</b></td></tr><tr><td><b>Scalènes</b></td><td><b>Flexion</b> tête et cou + <b>élévation des côtes</b></td><td>Inclinaison + <b>rotation</b></td></tr><tr><td><b>Transversaires épineux</b> (semi-épineux, multifides, rotateurs)</td><td><b>Extension</b> tête et cou</td><td>Inclinaison + <b>rotation</b></td></tr><tr><td><b>Intertransversaires</b></td><td>Extension + rotation, <b>stabilisation</b></td><td>—</td></tr><tr><td><b>Interépineux</b></td><td>Extension</td><td>Inclinaison + <b>stabilisation</b></td></tr></table><p><b>Longissimus</b> = le plus long et le plus épais. <b>Épineux</b> = le plus petit.</p>"},
{c:"c4",t:"4 · Les abdominaux : tableau de synthèse",b:"<table><tr><th>Muscle</th><th>Niveau</th><th>Rotation (unilat)</th></tr><tr><td><b>Transverse</b></td><td>Le plus <b>profond</b></td><td>—</td></tr><tr><td><b>Oblique interne</b></td><td>Intermédiaire</td><td>Rotation <b>EXTERNE</b></td></tr><tr><td><b>Oblique externe</b></td><td>Superficiel</td><td>Rotation <b>INTERNE</b></td></tr><tr><td><b>Droit de l’abdomen</b></td><td>Paroi antérieure</td><td>—</td></tr></table><ul><li><b>Transverse</b> : O <b>ligne blanche</b> → I <b>cartilages costaux 7-12</b>, <b>L1-L5 via le fascia thoraco-lombal</b>, <b>crête iliaque</b>, <b>ligament inguinal</b>. Comprime les <b>viscères</b>, <b>expiration forcée</b>, <b>stabilité et posture</b>.</li><li><b>Oblique interne</b> : O <b>3 ou 4 dernières côtes + ligne blanche</b> → I <b>crête iliaque, ligament inguinal, fascia thoraco-lombaire</b>.</li><li><b>Oblique externe</b> : O <b>7 dernières côtes</b> → I <b>crête iliaque, ligne blanche, ligament inguinal, pubis</b>.</li><li><b>Droit de l’abdomen</b> : O <b>cartilages costaux 5-7 + processus xiphoïde</b> → I <b>pubis</b>. Son <b>relâchement accentue la lordose lombaire</b>.</li><li>Bilatéralement, tous les obliques et le droit sont <b>fléchisseurs du tronc</b> et assurent la <b>statique du tronc</b>.</li></ul>"},
{c:"c4",t:"4 · Carré des lombes et ilio-psoas",b:"<ul><li><b>Carré des lombes</b> — le <b>plus profond de la paroi abdominale postérieure</b>. O : <b>bord inférieur de la 12e côte</b>, <b>processus transverses L1-L4</b> → I : <b>crête iliaque</b>, <b>ligament iliolombaire</b>. Bilat : <b>extension du tronc</b> (immobilise la 12e côte) ; unilat : <b>inclinaison latérale</b>.</li><li><b>Ilio-psoas</b> = <b>iliaque (chef latéral)</b> + <b>grand psoas (chef médial)</b> (+ petit psoas). <b>Insertion commune : petit trochanter</b>.<ul><li><b>Iliaque</b> : O <b>fosse iliaque</b>, <b>EIAI</b>, <b>ligaments sacro-iliaque et iliolombaire antérieurs</b>, <b>base du sacrum</b> → <b>antéversion du bassin</b>, <b>flexion de hanche</b>.</li><li><b>Grand psoas</b> : O <b>corps vertébraux T12-L5</b>, <b>disques T12-L5</b>, <b>processus transverses L1-L5</b> → <b>flexion de hanche</b> (+ rotation externe), <b>flexion du tronc</b>, <b>favorise la lordose lombaire</b>.</li></ul></li><li><b>Pourquoi deux effets ?</b> <b>Jambe posée au sol</b> → plutôt mouvement <b>des lombaires</b> ; <b>allongé</b> → mouvement <b>des lombaires et du fémur</b>.</li></ul>"},
{c:"c5",t:"5 · Ceinture scapulaire : qui fait quoi",b:"<p>Tous ces muscles ont leur <b>origine sur le squelette axial</b> et leur <b>insertion sur la scapula ou la clavicule</b>.</p><table><tr><th>Muscle</th><th>Action sur la scapula</th></tr><tr><td><b>Élévateur de la scapula</b></td><td>Élévation + <b>rotation vers le bas</b></td></tr><tr><td><b>Grand rhomboïde</b></td><td>Élévation, <b>adduction</b>, rotation vers le bas, <b>stabilise</b></td></tr><tr><td><b>Petit rhomboïde</b></td><td>Idem (O : <b>C7-T1</b>)</td></tr><tr><td><b>Trapèze descendant</b></td><td><b>Élève</b> la scapula</td></tr><tr><td><b>Trapèze transversal</b></td><td><b>Adduction</b></td></tr><tr><td><b>Trapèze ascendant</b></td><td><b>Baisse</b> la scapula</td></tr><tr><td><b>Subclavier</b></td><td><b>Abaissement</b></td></tr><tr><td><b>Petit pectoral</b></td><td>Abduction + <b>rotation vers le BAS</b></td></tr><tr><td><b>Dentelé antérieur</b></td><td>Abduction + <b>rotation vers le HAUT</b></td></tr></table>"},
{c:"c5",t:"5 · Épaule : les 6 fonctions et leurs muscles",b:"<table><tr><th>Fonction</th><th>Principaux</th><th>Accessoires</th></tr><tr><td><b>Flexion</b></td><td><b>Deltoïde antérieur</b>, <b>grand pectoral</b>, <b>coraco-brachial</b></td><td>Chef long du biceps, subscapulaire</td></tr><tr><td><b>Extension</b></td><td><b>Deltoïde postérieur</b>, <b>grand rond</b>, <b>grand dorsal</b></td><td>—</td></tr><tr><td><b>Abduction</b></td><td><b>Supra-épineux</b> (0-15), <b>deltoïde médian</b> (au-delà)</td><td>Chef long du biceps, dentelé antérieur, trapèze</td></tr><tr><td><b>Adduction</b></td><td><b>Grand pectoral</b>, <b>grand dorsal</b>, <b>triceps</b>, <b>biceps</b></td><td>Grand rond, coraco-brachial</td></tr><tr><td><b>Rotation interne</b></td><td><b>Subscapulaire</b>, grand pectoral, grand dorsal, grand rond, deltoïde antérieur</td><td>—</td></tr><tr><td><b>Rotation externe</b></td><td><b>Infra-épineux</b>, <b>petit rond</b>, deltoïde postérieur</td><td>—</td></tr></table><p><b>Abduction complète</b> : <b>0-90</b> scapulo-humérale (supra-épineux + deltoïde) → <b>90-150</b> glissement scapulo-thoracique (dentelé antérieur + trapèze) → <b>150-180</b> incurvation du rachis (érecteurs du rachis).</p><p><b>Coiffe des rotateurs</b> = <b>supra-épineux + infra-épineux + petit rond + subscapulaire</b>, tous originaires de la <b>scapula</b> : ils <b>centrent la tête humérale dans la cavité glénoïde</b> et <b>resserrent la capsule</b>.</p>"},
{c:"c5",t:"5 · Bras et avant-bras",b:"<table><tr><th>Fonction</th><th>Muscles</th></tr><tr><td><b>Flexion du coude</b></td><td><b>Biceps brachial</b>, <b>brachial</b>, <b>brachioradial</b></td></tr><tr><td><b>Extension du coude</b></td><td><b>Triceps brachial</b>, <b>anconé</b></td></tr><tr><td><b>Pronation</b></td><td><b>Rond pronateur</b>, <b>carré pronateur</b></td></tr><tr><td><b>Supination</b></td><td><b>Supinateur</b>, <b>biceps brachial</b> (+ brachioradial)</td></tr></table><ul><li><b>Biceps brachial</b> : <b>bi-articulaire</b> — origines sur la <b>scapula</b> (chef court : <b>processus coracoïde</b> ; chef long : <b>tubercule supraglénoïdien</b>), insertion sur la <b>tubérosité radiale</b> → il agit à l’<b>épaule ET au coude</b>.</li><li><b>Triceps brachial</b> : <b>chef long</b> sur le <b>tubercule infraglénoïdal</b> (donc aussi <b>extenseur et adducteur du bras</b>), chefs <b>médial et latéral</b> sur la <b>face postérieure de l’humérus</b>.</li><li><b>Brachioradial</b> : il <b>ramène l’avant-bras en position neutre</b> de prono-supination.</li></ul>"},
{c:"c5",t:"5 · Poignet : fléchisseurs, extenseurs, déviations",b:"<table><tr><th>Muscle</th><th>Insertion</th><th>Action</th></tr><tr><td><b>Fléchisseur radial du carpe</b></td><td>Bases 2e et 3e MTC</td><td>Fléchisseur <b>principal</b> + <b>abduction</b></td></tr><tr><td><b>Fléchisseur ulnaire du carpe</b></td><td>Pisiforme, hamatum, base 5e MTC</td><td>Flexion + <b>déviation ulnaire</b></td></tr><tr><td><b>Long palmaire</b></td><td>Aponévrose palmaire, rétinaculum</td><td>Fléchisseur du carpe (absent chez <b>30 %</b>)</td></tr><tr><td><b>Long ext. radial du carpe</b></td><td>Base 2e MTC</td><td>Extension (+ abduction, + flexion du coude)</td></tr><tr><td><b>Court ext. radial du carpe</b></td><td>Base 3e MTC</td><td>Extension (+ abduction)</td></tr><tr><td><b>Ext. ulnaire du carpe</b></td><td>Base 5e MTC</td><td>Extension + <b>adduction</b></td></tr></table><p><b>Déviation radiale (abduction)</b> : fléchisseur radial + long et court extenseurs radiaux. <b>Déviation ulnaire (adduction)</b> : fléchisseur ulnaire + extenseur ulnaire. Règle : <b>radial → vers le pouce</b>, <b>ulnaire → vers le petit doigt</b>.</p>"},
{c:"c6",t:"6 · Hanche : les 6 fonctions",b:"<table><tr><th>Fonction</th><th>Principaux</th><th>Accessoires</th></tr><tr><td><b>Flexion</b></td><td><b>Ilio-psoas</b>, <b>droit fémoral</b></td><td>Pectiné, TFL, sartorius</td></tr><tr><td><b>Extension</b></td><td><b>Grand glutéal</b>, <b>biceps fémoral</b>, <b>semi-membraneux</b>, <b>semi-tendineux</b></td><td>Grand adducteur</td></tr><tr><td><b>Abduction</b></td><td><b>Moyen glutéal</b>, <b>petit glutéal</b></td><td>TFL, piriforme, sartorius</td></tr><tr><td><b>Adduction</b></td><td><b>Long</b>, <b>court</b> et <b>grand adducteurs</b>, <b>gracile</b></td><td>Pectiné, carré du fémur, fibres inf. du grand glutéal</td></tr><tr><td><b>Rotation interne</b></td><td><b>Moyen</b> et <b>petit glutéal</b></td><td>TFL, plupart des adducteurs</td></tr><tr><td><b>Rotation externe</b></td><td><b>Grand glutéal</b>, <b>obturateur interne</b>, <b>jumeaux sup. et inf.</b>, <b>carré du fémur</b>, <b>piriforme</b></td><td>Obturateur externe, sartorius</td></tr></table>"},
{c:"c6",t:"6 · Genou : les 4 fonctions",b:"<table><tr><th>Fonction</th><th>Principaux</th><th>Accessoires</th></tr><tr><td><b>Flexion</b></td><td><b>Biceps fémoral</b>, <b>semi-membraneux</b>, <b>semi-tendineux</b>, <b>poplité</b> (initiation)</td><td>Sartorius, gracile, gastrocnémiens</td></tr><tr><td><b>Extension</b></td><td><b>Quadriceps</b> : <b>droit fémoral</b>, <b>vaste médial</b>, <b>vaste latéral</b>, <b>vaste intermédiaire</b></td><td>TFL</td></tr><tr><td><b>Rotation interne</b></td><td><b>Poplité</b>, <b>semi-membraneux</b>, <b>semi-tendineux</b></td><td>Sartorius, gracile</td></tr><tr><td><b>Rotation externe</b></td><td><b>Biceps fémoral</b></td><td>—</td></tr></table><p><b>Insertion commune du quadriceps</b> : <b>tubérosité tibiale via le ligament patellaire</b> + <b>patella</b>.</p><p><b>Muscles difficilement classables</b> : <b>sartorius</b> (hanche : flexion, abduction, <b>rotation externe</b> ; genou : flexion, rotation interne) et <b>TFL</b> (hanche : flexion, abduction, <b>rotation interne</b> ; genou : déjà fléchi → flexion, déjà étendu → extension).</p>"},
{c:"c6",t:"6 · Cheville et pied",b:"<table><tr><th>Fonction</th><th>Principaux</th><th>Accessoires</th></tr><tr><td><b>Flexion dorsale</b></td><td><b>Tibial antérieur</b>, <b>long extenseur des orteils</b></td><td>3e fibulaire</td></tr><tr><td><b>Flexion plantaire</b></td><td><b>Gastrocnémiens</b>, <b>soléaire</b> (= <b>triceps sural</b>)</td><td>Tibial postérieur, long fléchisseur des orteils, long et court fibulaires</td></tr><tr><td><b>Inversion</b></td><td><b>Tibial postérieur</b></td><td>Tibial antérieur</td></tr><tr><td><b>Éversion</b></td><td><b>Long fibulaire</b>, <b>court fibulaire</b></td><td>3e fibulaire</td></tr></table><ul><li><b>Triceps sural</b> = gastrocnémien <b>médial</b> + gastrocnémien <b>latéral</b> + <b>soléaire</b> → <b>tendon calcanéen</b> sur la <b>face postérieure du calcanéus</b>.</li><li><b>Gastrocnémiens</b> : O <b>condyles fémoraux</b> → <b>bi-articulaires</b> : flexion plantaire <b>+ flexion du genou</b>.</li><li><b>Soléaire</b> : O <b>tibia et fibula</b> → <b>mono-articulaire</b> : <b>flexion plantaire seule</b>.</li><li>Repère : <b>tibial = inversion</b>, <b>fibulaire = éversion</b>.</li></ul>"},
{c:"c6",t:"6 · Les muscles bi-articulaires",b:"<p>Un muscle <b>bi-articulaire</b> franchit <b>deux articulations</b> : son action <b>dépend de la posture du corps</b> et des forces extérieures.</p><ul><li><b>Droit fémoral</b> : hanche (flexion) + genou (extension).</li><li><b>Ischio-jambiers</b>, <b>sauf le chef court du biceps fémoral</b> : hanche (extension) + genou (flexion et rotation).</li><li><b>Gastrocnémiens</b> : genou (flexion) + cheville (flexion plantaire).</li><li><b>Sartorius</b>, <b>gracile</b>, <b>tenseur du fascia lata</b>.</li><li>Au membre supérieur : <b>biceps brachial</b> et le <b>chef long du triceps brachial</b>.</li></ul>"},
{c:"c1",t:"★ Les pièges qui coûtent des points",b:"<ul><li><b>Oblique interne → rotation EXTERNE</b> ; <b>oblique externe → rotation INTERNE</b>. Inversé par rapport au nom.</li><li><b>Petit pectoral → rotation vers le BAS</b> de la scapula ; <b>dentelé antérieur → rotation vers le HAUT</b>.</li><li><b>Coiffe des rotateurs</b> : <b>PETIT rond</b>, pas le grand rond.</li><li><b>Sartorius → rotation externe</b> de hanche ; <b>TFL → rotation interne</b>. Même origine (<b>EIAS</b>), même flexion + abduction.</li><li><b>Droit fémoral → EIAI</b> ; <b>sartorius et TFL → EIAS</b>.</li><li><b>Gastrocnémiens</b> fléchissent le genou, <b>pas le soléaire</b>.</li><li><b>Sacro-iliaques = synoviales</b> peu mobiles ; <b>symphyse pubienne = cartilagineuse</b>.</li><li><b>Scapulo-thoracique</b> = <b>plan de glissement</b>, <b>pas</b> une articulation synoviale.</li><li><b>Splénius → extension</b> (bilat) ; <b>scalènes → flexion</b> (bilat).</li><li><b>Convention du CM</b> : origine = proximale (près de la tête), insertion = distale.</li></ul>"}
];

var cv=$("cfx"),cx=cv.getContext("2d"),PS=[],raf=null;
function fit(){cv.width=innerWidth;cv.height=innerHeight}fit();addEventListener("resize",fit);
function burst(n){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  var st=getComputedStyle(document.documentElement);
  var cols=[st.getPropertyValue("--brand").trim(),st.getPropertyValue("--brand2").trim(),
            st.getPropertyValue("--brand3").trim(),st.getPropertyValue("--ok").trim()];
  for(var i=0;i<(n||70);i++)PS.push({x:innerWidth/2,y:innerHeight*.36,
    vx:(Math.random()-.5)*15,vy:Math.random()*-13-4,g:.4,s:Math.random()*7+3,
    c:cols[(Math.random()*cols.length)|0],r:Math.random()*6,vr:(Math.random()-.5)*.4,l:1});
  if(PS.length&&!raf)loop();
}
function loop(){
  (function step(){
    cx.clearRect(0,0,cv.width,cv.height);
    for(var i=PS.length-1;i>=0;i--){var p=PS[i];
      p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l-=.009;
      if(p.l<=0||p.y>cv.height+40){PS.splice(i,1);continue}
      cx.save();cx.globalAlpha=Math.max(0,p.l);cx.translate(p.x,p.y);cx.rotate(p.r);
      cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore();}
    if(PS.length)raf=requestAnimationFrame(step);else{raf=null;cx.clearRect(0,0,cv.width,cv.height)}
  })();
}

function flip(){

function rate(r){
  if(!FLIP)return;
  var id=FQ[FI];
  if(r===0){S.lvl[id]=0;S.combo=0;FQ.push(id)}
  else if(r===1){S.lvl[id]=Math.max(0,lvlOf(id));S.combo=0;FQ.push(id)}
  else{
    S.lvl[id]=Math.min(3,lvlOf(id)+1);S.combo=(S.combo||0)+1;
    if(S.combo>(S.best||0))S.best=S.combo;
    if(S.combo%5===0){combo(S.combo+" d’affilée");buzz(25);if(S.combo%10===0)burst(55)}
  }
  save();FI++;FLIP=false;
  var fc=$("fc");
  if(fc){fc.style.transition="transform .2s var(--ease),opacity .2s";
    fc.style.transform=(r===2?"translateX(88px)":"translateX(-88px)")+" rotate("+(r===2?4:-4)+"deg)";
    fc.style.opacity="0";}
  setTimeout(drawCard,160);
}
function swipe(el){
  var x0=null;
  el.addEventListener("pointerdown",function(e){x0=e.clientX});
  el.addEventListener("pointermove",function(e){
    if(x0===null||!FLIP)return;
    var dx=e.clientX-x0;
    el.style.transform="rotateY(180deg) translateX("+(-dx)+"px) rotate("+(-dx*.04)+"deg)";
  });
  el.addEventListener("pointerup",function(e){
    if(x0===null)return;var dx=e.clientX-x0;x0=null;
    if(FLIP&&Math.abs(dx)>90){rate(dx>0?2:0);return}
    el.style.transform="";
  });
  el.addEventListener("pointercancel",function(){x0=null;el.style.transform=""});
}

var SRec=window.SpeechRecognition||window.webkitSpeechRecognition,REC=null;
var MAC=/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent);
var LOCALF=(location.protocol==="file:");

function micStop(){MICWANT=false;if(REC){try{REC.stop()}catch(e){}REC=null}}
var MICWANT=false;
function micWire(btnId,get,set){
  var btn=$(btnId);if(!btn)return;
  function idle(){btn.classList.remove("on");btn.innerHTML="<i></i>Dicter ma réponse"}
  btn.onclick=function(){
    if(REC){micStop();idle();toast("Dictée arrêtée — appuie sur Corriger");return}
    var r;try{r=new SRec()}catch(e){toast("Dictée indisponible ici");return}
    r.lang="fr-FR";r.continuous=true;r.interimResults=true;
    var base=get(),fatal=false;
    r.onresult=function(e){
      var fin="",itr="";
      for(var i=e.resultIndex;i<e.results.length;i++){
        if(e.results[i].isFinal)fin+=e.results[i][0].transcript;
        else itr+=e.results[i][0].transcript;
      }
      if(fin)base=(base?base+" ":"")+fin.trim();
      set(base+(itr?(base?" ":"")+itr:""));
    };
    r.onerror=function(ev){
      if(ev.error==="not-allowed"||ev.error==="service-not-allowed")fatal=true;
      var m=ev.error==="not-allowed"?"Micro refusé — autorise-le dans le navigateur":
            ev.error==="no-speech"?"Je n\u2019ai rien entendu — continue, j\u2019écoute":
            ev.error==="service-not-allowed"?"Dictée bloquée ici — utilise celle du système":
            ev.error==="aborted"?"":"Micro : "+ev.error;
      if(m)toast(m);
    };
    r.onend=function(){
      /* la reconnaissance se coupe d\u2019elle-même après un silence : on relance tant qu\u2019il n\u2019a pas appuyé sur stop */
      if(MICWANT&&!fatal){try{r.start();return}catch(e){}}
      REC=null;MICWANT=false;idle();
    };
    try{r.start()}catch(e){toast("Dictée indisponible ici");return}
    REC=r;MICWANT=true;btn.classList.add("on");btn.innerHTML="<i></i>J\u2019écoute \u2014 appuie pour arrêter";
    buzz(14);
  };
}
function micTA(btnId,taId){
  var ta=$(taId);if(!ta)return;
  micWire(btnId,function(){return ta.value},function(v){
    ta.value=v;ta.dispatchEvent(new Event("input"));
  });
}
/* termes clés d’une réponse de flashcard (les <em>) */
function cardTerms(html){
  var out=[],re=/<em>([\s\S]*?)<\/em>/g,m;
  while((m=re.exec(html))){
    var t=m[1].replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
    if(t.length>=4&&t.length<=58&&out.indexOf(t)<0)out.push(t);
  }
  return out.slice(0,8);
}

/* ============ RÉVISION EXPRESS (session d’exercices) ============ */
var XR=null,XPASS=.6;
function mmss(s){var m=Math.floor(s/60),x=s%60;return m+":"+(x<10?"0":"")+x}
function shuf(a){for(var i=a.length-1;i>0;i--){var r=(Math.random()*(i+1))|0,t=a[i];a[i]=a[r];a[r]=t}return a}
function pickFrom(n,ids,weak){
  var a=ids.slice(0);
  if(weak)a.sort(function(x,y){var d=weak(x)-weak(y);return d!==0?d:(Math.random()-.5)});
  else shuf(a);
  return a.slice(0,n);
}
function pick(n,total,weak){
  var ids=[];for(var i=0;i<total;i++)ids.push(i);
  if(weak)ids.sort(function(a,b){var d=weak(a)-weak(b);return d!==0?d:(Math.random()-.5)});
  else shuf(ids);
  return ids.slice(0,n);
}
/* --- correspondance souple : accents, conjugaisons, ordre libre --- */
var XSUF=/(ations?|ateurs?|atrices?|ements?|ances?|ences?|iques?|istes?|ismes?|euses?|eurs?|elles?|ants?|ents?|ions|ons|ez|er|ir|ees?|es?|s)$/;
function stemW(w){var r=w.replace(XSUF,"");return r.length>=3?r:w}
function xBag(t){
  var ws=t.split(/[^a-z0-9]+/),o=[];
  for(var i=0;i<ws.length;i++)if(ws[i].length>=3)o.push(stemW(ws[i]));
  return o;
}
function xPref(a,b){var n=Math.min(a.length,b.length);return n<4?a===b:a.slice(0,n)===b.slice(0,n)}
function termScore(nv,term){
  var t=norm(term);
  if(t&&nv.indexOf(t)>=0)return 1;
  var all=xBag(t),key=[],i,j;
  for(i=0;i<all.length;i++)if(all[i].length>=4)key.push(all[i]);
  if(!key.length)key=all;
  if(!key.length)return 0;
  var ab=xBag(nv),hit=0;
  for(i=0;i<key.length;i++)
    for(j=0;j<ab.length;j++)if(xPref(key[i],ab[j])){hit++;break}
  return hit===key.length?1:(hit>0?.5:0);
}
function altScore(nv,k){
  var p=k.split("|"),best=0;
  for(var i=0;i<p.length;i++){var sc=termScore(nv,p[i]);if(sc>best)best=sc}
  return best;
}
function termFound(nv,t){return termScore(nv,t)===1}
function altFound(nv,k){return altScore(nv,k)===1}
function xHit(v,k){return altFound(v,k)}
/* termes clés d’une réponse de flashcard */
function xTerms(html){
  var out=[],re=/<em>([\s\S]*?)<\/em>/g,m;
  while((m=re.exec(html))){
    var t=m[1].replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
    if(t.length>=4&&t.length<=58&&out.indexOf(t)<0)out.push(t);
  }
  return out;
}
function note20(f,tot){return tot?Math.max(0,Math.min(20,Math.round(20*Math.pow(f/tot,.8)))):0}
/* evaluation commune : chaque element vaut 1, 0,5 ou 0 */
function xEval(nv,keys){
  var rows=[],got=0;
  for(var i=0;i<keys.length;i++){
    var st=altScore(nv,keys[i].k);
    rows.push({l:keys[i].l,st:st});got+=st;
  }
  return {rows:rows,got:got,max:keys.length,note:note20(got,keys.length)};
}
function xRows(ev){
  var g="",h="",m="",i;
  for(i=0;i<ev.rows.length;i++){
    var r=ev.rows[i],li='<div class="xli '+(r.st===1?"found":r.st?"half":"miss")+'"><span>'+(r.st===1?"✓":r.st?"~":"✗")+'</span>'+r.l+'</div>';
    if(r.st===1)g+=li;else if(r.st)h+=li;else m+=li;
  }
  var out="";
  if(g)out+='<div class="xgroup"><div class="lbl">Bien vu</div><div class="xlist">'+g+'</div></div>';
  if(h)out+='<div class="xgroup"><div class="lbl">À moitié — précise-le</div><div class="xlist">'+h+'</div></div>';
  if(m)out+='<div class="xgroup"><div class="lbl">Oublié — c’est ça qu’il faut retenir</div><div class="xlist">'+m+'</div></div>';

}

/* ---------- construction ---------- */
function xBuild(mode){
  var N=mode==="ultra"?{q:14,c:14,l:8,r:6}:mode==="long"?{q:10,c:10,l:6,r:4}:{q:5,c:5,l:3,r:2};
  var q=[],i;
  var qok=[];for(i=0;i<QCM.length;i++)qok.push(i);
  var qs=pickFrom(N.q,qok,function(a){return S.qcm[a]===undefined?1:(S.qcm[a]?2:0)});
  for(i=0;i<qs.length;i++)q.push({t:"qcm",i:qs[i]});
  var cand=[];
  for(i=0;i<FLASH.length;i++)if(xTerms(FLASH[i].a).length>=3)cand.push(i);
  cand.sort(function(a,b){var d=lvlOf(a)-lvlOf(b);return d!==0?d:(Math.random()-.5)});
  for(i=0;i<Math.min(N.c,cand.length);i++)q.push({t:"card",i:cand[i]});
  var ls=pick(N.l,XLISTES.length);
  for(i=0;i<ls.length;i++)q.push({t:"liste",i:ls[i]});
  var rs;
  if(mode==="ultra"){
    var pr=[],ot=[];
    for(i=0;i<EXAM.length;i++)(EXAM[i].p?pr:ot).push(i);
    rs=shuf(pr).concat(shuf(ot)).slice(0,N.r);
  }else rs=pick(N.r,EXAM.length,function(a){return S.exam[a]===undefined?1:S.exam[a]});
  for(i=0;i<rs.length;i++)q.push({t:"redac",i:rs[i]});
  for(i=0;i<q.length;i++){q[i].tries=0;q[i].ko=false}
  var n=q.length,b1=Math.ceil(n/3),b2=Math.ceil(n*2/3);
  XR={q:q,i:0,n0:n,bounds:[b1,b2],shown:{},notes:[],t0:Date.now(),mode:mode,retry:false};
  renderExpress();
}
function xMancheOf(i){return i<XR.bounds[0]?1:i<XR.bounds[1]?2:3}

function renderExpress(){
  if(!XR)return xIntro();
  if(XR.i>=XR.q.length)return xEnd();
  if(!XR.retry&&XR.bounds.indexOf(XR.i)>=0&&!XR.shown[XR.i]){XR.shown[XR.i]=1;return xPause()}
  xDraw();
}

function xMoy(){

}

/* note obtenue : on avance, on remet en file si ça a coincé */
function xScore(nt){

    var cp={t:it.t,i:it.i,tries:0,ko:false};

function xAgain(){XR.q[XR.i].tries++;XR.q[XR.i].ko=true;XR.retry=true;xDraw()}
function xDraw(){
  var it=XR.q[XR.i];
  if(it.t==="qcm")return xQcm(it);
  if(it.t==="card")return xEcrit(it);
  if(it.t==="liste")return xListe(it);

}
/* ---------- QCM ---------- */
function xQcm(it){
  var q=QCM[it.i],L=["A","B","C","D"],ord=[];
  for(var z=0;z<q.o.length;z++)ord.push(z);shuf(ord);
  var kk=ord.indexOf(q.k);
  var h='<h2 style="margin:12px 0 18px;font-size:clamp(17px,3.4vw,21px);line-height:1.34">'+q.q+'</h2><div id="xo">';
  for(var i=0;i<ord.length;i++)h+='<button class="opt" data-i="'+i+'"><span class="k">'+L[i]+'</span><span>'+q.o[ord[i]]+'</span></button>';
  h+='</div><div id="xres"></div>';
  xShell(h);
  $("xo").onclick=function(e){
    var b=e.target.closest("[data-i]");if(!b||b.disabled)return;
    var i=+b.getAttribute("data-i"),bs=$("xo").querySelectorAll(".opt");
    for(var j=0;j<bs.length;j++){bs[j].disabled=true;
      if(j===kk)bs[j].classList.add("ok");else if(j===i)bs[j].classList.add("no")}
    var good=(i===kk);
    S.qcm[it.i]=good?1:0;save();buzz(good?14:[10,40,10]);
    var nt=good?20:0;
    if(!good)XR.q[XR.i].ko=true;
    $("xres").innerHTML='<div class="xverdict '+(good?"win":"lose")+'"><b>'+nt+'<span>/20</span></b><span>'+(good?"Exact.":"Raté — la bonne réponse est en vert.")+'</span></div>'+
      '<div class="why"><b>'+(good?"Pourquoi :":"À retenir :")+'</b> '+q.w+'</div>'+
      '<div class="row" style="margin-top:16px"><button class="btn pri full" id="xn">Question suivante</button></div>'+
      (good?"":'<div class="mini" style="margin-top:10px">Elle reviendra plus tard dans la session.</div>');
    $("xn").onclick=function(){xScore(nt)};
  };
}

/* ---------- Réponse écrite ---------- */
function xWrite(opt){
  var h='';
  if(opt.lbl)h+='<div class="lbl">'+opt.lbl+'</div>';
  h+='<h2 style="margin:12px 0 10px;font-size:clamp(18px,3.6vw,23px);line-height:1.3">'+opt.q+'</h2>'+
     '<p class="sub" style="margin-bottom:14px">'+opt.sub+'</p>'+opt.pre+
     '<div class="row" style="margin-bottom:10px">'+micHtml("xmic")+'</div>'+
     '<textarea id="xta" placeholder="Ta réponse…" style="min-height:'+(opt.tall?160:130)+'px"></textarea>'+
     '<div class="xcount"><span id="xcnt">0</span> / '+opt.keys.length+' '+opt.unit+'</div>'+
     '<div class="row" style="margin-top:14px"><button class="btn pri full" id="xok">Corriger</button></div>'+
     '<div id="xres"></div>';
  xShell(h);
  var ta=$("xta");if(SRec&&!LOCALF)micTA("xmic","xta");
  ta.addEventListener("input",function(){
    var ev=xEval(norm(ta.value),opt.keys),f=0;
    for(var i=0;i<ev.rows.length;i++)if(ev.rows[i].st===1)f++;
    $("xcnt").textContent=f;
  });
  setTimeout(function(){try{ta.focus()}catch(e){}},60);
  $("xok").onclick=function(){
    micStop();
    var ev=xEval(norm(ta.value),opt.keys);
    $("xok").parentNode.style.display="none";
    if(opt.after)opt.after(ev);
    xReport(ev,opt.modele);
  };
}
function xReport(ev,modele){
  var it=XR.q[XR.i],nt=ev.note,ok=nt>=12;
  if(it.first===undefined)it.first=nt;
  if(it.first<12)it.ko=true;
  var mot=nt>=17?"Très bien.":nt>=14?"Bien.":nt>=12?"Ça passe — complète ce qui manque.":
          nt>=8?"Il y a de l’idée, mais l’essentiel manque.":
          nt>=4?"Tu effleures. Regarde ce qui est attendu.":"Les éléments attendus ne sont pas là.";
  var h='<div class="xverdict '+(ok?"win":"lose")+'"><b>'+nt+'<span>/20</span></b><span>'+mot+'</span></div>'+xRows(ev);
  if(modele)h+='<div class="corrige" style="margin-top:16px"><h4>La réponse complète</h4><div class="prose">'+modele+'</div></div>';
  h+='<div class="row" style="margin-top:18px"><button class="btn pri" id="xre" style="flex:1">Je la refais maintenant</button>'+
     '<button class="btn" id="xn">Question suivante</button></div>';
  if(it.ko)h+='<div class="mini" style="margin-top:10px">Elle reviendra aussi plus tard dans la session.</div>';
  $("xres").innerHTML=h;
  $("xre").onclick=function(){xAgain()};
  $("xn").onclick=function(){xScore(nt)};
  $("xres").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function xEcrit(it){
  var c=FLASH[it.i],T=xTerms(c.a),keys=[],chn="";
  for(var i=0;i<T.length;i++)keys.push({k:T[i],l:T[i]});
  for(var k=0;k<CHAPS.length;k++)if(CHAPS[k].id===c.c)chn="Chapitre "+(k+1);
  xWrite({lbl:chn,q:c.q,keys:keys,unit:"éléments attendus",modele:c.a,tall:true,
    sub:"Écris ta réponse avec tes mots. "+T.length+" éléments sont attendus.",
    pre:it.tries?'<div class="xretry">Tentative '+(it.tries+1)+" — tu viens de voir la correction, refais-la de tête.</div>":"",
    after:function(ev){if(ev.note>=12)S.lvl[it.i]=Math.min(3,lvlOf(it.i)+1);else S.lvl[it.i]=0;save();buzz(ev.note>=12?16:[10,40,10])}});
}
function xListe(it){
  var L=XLISTES[it.i],keys=[];
  for(var i=0;i<L.it.length;i++)keys.push({k:L.it[i].k,l:L.it[i].l});
  xWrite({q:L.q,keys:keys,unit:"trouvés",modele:null,
    sub:"Tape-les, séparés par des virgules. Ils se cochent au fur et à mesure.",
    pre:it.tries?'<div class="xretry">Tentative '+(it.tries+1)+" — redonne la liste complète de tête.</div>":"",
    after:function(ev){buzz(ev.note>=12?16:[10,40,10])}});
}
function xRedac(it){
  var q=EXAM[it.i],keys=[],plan='<div class="lbl" style="margin-bottom:8px">Plan attendu</div><div class="chips">';
  for(var i=0;i<q.kw.length;i++)keys.push({k:q.kw[i],l:q.kw[i]});
  for(i=0;i<q.plan.length;i++)plan+='<span class="chip plan">'+q.plan[i]+'</span>';
  plan+='</div>';
  xWrite({q:q.q,keys:keys,unit:"notions attendues",modele:q.rep,tall:true,
    sub:"Rédige comme au contrôle. Le plan attendu est juste en dessous.",
    pre:plan+(it.tries?'<div class="xretry">Tentative '+(it.tries+1)+" — reprends en intégrant ce qui manquait.</div>":""),
    after:function(ev){S.exam[it.i]=ev.note>=16?2:ev.note>=12?1:0;save();buzz(ev.note>=12?16:[10,40,10])}});
}

function initSkel(){

         cv.getContext("experimental-webgl",{alpha:true})}catch(e){gl=null}

  var seed=20261021;
  function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}

  var pos=[],scat=[],ext=[],kind=[],meta=[];
  var LAYER=0,MID=0;
  function push(x,y,z,k,size,bright){
    pos.push(x,y,z);kind.push(k);ext.push(size,bright,rnd());meta.push(LAYER,MID);
    var th=rnd()*6.2832,ph=Math.acos(2*rnd()-1),rad=2.1+rnd()*2.4;
    scat.push(rad*Math.sin(ph)*Math.cos(th),rad*Math.cos(ph)*0.8,rad*Math.sin(ph)*Math.sin(th)*0.6);
  }

    for(var i=0;i<n;i++){
      var t=rnd(),r=r0+(r1-r0)*t;
      var th=rnd()*6.2832,rr=r*Math.sqrt(rnd());
      var dx=b[0]-a[0],dy=b[1]-a[1],dz=b[2]-a[2];
      var L=Math.sqrt(dx*dx+dy*dy+dz*dz)||1;
      var ux=dx/L,uy=dy/L,uz=dz/L;
      var ax=Math.abs(ux)<0.9?1:0,ay=Math.abs(ux)<0.9?0:1;
      var px=uy*0-uz*ay,py=uz*ax-ux*0,pz=ux*ay-uy*ax;
      var pl=Math.sqrt(px*px+py*py+pz*pz)||1;px/=pl;py/=pl;pz/=pl;
      var qx=uy*pz-uz*py,qy=uz*px-ux*pz,qz=ux*py-uy*px;
      var ox=(px*Math.cos(th)+qx*Math.sin(th))*rr;
      var oy=(py*Math.cos(th)+qy*Math.sin(th))*rr;
      var oz=(pz*Math.cos(th)+qz*Math.sin(th))*rr;

      var x=q*Math.sin(ph)*Math.cos(th),y=q*Math.cos(ph),z=q*Math.sin(ph)*Math.sin(th);

    for(var i=0;i<n;i++){

      if(u*u+v*v>1)continue;

      push(c[0]+u*ax[0]+v*bx[0]+warp[0]*v*v+th,

  function belly(a,b,r0,r1,n,k,flat){
    for(var i=0;i<n;i++){

          drag:false,px:0,py:0,on:true,raf:null,zoom:1,ctr:[0,-0.2,0],ctrT:[0,-0.2,0],pinch:0,brand:[0.8,1,0.24],bone:[0.93,0.91,0.85],mcol:[0.88,0.3,0.32],light:false};
  function brand(){
    var c=getComputedStyle(document.documentElement).getPropertyValue("--brand").trim();
    var m=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(c.replace("#",""));
    if(m)st.brand=[parseInt(m[1],16)/255,parseInt(m[2],16)/255,parseInt(m[3],16)/255];
    var bg=getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
    var g=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(bg.replace("#",""));
    var lum=g?(0.2126*parseInt(g[1],16)+0.7152*parseInt(g[2],16)+0.0722*parseInt(g[3],16))/255:0;
    st.light=lum>0.5;
    /* en fond clair l’os additif ivoire disparaîtrait : encre sombre + alpha classique */
    st.bone=st.light?[0.12,0.10,0.08]:[0.93,0.91,0.85];
    st.mcol=st.light?[0.6,0.12,0.13]:[1.0,0.26,0.24];
  }
  brand();
  function frame(){
    st.raf=null;
    if(!st.on)return;
    var now=Date.now(),el=(now-st.t0)/1000;
    st.intro=Math.min(1,el/2.1);
    if(!st.drag){
      if(!RM)st.rotY+=0.0022+st.vel;
      st.vel*=0.94;
    }
    gl.clear(gl.COLOR_BUFFER_BIT);
    if(st.light)gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);else gl.blendFunc(gl.SRC_ALPHA,gl.ONE);
    gl.uniform1f(U.uAlphaK,st.light?1.7:1);
    gl.uniform1f(U.uDim,st.light?0.55:0.33);
    gl.uniform3f(U.uBone,st.bone[0],st.bone[1],st.bone[2]);
    gl.uniform3f(U.uMusCol,st.mcol[0],st.mcol[1],st.mcol[2]);
    gl.uniform1f(U.uIntro,st.intro);
    gl.uniform1f(U.uRotY,st.rotY);
    gl.uniform1f(U.uRotX,st.rotX);
    gl.uniform1f(U.uAspect,V.aspect);
    gl.uniform1f(U.uFocal,V.focal);
    gl.uniform1f(U.uCam,V.cam);
    gl.uniform1f(U.uScale,V.scale);
    gl.uniform1f(U.uDpr,V.dpr);
    gl.uniform1f(U.uFocus,st.focus);
    gl.uniform1f(U.uMus,st.mus);
    gl.uniform1f(U.uShowB,st.showB);
    gl.uniform1f(U.uShowM,st.showM);
    gl.uniform1f(U.uT,el);
    gl.uniform1f(U.uBreath,RM?0:0.5+0.5*Math.sin(el*0.85));
    for(var ci=0;ci<3;ci++)st.ctr[ci]+=(st.ctrT[ci]-st.ctr[ci])*0.08;
    gl.uniform1f(U.uZoom,st.zoom);
    gl.uniform3f(U.uCenter,st.ctr[0],st.ctr[1],st.ctr[2]);
    gl.uniform3f(U.uBrand,st.brand[0],st.brand[1],st.brand[2]);
    gl.drawArrays(gl.POINTS,0,ACC);
    /* accessoires en alpha classique : en additif le rose saturerait en blanc */
    gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
    gl.drawArrays(gl.POINTS,ACC,N-ACC);
    st.raf=requestAnimationFrame(frame);
  }
  function start(){if(!st.raf&&st.on)st.raf=requestAnimationFrame(frame)}
  function stop(){if(st.raf){cancelAnimationFrame(st.raf);st.raf=null}}
  function down(e){st.drag=true;st.px=(e.touches?e.touches[0]:e).clientX;st.py=(e.touches?e.touches[0]:e).clientY}
  function move(e){
    if(!st.drag)return;
    var x=(e.touches?e.touches[0]:e).clientX,y=(e.touches?e.touches[0]:e).clientY;
    var ox=st.px,oy=st.py;
    var dx=(x-st.px)/Math.max(160,V.W),dy=(y-st.py)/Math.max(160,V.H);
    st.px=x;st.py=y;
    st.rotY+=dx*3.1;st.vel=dx*0.42;
    st.rotX=Math.max(-0.55,Math.min(0.55,st.rotX+dy*1.6));
    if(e.cancelable&&Math.abs(x-ox)>=Math.abs(y-oy))e.preventDefault();
  }
  function up(){st.drag=false;st.pinch=0}
  function setZoom(z){st.zoom=Math.max(1,Math.min(4.2,z))}
  cv.addEventListener("wheel",function(e){
    setZoom(st.zoom*(1-e.deltaY*0.0016));
    if(e.cancelable)e.preventDefault();
  },{passive:false});
  function dist2(t){var a=t[0],b=t[1];return Math.sqrt((a.clientX-b.clientX)*(a.clientX-b.clientX)+(a.clientY-b.clientY)*(a.clientY-b.clientY))}
  cv.addEventListener("touchstart",function(e){if(e.touches.length===2){st.drag=false;st.pinch=dist2(e.touches)}},{passive:true});
  cv.addEventListener("touchmove",function(e){
    if(e.touches.length!==2||!st.pinch)return;
    var d=dist2(e.touches);
    setZoom(st.zoom*(d/st.pinch));st.pinch=d;
    if(e.cancelable)e.preventDefault();
  },{passive:false});
  cv.addEventListener("dblclick",function(){st.zoom=st.zoom>1.4?1:2.6});
  cv.addEventListener("mousedown",down);cv.addEventListener("touchstart",down,{passive:true});
  addEventListener("mousemove",move);cv.addEventListener("touchmove",move,{passive:false});
  addEventListener("mouseup",up);addEventListener("touchend",up);
  addEventListener("resize",function(){resize()});
  resize();start();
  return {
    resize:resize,start:start,stop:stop,brand:brand,
    show:function(v){st.on=v;if(v){resize();start()}else stop()},
    focus:function(k){
      st.focus=(k===null||k===undefined)?-1:k;
      var CY={0:0.92,1:0.16,2:0.3,3:0.22,4:-0.25,5:-0.72};
      st.ctrT=[0,(st.focus<0||CY[st.focus]===undefined)?-0.2:CY[st.focus],0];
      if(st.focus>=0&&st.zoom<1.25)st.zoom=1.8;
      if(st.focus<0)st.zoom=1;
    },
    zoom:function(z){st.zoom=Math.max(1,Math.min(4.2,z))},
    mus:function(m){st.mus=(m===null||m===undefined)?-1:m},
    layers:function(b,m){st.showB=b;st.showM=m}
  };
}
var H3MODE="both";
function h3dApplyMode(){
  if(!SKEL)return;
  if(H3MODE==="os")SKEL.layers(1,0);
  else if(H3MODE==="muscles")SKEL.layers(0.16,1);
  else SKEL.layers(0.82,0.5);
}
function h3dPanel(rk,mid){
  var box=$("h3dinfo");if(!box)return;
  var i,r=null;
  for(i=0;i<REGIONS.length;i++)if(REGIONS[i].k===rk)r=REGIONS[i];
  if(!r){box.innerHTML="";box.classList.remove("on");return}
  var ci=0;for(i=0;i<CHAPS.length;i++)if(CHAPS[i].id===r.c)ci=i;
  var h='<b>'+r.n+'</b><span>'+(mid>=0?MUSCLES[mid].i:r.d)+'</span>';
  var list=[];
  for(i=0;i<MUSCLES.length;i++)if(MUSCLES[i].r===rk)list.push(i);
  if(list.length&&H3MODE!=="os"){
    h+='<div class="h3dmus" id="h3dmus">';
    for(i=0;i<list.length;i++)
      h+='<button class="h3dmchip'+(list[i]===mid?" on":"")+'" data-mi="'+list[i]+'">'+MUSCLES[list[i]].n+'</button>';
    h+='</div>';
  }
  h+='<button class="h3dgo" data-ch="'+r.c+'">Réviser le chapitre '+(ci+1)+' →</button>';
  box.innerHTML=h;
  box.classList.add("on");
}
function renderHero3D(){
  var host=$("hero3d");if(!host)return;
  host.className="h3dwrap";
  var h='<div class="h3d" id="h3dstage"><canvas id="gl"></canvas><div class="h3dgrad"></div>'+
    '<div class="h3dtop"><span class="h3dtag">Corps · vue 3D</span><span class="h3dhint">Tourne au doigt · pince ou molette pour zoomer</span>'+
    '<div class="h3dseg" id="h3dseg">'+
      '<button data-m="os">Os</button><button data-m="muscles">Muscles</button><button class="on" data-m="both">Les deux</button>'+
    '</div></div>'+
    '<div class="h3dfoot"><div class="h3dchips" id="h3dchips">';
  for(var i=0;i<REGIONS.length;i++)h+='<button class="h3dchip" data-rk="'+REGIONS[i].k+'">'+REGIONS[i].n+'</button>';
  h+='</div></div></div><div class="h3dinfo" id="h3dinfo"></div>';
  host.innerHTML=h;
  try{SKEL=initSkel()}catch(e){SKEL=null}
  if(!SKEL){host.classList.add("no-gl");return}
  h3dApplyMode();
  var curR=-1,curM=-1;
  $("h3dseg").onclick=function(e){
    var b=e.target.closest("[data-m]");if(!b)return;
    H3MODE=b.getAttribute("data-m");
    var bs=$("h3dseg").querySelectorAll("button");
    for(var i=0;i<bs.length;i++)bs[i].classList.toggle("on",bs[i]===b);
    if(H3MODE==="os"&&curM>=0){curM=-1;SKEL.mus(null)}
    h3dApplyMode();
    if(curR>=0)h3dPanel(curR,curM);
    buzz(8);
  };
  $("h3dchips").onclick=function(e){
    var b=e.target.closest("[data-rk]");if(!b)return;
    var k=+b.getAttribute("data-rk"),was=b.classList.contains("on");
    var bs=$("h3dchips").querySelectorAll(".h3dchip");
    for(var i=0;i<bs.length;i++)bs[i].classList.remove("on");
    curM=-1;SKEL.mus(null);
    if(was){curR=-1;SKEL.focus(null);$("h3dinfo").innerHTML="";$("h3dinfo").classList.remove("on");buzz(6);return}
    b.classList.add("on");curR=k;SKEL.focus(k);h3dPanel(k,-1);buzz(10);
  };
  $("h3dinfo").onclick=function(e){
    var g=e.target.closest("[data-ch]");
    if(g){S.chap=g.getAttribute("data-ch");save();go("flash");return}
    var m=e.target.closest("[data-mi]");
    if(!m)return;
    var mi=+m.getAttribute("data-mi");
    if(mi===curM){curM=-1;SKEL.mus(null)}else{curM=mi;SKEL.mus(mi)}
    h3dPanel(curR,curM);buzz(8);
  };
}

/* GO */
$("nflash").textContent=dueCount();
renderHero3D();
renderCockpit();
