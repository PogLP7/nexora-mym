<script>
/* ============ DONNÉES ============ */
var EXAM_DATE = new Date(2026,9,23,8,45,0); /* vendredi 23 oct 2026 08h45 — contrôle intermédiaire */

var CHAPS = [
 {id:"c1", t:"Ostéologie & arthrologie — tronc, tête, pelvis", s:"Rachis, cage thoracique, courbures, disque, pelvis"},
 {id:"c2", t:"Ostéologie & arthrologie — membre inférieur", s:"Hanche, genou, cheville, pied"},
 {id:"c3", t:"Ostéologie & arthrologie — membre supérieur", s:"Ceinture scapulaire, épaule, coude, poignet, main"},
 {id:"c4", t:"Myologie — tronc, tête & abdomen", s:"Érecteurs, carré des lombes, ilio-psoas, abdominaux"},
 {id:"c5", t:"Myologie — ceinture scapulaire, épaule & bras", s:"Trapèze, coiffe, pectoral, biceps, triceps, poignet"},
 {id:"c6", t:"Myologie — hanche, genou, cheville", s:"Glutéaux, ischio-jambiers, quadriceps, triceps sural"}
];

/* ---- FLASHCARDS ---- */
var FLASH = [
/* ===== c1 : tronc, tête, pelvis ===== */
{c:"c1",q:"Squelette axial vs squelette appendiculaire",a:"<em>Squelette axial</em> = le <em>tronc et la tête</em> (rachis, cage thoracique, sacrum et coccyx, crâne).<br><em>Squelette appendiculaire</em> = les <em>membres</em> et leurs <em>ceintures</em> (pelvis pour le membre inférieur, ceinture scapulaire pour le membre supérieur)."},
{c:"c1",q:"Que regroupe le tronc ?",a:"Trois ensembles osseux :<ul><li>le <em>rachis</em> (colonne vertébrale)</li><li>la <em>cage thoracique</em> (thorax)</li><li>le <em>sacrum et le coccyx</em></li></ul>"},
{c:"c1",q:"Combien de vertèbres compte le rachis ? Détaille.",a:"<em>24 vertèbres mobiles</em> empilées :<ul><li><em>7 cervicales</em></li><li><em>12 thoraciques</em></li><li><em>5 lombaires</em></li></ul>Puis <em>le sacrum</em> = fusion de <em>5 vertèbres</em>, et <em>le coccyx</em> = fusion de <em>3 à 5 vertèbres</em>."},
{c:"c1",q:"Pourquoi la taille des vertèbres augmente-t-elle de haut en bas ?",a:"Parce que la <em>charge qu’elles supportent est de plus en plus importante</em> : chaque vertèbre porte le poids de tout ce qui est au-dessus d’elle. La taille est donc <em>croissante de haut en bas</em>."},
{c:"c1",q:"La forme des vertèbres est-elle la même sur tout le rachis ?",a:"Non : la forme est <em>légèrement différente le long du rachis</em> (cervicale, thoracique, lombaire) — on distingue les <em>principaux types de vertèbres</em> notamment sur une vue de la <em>face supérieure</em>."},
{c:"c1",q:"De quoi est constituée la cage thoracique ?",a:"Du <em>sternum</em> en avant, des <em>côtes</em> (12 paires) et du <em>rachis thoracique</em> en arrière.<br>N.B. : les <em>fausses côtes ne sont pas directement fixées au sternum</em>."},
{c:"c1",q:"Qu’est-ce qu’une fausse côte ?",a:"Une côte qui <em>n’est pas directement fixée au sternum</em> : elle s’y rattache indirectement par le cartilage de la côte sus-jacente, ou pas du tout (côtes flottantes)."},
{c:"c1",q:"Constitution d’un disque intervertébral",a:"Il se situe <em>entre les corps vertébraux</em> et comprend :<ul><li>une <em>partie centrale gélatineuse</em> = le <em>noyau pulpeux</em></li><li>un <em>anneau fibreux</em> périphérique</li></ul>"},
{c:"c1",q:"Combien de degrés de liberté au rachis ?",a:"<em>6 degrés de liberté</em> (3 rotations + 3 translations), <em>mais certains de très faible amplitude</em>. C’est l’empilement des petits mouvements de chaque étage qui donne la grande mobilité globale du rachis."},
{c:"c1",q:"Sur quoi repose chaque vertèbre ? (3 appuis)",a:"Chaque vertèbre repose sur celle du dessous par <em>trois appuis</em> :<ul><li>le <em>disque intervertébral</em> (en avant)</li><li>les <em>deux processus articulaires inférieurs</em> (en arrière)</li></ul>"},
{c:"c1",q:"Les 4 courbures du rachis dans le plan sagittal",a:"De haut en bas :<ul><li><em>lordose cervicale</em> (convexité antérieure)</li><li><em>cyphose thoracique</em> (ou dorsale)</li><li><em>lordose lombale</em></li><li><em>cyphose sacrale</em></li></ul>Dans le <em>plan frontal</em>, le rachis est au contraire <em>globalement rectiligne</em>."},
{c:"c1",q:"Lordose ou cyphose : comment ne pas se tromper ?",a:"<em>Lordose</em> = courbure à <em>convexité antérieure</em> (creux visible de dos) → <em>cervicale et lombale</em>.<br><em>Cyphose</em> = courbure à <em>convexité postérieure</em> (bosse) → <em>thoracique et sacrale</em>.<br>Elles <em>alternent</em> de haut en bas."},
{c:"c1",q:"Les mouvements réalisés par le tronc",a:"<ul><li><em>Flexion / extension</em> (plan sagittal)</li><li><em>Inclinaison médiale / latérale</em> (plan frontal)</li><li><em>Rotation interne / externe</em> (plan transverse)</li></ul>Les <em>angulations maximales</em> diffèrent selon l’étage : <em>cervical, thoracique et lombaire</em>."},
{c:"c1",q:"De quels os est constitué le pelvis ?",a:"Des <em>deux os coxaux</em> (os iliaques) + <em>le sacrum</em> + <em>le coccyx</em>. L’<em>os coxal</em> est lui-même issu de la fusion de l’ilium, de l’ischium et du pubis."},
{c:"c1",q:"Les 4 repères osseux du pelvis à connaître",a:"<ul><li><em>Crête iliaque</em></li><li><em>Épine iliaque antéro-supérieure</em> (EIAS)</li><li><em>Épine iliaque postéro-supérieure</em> (EIPS)</li><li><em>Tubérosité ischiale</em> (ischion)</li></ul>"},
{c:"c1",q:"Les articulations du pelvis et leur type",a:"<ul><li><em>Articulations sacro-iliaques</em> : <em>synoviales mais peu mobiles</em></li><li><em>Symphyse pubienne</em> : articulation <em>cartilagineuse</em></li></ul>De nombreux ligaments entourent ces articulations."},
{c:"c1",q:"Pourquoi le pelvis est-il presque immobile ?",a:"Parce que ses articulations sont construites pour la <em>transmission des forces</em> entre tronc et membres inférieurs : les <em>sacro-iliaques</em> sont synoviales mais <em>très peu mobiles</em>, et la <em>symphyse pubienne</em> est <em>cartilagineuse</em> donc peu déformable."},

/* ===== c2 : membre inférieur os + articulations ===== */
{c:"c2",q:"Les os du membre inférieur",a:"<ul><li><em>Fémur</em></li><li><em>Patella</em> (rotule)</li><li><em>Tibia</em> et <em>fibula</em></li><li><em>Tarses</em> : <em>7 os</em></li><li><em>Métatarses</em> : <em>5 os</em></li><li><em>Phalanges</em> : <em>14 os</em></li></ul>"},
{c:"c2",q:"Les repères anatomiques du membre inférieur",a:"<ul><li><em>Col du fémur</em></li><li><em>Grand trochanter</em></li><li><em>Malléole interne</em> (tibiale) et <em>malléole externe</em> (fibulaire)</li></ul>"},
{c:"c2",q:"Combien d’os au tarse, au métatarse, aux phalanges ?",a:"<em>7 tarses</em> + <em>5 métatarses</em> + <em>14 phalanges</em> = <em>26 os</em> par pied."},
{c:"c2",q:"Nom et interface de l’articulation de la hanche",a:"L’articulation <em>coxo-fémorale</em> : interface entre le <em>pelvis</em> (acétabulum de l’os coxal) et le <em>fémur</em> (tête fémorale)."},
{c:"c2",q:"Les ligaments de la hanche (à retenir)",a:"<em>Ligaments capsulaires</em> : <em>ilio-fémoral</em>, <em>pubo-fémoral</em>, <em>ischio-fémoral</em>.<br><em>Ligaments intracapsulaires</em> : <em>ligament transverse acétabulaire</em> et <em>ligament de la tête du fémur</em>."},
{c:"c2",q:"Mouvements et plans de la hanche",a:"<ul><li>Plan <em>sagittal</em> : <em>flexion / extension</em></li><li>Plan <em>frontal</em> : <em>abduction / adduction</em></li><li>Plan <em>transverse</em> : <em>rotation interne / externe</em></li></ul>La flexion de hanche est plus grande <em>genou fléchi que genou non fléchi</em> (les ischio-jambiers ne freinent plus le mouvement)."},
{c:"c2",q:"De quoi est composée l’articulation du genou ?",a:"De <em>deux articulations</em> :<ul><li>l’articulation <em>fémoro-tibiale</em></li><li>l’articulation <em>fémoro-patellaire</em></li></ul>"},
{c:"c2",q:"Le mouvement réel du genou n’est pas une simple rotation : pourquoi ?",a:"Parce qu’il y a <em>rotation du fémur par rapport au plateau tibial</em> <em>mais aussi une translation (glissement)</em> : le centre de rotation se déplace au cours de la flexion."},
{c:"c2",q:"Articulation tibio-fibulaire proximale",a:"Articulation entre l’extrémité <em>proximale du tibia et de la fibula</em> : sa <em>mobilité est très limitée</em>."},
{c:"c2",q:"Nom et interface de l’articulation de la cheville",a:"L’articulation de la cheville = l’articulation <em>talo-crurale</em> : interface entre le <em>tibia</em>, la <em>fibula</em> (os de la jambe) et le <em>talus</em> (os du pied).<br>La <em>fibula et le tibia « coincent » le talus</em>, ce qui explique la grande stabilité et la mobilité surtout sagittale."},
{c:"c2",q:"Les mouvements de la talo-crurale",a:"Principalement la <em>flexion dorsale</em> et la <em>flexion plantaire</em> (plan sagittal).<br>Les mouvements d’<em>abduction / adduction</em> et de <em>pronation / supination</em> y sont <em>légers (moins de 10 degrés)</em> et sont <em>accentués par les articulations du pied</em>, principalement les <em>intertarsiennes</em>."},
{c:"c2",q:"Qu’est-ce que l’articulation transverse du tarse ?",a:"Appelée aussi articulation <em>de Chopart</em>, elle associe :<ul><li>l’articulation <em>talo-calcanéo-naviculaire</em></li><li>l’articulation <em>calcanéo-cuboïdienne</em></li></ul>Elle combine flexion, abd/add et prono/supination du pied."},
{c:"c2",q:"Inversion et éversion du pied",a:"Ce sont des mouvements <em>combinés</em> :<ul><li><em>Inversion</em> = <em>adduction + supination + flexion plantaire</em></li><li><em>Éversion</em> = <em>abduction + pronation + flexion dorsale</em></li></ul>Ils résultent de la <em>combinaison des trois éléments</em> aux articulations du pied."},
{c:"c2",q:"Les mouvements des orteils et leurs articulations",a:"Des <em>flexions et extensions</em> sont possibles aux :<ul><li>articulations <em>métatarso-phalangiennes</em></li><li>articulations <em>interphalangiennes</em></li></ul>"},
{c:"c2",q:"Récapitule : nom savant des 3 grandes articulations du membre inférieur",a:"<ul><li>Hanche = <em>coxo-fémorale</em></li><li>Genou = <em>fémoro-tibiale + fémoro-patellaire</em></li><li>Cheville = <em>talo-crurale</em></li></ul>"},

/* ===== c3 : membre supérieur os + articulations ===== */
{c:"c3",q:"De quoi est constituée la ceinture scapulaire ?",a:"De la <em>clavicule</em> et de la <em>scapula</em> (omoplate) — et <em>parfois le sternum (manubrium) y est inclus</em>."},
{c:"c3",q:"Les articulations de la ceinture scapulaire (5)",a:"<ul><li><em>Sterno-claviculaire</em></li><li><em>Acromio-claviculaire</em></li><li><em>Scapulo-thoracique</em> (plan de glissement)</li><li><em>Subacromiale</em> (plan de glissement)</li><li><em>Complexe coraco-claviculaire</em></li></ul>"},
{c:"c3",q:"Articulation acromio-claviculaire : forme et conséquence",a:"Surfaces articulaires <em>planes, de formes elliptiques, juxtaposées l’une contre l’autre, sans emboîtement</em>. Elle <em>contient un ménisque</em>.<br>Cette forme autorise une <em>mobilité dans toutes les directions mais n’assure aucune stabilité</em> ; les <em>rotations de l’acromion sur la clavicule</em> sont majeures."},
{c:"c3",q:"Articulation sterno-claviculaire : quel mouvement ?",a:"Surtout un mouvement de <em>rotation entre le manubrium et la clavicule</em>."},
{c:"c3",q:"Pourquoi la scapulo-thoracique n’est-elle pas une vraie articulation ?",a:"Parce que c’est un <em>plan de glissement</em> : <em>pas d’articulation synoviale</em>, mais une <em>bourse séreuse</em> ou une <em>couche cellulo-graisseuse</em> qui <em>se comporte comme une articulation</em>. La scapula reste <em>« plaquée » au thorax</em> par les muscles."},
{c:"c3",q:"Degrés de liberté et mouvements de la scapulo-thoracique",a:"<em>2 translations + 3 rotations</em> (mais <em>surtout rotation interne / externe</em>).<br>Mouvements : <em>élévation / dépression</em>, <em>abduction (protraction) / adduction (rétraction)</em>."},
{c:"c3",q:"Articulation gléno-humérale : interface et congruence",a:"Interface entre la <em>glène de la scapula</em> et la <em>tête de l’humérus</em>.<br>La congruence est <em>augmentée par un anneau de fibrocartilage</em> inséré sur le pourtour de la glénoïde : le <em>bourrelet</em> ou <em>labrum glénoïdien</em>."},
{c:"c3",q:"Mouvements de la gléno-humérale",a:"<em>3 rotations</em> : <em>flexion / extension</em>, <em>abduction / adduction</em>, <em>rotation externe / rotation interne</em>."},
{c:"c3",q:"Qu’est-ce que le rythme scapulo-huméral ?",a:"Lors de l’élévation du bras :<ul><li>entre <em>0 et ~30 degrés</em> : mouvements <em>principalement à la gléno-humérale</em></li><li>après <em>~30 degrés</em> : l’<em>humérus et la scapula</em> bougent ensemble avec un rapport <em>~2:1</em> (2 degrés d’humérus pour 1 de scapula)</li></ul>"},
{c:"c3",q:"Amplitudes de l’épaule (flex/ext, abd/add, rot)",a:"<ul><li><em>Flexion / extension : 180 / 60</em></li><li><em>Abduction / adduction : 180 / 45</em></li><li><em>Rotation interne / externe : 95 / 40</em></li></ul>Ces valeurs combinent les mouvements de la <em>ceinture scapulaire</em> et de la <em>gléno-humérale</em>."},
{c:"c3",q:"Les os de l’avant-bras et leur particularité",a:"Le <em>radius</em> (latéral, côté pouce) et l’<em>ulna</em> (médial).<br>Le <em>radius est plus petit à son extrémité proximale qu’à son extrémité distale</em> — l’ulna fait l’inverse."},
{c:"c3",q:"Les articulations du coude",a:"Deux articulations : l’<em>huméro-ulnaire</em> et l’<em>huméro-radiale</em>, auxquelles s’ajoute l’articulation <em>radio-ulnaire proximale</em>."},
{c:"c3",q:"Amplitudes de flexion/extension du coude",a:"<em>Flexion max : 140 à 150 degrés</em>.<br><em>Extension max : 0 à 10 degrés</em>.<br>Lors du mouvement, le <em>radius « glisse » le long</em> de l’humérus."},
{c:"c3",q:"Quelles articulations pour la pronation/supination ?",a:"Les articulations <em>radio-ulnaire proximale et distale</em> (avec l’articulation du coude) : le <em>col du radius pivote</em> sur place et le radius croise l’ulna.<br>Amplitudes : <em>pronation max 90 degrés</em>, <em>supination max 90 degrés</em>."},
{c:"c3",q:"De quoi est composée l’articulation du poignet ?",a:"Des articulations <em>radio-carpiennes</em> (radius / 1re rangée du carpe) et <em>médio-carpiennes</em> (entre les deux rangées du carpe)."},
{c:"c3",q:"Flexion / extension du poignet : amplitudes et répartition",a:"<em>Flexion max ~90 degrés</em>, <em>extension max ~90 degrés</em>.<br>La <em>flexion</em> est surtout un mouvement <em>médiocarpien (60 %)</em> ; l’<em>extension</em> est surtout <em>radiocarpienne (~66 %)</em>."},
{c:"c3",q:"Inclinaison radiale / ulnaire du poignet",a:"La <em>1re rangée du carpe « glisse » entre le radius et la 2e rangée du carpe</em>.<br>Les <em>déviations radiale et ulnaire</em> sont <em>réparties entre les articulations radiocarpienne et médiocarpienne</em>."},
{c:"c3",q:"Les articulations des doigts",a:"<ul><li>Articulations <em>métacarpo-phalangiennes</em> (MCP)</li><li>Articulations <em>interphalangiennes proximales</em> (IPP)</li><li>Articulations <em>interphalangiennes distales</em> (IPD)</li></ul>Amplitudes : <em>MCP flexion max 90, extension max 30</em> ; <em>IP max 90 / 30</em> environ."},
{c:"c3",q:"L’articulation spéciale du pouce",a:"L’articulation <em>trapézo-métacarpienne</em> : elle donne au pouce sa grande liberté (opposition). S’y ajoutent la <em>métacarpo-phalangienne (max 60 degrés)</em> et l’<em>interphalangienne (max 60 degrés)</em>."},
{c:"c3",q:"Pourquoi les articulations craquent-elles ?",a:"Par <em>tribonucléation</em> : quand deux surfaces unies par un film de liquide visqueux sont <em>séparées brusquement</em>, la <em>pression négative</em> générée, couplée à la <em>vitesse de séparation</em>, crée <em>temporairement une cavité</em> (bulle) — c’est elle qui fait le bruit."},
{c:"c3",q:"Faire craquer ses doigts donne-t-il de l’arthrite ?",a:"Non. <em>Unger (1998)</em>, <em>prix IgNobel 2007</em> : pendant <em>50 ans</em> il a fait craquer les jointures de sa <em>main gauche au moins deux fois par jour</em> (≥ <em>36 500 fois</em>) et pas la droite → <em>aucune arthrite dans les deux mains</em>."},
{c:"c3",q:"Récapitule : nom savant des 3 grandes articulations du membre supérieur",a:"<ul><li>Épaule = <em>gléno-humérale</em> (+ articulations de la ceinture scapulaire)</li><li>Coude = <em>huméro-ulnaire + huméro-radiale</em> (+ radio-ulnaire proximale)</li><li>Poignet = <em>radio-carpiennes + médio-carpiennes</em></li></ul>"},

/* ===== c4 : myologie tronc, tête, abdomen ===== */
{c:"c4",q:"Les 4 façons de classer les muscles du tronc",a:"<ul><li>Par <em>vue</em> : <em>antérieure / postérieure</em></li><li>Par <em>zone</em> : <em>rachis, abdomen, thorax</em></li><li>Par <em>profondeur</em> : <em>superficiel (extrinsèque), intermédiaire, profond (intrinsèque)</em></li><li>Par <em>fonction</em> : par exemple les muscles des mouvements de la colonne vertébrale</li></ul>"},
{c:"c4",q:"Convention du cours : origine et insertion",a:"Le choix du cours : les <em>origines</em> sont les <em>jonctions proximales</em> (le plus près de la tête) et les <em>insertions</em> les <em>jonctions distales</em> (le plus éloigné de la tête).<br>Attention : certains manuels inversent."},
{c:"c4",q:"De quels muscles est composé le groupe des érecteurs du rachis ?",a:"De trois colonnes musculaires :<ul><li>l’<em>iliocostal</em></li><li>le <em>longissimus</em></li><li>l’<em>épineux</em></li></ul>Chaque colonne est subdivisée en <em>régions (lombaire, thoracique, cervicale, tête)</em> selon la zone du squelette où elle s’insère supérieurement."},
{c:"c4",q:"Fonction des érecteurs du rachis",a:"<ul><li>Contraction <em>bilatérale</em> → <em>extension de la zone du rachis</em> à laquelle ils sont rattachés</li><li>Contraction <em>unilatérale</em> → <em>inclinaison latérale</em> de cette même zone</li></ul>"},
{c:"c4",q:"Dans les érecteurs : lequel est le plus long et le plus épais ? Le plus petit ?",a:"Le <em>longissimus</em> est <em>le plus long et le plus épais</em>.<br>Le muscle <em>épineux</em> est <em>le plus petit</em>."},
{c:"c4",q:"Muscle carré des lombes : situation, origine, insertion",a:"C’est le <em>muscle le plus profond de la paroi abdominale postérieure</em>.<br><em>Origines</em> : <em>bord inférieur de la 12e côte</em>, <em>processus transverses des vertèbres L1 à L4</em>.<br><em>Insertion</em> : <em>crête iliaque</em> et <em>ligament iliolombaire</em>."},
{c:"c4",q:"Fonction du carré des lombes",a:"<ul><li><em>Bilatéralement</em> → <em>extension du tronc</em> (et il <em>immobilise la 12e côte</em>, utile à la respiration)</li><li><em>Unilatéralement</em> → <em>inclinaison latérale du tronc</em></li></ul>"},
{c:"c4",q:"De quoi est composé l’ilio-psoas ?",a:"De deux chefs :<ul><li>le <em>muscle iliaque</em> = <em>chef latéral</em></li><li>le <em>muscle grand psoas</em> = <em>chef médial</em></li></ul>(+ le <em>petit psoas</em>, inconstant). Insertion commune : le <em>petit trochanter</em> du fémur."},
{c:"c4",q:"Origines du muscle iliaque",a:"<em>Fosse iliaque</em> + <em>épine iliaque antérieure et inférieure</em> + <em>ligaments sacro-iliaque et iliolombaire antérieurs</em> + <em>base du sacrum</em>. Insertion : <em>petit trochanter</em>."},
{c:"c4",q:"Origines du muscle grand psoas",a:"<em>Corps vertébraux de T12 à L5</em>, <em>disques intervertébraux de T12 à L5</em>, <em>processus transverses des vertèbres L1 à L5</em>. Insertion : <em>petit trochanter</em>."},
{c:"c4",q:"Fonctions du muscle iliaque",a:"Il rapproche le <em>fémur du bassin</em> :<ul><li><em>antéversion du bassin</em></li><li><em>flexion de hanche</em></li></ul>"},
{c:"c4",q:"Fonctions du grand psoas",a:"Il rapproche le <em>fémur des lombaires</em> :<ul><li><em>flexion de hanche</em> (+ <em>rotation externe du fémur</em>)</li><li><em>flexion du tronc</em> (+ flexion latérale)</li><li>il <em>favorise la lordose lombaire</em></li></ul>"},
{c:"c4",q:"Pourquoi le psoas fait-il parfois une flexion de hanche et parfois une flexion du tronc ?",a:"Parce que le muscle se contracte et <em>produit une force à son origine ET à son insertion</em> : c’est la <em>configuration du corps et les forces extérieures</em> qui déterminent quel segment bouge.<br><em>Jambe posée au sol</em> → plutôt mouvement <em>des lombaires</em>. <em>Allongé</em> → mouvement <em>des lombaires et du fémur</em>."},
{c:"c4",q:"Qu’est-ce que l’abdomen ?",a:"La <em>région située entre le thorax et le pelvis</em>. Sa paroi comprend une <em>partie postérieure (profonde), épaisse et stable</em> et une <em>partie latérale et antérieure (superficielle), compressible et extensible</em>."},
{c:"c4",q:"Les 4 « abdominaux » du plus profond au plus superficiel",a:"Paroi latérale, de profond à superficiel :<ul><li><em>Transverse de l’abdomen</em> (le plus profond)</li><li><em>Oblique interne</em> (intermédiaire)</li><li><em>Oblique externe</em> (superficiel)</li></ul>Paroi antérieure : <em>droit de l’abdomen</em>."},
{c:"c4",q:"Transverse de l’abdomen : origine, insertion",a:"<em>Origine</em> : <em>ligne blanche de l’abdomen</em>.<br><em>Insertion</em> : <em>cartilages costaux 7 à 12</em> + par le biais du <em>fascia thoraco-lombal</em> les <em>vertèbres L1 à L5</em> + <em>crête iliaque</em> + <em>ligament inguinal</em>."},
{c:"c4",q:"Fonction du transverse de l’abdomen",a:"<ul><li>Il <em>comprime et soutient les viscères abdominaux</em> et participe à l’<em>expiration forcée</em></li><li><em>Stabilité du tronc et maintien de la posture</em></li><li>Contracté avec les autres abdominaux, il contribue à la <em>flexion de la colonne thoraco-lombaire / pelvis</em></li></ul>"},
{c:"c4",q:"Oblique interne : origine, insertion",a:"<em>Origine</em> : <em>cartilage des 3 ou 4 dernières côtes</em> + <em>ligne blanche</em>.<br><em>Insertion</em> : <em>crête iliaque</em> + <em>ligament inguinal</em> + <em>fascia thoraco-lombaire</em>. C’est le muscle <em>intermédiaire</em> des abdominaux."},
{c:"c4",q:"Fonction de l’oblique interne",a:"<ul><li><em>Unilatéralement</em> : <em>rotation externe du tronc / pelvis</em> + <em>flexion latérale</em></li><li><em>Bilatéralement</em> : <em>fléchisseur du tronc</em> et <em>statique du tronc</em></li><li>(compression et soutien des viscères avec les autres abdominaux)</li></ul>"},
{c:"c4",q:"Oblique externe : origine, insertion",a:"<em>Origine</em> : <em>7 dernières côtes (face externe)</em>.<br><em>Insertion</em> : <em>crête iliaque</em>, <em>ligne blanche</em>, <em>ligament inguinal</em>, <em>pubis</em> (via une lame tendineuse). C’est le muscle <em>superficiel</em> des abdominaux."},
{c:"c4",q:"Fonction de l’oblique externe",a:"<ul><li><em>Unilatéralement</em> : <em>rotation interne du tronc / pelvis</em></li><li><em>Bilatéralement</em> : <em>fléchisseur du tronc</em> et <em>statique du tronc</em></li></ul>"},
{c:"c4",q:"Oblique interne vs oblique externe : LE piège de rotation",a:"<em>Oblique interne</em> → <em>rotation EXTERNE</em> du tronc / pelvis.<br><em>Oblique externe</em> → <em>rotation INTERNE</em> du tronc / pelvis.<br>C’est <em>inversé</em> par rapport au nom : à retenir tel quel."},
{c:"c4",q:"Droit de l’abdomen : origine, insertion",a:"<em>Origine</em> : <em>cartilages costaux des côtes 5 à 7</em> et <em>processus xiphoïde du sternum</em>.<br><em>Insertion</em> : <em>pubis</em>."},
{c:"c4",q:"Fonction du droit de l’abdomen",a:"<ul><li><em>Fléchisseur du tronc / pelvis</em></li><li><em>Statique du tronc</em> : son <em>relâchement accentue la lordose lombaire</em></li><li>Il <em>augmente la pression abdominale</em> en synergie avec les autres abdos et <em>protège les viscères</em></li></ul>Donc <em>pas uniquement esthétique</em>."},

/* ===== c5 : myologie ceinture scapulaire, épaule, bras, main ===== */
{c:"c5",q:"Qu’ont en commun les muscles des mouvements de la ceinture scapulaire ?",a:"Ils ont leur <em>origine sur le squelette axial</em> et leur <em>insertion sur la scapula ou la clavicule</em>."},
{c:"c5",q:"Les 4 muscles de la face postérieure du thorax (ceinture scapulaire)",a:"<ul><li><em>Élévateur de la scapula</em></li><li><em>Grand rhomboïde</em> (= losange)</li><li><em>Petit rhomboïde</em></li><li><em>Trapèze</em></li></ul>"},
{c:"c5",q:"Élévateur de la scapula : O, I, action",a:"<em>Origine</em> : <em>C1 à C4 ou C5</em>.<br><em>Insertion</em> : <em>bord médial supérieur de la scapula</em>.<br><em>Action</em> : <em>élévation et rotation vers le bas de la scapula</em>."},
{c:"c5",q:"Grand rhomboïde : O, I, action",a:"<em>Origine</em> : <em>processus épineux de T2 à T5</em>.<br><em>Insertion</em> : <em>bord médial de la scapula</em>.<br><em>Action</em> : <em>élévation, adduction et rotation vers le bas de la scapula</em> ; il <em>stabilise la scapula</em>."},
{c:"c5",q:"Petit rhomboïde : O, I",a:"<em>Origine</em> : <em>processus épineux de C7 et T1</em>.<br><em>Insertion</em> : <em>bord médial de la scapula</em>. Même type d’action que le grand rhomboïde."},
{c:"c5",q:"Trapèze, partie descendante (fibres supérieures)",a:"<em>Origine</em> : <em>tiers médial de la ligne nuchale supérieure</em>, <em>protubérance occipitale externe</em>, <em>ligament nuchal</em>.<br><em>Insertion</em> : <em>tiers latéral de la clavicule</em>.<br><em>Action</em> : <em>élève la scapula</em> (et extension de la tête et du cou)."},
{c:"c5",q:"Trapèze, partie transversale (fibres moyennes)",a:"<em>Origine</em> : <em>processus épineux et ligaments supra-épineux des vertèbres T1 à T4</em> (ou C7-T3).<br><em>Insertion</em> : <em>marge acromiale médiale</em>, <em>crête supérieure de l’épine de la scapula</em>.<br><em>Action</em> : <em>adduction de la scapula</em>."},
{c:"c5",q:"Trapèze, partie ascendante (fibres inférieures)",a:"<em>Origine</em> : <em>processus épineux et ligaments supra-épineux des vertèbres T4 à T12</em>.<br><em>Insertion</em> : <em>apex latéral de l’extrémité médiale de l’épine de la scapula</em>.<br><em>Action</em> : <em>baisse la scapula</em>."},
{c:"c5",q:"Les 3 muscles de la face antérieure du thorax (ceinture scapulaire)",a:"<ul><li><em>Subclavier</em></li><li><em>Petit pectoral</em></li><li><em>Dentelé antérieur</em></li></ul>"},
{c:"c5",q:"Subclavier : O, I, action",a:"<em>Origine</em> : <em>clavicule</em>. <em>Insertion</em> : <em>1re côte</em>. <em>Action</em> : <em>abaissement</em> de la clavicule / ceinture."},
{c:"c5",q:"Petit pectoral : O, I, action",a:"<em>Origine</em> : <em>processus coracoïde de la scapula</em>.<br><em>Insertion</em> : <em>3e à 5e côtes</em>.<br><em>Action</em> : <em>abduction et rotation vers le bas de la scapula</em> ; il <em>élève les côtes quand la scapula est immobilisée</em>."},
{c:"c5",q:"Dentelé antérieur : O, I, action",a:"<em>Origine</em> : <em>bord médial et angle inférieur de la scapula</em>.<br><em>Insertion</em> : <em>8 ou 9 premières côtes</em>.<br><em>Action</em> : <em>abduction et rotation vers le HAUT de la scapula</em> ; il <em>élève les côtes quand la scapula est immobilisée</em>."},
{c:"c5",q:"Petit pectoral vs dentelé antérieur : le piège",a:"Les deux font l’<em>abduction</em> de la scapula, mais :<ul><li><em>Petit pectoral</em> → rotation vers le <em>bas</em></li><li><em>Dentelé antérieur</em> → rotation vers le <em>haut</em> (indispensable pour lever le bras au-delà de 90 degrés)</li></ul>"},
{c:"c5",q:"Les fléchisseurs de l’épaule",a:"<em>Principaux</em> : <em>deltoïde antérieur</em>, <em>grand pectoral</em>, <em>coraco-brachial</em>.<br><em>Accessoires</em> : <em>chef long du biceps brachial</em>, <em>subscapulaire</em>."},
{c:"c5",q:"Coraco-brachial : O, I, action",a:"<em>Origine</em> : <em>processus coracoïde de la scapula</em>.<br><em>Insertion</em> : <em>face antérieure de l’humérus</em>.<br><em>Action</em> : <em>flexion</em> et <em>adduction</em> (+ bascule antérieure de la scapula)."},
{c:"c5",q:"Deltoïde antérieur : O, I, action",a:"<em>Origine</em> : <em>corps et extrémité latérale de la clavicule</em>.<br><em>Insertion</em> : <em>tubérosité deltoïdienne</em> de l’humérus.<br><em>Action</em> : <em>flexion</em>, <em>adduction horizontale</em>, et le CM le classe parmi les <em>rotateurs internes</em> de l’épaule."},
{c:"c5",q:"Les 3 parties du grand pectoral",a:"<ul><li><em>Partie claviculaire</em> : O <em>moitié médiale du bord antérieur de la clavicule</em></li><li><em>Partie sterno-costale</em> : O <em>moitié supérieure du sternum et cartilages costaux de la 2e à la 6e côte</em></li><li><em>Partie abdominale</em> : O <em>gaine du muscle droit de l’abdomen</em></li></ul>Insertion commune sur l’<em>humérus</em>."},
{c:"c5",q:"Action du grand pectoral",a:"<em>Flexion</em>, <em>adduction</em>, <em>rotateur interne de l’humérus</em> — et en <em>respiration forcée</em> il augmente le volume thoracique."},
{c:"c5",q:"Les extenseurs de l’épaule",a:"<em>Principaux</em> : <em>deltoïde postérieur</em>, <em>grand rond</em>, <em>grand dorsal</em>."},
{c:"c5",q:"Grand rond : O, I, action",a:"<em>Origine</em> : <em>bord latéral de la scapula</em>.<br><em>Insertion</em> : <em>sillon intertuberculaire de l’humérus</em>.<br><em>Action</em> : <em>extension</em> et <em>adduction</em>."},
{c:"c5",q:"Deltoïde postérieur : O, I, action",a:"<em>Origine</em> : <em>épine de la scapula</em>.<br><em>Insertion</em> : <em>tubérosité deltoïdienne</em>.<br><em>Action</em> : <em>extension</em> de l’épaule."},
{c:"c5",q:"Les 3 parties du grand dorsal",a:"<ul><li><em>Partie vertébrale</em> : <em>apophyses épineuses de T7 à T12</em> + <em>fascia thoraco-lombaire</em></li><li><em>Partie costale</em> : <em>côtes 9 à 12</em></li><li><em>Partie iliaque</em> : <em>crête du sacrum et de l’ilium</em></li></ul>Insertion : <em>sillon intertuberculaire de l’humérus</em>."},
{c:"c5",q:"Action du grand dorsal",a:"<em>Extension</em>, <em>adduction</em>, <em>rotation interne</em> du bras.<br><em>Action sur le pelvis</em> : <em>inclinaison latérale du tronc</em>.<br>C’est <em>le muscle du grimpeur</em>."},
{c:"c5",q:"Les abducteurs de l’épaule",a:"<em>Principaux</em> : <em>supra-épineux</em> et <em>deltoïde médian</em>.<br><em>Accessoires</em> : <em>chef long du biceps brachial</em>, <em>dentelé antérieur</em> et <em>trapèze</em>."},
{c:"c5",q:"Supra-épineux : O, I, action",a:"<em>Origine</em> : <em>fosse supra-épineuse</em> (face supérieure de la scapula).<br><em>Insertion</em> : <em>facette supérieure du tubercule majeur de l’humérus</em>.<br><em>Action</em> : <em>abduction du bras principalement de 0 à 15 degrés</em>."},
{c:"c5",q:"Deltoïde médian : O, I, action",a:"<em>Origine</em> : <em>acromion</em>.<br><em>Insertion</em> : <em>tubérosité deltoïdienne</em>.<br><em>Action</em> : <em>abduction du bras au-delà des 15 degrés initiaux</em>."},
{c:"c5",q:"Les 3 phases de l’abduction du bras et leurs muscles",a:"<ul><li><em>0 à 90 degrés</em> : articulation <em>scapulo-humérale</em> → <em>supra-épineux et deltoïde</em></li><li><em>90 à 150 degrés</em> : <em>glissement scapulo-thoracique</em> → <em>dentelé antérieur et trapèze</em></li><li><em>150 à 180 degrés</em> : <em>incurvation de la colonne vertébrale</em> → <em>muscles érecteurs du rachis</em></li></ul>"},
{c:"c5",q:"Les adducteurs de l’épaule",a:"<em>Principaux</em> : <em>grand pectoral</em>, <em>grand dorsal</em>, <em>triceps brachial</em>, <em>biceps brachial</em>.<br><em>Accessoires</em> : <em>grand rond</em>, <em>coraco-brachial</em>. L’adduction résulte de <em>contractions simultanées</em>."},
{c:"c5",q:"Les rotateurs internes (médiaux) de l’épaule",a:"<em>Subscapulaire</em>, <em>grand pectoral</em>, <em>grand dorsal</em>, <em>grand rond</em>, <em>deltoïde antérieur</em>."},
{c:"c5",q:"Subscapulaire : O, I, action",a:"<em>Origine</em> : <em>deux tiers médiaux de la fosse subscapulaire</em>.<br><em>Insertion</em> : <em>tubercule mineur de l’humérus</em>.<br><em>Action</em> : <em>rotation interne du bras</em> et <em>stabilisation de la tête humérale dans la cavité glénoïde</em>."},
{c:"c5",q:"Les rotateurs externes (latéraux) de l’épaule",a:"<em>Infra-épineux</em>, <em>deltoïde postérieur</em>, <em>petit rond</em>."},
{c:"c5",q:"Infra-épineux : O, I, action",a:"<em>Origine</em> : <em>fosse infra-épineuse de la scapula</em>.<br><em>Insertion</em> : <em>grand tubercule de l’humérus</em>.<br><em>Action</em> : <em>rotation externe</em> à la gléno-humérale et <em>stabilisation de la tête humérale dans la cavité glénoïde</em>."},
{c:"c5",q:"Les 4 muscles de la coiffe des rotateurs",a:"<ul><li><em>Supra-épineux</em></li><li><em>Infra-épineux</em></li><li><em>Petit rond</em></li><li><em>Subscapulaire</em></li></ul>Ils ont tous pour origine la <em>scapula</em>."},
{c:"c5",q:"Rôle de la coiffe des rotateurs",a:"Un rôle <em>majeur dans la stabilisation de la gléno-humérale</em> : ils <em>maintiennent et centrent la tête humérale dans la cavité glénoïde</em> en <em>resserrant la capsule articulaire</em>."},
{c:"c5",q:"Les fléchisseurs du coude",a:"<em>Biceps brachial</em>, <em>brachial</em>, <em>brachioradial</em>."},
{c:"c5",q:"Brachial : O, I, action",a:"<em>Origine</em> : <em>moitié distale de la face antérieure de l’humérus</em>.<br><em>Insertion</em> : <em>processus coronoïde de l’ulna</em>.<br><em>Action</em> : <em>flexion de l’avant-bras</em>."},
{c:"c5",q:"Brachioradial : O, I, action",a:"<em>Origine</em> : <em>bord latéral de l’humérus</em>.<br><em>Insertion</em> : <em>processus styloïde du radius</em>.<br><em>Action</em> : <em>flexion de l’avant-bras</em> et il <em>ramène l’avant-bras en position neutre de prono-supination</em> (supination si en pronation, pronation si en supination)."},
{c:"c5",q:"Biceps brachial : les deux chefs",a:"<em>Chef court</em> : origine sur le <em>processus coracoïde de la scapula</em>.<br><em>Chef long</em> : origine sur le <em>tubercule supraglénoïdien de la scapula</em>.<br><em>Insertion</em> : <em>tubérosité radiale du radius</em> et <em>fascia profond de l’avant-bras</em>."},
{c:"c5",q:"Pourquoi le biceps brachial est-il un muscle bi-articulaire ?",a:"Parce qu’il a ses <em>origines sur la scapula</em> et ses <em>insertions sur le radius</em> : il croise donc <em>l’épaule ET le coude</em> et <em>impacte les mouvements à deux articulations</em>.<br>Actions : <em>flexion de l’avant-bras</em>, <em>supination de l’avant-bras</em>, et participation à la <em>flexion de l’épaule</em>."},
{c:"c5",q:"Anconé : O, I, action",a:"<em>Origine</em> : <em>épicondyle latéral</em> de l’humérus.<br><em>Insertion</em> : <em>face latérale de l’olécrâne</em>.<br><em>Action</em> : <em>extension de l’avant-bras</em>."},
{c:"c5",q:"Triceps brachial : les 3 chefs et l’action",a:"<ul><li><em>Chef long</em> : O <em>tubercule infraglénoïdal de la scapula</em></li><li><em>Chef médial</em> : O <em>face postérieure de l’humérus</em></li><li><em>Chef latéral</em> : O <em>face postérieure de l’humérus</em></li></ul>Insertion : <em>olécrâne</em>. Action : <em>extension de l’avant-bras</em> ; le <em>chef long</em> est en plus <em>extenseur et adducteur du bras</em> (bi-articulaire)."},
{c:"c5",q:"Les muscles pronateurs",a:"Le <em>rond pronateur</em> et le <em>carré pronateur</em>."},
{c:"c5",q:"Rond pronateur : O, I, action",a:"<em>Origines</em> : <em>chef huméral</em> sur l’<em>épicondyle médial</em>, <em>chef ulnaire</em> sur le <em>processus coronoïde</em>.<br><em>Insertion</em> : <em>tiers supérieur et latéral du radius</em>.<br><em>Action</em> : <em>pronation</em> (+ <em>flexion du coude</em> pour le chef huméral)."},
{c:"c5",q:"Carré pronateur : O, I, action",a:"<em>Origine</em> : <em>tiers distal de la face antérieure de l’ulna</em>.<br><em>Insertion</em> : <em>tiers distal de la face antérieure du radius</em>.<br><em>Action</em> : <em>pronation</em>."},
{c:"c5",q:"Les muscles supinateurs",a:"<em>Principaux</em> : le <em>supinateur</em> et le <em>biceps brachial</em>.<br><em>Accessoire</em> : le <em>brachioradial</em>."},
{c:"c5",q:"Supinateur : O, I, action",a:"<em>Origines</em> : <em>épicondyle latéral de l’humérus</em> et <em>crête supinatrice de l’ulna</em>.<br><em>Insertion</em> : <em>faces latérale, postérieure et antérieure du tiers proximal du radius</em>.<br><em>Action</em> : <em>supination</em> de l’avant-bras."},
{c:"c5",q:"Les fléchisseurs du poignet",a:"<em>Principaux</em> : <em>fléchisseur radial du carpe</em>, <em>fléchisseur ulnaire du carpe</em>, <em>long palmaire</em>.<br><em>Accessoires</em> : les <em>fléchisseurs des doigts</em>."},
{c:"c5",q:"Fléchisseur radial du carpe : O, I, action",a:"<em>Origine</em> : <em>épicondyle médial de l’humérus</em>.<br><em>Insertion</em> : <em>bases du 2e et du 3e métacarpiens</em>.<br><em>Action</em> : <em>fléchisseur principal du poignet et du carpe</em> + <em>abduction de la main</em>."},
{c:"c5",q:"Fléchisseur ulnaire du carpe : O, I, action",a:"<em>Origine</em> : <em>épicondyle médial de l’humérus</em>.<br><em>Insertion</em> : <em>os pisiforme</em>, <em>os hamatum</em> et <em>base du 5e métacarpien</em>.<br><em>Action</em> : <em>flexion du poignet avec déviation ulnaire</em>."},
{c:"c5",q:"Long palmaire : insertion et curiosité",a:"<em>Insertion</em> : <em>aponévrose palmaire</em> et <em>rétinaculum des fléchisseurs</em>. <em>Action</em> : <em>fléchisseur du carpe</em>.<br>Curiosité : <em>30 % de la population pourrait ne pas avoir de muscle long palmaire</em>."},
{c:"c5",q:"Les extenseurs du poignet",a:"<em>Principaux</em> : <em>long extenseur radial du carpe</em>, <em>court extenseur radial du carpe</em>, <em>extenseur ulnaire du carpe</em>.<br><em>Accessoires</em> : les <em>extenseurs des doigts</em>."},
{c:"c5",q:"Long extenseur radial du carpe : O, I, action",a:"<em>Origine</em> : <em>crête supracondylaire latérale de l’humérus</em>.<br><em>Insertion</em> : <em>base du 2e métacarpien</em>.<br><em>Action</em> : <em>extension du poignet</em> (+ abduction du poignet, + flexion du coude)."},
{c:"c5",q:"Court extenseur radial du carpe et extenseur ulnaire du carpe : insertions",a:"<em>Court extenseur radial du carpe</em> : <em>base du 3e métacarpien</em> → <em>extension</em> + abduction du poignet.<br><em>Extenseur ulnaire du carpe</em> : <em>base du 5e métacarpien</em> → <em>extension</em> + <em>adduction de la main</em>."},
{c:"c5",q:"Les abducteurs du poignet (déviation radiale)",a:"En synergie : <em>fléchisseur radial du carpe</em> + <em>long extenseur radial du carpe</em> + <em>court extenseur radial du carpe</em>.<br>Logique : tout ce qui est <em>radial</em> tire vers le <em>pouce</em>."},
{c:"c5",q:"Les adducteurs du poignet (déviation ulnaire)",a:"En synergie : <em>fléchisseur ulnaire du carpe</em> + <em>extenseur ulnaire du carpe</em>.<br>Logique : tout ce qui est <em>ulnaire</em> tire vers le <em>petit doigt</em>."},

/* ===== c6 : myologie membre inférieur ===== */
{c:"c6",q:"Les fléchisseurs de hanche",a:"<em>Principaux</em> : <em>ilio-psoas</em> et <em>droit fémoral</em>.<br><em>Accessoires</em> : <em>pectiné</em>, <em>tenseur du fascia lata</em>, <em>sartorius</em>."},
{c:"c6",q:"Droit fémoral : O, I, actions",a:"<em>Origines</em> : <em>épine iliaque antéro-inférieure</em> et <em>sillon supra-acétabulaire</em>.<br><em>Insertion</em> : <em>tubérosité tibiale</em> (via le <em>ligament patellaire</em>) et la <em>patella</em>.<br><em>Actions</em> (muscle <em>bi-articulaire</em>) : <em>flexion de la cuisse à la hanche</em> et <em>extension de la jambe au genou</em>."},
{c:"c6",q:"Les extenseurs de hanche",a:"<em>Principaux</em> : <em>grand glutéal</em>, <em>biceps fémoral</em>, <em>semi-membraneux</em>, <em>semi-tendineux</em>.<br><em>Accessoire</em> : <em>grand adducteur</em>."},
{c:"c6",q:"Grand glutéal : O, I, action",a:"<em>Origines</em> : <em>face externe de la fosse iliaque</em>, <em>crête sacrée</em>, <em>coccyx</em>, <em>fascia thoraco-lombaire</em>, <em>ligament sacro-tubéral</em>.<br><em>Insertions</em> : <em>tubérosité glutéale du fémur</em> et <em>tractus ilio-tibial</em>.<br><em>Actions</em> : <em>extension de la hanche</em>, <em>rotation externe de la hanche</em> ; <em>fibres supérieures → abduction</em>, <em>fibres inférieures → adduction</em>."},
{c:"c6",q:"Les 3 ischio-jambiers et leur particularité",a:"<em>Biceps fémoral</em>, <em>semi-membraneux</em>, <em>semi-tendineux</em>.<br><em>À part le chef court du biceps fémoral, ce sont des muscles bi-articulaires</em> : ils ont des rôles à la <em>hanche ET au genou</em>, et <em>leur rôle dépend de la posture du corps</em>."},
{c:"c6",q:"Biceps fémoral : O, I, actions",a:"<em>Origine</em> : <em>chef long sur la tubérosité ischiatique</em> (le chef court naît du fémur).<br><em>Insertion</em> : <em>tête de la fibula</em>.<br><em>Actions</em> : <em>extension de la hanche (chef long)</em>, <em>flexion du genou</em>, <em>rotation externe du genou</em>."},
{c:"c6",q:"Semi-tendineux : O, I, actions",a:"<em>Origine</em> : <em>tubérosité ischiatique</em>.<br><em>Insertion</em> : <em>face supérieure et médiale du tibia</em>.<br><em>Actions</em> : <em>extension de la hanche (pied au sol)</em>, <em>flexion du genou (pied décollé)</em>, <em>rotation interne du genou (pied décollé)</em>."},
{c:"c6",q:"Semi-membraneux : O, I, actions",a:"<em>Origine</em> : <em>tubérosité ischiatique</em>.<br><em>Insertion</em> : <em>condyle médial tibial</em>.<br><em>Actions</em> : <em>extension de la hanche (bassin en antéversion)</em>, <em>rotateur interne de la hanche (bassin neutre)</em>, <em>flexion du genou</em>, <em>rotation interne du genou (jambe fléchie)</em>."},
{c:"c6",q:"Ischio-jambiers : qui tourne en interne, qui tourne en externe ?",a:"<em>Rotation interne du genou</em> : <em>semi-tendineux</em> et <em>semi-membraneux</em> (les « semi », médiaux).<br><em>Rotation externe du genou</em> : <em>biceps fémoral</em> (latéral).<br>Repère : le muscle tourne le tibia <em>de son côté</em>."},
{c:"c6",q:"Les abducteurs de hanche",a:"<em>Principaux</em> : <em>moyen glutéal</em> et <em>petit glutéal</em>.<br><em>Accessoires</em> : <em>tenseur du fascia lata</em>, <em>piriforme</em>, <em>sartorius</em>."},
{c:"c6",q:"Moyen et petit glutéal : insertions et actions",a:"<em>Moyen glutéal</em> : insertion <em>face latérale du grand trochanter</em> → <em>abduction</em> + <em>rotation interne de la hanche</em>.<br><em>Petit glutéal</em> : insertion <em>face antérieure du grand trochanter</em> → <em>abduction</em> + <em>rotation interne de la hanche</em>."},
{c:"c6",q:"Les adducteurs de hanche",a:"<em>Principaux</em> : <em>long adducteur</em>, <em>court adducteur</em>, <em>grand adducteur</em>, <em>gracile</em>.<br><em>Accessoires</em> : <em>pectiné</em>, <em>carré du fémur</em>, <em>fibres inférieures du grand glutéal</em>."},
{c:"c6",q:"Long adducteur : O, I, action",a:"<em>Origine</em> : <em>face antérieure du pubis</em>.<br><em>Insertion</em> : <em>tiers moyen de la ligne âpre du fémur</em>.<br><em>Action</em> : <em>adduction</em> + <em>rotation externe de la hanche</em> (+ flexion de la hanche)."},
{c:"c6",q:"Court adducteur : O, I, action",a:"<em>Origine</em> : <em>face externe de la branche ischio-pubienne</em>.<br><em>Insertion</em> : <em>tiers moyen de la ligne âpre du fémur</em>.<br><em>Action</em> : <em>adduction</em> + <em>rotation externe de la hanche</em> (+ flexion)."},
{c:"c6",q:"Grand adducteur : O, I, actions",a:"<em>Origines</em> : <em>tubérosité ischiatique</em> et <em>branche inférieure du pubis</em>.<br><em>Insertions</em> : <em>chef antérieur</em> sur le <em>tiers inférieur de la ligne âpre</em>, <em>chef postérieur</em> sur le <em>tubercule de l’adducteur</em>.<br><em>Actions</em> : <em>adduction</em> + <em>rotation externe</em> ; <em>chef antérieur → flexion</em> de hanche, <em>chef postérieur → extension</em> de hanche."},
{c:"c6",q:"Gracile : O, I, action",a:"<em>Origine</em> : <em>bord inférieur de la branche ischio-pubienne</em>.<br><em>Insertion</em> : <em>face antéro-médiale du tibia</em>.<br><em>Action</em> : <em>adduction</em> + <em>flexion de la hanche</em> (et <em>flexion + rotation interne du genou</em>)."},
{c:"c6",q:"Les rotateurs internes de hanche",a:"<em>Principaux</em> : <em>moyen glutéal</em> et <em>petit glutéal</em>.<br><em>Accessoires</em> : <em>tenseur du fascia lata</em> et la <em>plupart des muscles adducteurs</em>."},
{c:"c6",q:"Les rotateurs externes de hanche",a:"<em>Principaux</em> : <em>grand glutéal</em>, <em>obturateur interne</em>, <em>jumeau supérieur et inférieur</em>, <em>carré du fémur</em>, <em>piriforme</em>.<br><em>Accessoires</em> : <em>obturateur externe</em>, <em>sartorius</em>."},
{c:"c6",q:"Les fléchisseurs du genou",a:"<em>Principaux</em> : <em>biceps fémoral</em>, <em>semi-membraneux</em>, <em>semi-tendineux</em>, <em>poplité</em> (il <em>initie</em> la flexion).<br><em>Accessoires</em> : <em>sartorius</em>, <em>gracile</em>, <em>gastrocnémiens</em>."},
{c:"c6",q:"Les extenseurs du genou",a:"Le <em>quadriceps</em> : <em>droit fémoral</em>, <em>vaste médial</em>, <em>vaste latéral</em>, <em>vaste intermédiaire</em>.<br><em>Accessoire</em> : <em>tenseur du fascia lata</em>."},
{c:"c6",q:"Insertion commune des quadriceps",a:"<em>Tubérosité tibiale</em> (via le <em>ligament patellaire</em>) et la <em>patella</em>. C’est pour ça qu’ils font tous l’<em>extension du genou</em>."},
{c:"c6",q:"Vaste médial : origines",a:"<em>Ligne intertrochantérique</em>, <em>ligne pectinée du fémur</em>, <em>ligne âpre</em>, <em>ligne supracondylaire médiale du fémur</em>."},
{c:"c6",q:"Vaste latéral : origines",a:"<em>Ligne intertrochantérique</em>, <em>grand trochanter</em>, <em>tubérosité glutéale</em>, <em>ligne âpre du fémur</em>."},
{c:"c6",q:"Vaste intermédiaire : origine",a:"<em>Face antérieure de la diaphyse fémorale</em>."},
{c:"c6",q:"Les rotateurs internes du genou",a:"<em>Principaux</em> : <em>poplité</em>, <em>semi-membraneux</em>, <em>semi-tendineux</em>.<br><em>Accessoires</em> : <em>sartorius</em>, <em>gracile</em>."},
{c:"c6",q:"Poplité : O, I, rôle",a:"<em>Origine</em> : <em>condyle latéral</em> du fémur.<br><em>Insertion</em> : <em>surface postérieure du tibia proximal</em>.<br><em>Rôle</em> : <em>rotation interne du genou</em> et <em>initiation de la flexion</em> (il « déverrouille » le genou)."},
{c:"c6",q:"Le rotateur externe du genou",a:"Le <em>biceps fémoral</em>."},
{c:"c6",q:"Sartorius : O, I, actions",a:"Muscle <em>biarticulaire</em>.<br><em>Origine</em> : <em>épine iliaque antéro-supérieure</em>.<br><em>Insertion</em> : <em>extrémité proximale du tibia</em>.<br><em>Hanche</em> : <em>flexion</em>, <em>abduction</em>, <em>rotation externe</em>.<br><em>Genou</em> : <em>flexion</em>, <em>rotation interne</em>."},
{c:"c6",q:"Tenseur du fascia lata : O, I, actions",a:"<em>Origines</em> : <em>épine iliaque antéro-supérieure</em> et <em>crête iliaque</em>.<br><em>Insertion</em> : <em>fascia lata</em> → <em>condyle latéral du tibia</em>.<br><em>Hanche</em> : <em>flexion</em>, <em>abduction</em>, <em>rotation interne</em>.<br><em>Genou</em> : s’il est <em>déjà fléchi → flexion</em> ; s’il est <em>déjà étendu → extension</em>."},
{c:"c6",q:"Sartorius vs TFL : la différence qui tombe en QCM",a:"Les deux partent de l’<em>EIAS</em> et font <em>flexion + abduction</em> de hanche. Mais :<ul><li><em>Sartorius</em> → <em>rotation EXTERNE</em> de hanche et <em>rotation interne</em> du genou</li><li><em>TFL</em> → <em>rotation INTERNE</em> de hanche</li></ul>"},
{c:"c6",q:"Les fléchisseurs dorsaux de la cheville",a:"<em>Principaux</em> : <em>tibial antérieur</em> et <em>long extenseur des orteils</em>.<br><em>Accessoire</em> : <em>3e fibulaire</em>."},
{c:"c6",q:"Tibial antérieur : O, I, actions",a:"<em>Origines</em> : <em>condyle et face latérale du tibia</em>, <em>membrane interosseuse</em>.<br><em>Insertions</em> : <em>os cunéiforme médial</em> et <em>base du premier métatarsien</em>.<br><em>Actions</em> : <em>flexion dorsale du pied</em> (cheville) et <em>inversion du pied</em> (articulation subtalaire)."},
{c:"c6",q:"Long extenseur des orteils : O, I, actions",a:"<em>Origine</em> : <em>face médiale en antérieur de la fibula</em>.<br><em>Insertion</em> : <em>face dorsale des orteils 2 à 5</em>.<br><em>Actions</em> : <em>extension (flexion dorsale) des orteils 2 à 5</em>, <em>flexion dorsale du pied</em>, <em>éversion du pied</em> (articulations tarsiennes)."},
{c:"c6",q:"Long extenseur de l’hallux : O, actions",a:"<em>Origine</em> : <em>milieu de la face antérieure du tibia</em>.<br><em>Actions</em> : <em>extension (flexion dorsale) de l’hallux</em>, <em>flexion dorsale de la cheville</em>, <em>éversion du pied</em>."},
{c:"c6",q:"Les fléchisseurs plantaires de la cheville",a:"<em>Principaux</em> : <em>gastrocnémiens</em> et <em>soléaire</em> (ensemble = le <em>triceps sural</em>).<br><em>Accessoires</em> : <em>tibial postérieur</em>, <em>long fléchisseur des orteils</em>, <em>long fibulaire</em>, <em>court fibulaire</em>."},
{c:"c6",q:"Qu’est-ce que le triceps sural ?",a:"L’ensemble <em>gastrocnémien médial + gastrocnémien latéral + soléaire</em>, qui se termine par le <em>tendon calcanéen</em> (tendon d’Achille) sur la <em>face postérieure du calcanéus</em>."},
{c:"c6",q:"Gastrocnémiens : O, I, actions",a:"<em>Origines</em> : <em>chef latéral sur le condyle fémoral latéral</em>, <em>chef médial sur le condyle fémoral médial</em> (et la face poplitée de la diaphyse fémorale).<br><em>Insertion</em> : <em>face postérieure du calcanéus via le tendon calcanéen</em>.<br><em>Actions</em> : <em>flexion plantaire du pied</em> ET <em>flexion du genou</em> (muscle <em>bi-articulaire</em>)."},
{c:"c6",q:"Soléaire : O, I, action",a:"<em>Origines</em> : <em>ligne du muscle soléaire et bord médial du tibia</em>, <em>tête et bord postérieur de la fibula</em>.<br><em>Insertion</em> : <em>face postérieure du calcanéus via le tendon calcanéen</em>.<br><em>Action</em> : <em>flexion plantaire du pied</em> uniquement — il <em>ne croise pas le genou</em>."},
{c:"c6",q:"Gastrocnémiens vs soléaire : la distinction clé",a:"Les <em>gastrocnémiens</em> naissent des <em>condyles fémoraux</em> → <em>bi-articulaires</em> : flexion plantaire <em>et</em> flexion du genou.<br>Le <em>soléaire</em> naît du <em>tibia et de la fibula</em> → <em>mono-articulaire</em> : <em>flexion plantaire seule</em>.<br>D’où le mollet travaillé genou tendu (gastrocnémiens) ou genou fléchi (soléaire)."},
{c:"c6",q:"Les inverseurs de la cheville",a:"<em>Principal</em> : <em>tibial postérieur</em>.<br><em>Accessoire</em> : <em>tibial antérieur</em>."},
{c:"c6",q:"Tibial postérieur : O, I",a:"<em>Origines</em> : <em>face postérieure du tibia</em> et <em>face postérieure de la fibula</em>.<br><em>Insertions</em> : <em>naviculaire</em>, <em>os cunéiformes</em>, <em>os cuboïde</em>, <em>bases des métatarsiens 2 à 4</em>."},
{c:"c6",q:"Les éverseurs de la cheville",a:"<em>Principaux</em> : <em>long fibulaire</em> (insertion sur le <em>1er métatarsien</em>) et <em>court fibulaire</em> (insertion sur le <em>5e métatarsien</em>).<br><em>Accessoire</em> : <em>3e fibulaire</em>."},
{c:"c6",q:"Inverseurs vs éverseurs : le repère simple",a:"<em>Tout ce qui est « tibial » → inversion</em> (tibial antérieur et postérieur, médiaux).<br><em>Tout ce qui est « fibulaire » → éversion</em> (long, court et 3e fibulaires, latéraux)."},
{c:"c6",q:"Quels sont les muscles bi-articulaires du membre inférieur à connaître ?",a:"<ul><li><em>Droit fémoral</em> (hanche + genou)</li><li><em>Ischio-jambiers</em> sauf le <em>chef court du biceps fémoral</em> (hanche + genou)</li><li><em>Gastrocnémiens</em> (genou + cheville)</li><li><em>Sartorius</em>, <em>gracile</em>, <em>tenseur du fascia lata</em></li></ul>Leur action dépend de la <em>posture du corps</em>."}
];
