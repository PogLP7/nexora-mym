{c:"c1",q:"Dans le plan sagittal, le rachis présente…",o:["4 courbures","2 courbures","Aucune courbure","6 courbures"],k:0,w:"Lordose cervicale, cyphose thoracique, lordose lombale, cyphose sacrale."},
{c:"c1",q:"Dans le plan frontal, le rachis est…",o:["Doublement incurvé","Globalement rectiligne","En lordose","En cyphose"],k:1,w:"Les 4 courbures sont sagittales ; dans le plan frontal le rachis est rectiligne."},
{c:"c1",q:"La courbure de la région lombaire est…",o:["Une cyphose","Une lordose","Une scoliose","Rectiligne"],k:1,w:"Lordose lombale. Lordoses = cervicale + lombale ; cyphoses = thoracique + sacrale."},
{c:"c1",q:"La courbure de la région thoracique est…",o:["Une lordose","Une cyphose","Rectiligne","Une double courbure"],k:1,w:"Cyphose dorsale / thoracique."},
{c:"c1",q:"Les mouvements réalisés par le tronc sont…",o:["Flexion/extension uniquement","Flexion/extension, inclinaison médiale/latérale, rotation interne/externe","Pronation/supination et flexion","Abduction/adduction et rotation"],k:1,w:"Trois plans : sagittal, frontal, transverse."},
{c:"c1",q:"Les articulations sacro-iliaques sont…",o:["Cartilagineuses et immobiles","Synoviales mais peu mobiles","Fibreuses et très mobiles","Des plans de glissement"],k:1,w:"Synoviales mais peu mobiles. C’est la symphyse pubienne qui est cartilagineuse."},
{c:"c1",q:"La symphyse pubienne est une articulation…",o:["Synoviale","Cartilagineuse","Un plan de glissement","Une énarthrose"],k:1,w:"Articulation cartilagineuse."},
{c:"c1",q:"Le pelvis est constitué de…",o:["Deux os coxaux, le sacrum et le coccyx","Deux os coxaux uniquement","Le sacrum et les deux fémurs","L’ilium et l’ischion"],k:0,w:"2 os coxaux + sacrum + coccyx. L’os coxal = ilium + ischium + pubis fusionnés."},
{c:"c1",q:"L’EIAS désigne…",o:["L’épine iliaque antéro-supérieure","L’épine iliaque postéro-supérieure","L’extrémité inférieure de l’aile sacrée","L’échancrure ischiatique antéro-supérieure"],k:0,w:"EIAS = épine iliaque antéro-supérieure. Repère clé : origine du sartorius et du TFL."},

/* ===== c2 ===== */
{c:"c2",q:"Combien d’os au tarse ?",o:["5","7","14","26"],k:1,w:"7 tarses, 5 métatarses, 14 phalanges."},
{c:"c2",q:"Combien de phalanges par pied ?",o:["5","7","14","12"],k:2,w:"14 phalanges (2 pour l’hallux, 3 pour chacun des 4 autres orteils)."},
{c:"c2",q:"La malléole externe appartient à…",o:["Au tibia","À la fibula","Au talus","Au calcanéus"],k:1,w:"Malléole externe = fibulaire ; malléole interne = tibiale."},
{c:"c2",q:"L’articulation de la hanche s’appelle…",o:["L’articulation sacro-iliaque","L’articulation coxo-fémorale","L’articulation ilio-fémorale","L’articulation acétabulaire"],k:1,w:"Coxo-fémorale : interface pelvis / fémur."},
{c:"c2",q:"Parmi ces ligaments, lequel est INTRAcapsulaire à la hanche ?",o:["Le ligament ilio-fémoral","Le ligament pubo-fémoral","Le ligament de la tête du fémur","Le ligament ischio-fémoral"],k:2,w:"Intracapsulaires : ligament transverse acétabulaire et ligament de la tête du fémur. Les trois autres sont capsulaires."},
{c:"c2",q:"La flexion de hanche est plus ample…",o:["Genou fléchi","Genou tendu","C’est identique","Hanche en rotation externe uniquement"],k:0,w:"Genou fléchi > genou non fléchi : les ischio-jambiers (bi-articulaires) ne freinent plus le mouvement."},
{c:"c2",q:"L’articulation du genou est composée de…",o:["La fémoro-tibiale uniquement","La fémoro-tibiale et la fémoro-patellaire","La fémoro-tibiale et la tibio-fibulaire proximale","La fémoro-patellaire et la tibio-fibulaire"],k:1,w:"Deux articulations : fémoro-tibiale + fémoro-patellaire."},
{c:"c2",q:"Au genou, le mouvement réel associe…",o:["Une rotation pure","Une translation pure","Une rotation et une translation (glissement)","Une pronation et une supination"],k:2,w:"Rotation du fémur par rapport au plateau tibial + translation."},
{c:"c2",q:"L’articulation tibio-fibulaire proximale…",o:["A une mobilité très limitée","Est très mobile","N’existe pas","Permet la flexion du genou"],k:0,w:"Mobilité très limitée."},
{c:"c2",q:"L’articulation de la cheville s’appelle…",o:["L’articulation subtalaire","L’articulation talo-crurale","L’articulation de Chopart","L’articulation calcanéo-cuboïdienne"],k:1,w:"Talo-crurale : tibia + fibula + talus."},
{c:"c2",q:"À la talo-crurale, le tibia et la fibula…",o:["« Coincent » le talus","Glissent sur le calcanéus","S’articulent avec le naviculaire","Sont séparés par un ménisque"],k:0,w:"Formulation du CM : la fibula et le tibia « coincent » le talus."},
{c:"c2",q:"Les mouvements d’abduction/adduction et de pronation/supination à la talo-crurale sont…",o:["Très amples (plus de 40 degrés)","Légers (moins de 10 degrés) et accentués par les articulations du pied","Impossibles","Les mouvements principaux"],k:1,w:"Moins de 10 degrés à la talo-crurale ; les intertarsiennes les accentuent."},
{c:"c2",q:"L’articulation transverse du tarse (Chopart) associe…",o:["La talo-crurale et la subtalaire","La talo-calcanéo-naviculaire et la calcanéo-cuboïdienne","Les intermétatarsiennes","Les métatarso-phalangiennes"],k:1,w:"Chopart = talo-calcanéo-naviculaire + calcanéo-cuboïdienne."},
{c:"c2",q:"L’inversion du pied correspond à la combinaison…",o:["Abduction + pronation + flexion dorsale","Adduction + supination + flexion plantaire","Adduction + pronation + flexion dorsale","Abduction + supination + flexion plantaire"],k:1,w:"Inversion = adduction + supination + flexion plantaire. L’éversion est l’inverse."},
{c:"c2",q:"Les mouvements des orteils se font aux articulations…",o:["Intertarsiennes et subtalaire","Métatarso-phalangiennes et interphalangiennes","Talo-crurale et Chopart","Tarso-métatarsiennes uniquement"],k:1,w:"Flexions/extensions aux MTP et aux IP."},

/* ===== c3 ===== */
{c:"c3",q:"La ceinture scapulaire est constituée de…",o:["La scapula et l’humérus","La clavicule et la scapula","La clavicule et le sternum","La scapula et les côtes"],k:1,w:"Clavicule + scapula (parfois le manubrium sternal est inclus)."},
{c:"c3",q:"L’articulation acromio-claviculaire…",o:["Est très stable grâce à un emboîtement profond","Autorise une mobilité dans toutes les directions mais n’assure aucune stabilité","N’a aucune mobilité","Est un plan de glissement sans ménisque"],k:1,w:"Surfaces planes elliptiques juxtaposées sans emboîtement, avec un ménisque : mobile mais instable."},
{c:"c3",q:"L’articulation scapulo-thoracique est…",o:["Une articulation synoviale classique","Un plan de glissement (bourse séreuse ou couche cellulo-graisseuse)","Une articulation cartilagineuse","Une symphyse"],k:1,w:"Pas synoviale : plan de glissement qui se comporte comme une articulation."},
{c:"c3",q:"Degrés de liberté de la scapulo-thoracique ?",o:["3 rotations uniquement","2 translations et 3 rotations","1 translation et 1 rotation","6 translations"],k:1,w:"2 translations + 3 rotations, surtout rotation interne/externe."},
{c:"c3",q:"L’abduction de la scapula est aussi appelée…",o:["Rétraction","Protraction","Élévation","Dépression"],k:1,w:"Abduction = protraction ; adduction = rétraction."},
{c:"c3",q:"Le labrum glénoïdien est…",o:["Un ligament capsulaire","Un anneau de fibrocartilage qui augmente la congruence","Un muscle de la coiffe","Une bourse séreuse"],k:1,w:"Bourrelet / labrum glénoïdien : anneau de fibrocartilage sur le pourtour de la glénoïde."},
{c:"c3",q:"Le rythme scapulo-huméral après ~30 degrés d’élévation est d’environ…",o:["1:1","2:1 (humérus : scapula)","1:2","3:1"],k:1,w:"Après ~30 degrés, humérus et scapula bougent avec un rapport ~2:1."},
{c:"c3",q:"Amplitude de flexion / extension de l’épaule au CM ?",o:["180 / 60","180 / 45","95 / 40","140 / 10"],k:0,w:"Flex/ext 180/60 ; abd/add 180/45 ; rot int/ext 95/40."},
{c:"c3",q:"Amplitude de rotation interne / externe de l’épaule au CM ?",o:["180 / 60","180 / 45","95 / 40","90 / 90"],k:2,w:"Rotation interne/externe : 95 / 40."},
{c:"c3",q:"Les articulations du coude sont…",o:["Huméro-ulnaire et huméro-radiale","Huméro-ulnaire uniquement","Radio-ulnaire proximale et distale","Huméro-radiale et radio-carpienne"],k:0,w:"Huméro-ulnaire + huméro-radiale, auxquelles s’ajoute la radio-ulnaire proximale."},
{c:"c3",q:"Flexion maximale du coude ?",o:["90 degrés","110-120 degrés","140-150 degrés","180 degrés"],k:2,w:"Flexion max 140-150 ; extension max 0-10."},
{c:"c3",q:"La pronation et la supination maximales sont d’environ…",o:["45 degrés chacune","90 degrés chacune","120 degrés chacune","180 degrés chacune"],k:1,w:"Pronation max 90, supination max 90."},
{c:"c3",q:"Le radius est…",o:["Plus petit à son extrémité proximale qu’à son extrémité distale","Plus gros à son extrémité proximale","De diamètre constant","Soudé à l’ulna"],k:0,w:"Le radius est plus petit en proximal et plus gros en distal — l’ulna fait l’inverse."},
{c:"c3",q:"L’articulation du poignet associe…",o:["Radio-carpiennes et médio-carpiennes","Radio-ulnaire distale et carpo-métacarpiennes","Médio-carpiennes uniquement","Radio-carpiennes et métacarpo-phalangiennes"],k:0,w:"Radio-carpiennes + médio-carpiennes."},
{c:"c3",q:"La flexion du poignet est majoritairement un mouvement…",o:["Radiocarpien (~66 %)","Médiocarpien (60 %)","Carpo-métacarpien","Radio-ulnaire"],k:1,w:"Flexion : médiocarpienne à 60 %. Extension : radiocarpienne à ~66 %."},
{c:"c3",q:"L’extension du poignet est majoritairement un mouvement…",o:["Médiocarpien (60 %)","Radiocarpien (~66 %)","Intercarpien","Métacarpo-phalangien"],k:1,w:"Extension : surtout radiocarpienne (~66 %)."},
{c:"c3",q:"L’articulation spéciale du pouce est…",o:["La métacarpo-phalangienne","La trapézo-métacarpienne","L’interphalangienne distale","La radio-carpienne"],k:1,w:"Trapézo-métacarpienne : elle autorise l’opposition."},
{c:"c3",q:"Le bruit de craquement articulaire s’explique par…",o:["Le frottement des cartilages","La tribonucléation : création temporaire d’une cavité par pression négative","La rupture d’un ligament","Le passage d’un tendon sur un os"],k:1,w:"Tribonucléation : séparation brusque de deux surfaces unies par un liquide visqueux."},
{c:"c3",q:"L’étude d’Unger (1998, IgNobel 2007) a montré que…",o:["Faire craquer ses doigts provoque de l’arthrite","Aucune arthrite n’est apparue dans les deux mains","L’arthrite n’apparaît qu’à gauche","Le craquement renforce les articulations"],k:1,w:"50 ans, main gauche craquée au moins 36 500 fois : aucune arthrite dans les deux mains."},

/* ===== c4 ===== */
{c:"c4",q:"Dans la convention du cours, l’origine d’un muscle est…",o:["La jonction distale (loin de la tête)","La jonction proximale (près de la tête)","Toujours sur l’os le plus mobile","Toujours sur le rachis"],k:1,w:"Choix du CM : origines = jonctions proximales, insertions = jonctions distales. Certains manuels inversent."},
{c:"c4",q:"Les érecteurs du rachis sont constitués de…",o:["Iliocostal, longissimus et épineux","Splénius, scalènes et multifides","Carré des lombes, psoas et iliaque","Semi-épineux, rotateurs et interépineux"],k:0,w:"Iliocostal + longissimus + épineux, chacun subdivisé en régions."},
{c:"c4",q:"Contractés bilatéralement, les érecteurs du rachis provoquent…",o:["Une flexion du rachis","Une extension de la zone du rachis à laquelle ils sont rattachés","Une rotation pure","Une inclinaison latérale"],k:1,w:"Bilatéral → extension ; unilatéral → inclinaison latérale."},
{c:"c4",q:"Dans les érecteurs du rachis, le plus long et le plus épais est…",o:["L’iliocostal","Le longissimus","L’épineux","Le multifide"],k:1,w:"Longissimus = le plus long et le plus épais. L’épineux est le plus petit."},
{c:"c4",q:"Le muscle le plus profond de la paroi abdominale postérieure est…",o:["Le transverse de l’abdomen","Le carré des lombes","Le grand psoas","L’oblique interne"],k:1,w:"Carré des lombes : le plus profond de la paroi abdominale postérieure."},
{c:"c4",q:"Origines du carré des lombes ?",o:["Bord inférieur de la 12e côte et processus transverses de L1 à L4","Corps vertébraux de T12 à L5","Crête iliaque et ligament inguinal","7 dernières côtes"],k:0,w:"O : 12e côte (bord inférieur) + processus transverses L1-L4. I : crête iliaque + ligament iliolombaire."},
{c:"c4",q:"Contracté unilatéralement, le carré des lombes provoque…",o:["Une extension du tronc","Une inclinaison latérale du tronc","Une rotation du tronc","Une flexion du tronc"],k:1,w:"Bilatéral → extension du tronc (et immobilise la 12e côte) ; unilatéral → inclinaison latérale."},
{c:"c4",q:"L’ilio-psoas est composé de…",o:["Du muscle iliaque (chef latéral) et du grand psoas (chef médial)","Du grand et du petit glutéal","Du psoas et du carré des lombes","De l’iliaque et du pectiné"],k:0,w:"Iliaque = chef latéral ; grand psoas = chef médial (+ petit psoas inconstant)."},
{c:"c4",q:"L’insertion commune de l’ilio-psoas est…",o:["Le grand trochanter","Le petit trochanter","La ligne âpre","La tubérosité tibiale"],k:1,w:"Petit trochanter du fémur."},
{c:"c4",q:"Les origines du grand psoas sont…",o:["La fosse iliaque et la base du sacrum","Les corps vertébraux et disques de T12 à L5 et les processus transverses de L1 à L5","La crête iliaque et le ligament inguinal","Les 7 dernières côtes"],k:1,w:"Corps vertébraux T12-L5, disques T12-L5, processus transverses L1-L5. La fosse iliaque, c’est l’iliaque."},
{c:"c4",q:"Le grand psoas favorise…",o:["La cyphose lombaire","La lordose lombaire","La rectitude du rachis","La cyphose thoracique"],k:1,w:"Il favorise la lordose lombaire (il tire les lombaires vers l’avant et le bas)."},
{c:"c4",q:"Que fait le muscle iliaque sur le bassin ?",o:["Une rétroversion","Une antéversion","Une rotation externe pure","Rien"],k:1,w:"Iliaque : antéversion du bassin / flexion de hanche."},
{c:"c4",q:"Pourquoi le psoas fait-il parfois fléchir la hanche et parfois le tronc ?",o:["Parce qu’il change d’insertion","Parce que le muscle produit une force à son origine ET à son insertion : c’est la configuration du corps qui décide","Parce qu’il a deux chefs","Parce qu’il est mono-articulaire"],k:1,w:"Jambe posée au sol → mouvement des lombaires. Allongé → mouvement des lombaires et du fémur."},
{c:"c4",q:"L’abdomen est la région située…",o:["Entre le thorax et le pelvis","Entre le pelvis et les cuisses","Au-dessus du diaphragme","Entre le rachis et le sternum"],k:0,w:"Définition du CM : entre le thorax et le pelvis."},
{c:"c4",q:"Le plus profond des « abdominaux » de la paroi latérale est…",o:["L’oblique externe","L’oblique interne","Le transverse de l’abdomen","Le droit de l’abdomen"],k:2,w:"De profond à superficiel : transverse → oblique interne → oblique externe."},
{c:"c4",q:"L’origine du transverse de l’abdomen est…",o:["La ligne blanche de l’abdomen","La crête iliaque","Les 7 dernières côtes","Le pubis"],k:0,w:"O : ligne blanche. I : cartilages costaux 7-12, L1-L5 via le fascia thoraco-lombal, crête iliaque, ligament inguinal."},
{c:"c4",q:"L’oblique interne, contracté unilatéralement, provoque…",o:["Une rotation interne du tronc","Une rotation externe du tronc / pelvis","Une extension du tronc","Une adduction du bassin"],k:1,w:"Piège classique : oblique INTERNE → rotation EXTERNE."},
{c:"c4",q:"L’oblique externe, contracté unilatéralement, provoque…",o:["Une rotation externe du tronc","Une rotation interne du tronc / pelvis","Une extension du tronc","Une inclinaison controlatérale pure"],k:1,w:"Oblique EXTERNE → rotation INTERNE. Inversé par rapport au nom."},
{c:"c4",q:"L’origine de l’oblique externe est…",o:["Les 7 dernières côtes (face externe)","Le cartilage des 3 ou 4 dernières côtes","La ligne blanche uniquement","La crête iliaque"],k:0,w:"O : 7 dernières côtes (face externe). I : crête iliaque, ligne blanche, ligament inguinal, pubis."},
{c:"c4",q:"Le droit de l’abdomen s’insère sur…",o:["La crête iliaque","Le pubis","Le ligament inguinal","Le fascia thoraco-lombal"],k:1,w:"O : cartilages costaux 5-7 + processus xiphoïde. I : pubis."},
{c:"c4",q:"Le relâchement du droit de l’abdomen…",o:["Accentue la lordose lombaire","Réduit la lordose lombaire","N’a aucun effet postural","Provoque une cyphose thoracique"],k:0,w:"Statique du tronc : son relâchement accentue la lordose lombaire."},
{c:"c4",q:"Quel muscle participe à l’expiration forcée et comprime les viscères ?",o:["Le droit de l’abdomen","Le transverse de l’abdomen","Le carré des lombes","Le longissimus"],k:1,w:"Le transverse comprime et soutient les viscères et participe à l’expiration forcée."},

/* ===== c5 ===== */
{c:"c5",q:"Les muscles des mouvements de la ceinture scapulaire ont…",o:["Leur origine sur l’humérus","Leur origine sur le squelette axial et leur insertion sur la scapula ou la clavicule","Leur origine sur la scapula et leur insertion sur l’humérus","Aucune insertion osseuse"],k:1,w:"Définition du CM."},
{c:"c5",q:"L’élévateur de la scapula naît de…",o:["C1 à C4 ou C5","T2 à T5","C7 et T1","T4 à T12"],k:0,w:"O : C1-C4/C5 ; I : bord médial supérieur de la scapula ; A : élévation + rotation vers le bas."},
{c:"c5",q:"Le grand rhomboïde naît des processus épineux de…",o:["C7 et T1","T2 à T5","T7 à T12","T4 à T12"],k:1,w:"Grand rhomboïde : T2-T5. Petit rhomboïde : C7-T1."},
{c:"c5",q:"Le petit rhomboïde naît des processus épineux de…",o:["C1 à C4","C7 et T1","T2 à T5","T9 à T12"],k:1,w:"Petit rhomboïde : C7 et T1."},
{c:"c5",q:"La partie descendante du trapèze…",o:["Baisse la scapula","Élève la scapula","Fait l’adduction de la scapula","Fait l’abduction de la scapula"],k:1,w:"Descendante (sup) → élève ; transversale (moy) → adduction ; ascendante (inf) → baisse."},
{c:"c5",q:"La partie transversale du trapèze provoque…",o:["L’élévation de la scapula","L’adduction de la scapula","L’abduction de la scapula","La rotation vers le bas"],k:1,w:"Fibres moyennes → adduction (rapprochement des scapulas)."},
{c:"c5",q:"La partie ascendante du trapèze s’insère sur…",o:["Le tiers latéral de la clavicule","L’apex latéral de l’extrémité médiale de l’épine de la scapula","Le processus coracoïde","L’acromion"],k:1,w:"Elle naît de T4-T12 et baisse la scapula."},
{c:"c5",q:"Le subclavier s’insère sur…",o:["La 1re côte","La clavicule","Le processus coracoïde","Le sternum"],k:0,w:"O : clavicule ; I : 1re côte ; A : abaissement."},
{c:"c5",q:"Le petit pectoral provoque…",o:["Abduction et rotation vers le haut de la scapula","Abduction et rotation vers le bas de la scapula","Adduction et élévation","Dépression pure"],k:1,w:"Petit pectoral → rotation vers le BAS. Dentelé antérieur → rotation vers le HAUT."},
{c:"c5",q:"Le dentelé antérieur s’insère sur…",o:["Les 8 ou 9 premières côtes","Les 3e à 5e côtes","La 1re côte","Le processus coracoïde"],k:0,w:"O : bord médial et angle inférieur de la scapula ; I : 8-9 premières côtes ; A : abduction + rotation vers le haut."},
{c:"c5",q:"Les fléchisseurs principaux de l’épaule sont…",o:["Deltoïde antérieur, grand pectoral, coraco-brachial","Deltoïde postérieur, grand rond, grand dorsal","Supra-épineux et deltoïde médian","Subscapulaire et petit rond"],k:0,w:"Accessoires : chef long du biceps et subscapulaire."},
{c:"c5",q:"Le coraco-brachial naît de…",o:["L’acromion","Le processus coracoïde de la scapula","L’épine de la scapula","La clavicule"],k:1,w:"O : processus coracoïde ; I : face antérieure de l’humérus ; A : flexion + adduction."},
{c:"c5",q:"Le grand pectoral est…",o:["Rotateur externe de l’humérus","Rotateur interne de l’humérus","Sans effet rotatoire","Abducteur principal"],k:1,w:"Flexion, adduction, rotation interne (+ respiration forcée)."},
{c:"c5",q:"Combien de parties compte le grand pectoral ?",o:["2","3 : claviculaire, sterno-costale, abdominale","4","1 seule"],k:1,w:"Claviculaire, sterno-costale, abdominale."},
{c:"c5",q:"Les extenseurs principaux de l’épaule sont…",o:["Deltoïde postérieur, grand rond, grand dorsal","Grand pectoral et biceps","Supra-épineux et trapèze","Subscapulaire et petit rond"],k:0,w:"Les trois extenseurs principaux."},
{c:"c5",q:"Le grand rond naît de…",o:["L’épine de la scapula","Le bord latéral de la scapula","La fosse infra-épineuse","Le processus coracoïde"],k:1,w:"O : bord latéral de la scapula ; I : sillon intertuberculaire ; A : extension + adduction."},
{c:"c5",q:"Le grand dorsal fait…",o:["Flexion, abduction, rotation externe","Extension, adduction, rotation interne","Abduction pure","Rotation externe pure"],k:1,w:"Extension + adduction + rotation interne. Sur le pelvis : inclinaison latérale du tronc."},
{c:"c5",q:"Combien de parties compte le grand dorsal ?",o:["3 : vertébrale, costale, iliaque","2 : vertébrale et costale","4","1"],k:0,w:"Vertébrale (T7-T12 + fascia thoraco-lombaire), costale (côtes 9-12), iliaque (crête du sacrum et de l’ilium)."},
{c:"c5",q:"Le supra-épineux est responsable de l’abduction…",o:["Au-delà de 15 degrés","Principalement de 0 à 15 degrés","De 90 à 150 degrés","De 150 à 180 degrés"],k:1,w:"Supra-épineux : 0-15. Deltoïde médian : au-delà des 15 degrés initiaux."},
{c:"c5",q:"Le deltoïde médian naît de…",o:["L’acromion","La clavicule","L’épine de la scapula","Le processus coracoïde"],k:0,w:"Antérieur → clavicule ; médian → acromion ; postérieur → épine de la scapula."},
{c:"c5",q:"De 90 à 150 degrés d’abduction, le mouvement vient surtout…",o:["De la scapulo-humérale","Du glissement scapulo-thoracique (dentelé antérieur et trapèze)","De l’incurvation du rachis","De la sterno-claviculaire"],k:1,w:"0-90 scapulo-humérale (supra-épineux + deltoïde) ; 90-150 scapulo-thoracique ; 150-180 incurvation du rachis."},
{c:"c5",q:"De 150 à 180 degrés d’abduction, le complément vient…",o:["Du deltoïde","De l’incurvation de la colonne vertébrale (érecteurs du rachis)","Du supra-épineux","Du subscapulaire"],k:1,w:"Troisième phase : incurvation du rachis."},
{c:"c5",q:"Les 4 muscles de la coiffe des rotateurs sont…",o:["Supra-épineux, infra-épineux, petit rond, subscapulaire","Supra-épineux, infra-épineux, grand rond, subscapulaire","Deltoïde, supra-épineux, petit rond, grand rond","Subscapulaire, grand dorsal, petit rond, infra-épineux"],k:0,w:"Attention : c’est le PETIT rond, pas le grand rond. Tous ont pour origine la scapula."},
{c:"c5",q:"Le rôle majeur de la coiffe des rotateurs est…",o:["La puissance de l’abduction","La stabilisation gléno-humérale en centrant la tête humérale dans la glène","La flexion du coude","La rotation de la scapula"],k:1,w:"Elle maintient et centre la tête humérale et resserre la capsule articulaire."},
{c:"c5",q:"Le subscapulaire s’insère sur…",o:["Le tubercule majeur","Le tubercule mineur de l’humérus","La tubérosité deltoïdienne","Le sillon intertuberculaire"],k:1,w:"O : deux tiers médiaux de la fosse subscapulaire ; I : tubercule mineur ; A : rotation interne + stabilisation."},
{c:"c5",q:"L’infra-épineux est…",o:["Rotateur interne","Rotateur externe","Abducteur principal","Fléchisseur"],k:1,w:"Rotateur externe (latéral) + stabilisateur de la tête humérale."},
{c:"c5",q:"Les rotateurs internes de l’épaule comprennent…",o:["Infra-épineux, petit rond, deltoïde postérieur","Subscapulaire, grand pectoral, grand dorsal, grand rond, deltoïde antérieur","Supra-épineux et deltoïde médian","Coraco-brachial et biceps"],k:1,w:"Rotateurs externes = infra-épineux, petit rond, deltoïde postérieur."},
{c:"c5",q:"Le brachial s’insère sur…",o:["Le processus styloïde du radius","Le processus coronoïde de l’ulna","La tubérosité radiale","L’olécrâne"],k:1,w:"O : moitié distale de la face antérieure de l’humérus ; I : processus coronoïde de l’ulna."},
{c:"c5",q:"Le brachioradial s’insère sur…",o:["Le processus styloïde du radius","Le processus coronoïde de l’ulna","La base du 2e métacarpien","L’olécrâne"],k:0,w:"O : bord latéral de l’humérus ; I : processus styloïde du radius."},
{c:"c5",q:"Particularité fonctionnelle du brachioradial ?",o:["Il est pronateur pur","Il ramène l’avant-bras en position neutre de prono-supination","Il est supinateur pur","Il étend le coude"],k:1,w:"Supination si l’avant-bras est en pronation, pronation s’il est en supination."},
{c:"c5",q:"Le chef long du biceps brachial naît de…",o:["Le processus coracoïde","Le tubercule supraglénoïdien de la scapula","Le tubercule infraglénoïdal","L’acromion"],k:1,w:"Chef long : tubercule supraglénoïdien. Chef court : processus coracoïde."},
{c:"c5",q:"Pourquoi le biceps brachial est-il bi-articulaire ?",o:["Il a deux chefs","Il a ses origines sur la scapula et ses insertions sur le radius : il croise épaule et coude","Il s’insère sur deux os de l’avant-bras","Il a deux tendons distaux"],k:1,w:"Avoir deux chefs ne suffit pas : c’est le franchissement de deux articulations qui compte."},
{c:"c5",q:"Le chef long du triceps brachial naît de…",o:["Le tubercule supraglénoïdien","Le tubercule infraglénoïdal de la scapula","La face postérieure de l’humérus","L’épicondyle latéral"],k:1,w:"Chef long : tubercule infraglénoïdal (donc bi-articulaire : extenseur et adducteur du bras)."},
{c:"c5",q:"L’anconé naît de…",o:["L’épicondyle médial","L’épicondyle latéral","L’olécrâne","La face postérieure de l’humérus"],k:1,w:"O : épicondyle latéral ; I : face latérale de l’olécrâne ; A : extension."},
{c:"c5",q:"Le carré pronateur relie…",o:["Le tiers distal de l’ulna au tiers distal du radius","L’épicondyle médial au radius","Le radius au 2e métacarpien","L’humérus à l’ulna"],k:0,w:"Faces antérieures des tiers distaux de l’ulna (O) et du radius (I)."},
{c:"c5",q:"Le rond pronateur a un chef huméral qui naît de…",o:["L’épicondyle latéral","L’épicondyle médial","L’olécrâne","Le processus styloïde"],k:1,w:"Chef huméral : épicondyle médial. Chef ulnaire : processus coronoïde."},
{c:"c5",q:"Le supinateur naît de…",o:["L’épicondyle médial de l’humérus","L’épicondyle latéral de l’humérus et la crête supinatrice de l’ulna","Le processus coracoïde","La tubérosité radiale"],k:1,w:"I : faces latérale, postérieure et antérieure du tiers proximal du radius."},
{c:"c5",q:"Le fléchisseur radial du carpe s’insère sur…",o:["Les bases du 2e et du 3e métacarpiens","La base du 5e métacarpien","L’os pisiforme","L’aponévrose palmaire"],k:0,w:"Fléchisseur principal du poignet + abduction de la main."},
{c:"c5",q:"Le fléchisseur ulnaire du carpe s’insère sur…",o:["Les bases du 2e et 3e métacarpiens","L’os pisiforme, l’os hamatum et la base du 5e métacarpien","Le rétinaculum des fléchisseurs","Le processus styloïde du radius"],k:1,w:"A : flexion du poignet avec déviation ulnaire."},
{c:"c5",q:"Quel muscle est absent chez environ 30 % de la population ?",o:["Le fléchisseur radial du carpe","Le long palmaire","L’anconé","Le supinateur"],k:1,w:"30 % de la population pourrait ne pas avoir de long palmaire."},
{c:"c5",q:"L’extenseur ulnaire du carpe fait…",o:["Extension + abduction de la main","Extension + adduction de la main","Flexion + adduction","Pronation"],k:1,w:"Insertion base du 5e MTC : extension + adduction (déviation ulnaire)."},
{c:"c5",q:"Les abducteurs du poignet (déviation radiale) sont…",o:["Fléchisseur et extenseur ulnaires du carpe","Fléchisseur radial du carpe + long et court extenseurs radiaux du carpe","Long palmaire et anconé","Rond et carré pronateurs"],k:1,w:"Tout ce qui est radial tire vers le pouce ; tout ce qui est ulnaire tire vers le petit doigt."},

/* ===== c6 ===== */
{c:"c6",q:"Les fléchisseurs principaux de hanche sont…",o:["Ilio-psoas et droit fémoral","Grand glutéal et ischio-jambiers","Moyen et petit glutéal","Les adducteurs"],k:0,w:"Accessoires : pectiné, TFL, sartorius."},
{c:"c6",q:"Le droit fémoral naît de…",o:["L’épine iliaque antéro-supérieure","L’épine iliaque antéro-inférieure et le sillon supra-acétabulaire","La tubérosité ischiatique","La crête iliaque"],k:1,w:"EIAI (pas EIAS : c’est le sartorius et le TFL qui naissent de l’EIAS)."},
{c:"c6",q:"Le droit fémoral fait…",o:["Flexion de hanche et flexion du genou","Flexion de hanche et extension du genou","Extension de hanche et extension du genou","Extension de hanche et flexion du genou"],k:1,w:"Muscle bi-articulaire : flexion de la cuisse à la hanche + extension de la jambe au genou."},
{c:"c6",q:"Les extenseurs principaux de hanche sont…",o:["Grand glutéal, biceps fémoral, semi-membraneux, semi-tendineux","Moyen glutéal et petit glutéal","Les quatre adducteurs","Ilio-psoas et droit fémoral"],k:0,w:"Accessoire : grand adducteur (chef postérieur)."},
{c:"c6",q:"Le grand glutéal s’insère sur…",o:["La face latérale du grand trochanter","La tubérosité glutéale du fémur et le tractus ilio-tibial","Le petit trochanter","La tête de la fibula"],k:1,w:"A : extension + rotation externe ; fibres sup → abduction, fibres inf → adduction."},
{c:"c6",q:"Les fibres inférieures du grand glutéal font…",o:["Une abduction","Une adduction","Une rotation interne","Une flexion"],k:1,w:"Fibres supérieures → abduction ; fibres inférieures → adduction."},
{c:"c6",q:"Quel ischio-jambier n’est PAS bi-articulaire ?",o:["Le semi-tendineux","Le chef court du biceps fémoral","Le semi-membraneux","Le chef long du biceps fémoral"],k:1,w:"À part le chef court du biceps fémoral, tous les ischio-jambiers sont bi-articulaires."},
{c:"c6",q:"Le biceps fémoral s’insère sur…",o:["Le condyle médial tibial","La tête de la fibula","La face supérieure et médiale du tibia","La tubérosité tibiale"],k:1,w:"D’où sa rotation externe du genou (il est latéral)."},
{c:"c6",q:"Le semi-membraneux s’insère sur…",o:["La tête de la fibula","Le condyle médial tibial","Le grand trochanter","La patella"],k:1,w:"O : tubérosité ischiatique ; I : condyle médial tibial."},
{c:"c6",q:"Quel muscle fait la rotation externe du genou ?",o:["Le semi-tendineux","Le semi-membraneux","Le biceps fémoral","Le poplité"],k:2,w:"Biceps fémoral (latéral) → rotation externe. Les « semi » (médiaux) et le poplité → rotation interne."},
{c:"c6",q:"Les abducteurs principaux de hanche sont…",o:["Moyen et petit glutéal","Grand glutéal et piriforme","TFL et sartorius","Les adducteurs"],k:0,w:"Accessoires : TFL, piriforme, sartorius."},
{c:"c6",q:"Le moyen glutéal s’insère sur…",o:["La face antérieure du grand trochanter","La face latérale du grand trochanter","Le petit trochanter","La tubérosité glutéale"],k:1,w:"Moyen → face latérale ; petit → face antérieure du grand trochanter."},
{c:"c6",q:"Le moyen glutéal fait, en plus de l’abduction…",o:["Une rotation externe","Une rotation interne de la hanche","Une extension","Une flexion du genou"],k:1,w:"Moyen et petit glutéal = abducteurs ET rotateurs internes de hanche."},
{c:"c6",q:"Les adducteurs principaux de hanche sont…",o:["Long, court et grand adducteurs et le gracile","Pectiné et carré du fémur","Moyen et petit glutéal","Sartorius et TFL"],k:0,w:"Accessoires : pectiné, carré du fémur, fibres inférieures du grand glutéal."},
{c:"c6",q:"Le gracile s’insère sur…",o:["La ligne âpre du fémur","La face antéro-médiale du tibia","Le grand trochanter","La tête de la fibula"],k:1,w:"C’est pour ça qu’il agit aussi sur le genou : flexion + rotation interne."},
{c:"c6",q:"Le chef postérieur du grand adducteur fait…",o:["Une flexion de hanche","Une extension de hanche","Une abduction","Une rotation interne"],k:1,w:"Chef antérieur → flexion ; chef postérieur → extension. D’où son rôle d’extenseur accessoire."},
{c:"c6",q:"Les rotateurs externes principaux de hanche comprennent…",o:["Moyen et petit glutéal","Grand glutéal, obturateur interne, jumeaux, carré du fémur, piriforme","TFL et adducteurs","Quadriceps"],k:1,w:"Accessoires : obturateur externe, sartorius."},
{c:"c6",q:"Quel muscle initie la flexion du genou ?",o:["Le biceps fémoral","Le poplité","Le gastrocnémien","Le sartorius"],k:1,w:"Le poplité initie la flexion (il « déverrouille » le genou) et fait la rotation interne."},
{c:"c6",q:"Le quadriceps est composé de…",o:["Droit fémoral, vaste médial, vaste latéral, vaste intermédiaire","Droit fémoral et les trois ischio-jambiers","Vaste médial, latéral, intermédiaire et sartorius","Droit fémoral, gracile, TFL, poplité"],k:0,w:"Un droit fémoral + trois vastes. Accessoire du genou : TFL."},
{c:"c6",q:"L’insertion commune du quadriceps est…",o:["La tête de la fibula","La tubérosité tibiale via le ligament patellaire et la patella","Le condyle médial du tibia","Le grand trochanter"],k:1,w:"D’où l’extension du genou pour les quatre."},
{c:"c6",q:"Le vaste intermédiaire naît de…",o:["La ligne intertrochantérique","La face antérieure de la diaphyse fémorale","Le grand trochanter","L’EIAI"],k:1,w:"Le plus simple des trois vastes : face antérieure de la diaphyse fémorale."},
{c:"c6",q:"Le poplité naît de…",o:["La surface postérieure du tibia","Le condyle latéral du fémur","Le condyle médial du fémur","La tête de la fibula"],k:1,w:"O : condyle latéral ; I : surface postérieure du tibia proximal."},
{c:"c6",q:"Le sartorius fait à la hanche…",o:["Flexion, abduction, rotation interne","Flexion, abduction, rotation externe","Extension, adduction, rotation externe","Flexion, adduction, rotation interne"],k:1,w:"Sartorius : rotation EXTERNE de hanche et rotation interne du genou. Le TFL fait rotation INTERNE de hanche."},
{c:"c6",q:"Le tenseur du fascia lata fait à la hanche…",o:["Flexion, abduction, rotation interne","Flexion, abduction, rotation externe","Extension et adduction","Rotation externe pure"],k:0,w:"TFL : flexion + abduction + rotation interne. Au genou : fléchi → flexion ; étendu → extension."},
{c:"c6",q:"Sartorius et TFL ont en commun leur origine sur…",o:["L’EIAI","L’EIAS","La tubérosité ischiatique","Le pubis"],k:1,w:"Les deux naissent de l’épine iliaque antéro-supérieure (le TFL aussi de la crête iliaque)."},
{c:"c6",q:"Les fléchisseurs dorsaux principaux de la cheville sont…",o:["Tibial antérieur et long extenseur des orteils","Gastrocnémiens et soléaire","Long et court fibulaires","Tibial postérieur et long fléchisseur des orteils"],k:0,w:"Accessoire : 3e fibulaire."},
{c:"c6",q:"Le tibial antérieur s’insère sur…",o:["La base du 5e métatarsien","L’os cunéiforme médial et la base du 1er métatarsien","Le calcanéus","Le naviculaire et le cuboïde"],k:1,w:"A : flexion dorsale + inversion (subtalaire)."},
{c:"c6",q:"Le tibial antérieur fait, en plus de la flexion dorsale…",o:["Une éversion","Une inversion du pied","Une flexion plantaire","Une abduction pure"],k:1,w:"Tibial = inverseur. Fibulaire = éverseur."},
{c:"c6",q:"Le long extenseur des orteils fait à la cheville…",o:["Flexion plantaire et inversion","Flexion dorsale et éversion","Flexion dorsale et inversion","Flexion plantaire et éversion"],k:1,w:"Extension des orteils 2 à 5, flexion dorsale, éversion aux articulations tarsiennes."},
{c:"c6",q:"Le triceps sural est composé de…",o:["Gastrocnémien médial, gastrocnémien latéral et soléaire","Gastrocnémiens et tibial postérieur","Soléaire et long fibulaire","Gastrocnémiens et poplité"],k:0,w:"Terminaison commune : tendon calcanéen sur la face postérieure du calcanéus."},
{c:"c6",q:"Les gastrocnémiens naissent de…",o:["Du tibia et de la fibula","Des condyles fémoraux","Du calcanéus","De la patella"],k:1,w:"Chef latéral : condyle fémoral latéral ; chef médial : condyle fémoral médial → muscle bi-articulaire."},
{c:"c6",q:"Quelle action le soléaire n’a-t-il PAS, contrairement aux gastrocnémiens ?",o:["La flexion plantaire","La flexion du genou","L’inversion","L’éversion"],k:1,w:"Le soléaire naît du tibia et de la fibula : il ne croise pas le genou, donc pas de flexion du genou."},
{c:"c6",q:"L’inverseur principal de la cheville est…",o:["Le tibial antérieur","Le tibial postérieur","Le long fibulaire","Le soléaire"],k:1,w:"Tibial postérieur = inverseur principal ; tibial antérieur = accessoire."},
{c:"c6",q:"Les éverseurs principaux de la cheville sont…",o:["Les tibiaux antérieur et postérieur","Le long et le court fibulaires","Le soléaire et les gastrocnémiens","Le long extenseur de l’hallux"],k:1,w:"Long fibulaire → 1er métatarsien ; court fibulaire → 5e métatarsien. Accessoire : 3e fibulaire."},
{c:"c6",q:"Le tibial postérieur s’insère sur…",o:["Le calcanéus","Le naviculaire, les cunéiformes, le cuboïde et les bases des métatarsiens 2 à 4","La base du 1er métatarsien","La tête de la fibula"],k:1,w:"Insertions multiples sur le bord médial et la plante du pied : d’où l’inversion et le soutien de la voûte."},
/* ===== COMPÉTENCE 3 : muscles sollicités et mode de contraction ===== */
{c:"c6",q:"Un muscle qui se raccourcit, ses insertions se rapprochant, travaille en…",o:["Excentrique","Concentrique","Isométrique","Pliométrique"],k:1,w:"Concentrique = raccourcissement. Excentrique = allongement en freinant. Isométrique = longueur constante."},
{c:"c6",q:"Un muscle qui s’allonge tout en freinant la charge travaille en…",o:["Concentrique","Isométrique","Excentrique","Statique"],k:2,w:"Excentrique : le muscle est actif mais la résistance l’emporte, il freine."},
{c:"c6",q:"Un muscle contracté sans que sa longueur change travaille en…",o:["Isométrique","Concentrique","Excentrique","Auxotonique"],k:0,w:"Isométrique = iso (même) + métrique (longueur). C’est le gainage, la chaise contre un mur."},
{c:"c6",q:"Pendant la DESCENTE d’un squat, le quadriceps travaille en…",o:["Concentrique","Excentrique","Isométrique","Il est relâché"],k:1,w:"Le genou fléchit alors que le quadriceps est extenseur : il freine la descente, donc excentrique."},
{c:"c6",q:"Pendant la REMONTÉE d’un squat, le grand glutéal travaille en…",o:["Excentrique","Isométrique","Concentrique","Il est relâché"],k:2,w:"Extension de hanche produite par le grand glutéal : il raccourcit, donc concentrique."},
{c:"c4",q:"Pendant un gainage ventral, les abdominaux travaillent en…",o:["Concentrique","Excentrique","Isométrique","Alternativement concentrique puis excentrique"],k:2,w:"Rien ne bouge : transverse, droit de l’abdomen et obliques tiennent la position en isométrique."},
{c:"c6",q:"À la réception d’un saut, le triceps sural travaille en…",o:["Concentrique","Excentrique","Isométrique","Il ne participe pas"],k:1,w:"La cheville part en flexion dorsale, les fléchisseurs plantaires freinent : excentrique."},
{c:"c6",q:"Pendant une impulsion verticale, le triceps sural travaille en…",o:["Excentrique","Concentrique","Isométrique","Il ne participe pas"],k:1,w:"Flexion plantaire active pour pousser : concentrique."},
{c:"c6",q:"Descendre un escalier sollicite principalement le quadriceps en…",o:["Concentrique","Excentrique","Isométrique","Il n’est pas sollicité"],k:1,w:"C’est le freinage du poids du corps à chaque marche : excentrique. D’où les courbatures en descente."},
{c:"c6",q:"Monter un escalier sollicite principalement le quadriceps en…",o:["Excentrique","Isométrique","Concentrique","Il n’est pas sollicité"],k:2,w:"Extension du genou pour se hisser : concentrique."},
{c:"c5",q:"Lors de la montée d’une traction à la barre, quels muscles sont les principaux moteurs ?",o:["Grand pectoral et deltoïde antérieur","Grand dorsal, grand rond, biceps brachial et brachial","Triceps brachial et deltoïde postérieur","Trapèze et rhomboïdes uniquement"],k:1,w:"Extension-adduction de l’épaule (grand dorsal, grand rond) + flexion du coude (biceps, brachial), en concentrique."},
{c:"c5",q:"Lors de la descente contrôlée d’une traction, le grand dorsal travaille en…",o:["Concentrique","Isométrique","Excentrique","Il est relâché"],k:2,w:"Il freine le retour en flexion-abduction de l’épaule : excentrique."},
{c:"c5",q:"Pendant la phase de poussée d’une pompe, quels sont les principaux moteurs ?",o:["Grand dorsal et biceps","Grand pectoral, deltoïde antérieur et triceps brachial","Trapèze et grand rond","Dentelé antérieur seul"],k:1,w:"Flexion-adduction horizontale de l’épaule + extension du coude, en concentrique."},
{c:"c5",q:"Pendant la descente d’une pompe, le grand pectoral travaille en…",o:["Concentrique","Excentrique","Isométrique","Il est relâché"],k:1,w:"Il freine l’écartement : excentrique."},
{c:"c5",q:"Reposer lentement une haltère lors d’un curl sollicite le biceps brachial en…",o:["Concentrique","Isométrique","Excentrique","Il est relâché"],k:2,w:"Le coude s’étend alors que le biceps est fléchisseur : il freine, donc excentrique."},
{c:"c4",q:"Se pencher lentement en avant depuis la position debout sollicite les érecteurs du rachis en…",o:["Concentrique","Excentrique","Isométrique","Ils sont relâchés"],k:1,w:"Le tronc part en flexion et les extenseurs du rachis freinent : excentrique."},
{c:"c4",q:"Se redresser depuis la position penchée sollicite les érecteurs du rachis en…",o:["Excentrique","Concentrique","Isométrique","Ils sont relâchés"],k:1,w:"Extension du tronc produite activement : concentrique."},
{c:"c6",q:"La chaise contre un mur sollicite le quadriceps en…",o:["Concentrique","Excentrique","Isométrique","Alternativement"],k:2,w:"Angle de genou constant, position maintenue : isométrique."},
{c:"c4",q:"Lors d’un relevé de buste (crunch), le moteur principal est…",o:["Le carré des lombes","Le droit de l’abdomen","Les érecteurs du rachis","Le grand psoas seul"],k:1,w:"Fléchisseur du tronc / pelvis : le droit de l’abdomen, en concentrique."},
{c:"c4",q:"Un mouvement de rotation du tronc vers la gauche sollicite surtout…",o:["L’oblique externe gauche et l’oblique interne gauche","L’oblique externe droit et l’oblique interne gauche","Le droit de l’abdomen seul","Le transverse seul"],k:1,w:"Oblique externe → rotation interne (controlatérale), oblique interne → rotation externe (homolatérale) : ils travaillent en paire croisée."},
{c:"c6",q:"Pourquoi le psoas fait-il fléchir les lombaires plutôt que la hanche quand la jambe est posée au sol ?",o:["Parce qu’il change d’insertion","Parce que le segment le plus mobile devient le tronc : le muscle tire sur ses deux bouts","Parce qu’il se contracte en excentrique","Parce que l’iliaque prend le relais"],k:1,w:"Le CM insiste : la force s’applique à l’origine ET à l’insertion, c’est la configuration du corps qui décide du segment qui bouge."},
{c:"c6",q:"Pour cibler le soléaire plutôt que les gastrocnémiens lors d’un travail de mollet, il faut…",o:["Travailler genou tendu","Travailler genou fléchi","Travailler en isométrique uniquement","Travailler pied en éversion"],k:1,w:"Genou fléchi, les gastrocnémiens (bi-articulaires, nés des condyles fémoraux) sont en position raccourcie et inefficaces : le soléaire prend le relais."},

/* ===== ORIGINES ET INSERTIONS — MEMBRE SUPÉRIEUR ===== */
{c:"c5",q:"Le deltoïde, quelle que soit sa partie, s’insère sur…",o:["L’acromion","La tubérosité deltoïdienne de l’humérus","Le sillon intertuberculaire","Le tubercule mineur"],k:1,w:"Insertion commune : la tubérosité deltoïdienne. Ce sont les origines qui diffèrent (clavicule / acromion / épine de la scapula)."},
{c:"c5",q:"Le grand pectoral et le grand dorsal partagent…",o:["La même origine","Une insertion sur l’humérus et la rotation interne","L’extension de l’épaule","L’abduction de l’épaule"],k:1,w:"Tous deux s’insèrent sur l’humérus et sont rotateurs internes et adducteurs. Le pectoral fléchit, le dorsal étend."},
{c:"c5",q:"Quel muscle naît du processus coracoïde ET s’insère sur la face antérieure de l’humérus ?",o:["Le petit pectoral","Le coraco-brachial","Le chef court du biceps","Le subscapulaire"],k:1,w:"Le petit pectoral naît aussi du coracoïde mais s’insère sur les côtes ; le chef court du biceps va au radius."},
{c:"c5",q:"Trois muscles naissent du processus coracoïde. Lequel n’en fait PAS partie ?",o:["Le coraco-brachial","Le chef court du biceps brachial","Le petit pectoral","Le chef long du biceps brachial"],k:3,w:"Le chef long naît du tubercule supraglénoïdien, pas du coracoïde."},
{c:"c5",q:"Le supra-épineux s’insère sur…",o:["Le tubercule mineur","La facette supérieure du tubercule majeur","La tubérosité deltoïdienne","Le sillon intertuberculaire"],k:1,w:"Tubercule majeur, facette supérieure. Le subscapulaire est le seul de la coiffe à aller sur le tubercule mineur."},
{c:"c5",q:"Quel muscle de la coiffe des rotateurs s’insère sur le tubercule MINEUR ?",o:["Le supra-épineux","L’infra-épineux","Le subscapulaire","Le petit rond"],k:2,w:"Le subscapulaire, seul rotateur interne de la coiffe. Les trois autres vont sur le tubercule majeur."},
{c:"c5",q:"Le grand rond et le grand dorsal s’insèrent tous deux sur…",o:["Le tubercule majeur","Le sillon intertuberculaire de l’humérus","La tubérosité deltoïdienne","L’olécrâne"],k:1,w:"Même insertion, et des actions proches : extension, adduction, rotation interne."},
{c:"c5",q:"Pourquoi le biceps brachial est-il supinateur alors que le brachial ne l’est pas ?",o:["Parce qu’il est plus puissant","Parce qu’il s’insère sur le radius, qu’il peut faire pivoter","Parce qu’il a deux chefs","Parce qu’il franchit l’épaule"],k:1,w:"Insertion sur la tubérosité radiale : il enroule le radius. Le brachial s’insère sur l’ulna, qui ne pivote pas."},
{c:"c5",q:"Le triceps brachial s’insère sur…",o:["Le processus coronoïde","L’olécrâne","Le processus styloïde de l’ulna","La tête radiale"],k:1,w:"Olécrâne, d’où l’extension de l’avant-bras."},
{c:"c5",q:"Lequel de ces muscles ne naît PAS de l’épicondyle médial de l’humérus ?",o:["Le fléchisseur radial du carpe","Le fléchisseur ulnaire du carpe","Le chef huméral du rond pronateur","Le long extenseur radial du carpe"],k:3,w:"Les extenseurs naissent du côté latéral : crête supracondylaire latérale et épicondyle latéral."},
{c:"c5",q:"Le supinateur naît notamment de…",o:["L’épicondyle médial","L’épicondyle latéral de l’humérus et la crête supinatrice de l’ulna","Le processus coronoïde","La tête de la fibula"],k:1,w:"Double origine humérale et ulnaire, insertion sur le tiers proximal du radius."},
{c:"c5",q:"L’élévateur de la scapula naît des vertèbres…",o:["C1 à C4 ou C5","C7 et T1","T2 à T5","T4 à T12"],k:0,w:"C1-C4/C5. Petit rhomboïde : C7-T1. Grand rhomboïde : T2-T5."},
{c:"c5",q:"Le dentelé antérieur naît de…",o:["Les 8 ou 9 premières côtes","Le bord médial et l’angle inférieur de la scapula","Le processus coracoïde","La clavicule"],k:1,w:"Convention du CM : l’origine est proximale (la scapula), l’insertion distale (les côtes)."},

/* ===== ORIGINES ET INSERTIONS — MEMBRE INFÉRIEUR ===== */
{c:"c6",q:"Quels muscles partagent la tubérosité ischiatique comme origine ?",o:["Les quatre chefs du quadriceps","Les trois ischio-jambiers et le grand adducteur","Les glutéaux","Le sartorius et le TFL"],k:1,w:"Biceps fémoral (chef long), semi-tendineux, semi-membraneux, plus le grand adducteur."},
{c:"c6",q:"Les trois vastes du quadriceps naissent tous…",o:["Du bassin","Du fémur","Du tibia","De la patella"],k:1,w:"Seul le droit fémoral naît du bassin : c’est pour ça qu’il est le seul du quadriceps à fléchir la hanche."},
{c:"c6",q:"Quel muscle s’insère sur la tête de la fibula ?",o:["Le semi-tendineux","Le semi-membraneux","Le biceps fémoral","Le gracile"],k:2,w:"Insertion latérale, d’où sa rotation EXTERNE du genou."},
{c:"c6",q:"Quel muscle s’insère sur le PETIT trochanter ?",o:["Le moyen glutéal","Le grand glutéal","L’ilio-psoas","Le piriforme"],k:2,w:"Petit trochanter : insertion commune de l’iliaque et du grand psoas."},
{c:"c6",q:"Les adducteurs s’insèrent majoritairement sur…",o:["Le grand trochanter","La ligne âpre du fémur","La tubérosité tibiale","Le condyle médial"],k:1,w:"Long, court et grand adducteurs vont sur la ligne âpre. Le gracile fait exception : il va sur le tibia."},
{c:"c6",q:"Quel adducteur s’insère sur le TIBIA et agit donc aussi sur le genou ?",o:["Le long adducteur","Le court adducteur","Le grand adducteur","Le gracile"],k:3,w:"Gracile : face antéro-médiale du tibia, d’où flexion et rotation interne du genou."},
{c:"c6",q:"Le long fibulaire s’insère sur…",o:["Le 1er métatarsien","Le 5e métatarsien","Le calcanéus","Le talus"],k:0,w:"Long fibulaire → 1er métatarsien, court fibulaire → 5e. Les deux sont éverseurs."},
{c:"c6",q:"Le tendon calcanéen est l’insertion commune de…",o:["Tibial postérieur et long fléchisseur des orteils","Gastrocnémiens et soléaire","Quadriceps","Ischio-jambiers"],k:1,w:"Le triceps sural, sur la face postérieure du calcanéus."},

/* ===== ACTIONS ET GROUPES — ÉVALUÉ ===== */
{c:"c5",q:"Quel muscle fait l’abduction de la scapula ET sa rotation vers le haut ?",o:["Le petit pectoral","Le dentelé antérieur","Le grand rhomboïde","L’élévateur de la scapula"],k:1,w:"Indispensable pour lever le bras au-delà de 90°. Le petit pectoral fait l’inverse : rotation vers le bas."},
{c:"c5",q:"Quels muscles font la rotation de la scapula VERS LE BAS ?",o:["Dentelé antérieur et trapèze ascendant","Élévateur de la scapula, rhomboïdes et petit pectoral","Trapèze transversal seul","Subclavier et dentelé antérieur"],k:1,w:"Ils ramènent la glène vers le bas, antagonistes du dentelé antérieur."},
{c:"c5",q:"Si le dentelé antérieur est déficient, quel mouvement est le plus limité ?",o:["La flexion du coude","L’abduction du bras au-delà de 90°","La rotation interne de l’épaule","L’extension du poignet"],k:1,w:"La phase 90-150° passe par le glissement scapulo-thoracique : dentelé antérieur et trapèze."},
{c:"c5",q:"Le chef long du triceps brachial agit aussi sur l’épaule parce qu’il…",o:["S’insère sur la clavicule","Naît du tubercule infraglénoïdal de la scapula","Passe sous l’acromion","S’insère sur le tubercule majeur"],k:1,w:"Origine scapulaire = muscle bi-articulaire : extenseur et adducteur du bras en plus de l’extension du coude."},
{c:"c5",q:"Quel muscle ramène l’avant-bras en position NEUTRE de prono-supination ?",o:["Le rond pronateur","Le supinateur","Le brachioradial","Le carré pronateur"],k:2,w:"Particularité du brachioradial : supination si l’avant-bras est en pronation, pronation s’il est en supination."},
{c:"c5",q:"La déviation ULNAIRE du poignet est produite par…",o:["Le fléchisseur radial et les extenseurs radiaux","Le fléchisseur ulnaire et l’extenseur ulnaire du carpe","Le long palmaire seul","Le supinateur"],k:1,w:"Ce qui est ulnaire tire vers le petit doigt, ce qui est radial tire vers le pouce."},
{c:"c5",q:"Quel muscle est à la fois fléchisseur du poignet et abducteur de la main ?",o:["Le fléchisseur ulnaire du carpe","Le fléchisseur radial du carpe","Le long palmaire","L’extenseur ulnaire du carpe"],k:1,w:"Fléchisseur principal du poignet, et comme il est radial il abducte la main."},
{c:"c6",q:"Quel muscle est abducteur ET rotateur interne de hanche ?",o:["Le grand glutéal","Le moyen glutéal","Le piriforme","Le sartorius"],k:1,w:"Moyen et petit glutéal. Le grand glutéal, lui, est rotateur externe."},
{c:"c6",q:"Les fibres SUPÉRIEURES du grand glutéal font…",o:["Une adduction","Une abduction","Une rotation interne","Une flexion"],k:1,w:"Fibres supérieures → abduction, fibres inférieures → adduction. Le corps du muscle fait extension + rotation externe."},
{c:"c6",q:"Quel muscle fait flexion, abduction et rotation EXTERNE de hanche, puis rotation interne du genou ?",o:["Le tenseur du fascia lata","Le sartorius","Le droit fémoral","Le gracile"],k:1,w:"Le sartorius. Le TFL part du même EIAS mais fait la rotation INTERNE de hanche."},
{c:"c6",q:"Au genou, le tenseur du fascia lata…",o:["Est toujours fléchisseur","Est toujours extenseur","Fléchit si le genou est déjà fléchi, étend s’il est déjà étendu","N’a aucune action"],k:2,w:"Son action dépend de la position de départ, via le tractus ilio-tibial."},
{c:"c6",q:"Quel muscle initie la flexion du genou en le « déverrouillant » ?",o:["Le biceps fémoral","Le gastrocnémien","Le poplité","Le sartorius"],k:2,w:"Le poplité, qui fait aussi la rotation interne."},
{c:"c6",q:"Quels muscles font la rotation INTERNE du genou ?",o:["Le biceps fémoral","Le poplité, le semi-membraneux et le semi-tendineux","Le quadriceps","Le triceps sural"],k:1,w:"Les muscles médiaux. Le biceps fémoral, latéral, fait la rotation externe."},
{c:"c6",q:"Quel chef des ischio-jambiers n’agit PAS sur la hanche ?",o:["Le semi-tendineux","Le semi-membraneux","Le chef court du biceps fémoral","Le chef long du biceps fémoral"],k:2,w:"Il naît du fémur, pas de la tubérosité ischiatique : il ne franchit que le genou."},
{c:"c6",q:"Quel muscle est à la fois fléchisseur dorsal de la cheville et inverseur du pied ?",o:["Le long fibulaire","Le tibial antérieur","Le soléaire","Le long extenseur des orteils"],k:1,w:"Tibial antérieur : flexion dorsale à la cheville, inversion à la subtalaire."},
{c:"c6",q:"Le long extenseur des orteils fait, à la cheville et au pied…",o:["Flexion plantaire et inversion","Flexion dorsale et éversion","Flexion dorsale et inversion","Flexion plantaire et éversion"],k:1,w:"Extension des orteils 2 à 5, flexion dorsale, et éversion aux articulations tarsiennes."},
{c:"c6",q:"Un muscle « tibial » est toujours…",o:["Éverseur","Inverseur","Fléchisseur plantaire","Abducteur"],k:1,w:"Tibial antérieur et tibial postérieur sont médiaux, donc inverseurs. Les fibulaires sont latéraux, donc éverseurs."},

/* ===== OSTÉOLOGIE ET ARTHROLOGIE ÉVALUÉES ===== */
{c:"c1",q:"La cage thoracique est formée de…",o:["Du sternum, des côtes et du rachis thoracique","Du sternum et des côtes uniquement","Des côtes et des clavicules","Du rachis thoracique seul"],k:0,w:"Et les fausses côtes ne sont pas directement fixées au sternum."},
{c:"c1",q:"Quelle affirmation est VRAIE sur le rachis ?",o:["Il compte 24 vertèbres au total, sacrum inclus","Il compte 24 vertèbres mobiles, auxquelles s’ajoutent sacrum et coccyx","Il compte 33 vertèbres toutes mobiles","Il compte 7 cervicales et 12 lombaires"],k:1,w:"24 mobiles (7+12+5), puis le sacrum (5 fusionnées) et le coccyx (3 à 5)."},
{c:"c1",q:"Les courbures du rachis se succèdent dans l’ordre…",o:["Cyphose, lordose, cyphose, lordose","Lordose cervicale, cyphose thoracique, lordose lombale, cyphose sacrale","Lordose, lordose, cyphose, cyphose","Il n’y a que deux courbures"],k:1,w:"Elles alternent de haut en bas, dans le plan sagittal uniquement."},
{c:"c1",q:"Le noyau pulpeux se situe…",o:["Dans le foramen vertébral","Au centre du disque intervertébral","Entre les processus articulaires","Dans le canal sacré"],k:1,w:"Partie centrale gélatineuse, entourée de l’anneau fibreux."},
{c:"c2",q:"L’articulation coxo-fémorale met en rapport…",o:["Le sacrum et l’ilium","Le pelvis et le fémur","Le fémur et le tibia","Le fémur et la patella"],k:1,w:"Tête fémorale dans l’acétabulum de l’os coxal."},
{c:"c2",q:"Parmi ces ligaments de la hanche, lequel est CAPSULAIRE ?",o:["Le ligament de la tête du fémur","Le ligament transverse acétabulaire","Le ligament ischio-fémoral","Le ligament croisé antérieur"],k:2,w:"Capsulaires : ilio-fémoral, pubo-fémoral, ischio-fémoral. C’est la seule diapo du cours marquée « à retenir »."},
{c:"c2",q:"Le genou est formé de deux articulations :",o:["Fémoro-tibiale et tibio-fibulaire","Fémoro-tibiale et fémoro-patellaire","Fémoro-patellaire et tibio-fibulaire","Fémoro-tibiale uniquement"],k:1,w:"Et le mouvement réel associe rotation ET translation du fémur sur le plateau tibial."},
{c:"c2",q:"La cheville, ou articulation talo-crurale, met en rapport…",o:["Le tibia, la fibula et le talus","Le talus et le calcanéus","Le tibia et le calcanéus","Le talus et le naviculaire"],k:0,w:"Tibia et fibula « coincent » le talus, ce qui explique sa stabilité."},
{c:"c2",q:"L’éversion du pied combine…",o:["Adduction, supination, flexion plantaire","Abduction, pronation, flexion dorsale","Abduction, supination, flexion dorsale","Adduction, pronation, flexion plantaire"],k:1,w:"C’est l’inverse exact de l’inversion."},
{c:"c3",q:"Quelle articulation de la ceinture scapulaire n’est PAS une articulation synoviale ?",o:["La sterno-claviculaire","L’acromio-claviculaire","La scapulo-thoracique","La gléno-humérale"],k:2,w:"C’est un plan de glissement : bourse séreuse ou couche cellulo-graisseuse."},
{c:"c3",q:"Le labrum glénoïdien sert à…",o:["Produire le liquide synovial","Augmenter la congruence de la gléno-humérale","Limiter la rotation interne","Relier la clavicule à l’acromion"],k:1,w:"Anneau de fibrocartilage inséré sur le pourtour de la glénoïde."},
{c:"c3",q:"Au-delà de 30° d’élévation du bras, le rapport humérus / scapula est d’environ…",o:["1:1","2:1","1:2","4:1"],k:1,w:"Rythme scapulo-huméral : 2° d’humérus pour 1° de scapula."},
{c:"c3",q:"La flexion maximale du coude est d’environ…",o:["90°","120°","140 à 150°","180°"],k:2,w:"Et l’extension maximale de 0 à 10°."},
{c:"c3",q:"La pronation et la supination se font grâce aux articulations…",o:["Huméro-ulnaire et huméro-radiale","Radio-ulnaires proximale et distale","Radio-carpienne et médio-carpienne","Scapulo-thoracique"],k:1,w:"Le col du radius pivote, le radius croise l’ulna. 90° dans chaque sens."},
{c:"c3",q:"La flexion du poignet est majoritairement…",o:["Radiocarpienne","Médiocarpienne, à 60 %","Carpo-métacarpienne","Radio-ulnaire"],k:1,w:"Alors que l’extension est surtout radiocarpienne, à environ 66 %."},
{c:"c1",q:"Dans la convention retenue par le cours, l’insertion d’un muscle est…",o:["Le point le plus proche de la tête","Le point le plus éloigné de la tête","Toujours sur l’os le plus mobile","Toujours sur un os long"],k:1,w:"Origines = jonctions proximales, insertions = jonctions distales. Certains manuels font l’inverse."},
{c:"c4",q:"Contractés bilatéralement, les érecteurs du rachis produisent…",o:["Une flexion du tronc","Une extension de la zone du rachis concernée","Une rotation pure","Une inclinaison latérale"],k:1,w:"Bilatéral → extension ; unilatéral → inclinaison latérale de la zone concernée."},
{c:"c4",q:"Le carré des lombes s’insère sur…",o:["La 12e côte","La crête iliaque et le ligament iliolombaire","Le petit trochanter","Le sacrum"],k:1,w:"Origines : 12e côte et processus transverses L1-L4 ; insertion : crête iliaque et ligament iliolombaire."},
{c:"c4",q:"Quel muscle abdominal participe à l’expiration forcée et comprime les viscères ?",o:["Le droit de l’abdomen","L’oblique externe","Le transverse de l’abdomen","Le carré des lombes"],k:2,w:"Le plus profond, il agit comme une sangle."},
{c:"c4",q:"Le relâchement de quel muscle accentue la lordose lombaire ?",o:["Le transverse","Le droit de l’abdomen","L’oblique interne","Le carré des lombes"],k:1,w:"Rôle de statique du tronc : relâché, le bassin bascule en antéversion."},
{c:"c4",q:"Quel muscle favorise la lordose lombaire quand il est raccourci ?",o:["Le droit de l’abdomen","Le grand psoas","Le transverse","Le grand glutéal"],k:1,w:"Il tire les corps vertébraux lombaires vers l’avant et le bas."}
];

/* ---- CONTRÔLE BLANC (questions rédigées) ---- */
var EXAM = [
{q:"Décrivez l’organisation du rachis : nombre et types de vertèbres, courbures, et expliquez pourquoi la taille des vertèbres augmente de haut en bas.",
 kw:["24 vertèbres","cervicales","thoraciques","lombaires","sacrum","coccyx","lordose","cyphose","charge"],
 plan:["24 vertèbres mobiles : 7 + 12 + 5","Sacrum = fusion de 5, coccyx = fusion de 3 à 5","4 courbures sagittales alternées","Plan frontal rectiligne","Taille croissante = charge croissante"],
 rep:"<b>1. Composition.</b> Le rachis est un <b>empilement de 24 vertèbres mobiles</b> : <b>7 cervicales</b>, <b>12 thoraciques</b>, <b>5 lombaires</b>. S’y ajoutent le <b>sacrum</b> (<b>fusion de 5 vertèbres</b>) et le <b>coccyx</b> (<b>fusion de 3 à 5 vertèbres</b>).<br><b>2. Forme.</b> La forme des vertèbres est <b>légèrement différente le long du rachis</b> selon l’étage.<br><b>3. Courbures.</b> Dans le <b>plan sagittal</b>, <b>4 courbures</b> alternées : <b>lordose cervicale</b>, <b>cyphose thoracique</b>, <b>lordose lombale</b>, <b>cyphose sacrale</b>. Dans le <b>plan frontal</b>, le rachis est <b>globalement rectiligne</b>.<br><b>4. Taille croissante.</b> La taille des vertèbres est <b>croissante de haut en bas</b> car <b>la charge qu’elles supportent est de plus en plus importante</b> : chaque vertèbre porte le poids de tous les segments situés au-dessus d’elle."},

{q:"Décrivez l’articulation entre deux vertèbres : appuis, disque intervertébral, degrés de liberté et mouvements du tronc.",
 kw:["trois appuis","disque intervertébral","processus articulaires","noyau pulpeux","anneau fibreux","6 degrés","flexion","inclinaison","rotation"],
 plan:["3 appuis : disque + 2 processus articulaires inférieurs","Disque = noyau pulpeux + anneau fibreux","6 degrés de liberté, certains de faible amplitude","Mouvements dans les 3 plans","Amplitudes différentes selon l’étage"],
 rep:"<b>1. Les appuis.</b> Chaque vertèbre repose sur celle du dessous par <b>trois appuis</b> : le <b>disque intervertébral</b> en avant et les <b>deux processus articulaires inférieurs</b> en arrière.<br><b>2. Le disque.</b> Situé <b>entre les corps vertébraux</b>, il comprend une <b>partie centrale gélatineuse, le noyau pulpeux</b>, entourée d’un <b>anneau fibreux</b>.<br><b>3. Mobilité.</b> Le rachis possède <b>6 degrés de liberté</b>, <b>mais certains de très faible amplitude</b> ; de nombreux ligaments entourent et lient les vertèbres.<br><b>4. Mouvements du tronc.</b> <b>Flexion / extension</b> (sagittal), <b>inclinaison médiale / latérale</b> (frontal), <b>rotation interne / externe</b> (transverse). Les <b>angulations maximales diffèrent</b> aux niveaux <b>cervical, thoracique et lombaire</b>."},

{q:"Présentez l’articulation coxo-fémorale : interface, ligaments, mouvements et plans.",
 kw:["coxo-fémorale","pelvis","fémur","ilio-fémoral","pubo-fémoral","ischio-fémoral","transverse acétabulaire","tête du fémur","flexion","abduction","rotation"],
 plan:["Interface pelvis / fémur","Ligaments capsulaires : les 3","Ligaments intracapsulaires : les 2","Mouvements dans les 3 plans","Flexion plus grande genou fléchi"],
 rep:"<b>1. Interface.</b> L’articulation de la hanche est l’articulation <b>coxo-fémorale</b> : interface entre le <b>pelvis</b> et le <b>fémur</b>.<br><b>2. Ligaments capsulaires</b> : <b>ilio-fémoral</b>, <b>pubo-fémoral</b>, <b>ischio-fémoral</b>.<br><b>3. Ligaments intracapsulaires</b> : <b>ligament transverse acétabulaire</b> et <b>ligament de la tête du fémur</b>.<br><b>4. Mouvements.</b> Plan <b>sagittal</b> : <b>flexion / extension</b> ; plan <b>frontal</b> : <b>abduction / adduction</b> ; plan <b>transverse</b> : <b>rotation interne / externe</b>. La <b>flexion est plus ample genou fléchi que genou tendu</b> (les ischio-jambiers bi-articulaires ne freinent plus le mouvement)."},

{q:"Décrivez les articulations de la ceinture scapulaire et expliquez le rythme scapulo-huméral.",
 kw:["sterno-claviculaire","acromio-claviculaire","scapulo-thoracique","plan de glissement","ménisque","protraction","rythme scapulo-huméral","2:1","30"],
 plan:["Les articulations de la ceinture","Acromio-claviculaire : mobile mais instable","Scapulo-thoracique : plan de glissement, pas synoviale","Degrés de liberté et mouvements","Rythme scapulo-huméral : 0-30 puis 2:1"],
 rep:"<b>1. Les articulations.</b> <b>Sterno-claviculaire</b> (surtout une rotation entre manubrium et clavicule), <b>acromio-claviculaire</b>, <b>scapulo-thoracique</b>, <b>subacromiale</b> (plan de glissement) et le <b>complexe coraco-claviculaire</b>.<br><b>2. Acromio-claviculaire.</b> Surfaces <b>planes, elliptiques, juxtaposées sans emboîtement</b>, contenant un <b>ménisque</b> : elle autorise une <b>mobilité dans toutes les directions mais n’assure aucune stabilité</b> ; les <b>rotations de l’acromion sur la clavicule</b> y sont majeures.<br><b>3. Scapulo-thoracique.</b> Ce n’est <b>pas une articulation synoviale</b> : c’est un <b>plan de glissement</b> (bourse séreuse ou couche cellulo-graisseuse) qui se comporte comme une articulation ; la scapula est <b>plaquée au thorax par les muscles</b>. Elle offre <b>2 translations et 3 rotations</b> (surtout rotation interne / externe) : <b>élévation / dépression</b>, <b>abduction (protraction) / adduction (rétraction)</b>.<br><b>4. Rythme scapulo-huméral.</b> Entre <b>0 et ~30 degrés</b> d’élévation, le mouvement se fait <b>principalement à la gléno-humérale</b> ; <b>au-delà de ~30 degrés</b>, l’<b>humérus et la scapula</b> bougent ensemble selon un rapport d’environ <b>2:1</b>."},

{q:"Décrivez l’abduction complète du bras (0 à 180 degrés) en précisant les articulations et les muscles impliqués à chaque phase.",
 kw:["supra-épineux","deltoïde","scapulo-humérale","dentelé antérieur","trapèze","scapulo-thoracique","érecteurs du rachis","15 degrés"],
 plan:["0-15 : supra-épineux","0-90 : scapulo-humérale, supra-épineux + deltoïde","90-150 : glissement scapulo-thoracique, dentelé + trapèze","150-180 : incurvation du rachis, érecteurs","Rôle stabilisateur de la coiffe"],
 rep:"<b>1. Démarrage.</b> L’abduction est initiée par le <b>supra-épineux</b>, actif <b>principalement de 0 à 15 degrés</b> ; le <b>deltoïde médian</b> prend le relais <b>au-delà des 15 degrés initiaux</b>.<br><b>2. De 0 à 90 degrés</b> : le mouvement se fait à l’articulation <b>scapulo-humérale</b> grâce au <b>supra-épineux et au deltoïde</b>.<br><b>3. De 90 à 150 degrés</b> : c’est le <b>glissement scapulo-thoracique</b>, assuré par le <b>dentelé antérieur et le trapèze</b> (le dentelé antérieur fait la <b>rotation vers le haut</b> de la scapula).<br><b>4. De 150 à 180 degrés</b> : le complément vient de l’<b>incurvation de la colonne vertébrale</b>, par les <b>muscles érecteurs du rachis</b>.<br><b>5. En permanence</b>, les muscles de la <b>coiffe des rotateurs</b> centrent la <b>tête humérale dans la cavité glénoïde</b>."},

{q:"Présentez les quatre « abdominaux » : situation, origines, insertions et fonctions. Insistez sur les rotations.",
 kw:["transverse","oblique interne","oblique externe","droit de l’abdomen","ligne blanche","crête iliaque","ligament inguinal","rotation externe","rotation interne","lordose"],
 plan:["Organisation en profondeur","Transverse : O/I et fonction viscérale","Oblique interne : rotation externe","Oblique externe : rotation interne","Droit de l’abdomen et statique du tronc"],
 rep:"<b>1. Organisation.</b> La paroi abdominale <b>latérale</b> comporte, de profond à superficiel, le <b>transverse de l’abdomen</b>, l’<b>oblique interne</b> et l’<b>oblique externe</b> ; la paroi <b>antérieure</b> porte le <b>droit de l’abdomen</b>. La paroi <b>postérieure</b> (profonde) est <b>épaisse et stable</b>, la paroi latérale et antérieure est <b>compressible et extensible</b>.<br><b>2. Transverse.</b> O : <b>ligne blanche de l’abdomen</b> ; I : <b>cartilages costaux 7 à 12</b>, <b>vertèbres L1 à L5 via le fascia thoraco-lombal</b>, <b>crête iliaque</b>, <b>ligament inguinal</b>. Fonction : il <b>comprime et soutient les viscères</b>, participe à l’<b>expiration forcée</b>, assure la <b>stabilité du tronc et la posture</b>, et contribue avec les autres abdominaux à la <b>flexion thoraco-lombaire</b>.<br><b>3. Oblique interne.</b> O : <b>cartilage des 3 ou 4 dernières côtes + ligne blanche</b> ; I : <b>crête iliaque, ligament inguinal, fascia thoraco-lombaire</b>. Unilatéralement : <b>rotation externe du tronc / pelvis</b> et <b>flexion latérale</b> ; bilatéralement : <b>fléchisseur et statique du tronc</b>.<br><b>4. Oblique externe.</b> O : <b>7 dernières côtes (face externe)</b> ; I : <b>crête iliaque, ligne blanche, ligament inguinal, pubis</b>. Unilatéralement : <b>rotation interne du tronc / pelvis</b> ; bilatéralement : <b>fléchisseur et statique du tronc</b>.<br><b>5. Droit de l’abdomen.</b> O : <b>cartilages costaux 5 à 7 et processus xiphoïde</b> ; I : <b>pubis</b>. Fonction : <b>fléchisseur du tronc / pelvis</b>, <b>statique du tronc</b> — son <b>relâchement accentue la lordose lombaire</b> — et il <b>augmente la pression abdominale</b> en protégeant les viscères.<br><b>Attention au piège</b> : oblique <b>interne</b> → rotation <b>externe</b> ; oblique <b>externe</b> → rotation <b>interne</b>."},

{q:"Présentez le muscle ilio-psoas et expliquez pourquoi sa contraction produit parfois une flexion de hanche et parfois une flexion du tronc.",
 kw:["iliaque","grand psoas","chef latéral","chef médial","petit trochanter","antéversion","flexion de hanche","lordose lombaire","origine","insertion"],
 plan:["Deux chefs et leurs origines","Insertion commune : petit trochanter","Fonctions de l’iliaque","Fonctions du psoas","Le principe : force à l’origine ET à l’insertion"],
 rep:"<b>1. Composition.</b> L’ilio-psoas associe le <b>muscle iliaque (chef latéral)</b> et le <b>muscle grand psoas (chef médial)</b>, auxquels s’ajoute le <b>petit psoas</b>.<br><b>2. Origines.</b> Iliaque : <b>fosse iliaque</b>, <b>épine iliaque antérieure et inférieure</b>, <b>ligaments sacro-iliaque et iliolombaire antérieurs</b>, <b>base du sacrum</b>. Grand psoas : <b>corps vertébraux de T12 à L5</b>, <b>disques intervertébraux de T12 à L5</b>, <b>processus transverses de L1 à L5</b>. <b>Insertion commune : le petit trochanter</b>.<br><b>3. Fonctions.</b> L’<b>iliaque</b> rapproche le <b>fémur du bassin</b> : <b>antéversion du bassin</b> et <b>flexion de hanche</b>. Le <b>grand psoas</b> rapproche le <b>fémur des lombaires</b> : <b>flexion de hanche</b> (+ rotation externe du fémur), <b>flexion du tronc</b> (+ flexion latérale), et il <b>favorise la lordose lombaire</b>.<br><b>4. Le principe.</b> Un muscle qui se contracte <b>produit une force à son origine ET à son insertion</b>. C’est donc la <b>configuration du corps et les forces extérieures</b> qui déterminent le segment qui bouge : <b>jambe posée au sol</b>, on observe plutôt un <b>mouvement des lombaires</b> ; <b>allongé</b>, on observe un <b>mouvement des lombaires et du fémur</b>."},

{q:"Décrivez la coiffe des rotateurs : composition, origine commune, insertions et rôle fonctionnel.",
 kw:["supra-épineux","infra-épineux","petit rond","subscapulaire","scapula","tête humérale","cavité glénoïde","capsule","stabilisation"],
 plan:["Les 4 muscles","Origine commune : la scapula","Insertions : tubercules de l’humérus","Rôle : centrage de la tête humérale","Actions propres de chacun"],
 rep:"<b>1. Composition.</b> La coiffe des rotateurs regroupe le <b>supra-épineux</b>, l’<b>infra-épineux</b>, le <b>petit rond</b> et le <b>subscapulaire</b> — c’est bien le <b>petit</b> rond, et non le grand rond.<br><b>2. Origine commune.</b> Tous ont pour origine la <b>scapula</b> : fosse supra-épineuse, fosse infra-épineuse, bord latéral, fosse subscapulaire.<br><b>3. Insertions.</b> Supra-épineux : <b>facette supérieure du tubercule majeur</b> ; infra-épineux : <b>grand tubercule</b> ; subscapulaire : <b>tubercule mineur</b>.<br><b>4. Rôle.</b> Un rôle <b>majeur dans la stabilisation de la gléno-humérale</b> : ils <b>maintiennent et centrent la tête humérale dans la cavité glénoïde</b> en <b>resserrant la capsule articulaire</b>.<br><b>5. Actions propres.</b> Supra-épineux : <b>abduction de 0 à 15 degrés</b> ; infra-épineux et petit rond : <b>rotation externe</b> ; subscapulaire : <b>rotation interne</b>."},

{q:"Présentez les ischio-jambiers : composition, origines, insertions, actions, et expliquez ce qu’implique leur caractère bi-articulaire.",
 kw:["biceps fémoral","semi-tendineux","semi-membraneux","tubérosité ischiatique","tête de la fibula","condyle médial","bi-articulaire","extension de la hanche","flexion du genou","rotation"],
 plan:["Les 3 muscles","Origine commune : tubérosité ischiatique","Insertions distinctes","Actions hanche + genou","Bi-articulaire sauf chef court du biceps"],
 rep:"<b>1. Composition.</b> <b>Biceps fémoral</b>, <b>semi-tendineux</b>, <b>semi-membraneux</b>.<br><b>2. Origines.</b> Tous naissent de la <b>tubérosité ischiatique</b> (le <b>chef court du biceps fémoral</b> naît du fémur).<br><b>3. Insertions.</b> Biceps fémoral : <b>tête de la fibula</b> ; semi-tendineux : <b>face supérieure et médiale du tibia</b> ; semi-membraneux : <b>condyle médial tibial</b>.<br><b>4. Actions.</b> Biceps fémoral : <b>extension de la hanche (chef long)</b>, <b>flexion du genou</b>, <b>rotation externe du genou</b>. Semi-tendineux : <b>extension de la hanche pied au sol</b>, <b>flexion du genou pied décollé</b>, <b>rotation interne du genou</b>. Semi-membraneux : <b>extension de la hanche bassin en antéversion</b>, <b>rotateur interne de la hanche bassin neutre</b>, <b>flexion et rotation interne du genou</b>.<br><b>5. Bi-articularité.</b> <b>À part le chef court du biceps fémoral, ce sont des muscles bi-articulaires</b> : ils franchissent <b>hanche et genou</b>, donc <b>leur rôle dépend de la posture du corps</b> et des forces extérieures. Repère de rotation : les deux « semi » (médiaux) font la <b>rotation interne</b>, le biceps fémoral (latéral) la <b>rotation externe</b>."},

{q:"Décrivez les muscles de la cheville : fléchisseurs dorsaux, fléchisseurs plantaires, inverseurs et éverseurs. Opposez gastrocnémiens et soléaire.",
 kw:["tibial antérieur","long extenseur des orteils","gastrocnémiens","soléaire","triceps sural","tendon calcanéen","tibial postérieur","long fibulaire","court fibulaire","bi-articulaire","condyles fémoraux"],
 plan:["Fléchisseurs dorsaux","Fléchisseurs plantaires = triceps sural","Inverseurs : les tibiaux","Éverseurs : les fibulaires","Gastrocnémiens bi-articulaires vs soléaire mono-articulaire"],
 rep:"<b>1. Fléchisseurs dorsaux.</b> Principaux : <b>tibial antérieur</b> (O : condyle et face latérale du tibia, membrane interosseuse ; I : <b>os cunéiforme médial et base du 1er métatarsien</b> ; A : <b>flexion dorsale + inversion</b>) et <b>long extenseur des orteils</b> (I : <b>face dorsale des orteils 2 à 5</b> ; A : <b>extension des orteils 2 à 5, flexion dorsale, éversion</b>). Accessoire : <b>3e fibulaire</b>.<br><b>2. Fléchisseurs plantaires.</b> Principaux : <b>gastrocnémiens</b> et <b>soléaire</b>, qui forment le <b>triceps sural</b> et se terminent par le <b>tendon calcanéen</b> sur la <b>face postérieure du calcanéus</b>. Accessoires : <b>tibial postérieur</b>, <b>long fléchisseur des orteils</b>, <b>long et court fibulaires</b>.<br><b>3. Inverseurs.</b> Principal : <b>tibial postérieur</b> (O : faces postérieures du tibia et de la fibula ; I : naviculaire, cunéiformes, cuboïde, bases des métatarsiens 2 à 4) ; accessoire : <b>tibial antérieur</b>.<br><b>4. Éverseurs.</b> <b>Long fibulaire</b> (I : 1er métatarsien) et <b>court fibulaire</b> (I : 5e métatarsien) ; accessoire : <b>3e fibulaire</b>. Repère : <b>tibial = inversion, fibulaire = éversion</b>.<br><b>5. Gastrocnémiens vs soléaire.</b> Les <b>gastrocnémiens</b> naissent des <b>condyles fémoraux</b> : ils sont <b>bi-articulaires</b> et font <b>flexion plantaire ET flexion du genou</b>. Le <b>soléaire</b> naît du <b>tibia et de la fibula</b> : il est <b>mono-articulaire</b> et ne fait que la <b>flexion plantaire</b>."}
];
