<!DOCTYPE html>
<!-- anat-build-v1 -->
<html lang="fr" data-theme="carbon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<meta name="description" content="Réviser l’anatomie et l’anatomie fonctionnelle — L2 APA. Flashcards, QCM, contrôle blanc, dictée vocale corrigée.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:title" content="Anatomie — salle de contrôle">
<meta property="og:description" content="Flashcards, QCM, tableau des muscles, contrôle blanc et dictée vocale corrigée. L2 APA.">
<title>Anatomie — salle de contrôle</title>
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --fd:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable Display","Segoe UI",Inter,system-ui,sans-serif;
  --fb:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,system-ui,sans-serif;
  --fm:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --ease:cubic-bezier(.33,1,.5,1);
  --spring:cubic-bezier(.3,1.3,.5,1);
  --w:900px;
}

/* --- CARBONE (défaut) : noir mat, accent lime --- */
[data-theme="carbon"]{
  --bg:#0c0c0e; --wash:#121215; --surf:#17171b; --surf2:#1f1f25; --surfi:#101013;
  --ink:#f4f4f2; --ink2:#a0a0ab; --ink3:#6b6b78;
  --line:rgba(255,255,255,.085); --line2:rgba(255,255,255,.17);
  --brand:#ccff3d; --brandink:#131500; --brand2:#4cc9f0; --brand3:#ff7a5c;
  --ok:#5ee6a8; --warn:#ffcb47; --bad:#ff6b7e;
  --r:14px; --r2:18px; --rs:9px;
  --sh:0 1px 2px rgba(0,0,0,.5),0 14px 34px -22px rgba(0,0,0,.9);
  --glow:0 0 0 rgba(0,0,0,0);
  --fh:var(--fd); --caps:.1em;
}
/* --- PAPIER : clair, chaud, lecture longue --- */
[data-theme="paper"]{
  --bg:#f4f1e9; --wash:#ebe7dc; --surf:#fffdf7; --surf2:#faf6ec; --surfi:#fffdf7;
  --ink:#1b1713; --ink2:#6a6054; --ink3:#9a9083;
  --line:rgba(27,23,19,.13); --line2:rgba(27,23,19,.3);
  --brand:#b4420f; --brandink:#fff8f2; --brand2:#0d6e63; --brand3:#8a5a00;
  --ok:#2f7d4f; --warn:#9a6a00; --bad:#b03030;
  --r:10px; --r2:14px; --rs:7px;
  --sh:0 1px 2px rgba(60,45,25,.07),0 10px 26px -18px rgba(60,45,25,.3);
  --glow:0 0 0 rgba(0,0,0,0);
  --fh:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif; --caps:.08em;
}
/* --- AURORA : sombre saturé, halos --- */
[data-theme="aurora"]{
  --bg:#070a14; --wash:#0c1120; --surf:#121a2e; --surf2:#1a2440; --surfi:#0e1424;
  --ink:#eaf0ff; --ink2:#95a3c6; --ink3:#5e6b8c;
  --line:rgba(140,170,255,.14); --line2:rgba(140,170,255,.3);
  --brand:#7c5cff; --brandink:#ffffff; --brand2:#22d3ee; --brand3:#f472b6;
  --ok:#34d399; --warn:#fbbf24; --bad:#fb7185;
  --r:18px; --r2:24px; --rs:11px;
  --sh:0 1px 2px rgba(0,0,0,.4),0 20px 50px -28px rgba(0,0,0,.95);
  --glow:0 0 34px -6px var(--brand);
  --fh:var(--fd); --caps:.12em;
}
/* --- NOIR : contraste max, suisse --- */
[data-theme="noir"]{
  --bg:#ffffff; --wash:#f2f2f2; --surf:#ffffff; --surf2:#f6f6f6; --surfi:#ffffff;
  --ink:#000000; --ink2:#595959; --ink3:#8c8c8c;
  --line:rgba(0,0,0,.18); --line2:#000000;
  --brand:#e5242b; --brandink:#ffffff; --brand2:#000000; --brand3:#0047ff;
  --ok:#007a3d; --warn:#b36b00; --bad:#e5242b;
  --r:0px; --r2:0px; --rs:0px;
  --sh:none; --glow:none;
  --fh:var(--fd); --caps:.14em;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:400 15.5px/1.6 var(--fb);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
  transition:background .35s var(--ease),color .35s var(--ease);
}
[data-theme="noir"] body{font-weight:430}

/* ambiance : uniquement sur aurora */
#amb{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .5s}
[data-theme="aurora"] #amb{opacity:1;background:
  radial-gradient(1100px 620px at 82% -12%,#1d2a63 0%,transparent 62%),
  radial-gradient(820px 560px at -12% 18%,#2a1452 0%,transparent 62%),
  radial-gradient(700px 500px at 45% 108%,#4a1038 0%,transparent 60%)}
[data-theme="carbon"] #amb{opacity:1;background:
  radial-gradient(900px 420px at 50% -8%,rgba(204,255,61,.07) 0%,transparent 70%)}

/* ============================================================
   LAYOUT
   ============================================================ */
.wrap{max-width:var(--w);margin:0 auto;padding:0 18px 140px}
@media(max-width:700px){.wrap{padding-bottom:104px}}

header{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--line)}
[data-theme="aurora"] header{background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.hd{max-width:var(--w);margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;display:flex;align-items:center;gap:10px}
.brandmark{display:flex;align-items:baseline;gap:8px;font-family:var(--fh);font-weight:800;font-size:17px;letter-spacing:-.4px;min-width:0}
[data-theme="paper"] .brandmark{font-weight:700;letter-spacing:0}
.brandmark em{font-style:normal;color:var(--ink3);font-family:var(--fm);font-size:10.5px;font-weight:600;
  letter-spacing:var(--caps);text-transform:uppercase;white-space:nowrap}
@media(max-width:560px){.brandmark em{display:none}}
.hd .sp{flex:1}

.jdays{display:inline-flex;align-items:baseline;gap:5px;padding:5px 10px;border-radius:var(--rs);
  background:var(--brand);color:var(--brandink);font-family:var(--fm);font-size:11px;font-weight:700;
  letter-spacing:var(--caps);text-transform:uppercase;white-space:nowrap;box-shadow:var(--glow)}

.ibtn{width:32px;height:32px;border-radius:var(--rs);border:1px solid var(--line);background:transparent;color:var(--ink2);
  display:grid;place-items:center;cursor:pointer;font-size:14px;transition:.16s var(--ease);flex:none;font-family:var(--fb)}
.ibtn:hover{background:var(--surf2);color:var(--ink);border-color:var(--line2)}
.ibtn:active{transform:scale(.9)}

/* sélecteur de thème */
.themes{display:flex;gap:5px;padding:4px;border:1px solid var(--line);border-radius:999px}
.sw{width:17px;height:17px;border-radius:50%;border:1.5px solid transparent;cursor:pointer;padding:0;
  transition:.18s var(--spring);position:relative}
.sw:hover{transform:scale(1.16)}
.sw[aria-pressed="true"]{border-color:var(--ink);transform:scale(1.1)}
.sw[data-s="carbon"]{background:linear-gradient(135deg,#1a1a1e 48%,#ccff3d 48%)}
.sw[data-s="paper"]{background:linear-gradient(135deg,#fffdf7 48%,#b4420f 48%)}
.sw[data-s="aurora"]{background:linear-gradient(135deg,#121a2e 48%,#7c5cff 48%)}
.sw[data-s="noir"]{background:linear-gradient(135deg,#fff 48%,#e5242b 48%);border-color:var(--line)}

/* nav desktop */
nav{max-width:var(--w);margin:0 auto;padding:0 18px 10px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.tab{position:relative;padding:7px 13px;border-radius:999px;border:1px solid transparent;background:transparent;
  color:var(--ink2);font:600 13.5px/1 var(--fb);cursor:pointer;white-space:nowrap;transition:.18s var(--ease);
  display:inline-flex;align-items:center;gap:6px}
.tab:hover{color:var(--ink);background:var(--surf2)}
.tab.on{color:var(--brandink);background:var(--brand);border-color:transparent}
[data-theme="noir"] .tab.on{color:#fff;background:#000}
[data-theme="noir"] .tab{border-radius:0}
.tab .n{font-family:var(--fm);font-size:10px;font-weight:700;padding:2px 5px;border-radius:5px;
  background:color-mix(in srgb,currentColor 16%,transparent)}
@media(max-width:700px){nav{display:none}}

/* nav mobile (bas) */
#bnav{display:none}
@media(max-width:700px){
  #bnav{display:grid;grid-template-columns:repeat(8,1fr);position:fixed;left:0;right:0;bottom:0;z-index:60;
    background:var(--bg);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  #bnav button{background:transparent;border:0;color:var(--ink3);cursor:pointer;padding:6px 1px;border-radius:var(--rs);
    display:flex;flex-direction:column;align-items:center;gap:3px;font:600 8px/1 var(--fb);transition:.16s var(--ease);
    overflow:hidden;white-space:nowrap}
  #bnav button .ic{font-size:15px;line-height:1}
  @media(max-width:360px){#bnav button{font-size:7.2px}#bnav button .ic{font-size:14px}}
  #bnav button.on{color:var(--brand)}
  [data-theme="noir"] #bnav button.on{color:#000;font-weight:800}
  #bnav button:active{transform:scale(.9)}
}

.panel{display:none}
.panel.on{display:block;animation:rise .4s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.stag>*{animation:rise .5s var(--ease) both}
.stag>*:nth-child(1){animation-delay:.02s}.stag>*:nth-child(2){animation-delay:.05s}
.stag>*:nth-child(3){animation-delay:.08s}.stag>*:nth-child(4){animation-delay:.11s}
.stag>*:nth-child(5){animation-delay:.14s}.stag>*:nth-child(6){animation-delay:.17s}
.stag>*:nth-child(7){animation-delay:.2s}.stag>*:nth-child(8){animation-delay:.23s}
.stag>*:nth-child(n+9){animation-delay:.26s}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ============================================================
   PRIMITIVES
   ============================================================ */
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r2);padding:20px;margin:16px 0;box-shadow:var(--sh)}
[data-theme="noir"] .card{border-width:1.5px;border-color:#000}
.lbl{font:700 10.5px/1 var(--fm);letter-spacing:var(--caps);text-transform:uppercase;color:var(--ink3)}
h1,h2,h3,h4{font-family:var(--fh);letter-spacing:-.4px;margin:0}
[data-theme="paper"] h1,[data-theme="paper"] h2,[data-theme="paper"] h3{letter-spacing:-.1px}
h2{font-size:23px;font-weight:800}
h3{font-size:16.5px;font-weight:700;margin:20px 0 10px}
.sub{color:var(--ink2);font-size:14px;margin:6px 0 0}
.mini{font-size:12.5px;color:var(--ink3)}

.btn{appearance:none;border:1px solid var(--line2);background:var(--surf2);color:var(--ink);
  padding:11px 17px;border-radius:var(--r);font:650 14px/1 var(--fb);cursor:pointer;
  transition:.16s var(--ease);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--surf2);border-color:var(--ink3);transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--brand);color:var(--brandink);border-color:transparent;box-shadow:var(--glow)}
[data-theme="noir"] .btn.pri{background:#000;color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn.g{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:color-mix(in srgb,var(--ok) 11%,transparent)}
.btn.o{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 11%,transparent)}
.btn.r{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:color-mix(in srgb,var(--bad) 11%,transparent)}
.btn.full{width:100%}
.btn.sm{padding:8px 13px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* ============================================================
   COCKPIT
   ============================================================ */
.masthead{display:grid;grid-template-columns:1fr auto;gap:26px;align-items:center}
@media(max-width:620px){.masthead{grid-template-columns:1fr;gap:20px}}
.masthead h1{font-size:clamp(26px,6vw,38px);font-weight:850;line-height:1.05;letter-spacing:-1.4px}
[data-theme="paper"] .masthead h1{font-weight:700;letter-spacing:-.4px}
.ring{position:relative;width:124px;height:124px;flex:none;justify-self:end}
@media(max-width:620px){.ring{justify-self:start}}
.ring svg{transform:rotate(-90deg);display:block}
.ring .bgc{stroke:var(--line);stroke-width:9}
.ring .fg{stroke:var(--brand);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1.2s var(--ease);filter:drop-shadow(var(--glow))}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .mid b{display:block;font:800 29px/1 var(--fh);letter-spacing:-1.4px}
.ring .mid span{font:700 9.5px/1 var(--fm);letter-spacing:var(--caps);text-transform:uppercase;color:var(--ink3);margin-top:5px;display:block}

.cdrow{display:flex;gap:7px;margin-top:16px;flex-wrap:wrap}
.cdrow div{border:1px solid var(--line);border-radius:var(--rs);padding:7px 11px;min-width:58px;text-align:center;background:var(--surfi)}
.cdrow b{display:block;font:800 21px/1 var(--fh);letter-spacing:-.8px;font-variant-numeric:tabular-nums}
.cdrow span{font:600 9.5px/1 var(--fm);letter-spacing:var(--caps);text-transform:uppercase;color:var(--ink3);margin-top:5px;display:block}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin:16px 0}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;transition:.2s var(--ease)}
.kpi:hover{transform:translateY(-2px);border-color:var(--line2)}
.kpi b{display:block;font:800 25px/1 var(--fh);letter-spacing:-1px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi span{font-size:11.5px;color:var(--ink3);margin-top:5px;display:block}

.bars{display:grid;gap:14px}
.bar{cursor:pointer;border:0;background:transparent;padding:0;text-align:left;width:100%;font:inherit;color:inherit}
.bar .t{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.bar .t b{font-size:14.5px;font-weight:650}
.bar .t span{font:700 12px/1 var(--fm);color:var(--ink3);font-variant-numeric:tabular-nums}
.track{height:7px;border-radius:999px;background:var(--wash);overflow:hidden;border:1px solid var(--line)}
[data-theme="noir"] .track{border-color:#000}
.fill{height:100%;background:var(--brand);transition:width 1.1s var(--ease)}
.fill.c2{background:var(--brand2)}.fill.c3{background:var(--brand3)}.fill.c4{background:var(--ok)}
.bar:hover .t b{color:var(--brand)}
[data-theme="noir"] .bar:hover .t b{text-decoration:underline}

.steps{counter-reset:s;display:grid;gap:12px;margin-top:4px}
.step{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;line-height:1.55}
.step:before{counter-increment:s;content:counter(s);flex:none;width:23px;height:23px;border-radius:50%;
  background:var(--brand);color:var(--brandink);font:800 11.5px/23px var(--fm);text-align:center;margin-top:1px}
[data-theme="noir"] .step:before{background:#000;color:#fff}
.step b{font-weight:700}

/* ============================================================
   FLASHCARDS
   ============================================================ */
.segs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:18px 0 12px;padding-bottom:2px}
.segs::-webkit-scrollbar{display:none}
.seg{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink2);
  font:600 12.5px/1 var(--fb);cursor:pointer;white-space:nowrap;transition:.16s var(--ease)}
.seg:hover{color:var(--ink);border-color:var(--line2)}
.seg.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.meter{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.meter .track{flex:1}
.meter .cnt{font:700 12px/1 var(--fm);color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}

.deck{perspective:1700px;touch-action:pan-y;margin-bottom:14px}
.fc{position:relative;width:100%;min-height:min(56vh,360px);transform-style:preserve-3d;
  transition:transform .6s var(--spring);cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc>div{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:var(--r2);border:1px solid var(--line);background:var(--surf);box-shadow:var(--sh);
  padding:30px 26px;display:flex;flex-direction:column;justify-content:center}
[data-theme="noir"] .fc>div{border-width:1.5px;border-color:#000}
.fc .back{transform:rotateY(180deg);background:var(--surf2)}
[data-theme="aurora"] .fc .back{background:linear-gradient(155deg,color-mix(in srgb,var(--brand) 22%,var(--surf)),var(--surf))}
[data-theme="noir"] .fc .back{background:#000;color:#fff;border-color:#000}
.fc .tagline{position:absolute;top:18px;left:24px;right:70px;font:700 10px/1.3 var(--fm);
  letter-spacing:var(--caps);text-transform:uppercase;color:var(--ink3)}
[data-theme="noir"] .fc .back .tagline{color:#999}
.fc .pips{position:absolute;top:17px;right:22px;display:flex;gap:4px}
.fc .pips i{width:6px;height:6px;border-radius:50%;background:var(--line2)}
.fc .pips i.on{background:var(--brand)}
.fc .q{font-family:var(--fh);font-size:clamp(21px,4.4vw,29px);font-weight:750;line-height:1.24;letter-spacing:-.8px}
[data-theme="paper"] .fc .q{font-weight:600;letter-spacing:-.2px}
.fc .a{font-size:15.5px;line-height:1.68;overflow-y:auto;max-height:min(44vh,280px);padding-right:4px}
.fc .a em{font-style:normal;font-weight:700;color:var(--brand)}
[data-theme="noir"] .fc .back em{color:#ccff3d}
[data-theme="paper"] .fc .a em{color:var(--brand);background:color-mix(in srgb,var(--brand) 11%,transparent);
  padding:0 3px;border-radius:3px}
.fc .tapme{position:absolute;bottom:20px;left:0;right:0;text-align:center;font:600 11px/1 var(--fm);
  letter-spacing:var(--caps);text-transform:uppercase;color:var(--ink3)}

#combo{position:fixed;left:50%;top:24%;transform:translateX(-50%) scale(.6);opacity:0;pointer-events:none;z-index:90;
  font:900 clamp(34px,9vw,52px)/1 var(--fh);letter-spacing:-2.4px;color:var(--brand);text-align:center;
  text-shadow:0 10px 40px color-mix(in srgb,var(--brand) 45%,transparent)}
#combo.go{animation:comboPop 1s var(--spring)}
@keyframes comboPop{0%{opacity:0;transform:translateX(-50%) scale(.5)}22%{opacity:1;transform:translateX(-50%) scale(1.14)}
  68%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) scale(1.02) translateY(-28px)}}

/* ============================================================
   QCM
   ============================================================ */
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:14px 16px;margin:9px 0;
  border-radius:var(--r);border:1px solid var(--line);background:var(--surfi);color:var(--ink);
  font:450 14.5px/1.5 var(--fb);cursor:pointer;transition:.16s var(--ease)}
.opt:hover:not(:disabled){border-color:var(--ink3);background:var(--surf2);transform:translateX(3px)}
.opt:disabled{cursor:default}
.opt .k{flex:none;display:grid;place-items:center;width:22px;height:22px;border-radius:var(--rs);
  background:var(--wash);border:1px solid var(--line);font:700 11px/1 var(--fm)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.opt.ok .k{background:var(--ok);color:var(--bg);border-color:var(--ok)}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,transparent);animation:nope .4s}
.opt.no .k{background:var(--bad);color:var(--bg);border-color:var(--bad)}
@keyframes nope{0%,100%{transform:translateX(0)}22%{transform:translateX(-7px)}44%{transform:translateX(6px)}
  66%{transform:translateX(-4px)}88%{transform:translateX(2px)}}
.why{margin-top:12px;padding:14px 16px;border-radius:var(--r);background:var(--wash);
  border:1px solid var(--line);border-left:3px solid var(--brand2);font-size:14px;line-height:1.6;color:var(--ink2);
  animation:rise .3s var(--ease) both}
.why b{color:var(--ink)}

/* ============================================================
   CONTRÔLE
   ============================================================ */
.qlist{display:grid;gap:9px}
.qrow{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:14px 16px;
  border-radius:var(--r);border:1px solid var(--line);background:var(--surfi);color:var(--ink);cursor:pointer;
  font:inherit;transition:.16s var(--ease)}
.qrow:hover{border-color:var(--ink3);transform:translateX(3px)}
.qrow .num{flex:none;font:700 12px/1 var(--fm);color:var(--ink3);font-variant-numeric:tabular-nums}
.qrow .txt{flex:1;font-size:14px;line-height:1.45;font-weight:550}
.pill{flex:none;font:700 9.5px/1 var(--fm);letter-spacing:var(--caps);text-transform:uppercase;
  padding:5px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink3)}
.pill.p2{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.pill.p1{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.pill.p0{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent);background:color-mix(in srgb,var(--bad) 12%,transparent)}

textarea{width:100%;min-height:170px;border-radius:var(--r);border:1px solid var(--line);background:var(--surfi);
  color:var(--ink);padding:15px;font:450 15px/1.7 var(--fb);resize:vertical;outline:none;transition:.16s var(--ease)}
textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
textarea::placeholder{color:var(--ink3)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{font:600 11.5px/1 var(--fb);padding:6px 10px;border-radius:999px;border:1px dashed var(--line2);color:var(--ink3);transition:.2s var(--ease)}
.chip.hit{border-style:solid;border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.chip.plan{border-style:solid;border-color:var(--line);color:var(--ink2);background:var(--wash)}
.corrige{margin-top:16px;padding:20px;border-radius:var(--r2);background:var(--wash);border:1px solid var(--line);
  border-top:3px solid var(--brand);font-size:15px;line-height:1.72;animation:rise .35s var(--ease) both}
.corrige h4{font:700 10.5px/1 var(--fm);letter-spacing:var(--caps);text-transform:uppercase;color:var(--brand);margin-bottom:14px}
.corrige ul{margin:10px 0;padding-left:20px}.corrige li{margin:7px 0}
.corrige b{font-weight:700;color:var(--ink)}
.corrige i{color:var(--ink2)}

/* ============================================================
   FICHES / MUSCLES
   ============================================================ */
.search{width:100%;padding:13px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surfi);
  color:var(--ink);font:450 15px/1 var(--fb);outline:none;margin:18px 0 14px;transition:.16s var(--ease)}
.search:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
.search::placeholder{color:var(--ink3)}

.acc{border:1px solid var(--line);border-radius:var(--r);margin:9px 0;overflow:hidden;background:var(--surfi)}
.acc>button{width:100%;text-align:left;padding:15px 17px;background:transparent;border:0;color:var(--ink);
  font:650 15px/1.4 var(--fb);cursor:pointer;display:flex;align-items:center;gap:11px;transition:.16s var(--ease)}
.acc>button:hover{background:var(--surf2)}
.acc>button .ar{margin-left:auto;color:var(--ink3);transition:transform .28s var(--spring);flex:none}
.acc.op>button .ar{transform:rotate(90deg)}
.acc.op>button{border-bottom:1px solid var(--line)}
.acc .cx{font:700 9.5px/1 var(--fm);letter-spacing:var(--caps);padding:5px 7px;border-radius:var(--rs);
  background:var(--wash);border:1px solid var(--line);color:var(--ink3);flex:none}
.acc .bd{display:none;padding:17px;font-size:15px;line-height:1.72;color:var(--ink2)}
.acc.op .bd{display:block;animation:rise .3s var(--ease) both}
.acc .bd ul,.acc .bd ol{padding-left:20px;margin:10px 0}
.acc .bd li{margin:7px 0}
.acc .bd b{color:var(--ink);font-weight:700}
.acc .bd i{color:var(--ink2)}

blockquote{margin:14px 0;padding:14px 17px;border-left:3px solid var(--brand);background:var(--wash);
  border-radius:0 var(--r) var(--r) 0;font-size:14.5px;line-height:1.65;color:var(--ink)}
[data-theme="paper"] blockquote{font-family:var(--fh);font-style:italic}
blockquote cite{display:block;margin-top:9px;font-style:normal;font:700 10.5px/1 var(--fm);
  letter-spacing:var(--caps);text-transform:uppercase;color:var(--ink3)}

table{width:100%;border-collapse:collapse;margin:14px 0;font-size:14px}
th,td{padding:11px 12px;text-align:left;border:1px solid var(--line);vertical-align:top;line-height:1.5}
th{font:700 10px/1.3 var(--fm);letter-spacing:var(--caps);text-transform:uppercase;color:var(--ink3);background:var(--wash)}
tbody tr td:first-child,table tr td:first-child{color:var(--ok)}
table tr td:last-child{color:var(--bad)}
.warnbox{padding:12px 15px;border-radius:var(--r);background:color-mix(in srgb,var(--warn) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);font-size:13.5px;color:var(--ink);line-height:1.55;margin:12px 0}

.auts{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:12px}
.aut{border:1px solid var(--line);border-radius:var(--r);padding:17px;background:var(--surf);transition:.2s var(--ease);box-shadow:var(--sh)}
.aut:hover{transform:translateY(-3px);border-color:var(--brand)}
.aut b{font-family:var(--fh);font-size:16px;font-weight:750;display:block;letter-spacing:-.3px}
.aut .d{font:600 10.5px/1.3 var(--fm);letter-spacing:var(--caps);text-transform:uppercase;color:var(--ink3);margin:6px 0 9px}
.aut .o{font-size:13px;color:var(--brand);margin-bottom:9px;line-height:1.45;font-weight:600}
.aut .i{font-size:14px;line-height:1.6;color:var(--ink2)}

/* ============================================================
   RÉVISION EXPRESS
   ============================================================ */
.prose{font-size:15px;line-height:1.7;color:var(--ink2)}
.prose b{color:var(--ink);font-weight:700}
.prose p{margin:12px 0}
.prose ul,.prose ol{padding-left:21px;margin:10px 0}
.prose li{margin:8px 0}
.prose em{font-style:normal;font-weight:700;color:var(--brand)}
.prose i{color:var(--ink2)}
.xclock{display:flex;align-items:baseline;gap:12px;margin-top:18px;flex-wrap:wrap}
.xclock b{font:800 clamp(34px,8vw,44px)/1 var(--fh);letter-spacing:-2px;font-variant-numeric:tabular-nums}
.xblock{position:relative;transition:.25s var(--ease)}
.xblock.now{border-color:var(--brand);box-shadow:var(--glow),var(--sh)}
.xblock.ok{opacity:.6}
.xhead{display:flex;align-items:center;gap:10px}
.xtime{font:700 10.5px/1 var(--fm);letter-spacing:var(--caps);text-transform:uppercase;color:var(--ink3)}
.xcheck{margin-left:auto;width:26px;height:26px;border-radius:50%;border:1px solid var(--line2);background:transparent;
  color:var(--brandink);cursor:pointer;font:700 13px/1 var(--fb);transition:.16s var(--ease);flex:none}
.xcheck:hover{border-color:var(--brand)}
.xcheck.on{background:var(--brand);border-color:var(--brand)}
.defn{padding:15px 0;border-bottom:1px solid var(--line)}
.defn:last-child{border-bottom:0}
.defn>b{font-family:var(--fh);font-size:16.5px;font-weight:750;color:var(--ink)}
.defn p{margin:7px 0 0}
.xqi{border-bottom:1px solid var(--line)}
.xqq{width:100%;text-align:left;background:transparent;border:0;color:var(--ink);cursor:pointer;
  padding:13px 2px;display:flex;align-items:flex-start;gap:11px;font:550 14.5px/1.45 var(--fb);transition:.14s var(--ease)}
.xqq:hover{color:var(--brand)}
.xqq .xn{flex:none;font:700 11px/1.5 var(--fm);color:var(--ink3);min-width:18px}
.xqq .ar{margin-left:auto;color:var(--ink3);transition:transform .25s var(--spring)}
.xqi.op .xqq .ar{transform:rotate(90deg)}
.xqa{display:none;padding:0 2px 15px 29px;font-size:14.5px;line-height:1.65;color:var(--ink2)}
.xqi.op .xqa{display:block;animation:rise .25s var(--ease) both}
.xqa b{color:var(--ink)}
.xgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:20px}
.xcell{border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;background:var(--surfi)}
.xcell b{display:block;font-family:var(--fh);font-size:15px;font-weight:750}
.xcell span{display:block;font-size:12.5px;color:var(--ink3);margin-top:5px;line-height:1.45}
.xhead2{display:flex;align-items:center;gap:10px}
.xbadge{font:700 9.5px/1 var(--fm);letter-spacing:var(--caps);text-transform:uppercase;padding:6px 9px;
  border-radius:999px;background:var(--brand);color:var(--brandink)}
.xhead2 .mini{margin-left:auto;font-variant-numeric:tabular-nums}
.xcount{font:700 12.5px/1 var(--fm);color:var(--ink3);margin-top:10px;font-variant-numeric:tabular-nums}
.xcount span{color:var(--brand);font-size:15px}
.xlist{display:grid;gap:7px;margin-top:4px}
.xli{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.5;padding:9px 12px;border-radius:var(--rs);border:1px solid var(--line)}
.xli>span{flex:none;font:700 12px/1.5 var(--fm)}
.xli.found{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.xli.miss{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.xmanche{font:700 9.5px/1 var(--fm);letter-spacing:var(--caps);text-transform:uppercase;padding:6px 9px;
  border-radius:999px;border:1px solid var(--line);color:var(--ink3)}
.xnote{padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surfi);
  font-size:13.5px;line-height:1.55;color:var(--ink2)}
.xnote b{color:var(--ink)}
.xretry{margin:14px 0 0;padding:9px 13px;border-radius:var(--rs);font:650 12.5px/1.4 var(--fb);
  background:color-mix(in srgb,var(--warn) 14%,transparent);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);color:var(--ink)}
.xhint{margin:12px 0;padding:11px 13px;border-radius:var(--r);border:1px dashed var(--line2);background:var(--surfi);
  font-size:13px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.xhint b{color:var(--ink);margin-right:4px}
.xverdict{display:flex;align-items:center;gap:14px;margin-top:16px;padding:16px 18px;border-radius:var(--r);border:1px solid var(--line)}
.xverdict b{font:800 36px/1 var(--fh);letter-spacing:-2px;font-variant-numeric:tabular-nums}
.xverdict b span{font-size:16px;letter-spacing:-.5px;color:var(--ink3)}
.xverdict>span{font-size:14.5px;font-weight:650;line-height:1.4}
.xverdict.win{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 11%,transparent)}
.xverdict.win b{color:var(--ok)}
.xverdict.lose{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.xverdict.lose b{color:var(--bad)}
.xli.half{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.xgroup{margin-top:16px}
.xgroup .lbl{margin-bottom:8px}
.xsos{border-color:var(--brand)}
.xsosplan{font:800 clamp(18px,3.8vw,24px)/1.35 var(--fh);letter-spacing:-.6px;margin:12px 0 14px;color:var(--brand)}
.xsosline{font-size:15px;line-height:1.7;color:var(--ink);padding-left:14px;border-left:2px solid var(--line);margin:6px 0}
.mic{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:1px solid var(--line2);
  background:var(--surfi);color:var(--ink2);font:650 13px/1 var(--fb);cursor:pointer;transition:.16s var(--ease)}
.mic:hover{color:var(--ink);border-color:var(--brand)}
.mic i{width:9px;height:9px;border-radius:50%;background:var(--ink3);flex:none;transition:.2s var(--ease)}
.mic.on{background:var(--brand);color:var(--brandink);border-color:transparent;box-shadow:var(--glow)}
.mic.on i{background:var(--brandink);animation:mpulse 1.1s infinite}
@keyframes mpulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.dict{margin-top:12px;padding:14px 16px;border-radius:var(--r);border:1px dashed var(--line2);background:var(--surfi);
  font-size:15px;line-height:1.6;color:var(--ink);min-height:58px}
.dict:empty:before{content:"Appuie sur Dicter et récite ta réponse…";color:var(--ink3)}
.terms{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tipdict{display:block;font-size:12.5px;line-height:1.5;color:var(--ink3);padding:9px 12px;border-radius:var(--rs);border:1px dashed var(--line);background:var(--surfi)}
.tipdict kbd{margin:0 1px}
/* ============================================================
   DIVERS
   ============================================================ */
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(14px);
  background:var(--ink);color:var(--bg);padding:11px 19px;border-radius:999px;font:650 13.5px/1 var(--fb);
  opacity:0;pointer-events:none;transition:.3s var(--spring);z-index:95;white-space:nowrap;box-shadow:var(--sh)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#cfx{position:fixed;inset:0;pointer-events:none;z-index:99}
.kbd{display:none;font:600 11.5px/1.7 var(--fm);color:var(--ink3);text-align:center;margin-top:16px}
@media(hover:hover) and (min-width:760px){.kbd{display:block}}
kbd{background:var(--wash);border:1px solid var(--line);border-radius:4px;padding:2px 6px;font-size:10.5px;font-family:var(--fm);color:var(--ink2)}
.done{text-align:center;padding:46px 22px}
.done .big{font-size:52px;line-height:1;margin-bottom:16px}
.done h2{font-size:clamp(26px,6vw,36px);letter-spacing:-1.2px}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
footer{max-width:var(--w);margin:0 auto;padding:30px 18px 10px;text-align:center;
  font:600 11px/1.7 var(--fm);letter-spacing:var(--caps);text-transform:uppercase;color:var(--ink3)}
/* ---------- SQUELETTE 3D ---------- */
.h3dwrap{max-width:var(--w);margin:18px auto 0}
.h3dwrap.no-gl{display:none}
.h3d{position:relative;height:clamp(300px,54vh,440px);
  border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;box-shadow:var(--sh);
  background:radial-gradient(120% 95% at 50% 8%,var(--surf2) 0%,var(--surfi) 62%,var(--bg) 100%);
  isolation:isolate;user-select:none;-webkit-user-select:none}
.h3d canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:pan-y}
.h3d canvas:active{cursor:grabbing}
.h3dgrad{position:absolute;inset:auto 0 0 0;height:30%;pointer-events:none;
  background:linear-gradient(to top,var(--bg) 2%,transparent 100%);opacity:.7}
.h3dtop{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;
  padding:14px 16px;pointer-events:none;flex-wrap:wrap}
.h3dtag{font:700 10px/1 var(--fm);letter-spacing:var(--caps);text-transform:uppercase;color:var(--brand);
  border:1px solid var(--line2);border-radius:999px;padding:6px 10px;background:var(--surfi)}
.h3dhint{font:600 10px/1 var(--fm);letter-spacing:var(--caps);text-transform:uppercase;color:var(--ink3)}
.h3dfoot{position:absolute;left:0;right:0;bottom:0;padding:0 12px 12px;pointer-events:none}
.h3dchips{display:flex;gap:7px;overflow-x:auto;padding:4px 4px 8px;pointer-events:auto;
  scrollbar-width:none;-ms-overflow-style:none}
.h3dchips::-webkit-scrollbar{display:none}
.h3dchip{flex:0 0 auto;border:1px solid var(--line2);background:var(--surf);color:var(--ink2);
  border-radius:999px;padding:8px 13px;font:650 12px/1 var(--fb);cursor:pointer;
  transition:.18s var(--ease);white-space:nowrap}
.h3dchip:hover{color:var(--ink);border-color:var(--brand)}
.h3dchip.on{background:var(--brand);border-color:var(--brand);color:var(--brandink)}
.h3dinfo{display:none;margin:10px 0 0;padding:15px 17px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--surf);box-shadow:var(--sh)}
.h3dinfo.on{display:block;animation:rise .34s var(--spring) both}
.h3dinfo b{display:block;font-family:var(--fh);font-size:15px;font-weight:750;letter-spacing:-.3px;margin-bottom:5px}
.h3dinfo span{display:block;font-size:12.5px;line-height:1.5;color:var(--ink2)}
.h3dgo{margin-top:11px;border:0;background:var(--brand);color:var(--brandink);border-radius:var(--rs);
  padding:9px 14px;font:700 12px/1 var(--fb);cursor:pointer;transition:.18s var(--ease)}
.h3dgo:hover{transform:translateY(-1px)}
@media(max-width:640px){.h3d{height:clamp(280px,48vh,380px);border-radius:var(--r)}
  .h3dinfo span{font-size:12px}}
.h3dseg{display:flex;gap:3px;pointer-events:auto;margin-left:auto;background:var(--surfi);
  border:1px solid var(--line2);border-radius:999px;padding:3px}
.h3dseg button{border:0;background:transparent;color:var(--ink3);border-radius:999px;
  padding:6px 11px;font:700 10px/1 var(--fm);letter-spacing:.06em;text-transform:uppercase;
  cursor:pointer;transition:.18s var(--ease);white-space:nowrap}
.h3dseg button:hover{color:var(--ink)}
.h3dseg button.on{background:var(--brand);color:var(--brandink)}
.h3dmus{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.h3dmchip{border:1px solid var(--line2);background:var(--surf2);color:var(--ink2);border-radius:999px;
  padding:7px 11px;font:650 11.5px/1 var(--fb);cursor:pointer;transition:.18s var(--ease)}
.h3dmchip:hover{color:var(--ink);border-color:var(--brand)}
.h3dmchip.on{background:var(--brand);border-color:var(--brand);color:var(--brandink)}
@media(max-width:640px){.h3dtop{gap:7px}.h3dseg button{padding:6px 9px;font-size:9.5px}}
/* ---------- SCHÉMAS ---------- */
.pitag{display:inline-block;margin-left:7px;padding:3px 7px;border-radius:999px;border:1px solid var(--line2);background:var(--wash);color:var(--ink3);font:700 9px/1 var(--fm);letter-spacing:.07em;text-transform:uppercase;vertical-align:middle}
.evbox{border:1px solid var(--brand);border-radius:var(--r);padding:14px 16px;margin-top:14px;background:var(--surfi)}
.evbox>b:first-child{display:block;font-family:var(--fh);font-size:14px;margin-bottom:6px}
.evbox>span{display:block;font-size:12.5px;line-height:1.55;color:var(--ink2)}
.evbox>span b{color:var(--ink)}
.scbar{display:flex;gap:7px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none}
.scbar::-webkit-scrollbar{display:none}
.scchip{flex:0 0 auto;border:1px solid var(--line2);background:var(--surf);color:var(--ink2);
  border-radius:999px;padding:9px 14px;font:650 12.5px/1 var(--fb);cursor:pointer;
  transition:.18s var(--ease);white-space:nowrap}
.scchip:hover{color:var(--ink);border-color:var(--brand)}
.scchip.on{background:var(--brand);border-color:var(--brand);color:var(--brandink)}
.scwrap{border:1px solid var(--line);border-radius:var(--r);background:var(--surfi);
  padding:12px;display:flex;justify-content:center}
.scsvg{width:100%;max-width:440px;height:auto;display:block;touch-action:manipulation}
.sgb,.sgb2{fill:var(--surf2);stroke:var(--ink3);stroke-width:2.2;stroke-linejoin:round}
.sgh{fill:var(--wash);stroke:var(--ink3);stroke-width:2.2;stroke-linejoin:round}
.sgm{fill:var(--surf2);stroke:var(--ink2);stroke-width:2;stroke-dasharray:4 3}
.sgcolo{fill:none;stroke:var(--ink3);stroke-width:34;stroke-linecap:round}
.sgcol{fill:none;stroke:var(--surf2);stroke-width:30;stroke-linecap:round}
.sgd{fill:none;stroke:var(--ink3);stroke-width:30;stroke-linecap:butt;stroke-dasharray:2 12;opacity:.5}
.sgb{stroke:var(--ink3)}
.sgax{stroke:var(--ink3);stroke-width:1.4;opacity:.45;fill:none}
.sgt{fill:var(--ink3);font:600 11px var(--fm);letter-spacing:.1em;text-transform:uppercase}
.sgr{stroke:var(--ink3);stroke-width:1.6;opacity:.4}
.sgr2{stroke:var(--brand3);stroke-width:3.4;opacity:.9}
.sgr3{stroke:var(--brand2);stroke-width:3.4;opacity:.9}
.sgr4{stroke:var(--brand);stroke-width:3.4;opacity:.9}
.scld{stroke:var(--brand);stroke-width:1.6;opacity:.6}
.scmk{cursor:pointer}
.scmk circle{fill:var(--surf);stroke:var(--brand);stroke-width:2.4;transition:.2s var(--ease)}
.scmk text{fill:var(--ink);font:700 14px var(--fm);text-anchor:middle;pointer-events:none}
.scmk:hover circle{fill:var(--brand)}
.scmk:hover text{fill:var(--brandink)}
.scmk.ok circle{fill:var(--ok);stroke:var(--ok)}
.scmk.ok text{fill:var(--bg)}
.scmk.no circle{fill:var(--bad);stroke:var(--bad)}
.scmk.hot circle{fill:var(--brand);stroke:var(--brand)}
.scmk.hot text{fill:var(--brandink)}
