<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Évolution de l'âge</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#06040c;overscroll-behavior:none}
body{font-family:ui-sans-serif,-apple-system,"Helvetica Neue",Arial,sans-serif;color:#f4f1fa;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-tap-highlight-color:transparent;
  display:flex;flex-direction:column}

#glow{position:fixed;inset:-30%;z-index:0;filter:blur(13vmin);opacity:.5;pointer-events:none}
.g{position:absolute;border-radius:48% 52% 56% 44%;mix-blend-mode:screen;will-change:transform}
.g1{width:70vmin;height:70vmin;left:-4%;top:-8%;background:radial-gradient(circle,hsl(272 92% 58%),transparent 66%);animation:a1 18s ease-in-out infinite}
.g2{width:78vmin;height:78vmin;right:-10%;bottom:-14%;background:radial-gradient(circle,hsl(28 94% 56%),transparent 66%);animation:a2 23s ease-in-out infinite}
.g3{width:58vmin;height:58vmin;left:38%;top:34%;background:radial-gradient(circle,hsl(330 88% 58%),transparent 70%);animation:a3 15s ease-in-out infinite}
@keyframes a1{0%,100%{transform:translate(0,0) scale(1) rotate(0)}50%{transform:translate(20vmin,14vmin) scale(1.24) rotate(70deg)}}
@keyframes a2{0%,100%{transform:translate(0,0) scale(1.08) rotate(0)}50%{transform:translate(-18vmin,-15vmin) scale(.84) rotate(-60deg)}}
@keyframes a3{0%,100%{transform:translate(0,0) scale(.9) rotate(0)}50%{transform:translate(-15vmin,17vmin) scale(1.28) rotate(55deg)}}

header{position:relative;z-index:2;padding:5vmin 5vmin 0;text-align:center;flex:0 0 auto}
.kicker{font-size:min(1.7vmin,2.6vw);letter-spacing:.42em;text-transform:uppercase;opacity:.34}
h1{margin-top:1.6vmin;font-size:min(7vmin,9vw);font-weight:200;letter-spacing:-.03em;line-height:1}
h1 em{font-style:normal;background:linear-gradient(100deg,hsl(272 92% 72%),hsl(330 90% 70%) 46%,hsl(28 94% 66%));
  -webkit-background-clip:text;background-clip:text;color:transparent}

main{position:relative;z-index:2;flex:1 1 auto;display:flex;gap:2.4vmin;padding:4vmin 5vmin 6vmin}
@media (max-aspect-ratio:1/1){main{flex-direction:column}}

a.tile{flex:1 1 0;display:flex;flex-direction:column;justify-content:flex-end;
  text-decoration:none;color:inherit;position:relative;overflow:hidden;
  border-radius:3vmin;padding:5vmin;border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.035);
  transition:transform .4s cubic-bezier(.16,1,.3,1),border-color .4s,background .4s}
a.tile:hover,a.tile:active{transform:translateY(-1vmin) scale(1.012);border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.07)}
a.tile:before{content:"";position:absolute;inset:0;opacity:.3;transition:opacity .4s;
  background:radial-gradient(ellipse 70% 60% at 50% 110%,var(--c1),transparent 70%)}
a.tile:hover:before{opacity:.55}
.t3{--c1:hsl(28 94% 56%)}
.t4{--c1:hsl(275 92% 60%)}

.num{position:absolute;top:4vmin;left:5vmin;font-size:min(2vmin,3vw);letter-spacing:.3em;text-transform:uppercase;opacity:.42}
.mark{position:absolute;top:50%;left:50%;transform:translate(-50%,-55%);font-size:min(34vmin,46vw);
  font-weight:150;line-height:1;letter-spacing:-.05em;opacity:.1;pointer-events:none}
.tname{position:relative;font-size:min(5.4vmin,7vw);font-weight:250;letter-spacing:-.02em;line-height:1.08}
.tsub{position:relative;margin-top:1.4vmin;font-size:min(2.2vmin,3.2vw);font-weight:300;opacity:.55;letter-spacing:.02em}
.swatches{position:relative;display:flex;gap:.9vmin;margin-top:3vmin}
.swatches i{width:min(2.2vmin,3vw);height:min(2.2vmin,3vw);border-radius:50%;display:block}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="glow"><div class="g g1"></div><div class="g g2"></div><div class="g g3"></div></div>

<header>
  <div class="kicker">Escape game</div>
  <h1>Évolution de <em>l'âge</em></h1>
</header>

<main>
  <a class="tile t3" href="stroop/">
    <div class="num">Énigme 3</div>
    <div class="mark">3</div>
    <div class="tname">Ne crois pas<br>ce que tu lis</div>
    <div class="tsub">Six cartes, six encres</div>
    <div class="swatches">
      <i style="background:hsl(6 78% 54%)"></i><i style="background:hsl(30 92% 55%)"></i>
      <i style="background:hsl(46 94% 56%)"></i><i style="background:hsl(140 58% 46%)"></i>
      <i style="background:hsl(218 76% 58%)"></i><i style="background:hsl(272 64% 62%)"></i>
    </div>
  </a>

  <a class="tile t4" href="memoire/">
    <div class="num">Énigme 4</div>
    <div class="mark">4</div>
    <div class="tname">La mémoire<br>qui s'efface</div>
    <div class="tsub">Quatre séries, quatre décennies</div>
    <div class="swatches">
      <i style="background:hsl(275 90% 62%)"></i><i style="background:hsl(314 88% 60%)"></i>
      <i style="background:hsl(353 86% 58%)"></i><i style="background:hsl(32 84% 56%)"></i>
    </div>
  </a>
</main>

</body>
</html>
