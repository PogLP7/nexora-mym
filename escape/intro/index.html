<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; media-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>Intro — Évolution de l'âge</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#000;overscroll-behavior:none}
body{font-family:ui-sans-serif,-apple-system,"Helvetica Neue",Arial,sans-serif;color:#eee;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-tap-highlight-color:transparent;
  --lum:0; --age:0; --rot:0;
  --tx:50%; --ty:60%; --beam:0;
  --camx:0px; --camy:0px; --camz:1; --camr:0deg;
  --shk:0px;}

/* ================= CAMERA ================= */
#cam{position:fixed;inset:-7%;
  transform:translate3d(calc(var(--camx) + var(--shk)),var(--camy),0) scale(var(--camz)) rotate(var(--camr));
  will-change:transform}

.set{position:absolute;inset:0;opacity:0;visibility:hidden}
.set.on{opacity:1;visibility:visible}
.layer{position:absolute;inset:0;will-change:transform}
svg.art{position:absolute;inset:0;width:100%;height:100%}
.lit{opacity:var(--lum);transition:opacity .07s linear}

/* ================= TORCHE ================= */
.torch{
  --m:radial-gradient(circle closest-side,#000 0%,rgba(0,0,0,.74) 40%,transparent 75%);
  -webkit-mask-image:var(--m); mask-image:var(--m);
  -webkit-mask-size:92vmin 92vmin; mask-size:92vmin 92vmin;
  -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
  -webkit-mask-position:var(--tx) var(--ty); mask-position:var(--tx) var(--ty);
  transition:-webkit-mask-position 1.2s cubic-bezier(.42,0,.22,1),
             mask-position 1.2s cubic-bezier(.42,0,.22,1)}
#beam{position:fixed;inset:0;z-index:8;pointer-events:none;opacity:var(--beam);
  background:radial-gradient(circle 32vmin at var(--tx) var(--ty),
    rgba(255,242,214,.3),rgba(255,232,196,.09) 44%,transparent 70%);
  mix-blend-mode:screen;
  transition:background 1.2s cubic-bezier(.42,0,.22,1),opacity .6s linear}

/* ================= LE LIEU VIEILLIT ================= */
/* chaque palier fait apparaitre une couche de decrepitude */
#webs,#cracks,#peel,#debris,#grime{opacity:0;transition:opacity 1.6s ease-out}
body.ag1 #grime{opacity:.4}
body.ag2 #grime{opacity:.75}  body.ag2 #cracks{opacity:.5}
body.ag3 #grime{opacity:.95}  body.ag3 #cracks{opacity:.85} body.ag3 #peel{opacity:.7} body.ag3 #webs{opacity:.45}
body.ag4 #grime{opacity:1}    body.ag4 #cracks{opacity:1}   body.ag4 #peel{opacity:1}  body.ag4 #webs{opacity:.85}
body.ag4 #debris{opacity:.9}  body.ag3 #debris{opacity:.45}
#chalkMarks{transition:opacity 1.6s ease-out}
body.ag2 #chalkMarks{opacity:.16} body.ag3 #chalkMarks{opacity:.09} body.ag4 #chalkMarks{opacity:.04}
#webs path{stroke:#b5aea0;fill:none;stroke-width:.9;stroke-linecap:round;opacity:.8}
#webs .thick{stroke-width:1.15;opacity:.78}
#cracks path{stroke:#6b6253;fill:none;stroke-width:1.6;stroke-linecap:round;opacity:.5}
#cracks .hair{stroke-width:.9;opacity:.3}

/* ================= EFFETS ================= */
#dust,#grain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#dust{z-index:7}
#grain{z-index:9;mix-blend-mode:overlay;opacity:calc(.09 + var(--age)*.2);
  background-repeat:repeat;animation:gr .5s steps(1) infinite}
@keyframes gr{0%{background-position:0 0}25%{background-position:-23px 17px}
  50%{background-position:41px -31px}75%{background-position:-11px -47px}100%{background-position:29px 13px}}

#scan{position:fixed;inset:0;z-index:9;pointer-events:none;opacity:calc(var(--age)*.13);
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.5) 0 .18vmin,transparent .18vmin .42vmin);
  transition:opacity 1.4s linear}

#vig{position:fixed;inset:0;z-index:10;pointer-events:none;
  background:radial-gradient(ellipse calc(96% - var(--age)*18%) calc(96% - var(--age)*20%) at 50% 50%,transparent 44%,#000 100%);
  transition:background 1.4s linear}

#chroma{position:fixed;inset:0;z-index:11;pointer-events:none;opacity:0;mix-blend-mode:screen;
  background:linear-gradient(90deg,rgba(255,30,30,.55),transparent 16%,transparent 84%,rgba(30,110,255,.55))}
#chroma.hit{animation:ch .45s ease-out}
@keyframes ch{0%{opacity:.6}100%{opacity:0}}

/* dechirure numerique */
#glitch{position:fixed;inset:0;z-index:12;pointer-events:none;opacity:0;overflow:hidden}
#glitch div{position:absolute;left:-10%;right:-10%;background:#fff;opacity:.9;mix-blend-mode:overlay}
#glitch.hit{animation:gl .34s steps(5)}
@keyframes gl{0%,100%{opacity:0}20%,60%{opacity:1}}

#flash{position:fixed;inset:0;z-index:17;background:#fff;opacity:0;pointer-events:none}
#flash.hit{animation:fl .3s ease-out}
@keyframes fl{0%{opacity:0}4%{opacity:1}20%{opacity:.45}100%{opacity:0}}
#flash.soft{animation:fls .9s ease-out}
@keyframes fls{0%{opacity:0}10%{opacity:.8}100%{opacity:0}}
#flash.red{background:#5a0b0b}
#flash.red.hit{animation:flr .7s ease-out}
@keyframes flr{0%{opacity:0}8%{opacity:.75}100%{opacity:0}}

#fade{position:fixed;inset:0;z-index:16;background:#000;opacity:1;pointer-events:none;
  transition:opacity .8s linear}

/* ================= NEON SUSPENDU ================= */
#lamp{position:absolute;left:50%;top:0;width:40%;height:34%;z-index:4;pointer-events:none;
  transform-origin:50% 0;animation:swing 7.5s ease-in-out infinite;opacity:0;transition:opacity .1s linear}
#lamp.on{opacity:var(--lum)}
@keyframes swing{0%,100%{transform:translateX(-50%) rotate(-1.5deg)}50%{transform:translateX(-50%) rotate(1.5deg)}}
#lamp .wire{position:absolute;left:50%;top:0;width:1px;height:16%;background:#4a4238;transform:translateX(-50%)}
#lamp .tube{position:absolute;left:0;right:0;top:16%;height:9%;border-radius:99px;background:#fff4e0;
  box-shadow:0 0 4vmin .6vmin rgba(255,240,208,.8),0 0 16vmin 4vmin rgba(255,218,160,.3)}
#lamp .pool{position:absolute;left:-85%;right:-85%;top:16%;height:520%;
  background:radial-gradient(ellipse 44% 62% at 50% 0%,rgba(255,230,186,.62),rgba(255,222,172,.18) 46%,transparent 74%)}

/* ================= SILHOUETTE ================= */
/* ombre projetee sur le mur, elle suit le balancement de la lampe */
#manShade{position:absolute;left:50%;bottom:8%;height:55%;aspect-ratio:.4545/1;z-index:5;
  transform-origin:50% 100%;opacity:0;pointer-events:none;
  filter:blur(1.6vmin);animation:shadeSwing 7.5s ease-in-out infinite}
@keyframes shadeSwing{
  0%,100%{transform:translateX(-50%) translateX(7%) scale(1.35,2.3) skewX(17deg)}
  50%{transform:translateX(-50%) translateX(-7%) scale(1.35,2.3) skewX(-17deg)}}
#manShade.on{opacity:.72;transition:opacity 1.6s ease-out}
#manShade svg{width:100%;height:100%;overflow:visible}

/* yeux */
#eyes{opacity:0}
#eyes.on{animation:eyesIn 2.4s ease-out forwards}
@keyframes eyesIn{0%{opacity:0}100%{opacity:1}}
#eyes.burn{animation:burn 1.1s ease-in-out infinite}
@keyframes burn{0%,100%{opacity:1}50%{opacity:.55}}

#manWrap{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);
  height:55%;aspect-ratio:.4545/1;opacity:0;z-index:6}
#manWrap.in{animation:manIn 3.4s cubic-bezier(.2,.75,.25,1) forwards}
@keyframes manIn{0%{opacity:0;transform:translateX(-50%) translateY(4%) scale(.8)}
  45%{opacity:1}100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
#manWrap.old{animation:old 3.2s cubic-bezier(.3,0,.3,1) forwards}
@keyframes old{to{transform:translateX(-50%) translateY(4%) scale(.88) skewX(-3deg)}}
#man{position:absolute;inset:0;overflow:visible}
#breath{transform-origin:50% 42%;animation:br 4.4s ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(1,1)}50%{transform:scale(1.014,1.008)}}
#head{transform-origin:50% 100%;animation:look 11s ease-in-out infinite}
@keyframes look{0%,62%,100%{transform:rotate(0)}70%{transform:rotate(-4.5deg)}86%{transform:rotate(2deg)}}
#armR{transform-origin:78% 32%;animation:arm 7.5s ease-in-out infinite}
#armL{transform-origin:22% 32%;animation:arm 9.2s ease-in-out infinite reverse}
@keyframes arm{0%,70%,100%{transform:rotate(0)}80%{transform:rotate(-7deg)}}
#manShadow{position:absolute;left:50%;bottom:-2%;width:62%;height:7%;
  transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,.85),transparent 72%);
  filter:blur(1.4vmin)}

/* ================= TEXTE ================= */
#subs{position:fixed;left:0;right:0;bottom:10%;z-index:13;text-align:center;padding:0 7vw}
#sub{display:inline-block;font-size:min(4vmin,5.4vw);font-weight:300;line-height:1.38;
  color:#f4f1ea;text-shadow:0 .4vmin 2.6vmin rgba(0,0,0,.95),0 0 .8vmin rgba(0,0,0,.8);opacity:0}
#sub.on{animation:subIn .8s cubic-bezier(.16,1,.3,1) forwards}
#sub.off{animation:subOut .5s ease-in forwards}
@keyframes subIn{from{opacity:0;transform:translateY(1.2vmin);filter:blur(.6vmin)}to{opacity:1;transform:none;filter:none}}
@keyframes subOut{to{opacity:0;transform:translateY(-.8vmin);filter:blur(.3vmin)}}

#card{position:fixed;inset:0;z-index:14;display:flex;align-items:center;justify-content:center;
  pointer-events:none;text-align:center;padding:8vw}
#cardT{font-size:min(3vmin,4.4vw);font-weight:300;letter-spacing:.42em;text-transform:uppercase;
  color:#cfc8ba;opacity:0}
#cardT.on{animation:cardIn 3.6s ease-in-out forwards}
@keyframes cardIn{0%{opacity:0;letter-spacing:.62em}20%{opacity:.85;letter-spacing:.42em}
  74%{opacity:.85}100%{opacity:0;letter-spacing:.3em}}

#ages{position:fixed;inset:0;z-index:13;display:flex;align-items:center;justify-content:center;pointer-events:none}
#ageN{font-size:min(32vmin,38vw);font-weight:150;letter-spacing:-.045em;line-height:1;
  font-variant-numeric:tabular-nums;color:#fff;opacity:0;text-shadow:0 0 9vmin rgba(0,0,0,.85)}
#ageN.hit{animation:hit .72s cubic-bezier(.16,1,.3,1)}
@keyframes hit{0%{opacity:0;transform:scale(1.7);filter:blur(2.6vmin)}
  16%{opacity:1;transform:scale(1);filter:none}76%{opacity:1}100%{opacity:0;transform:scale(.95)}}

/* ================= FIN ================= */
#end{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:#000;opacity:0;pointer-events:none;
  text-align:center;padding:7vw}
#end.on{opacity:1;pointer-events:auto;transition:opacity 1.2s ease-out}
#end .k{font-size:min(1.8vmin,2.8vw);letter-spacing:.5em;text-transform:uppercase;opacity:0;color:#8e8a82}
#end h1{margin-top:2.4vmin;font-size:min(9vmin,11vw);font-weight:200;letter-spacing:-.03em;line-height:1;opacity:0}
#end h1 em{font-style:normal;background:linear-gradient(100deg,#c9a4ff,#ff9ec4 46%,#ffc07a);
  -webkit-background-clip:text;background-clip:text;color:transparent}
#end a{margin-top:7vmin;font-size:min(2vmin,3.2vw);letter-spacing:.22em;text-transform:uppercase;
  text-decoration:none;color:#000;background:#eee;padding:1.8vmin 4.2vmin;border-radius:99px;opacity:0}
.fin{animation:fin 1.1s cubic-bezier(.16,1,.3,1) forwards}
@keyframes fin{from{opacity:0;transform:translateY(1.8vmin)}to{opacity:1;transform:none}}

/* ================= LE SURGISSEMENT ================= */
#scream{position:fixed;inset:0;z-index:19;display:flex;align-items:center;justify-content:center;
  background:#000;opacity:0;visibility:hidden;pointer-events:none}
#scream svg{height:128%;width:auto}
#scream.on{opacity:1;visibility:visible;animation:scr .78s cubic-bezier(.1,.9,.2,1) both}
@keyframes scr{
  0%{opacity:0;transform:scale(.46) rotate(-3deg)}
  7%{opacity:1;transform:scale(1.16) rotate(1.5deg)}
  18%{transform:scale(1.02) rotate(-1deg)}
  40%{transform:scale(1.1) rotate(.8deg)}
  70%{transform:scale(1.04) rotate(-.6deg)}
  100%{opacity:1;transform:scale(1.08)}}
#scream .glow{animation:eyeBurn .09s steps(2) infinite}
@keyframes eyeBurn{0%{opacity:1}100%{opacity:.72}}

/* ================= LANCEMENT ================= */
#go{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:#000;cursor:pointer;text-align:center;padding:7vw}
#go.gone{opacity:0;pointer-events:none;transition:opacity .9s}
#go .t{font-size:min(5.4vmin,7vw);font-weight:200;letter-spacing:-.02em}
#go .d{margin-top:2.6vmin;font-size:min(2.1vmin,3.2vw);font-weight:300;letter-spacing:.2em;
  text-transform:uppercase;opacity:.38}
#go .w{margin-top:1.4vmin;font-size:min(1.7vmin,2.7vw);font-weight:300;letter-spacing:.14em;opacity:.22}
#go .pulse{margin-top:5vmin;width:min(9vmin,13vw);height:min(9vmin,13vw);border-radius:50%;
  border:1px solid rgba(255,255,255,.3);animation:pl 2.4s ease-in-out infinite}
@keyframes pl{0%,100%{transform:scale(1);opacity:.4}50%{transform:scale(1.16);opacity:1}}

@media (prefers-reduced-motion:reduce){#breath,#head,#armR,#armL,.pulse{animation:none}}
</style>
</head>
<body>

<div id="cam">

  <!-- ===== LA PORTE ===== -->
  <div class="set" id="set-door">
    <div class="layer lit" id="doorLayer">
      <svg class="art" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <linearGradient id="corr" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#191613"/><stop offset="1" stop-color="#070605"/></linearGradient>

        </defs>
        <rect width="1600" height="900" fill="url(#corr)"/>
        <polygon points="0,0 0,900 440,760 440,150" fill="#120f0c"/>
        <polygon points="1600,0 1600,900 1160,760 1160,150" fill="#0f0d0a"/>
        <polygon points="0,900 1600,900 1160,760 440,760" fill="#0a0907"/>

        <rect x="620" y="200" width="360" height="560" rx="4" fill="url(#dr)" stroke="#4a3b2a" stroke-width="4"/>
        <rect x="652" y="236" width="296" height="196" rx="3" fill="#241c14" stroke="#4a3b2a" stroke-width="3"/>
        <rect x="652" y="470" width="296" height="250" rx="3" fill="#241c14" stroke="#4a3b2a" stroke-width="3"/>
        <rect x="672" y="256" width="256" height="156" fill="#0e1620" opacity=".9"/>
        <rect x="1012" y="300" width="112" height="78" rx="3" fill="#1b1713" stroke="#50422f" stroke-width="2"/>
        <text x="1068" y="352" font-family="ui-sans-serif,Helvetica,Arial" font-size="42" font-weight="700"
              text-anchor="middle" opacity=".85" style="fill:#9a8a6f">B12</text>
        <rect x="952" y="470" width="54" height="15" rx="7" fill="#8d7c5e"/>
        <circle cx="958" cy="478" r="13" fill="#6f6149"/>
        <g transform="rotate(-6 560 330)">
          <rect x="500" y="290" width="120" height="160" fill="#241f18" stroke="#3c3326" stroke-width="2"/>

            <path d="M516 322 h88 M516 346 h66 M516 370 h88 M516 394 h48"/></g>

        <g id="doorWeb" opacity=".32"></g>
      </svg>
    </div>
  </div>

  <!-- ===== LA SALLE ===== -->
  <div class="set" id="set-room">
    <div class="layer lit" id="bg">
      <svg class="art" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#2d2825"/><stop offset="1" stop-color="#0c0b0a"/></linearGradient>
          <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#191510"/><stop offset="1" stop-color="#050504"/></linearGradient>
          <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1e2c25"/><stop offset="1" stop-color="#111a15"/></linearGradient>
          <radialGradient id="godray" cx=".5" cy="0" r="1">
            <stop offset="0" stop-color="#ffe9c0" stop-opacity=".22"/>
            <stop offset="1" stop-color="#ffe9c0" stop-opacity="0"/></radialGradient>
        </defs>
        <rect width="1600" height="900" fill="url(#wall)"/>
        <polygon points="0,900 1600,900 1180,470 420,470" fill="url(#floor)"/>
        <g stroke="#2b2620" stroke-width="1.1" opacity=".45">
          <line x1="0" y1="900" x2="470" y2="470"/><line x1="330" y1="900" x2="610" y2="470"/>
          <line x1="760" y1="900" x2="770" y2="470"/><line x1="1230" y1="900" x2="990" y2="470"/>
          <line x1="1600" y1="900" x2="1130" y2="470"/>
        </g>
        <rect x="548" y="292" width="504" height="178" rx="4" fill="url(#board)" stroke="#3d342a" stroke-width="2"/>
        <rect x="548" y="470" width="504" height="13" fill="#2a2319"/>
        <g id="chalkMarks" stroke="#7b876f" stroke-width="2" opacity=".3" stroke-linecap="round" fill="none">
          <path d="M586 338 h132 M586 366 h88 M586 394 h152 M586 422 h70"/>
          <circle cx="878" cy="372" r="40"/><path d="M838 372 h80 M878 332 v80"/>
          <path d="M952 336 l46 58 M998 336 l-46 58"/>
          <path d="M770 420 q30 -26 60 0 t60 0"/>
        </g>
        <g fill="#cfc7b4" opacity=".5">
          <rect x="600" y="474" width="26" height="6" rx="3"/><rect x="640" y="474" width="18" height="6" rx="3"/></g>
        <rect x="80" y="238" width="232" height="318" rx="3" fill="#0a1526" stroke="#362e25" stroke-width="3"/>
        <g stroke="#9ab8e6" stroke-width="5" opacity=".28">
          <line x1="84" y1="264" x2="308" y2="264"/><line x1="84" y1="302" x2="308" y2="302"/>
          <line x1="84" y1="340" x2="308" y2="340"/><line x1="84" y1="378" x2="308" y2="378"/>
          <line x1="84" y1="416" x2="308" y2="416"/><line x1="84" y1="454" x2="308" y2="454"/>
          <line x1="84" y1="492" x2="308" y2="492"/><line x1="84" y1="530" x2="308" y2="530"/></g>
        <g transform="rotate(2.5 1388 356)">
          <rect x="1312" y="250" width="152" height="212" fill="#282118" stroke="#3d3429" stroke-width="2"/>
          <g opacity=".26" stroke="#8d7f6c" stroke-width="2" fill="none">
            <ellipse cx="1388" cy="306" rx="26" ry="32"/><path d="M1388 338 v72 M1388 368 l-26 24 M1388 368 l26 24"/></g>
        </g>
        <path d="M1312 250 l34 28 l-34 20 z" fill="#0b0a09"/>
        <g id="clock" transform="translate(1182 206)">
          <circle r="58" fill="#161310" stroke="#4a3e31" stroke-width="4"/>
          <circle r="47" fill="none" stroke="#2d261f" stroke-width="1.5"/>
          <g stroke="#7e7667" stroke-width="3" stroke-linecap="round">
            <line y1="-45" y2="-37"/><line x1="45" x2="37"/><line y1="45" y2="37"/><line x1="-45" x2="-37"/></g>
          <line id="hh" y1="7" y2="-27" stroke="#d2c9b7" stroke-width="5" stroke-linecap="round"/>
          <line id="mm" y1="9" y2="-41" stroke="#d2c9b7" stroke-width="3.4" stroke-linecap="round"/>
          <circle r="4" fill="#d2c9b7"/>
        </g>
        <g fill="#2a251d" opacity=".75">
          <rect x="300" y="820" width="78" height="54" rx="2" transform="rotate(-14 339 847)"/>
          <rect x="1180" y="842" width="92" height="60" rx="2" transform="rotate(9 1226 872)"/>
          <rect x="690" y="868" width="70" height="48" rx="2" transform="rotate(-5 725 892)"/></g>

        <!-- ===== COUCHES DE DECREPITUDE, remplies en JS ===== -->
        <g id="grime"></g>
        <g id="peel"></g>
        <g id="cracks"></g>
        <g id="debris"></g>
        <g id="webs"></g>
      </svg>
      <svg class="art" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="mix-blend-mode:screen">
        <g opacity=".5">
          <polygon points="84,250 310,250 700,900 240,900" fill="url(#godray)" opacity=".5"/>
          <polygon points="120,300 300,300 620,900 300,900" fill="url(#godray)" opacity=".4"/></g>
      </svg>
    </div>

    <div class="layer lit" id="fg">
      <svg class="art" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var body = document.body, T = [];
function at(ms, fn){ T.push(setTimeout(fn, ms)); }
function css(k, v){ body.style.setProperty(k, v); }
function rnd(a, b){ return a + Math.random()*(b-a); }

/* =====================================================================
   SON
   ===================================================================== */
var AC = null, master = null, hallIn = null, echoIn = null;

function audio(){
  if (AC) return AC;
  var C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
  AC = new C();

  var comp = AC.createDynamicsCompressor();
  comp.threshold.value = -15; comp.knee.value = 22; comp.ratio.value = 3.6;
  comp.attack.value = .005; comp.release.value = .2;
  comp.connect(AC.destination);

  master = AC.createGain(); master.gain.value = .9; master.connect(comp);

  /* grande reverberation sombre */
  var hall = AC.createConvolver(); hall.buffer = impulse(3.2, 3.1, 1800);
  var hw = AC.createGain(); hw.gain.value = .55;
  hall.connect(hw); hw.connect(comp);
  hallIn = AC.createGain(); hallIn.connect(hall);

  /* echo de couloir */
  var dl = AC.createDelay(1.2); dl.delayTime.value = .33;
  var fb = AC.createGain(); fb.gain.value = .34;
  var dlp = AC.createBiquadFilter(); dlp.type = "lowpass"; dlp.frequency.value = 1400;
  var dw = AC.createGain(); dw.gain.value = .4;
  dl.connect(dlp); dlp.connect(fb); fb.connect(dl); dlp.connect(dw); dw.connect(comp);
  echoIn = AC.createGain(); echoIn.connect(dl);
  return AC;
}
function impulse(sec, decay, cut){
  var sr = AC.sampleRate, len = Math.floor(sr*sec), b = AC.createBuffer(2, len, sr);
  for (var c=0;c<2;c++){
    var d = b.getChannelData(c), lp = 0;
    for (var i=0;i<len;i++){
      var x = i/len;
      var early = (i > sr*.013 && i < sr*.06) ? 1.9 : 1;
      var n = (Math.random()*2-1) * Math.pow(1-x, decay) * early;
      lp += ((cut ? .22 : 1) * n - lp) * .5;     /* assombrit la queue */
      d[i] = lp * .6;
    }
  }
  return b;
}
function noiseBuf(sec, shape){
  var sr = AC.sampleRate, len = Math.max(1, Math.floor(sr*sec)), b = AC.createBuffer(1, len, sr);
  var d = b.getChannelData(0);
  for (var i=0;i<len;i++){ var x = i/len; d[i] = (Math.random()*2-1) * (shape ? shape(x) : (1-x)); }
  return b;
}
function send(node, amt, echo){
  if (hallIn && amt){ var g = AC.createGain(); g.gain.value = amt; node.connect(g); g.connect(hallIn); }
  if (echoIn && echo){ var e = AC.createGain(); e.gain.value = echo; node.connect(e); e.connect(echoIn); }
}
function now(){ return AC.currentTime; }
/* place un son dans le champ stereo : -1 a gauche, +1 a droite */
function out(node, rev, echo, pan){
  var dest = node;
  if (pan !== undefined && pan !== null && AC.createStereoPanner){
    var pn = AC.createStereoPanner(); pn.pan.value = Math.max(-1, Math.min(1, pan));
    node.connect(pn); dest = pn;
  }
  dest.connect(master);
  send(dest, rev, echo);
}

/* ---- nappe : deux sinus proches qui battent, c'est ce qui met mal a l'aise ---- */
var droneG = [];
function drone(){
  var a = audio(); if (!a) return;
  [[40,.17],[40.7,.13],[61,.1],[81.3,.055],[122,.03]].forEach(function(p){
    var o = a.createOscillator(), g = a.createGain(), lp = a.createBiquadFilter();
    o.type = "sine"; o.frequency.value = p[0];
    lp.type = "lowpass"; lp.frequency.value = 240;
    g.gain.value = 0;
    o.connect(lp); lp.connect(g); g.connect(master);
    o.start(); g.gain.linearRampToValueAtTime(p[1], now() + 5);
    droneG.push({g:g, v:p[1], o:o});
  });
  /* infrason : on ne l'entend pas, on le ressent */
  var s = a.createOscillator(), sg = a.createGain();
  s.type = "sine"; s.frequency.value = 19;
  sg.gain.value = 0; s.connect(sg); sg.connect(master); s.start();
  sg.gain.linearRampToValueAtTime(.12, now() + 6);
  droneG.push({g:sg, v:.12, o:s});
}
function droneTo(m, sec){
  if (!AC) return;
  droneG.forEach(function(d){ try { d.g.gain.linearRampToValueAtTime(d.v*m, now()+sec); } catch(e){} });
}
function droneStop(){
  if (!AC) return;
  droneG.forEach(function(d){ try { d.g.gain.linearRampToValueAtTime(0, now()+1.2); d.o.stop(now()+1.8); } catch(e){} });
  droneG = [];
}

/* ---- cordes stridentes, le reflexe Psycho ---- */
function strings(dur, vol, base){
  var a = audio(); if (!a) return;
  base = base || 1180;
  [1, 1.0595, 1.498, 2.004, 2.52].forEach(function(r, i){
    var o = a.createOscillator(), g = a.createGain(), bp = a.createBiquadFilter();
    var lfo = a.createOscillator(), lg = a.createGain();
    o.type = "sawtooth"; o.frequency.value = base*r;
    lfo.type = "sine"; lfo.frequency.value = 5.5 + i*1.3; lg.gain.value = base*r*.014;
    lfo.connect(lg); lg.connect(o.frequency); lfo.start();
    bp.type = "bandpass"; bp.frequency.value = base*r*1.8; bp.Q.value = 2.6;
    g.gain.setValueAtTime(.0001, now());
    g.gain.linearRampToValueAtTime((vol||.12)/5, now()+.035);
    g.gain.setValueAtTime((vol||.12)/5, now()+dur*.72);
    g.gain.linearRampToValueAtTime(.0001, now()+dur);
    o.connect(bp); bp.connect(g); g.connect(master); send(g, .45);
    o.start(); o.stop(now()+dur+.1); lfo.stop(now()+dur+.1);
  });
}
/* ---- cordes qui glissent vers l'aigu ---- */
function strSlide(dur, vol){
  var a = audio(); if (!a) return;
  [1, 1.5].forEach(function(r){
    var o = a.createOscillator(), g = a.createGain(), bp = a.createBiquadFilter();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(260*r, now());
    o.frequency.exponentialRampToValueAtTime(1700*r, now()+dur);
    bp.type = "bandpass"; bp.Q.value = 3.4;
    bp.frequency.setValueAtTime(600, now());
    bp.frequency.exponentialRampToValueAtTime(4200, now()+dur);
    g.gain.setValueAtTime(.0001, now());
    g.gain.exponentialRampToValueAtTime((vol||.16)/2, now()+dur*.85);
    g.gain.linearRampToValueAtTime(.0001, now()+dur);
    o.connect(bp); bp.connect(g); g.connect(master); send(g, .5);
    o.start(); o.stop(now()+dur+.1);
  });
}
/* ---- battement de coeur ---- */
function beat(vol){
  var a = audio(); if (!a) return;
  [[0, vol], [.21, vol*.68]].forEach(function(p){
    var o = a.createOscillator(), g = a.createGain(), t = now() + p[0];
    o.type = "sine";
    o.frequency.setValueAtTime(66, t);
    o.frequency.exponentialRampToValueAtTime(31, t+.15);
    g.gain.setValueAtTime(.0001, t);
    g.gain.linearRampToValueAtTime(p[1], t+.012);
    g.gain.exponentialRampToValueAtTime(.0001, t+.26);
    o.connect(g); g.connect(master); send(g, .3);
    o.start(t); o.stop(t+.3);
  });
}
var heartT = null;
function heartStart(ms, vol){
  heartStop();
  var v = vol || .22, period = ms;
  (function loop(){
    beat(v);
    period = Math.max(300, period*.93);
    heartT = setTimeout(loop, period);
    T.push(heartT);
  })();
}
function heartStop(){ if (heartT){ clearTimeout(heartT); heartT = null; } }

/* ---- chuchotements ---- */
function whispers(dur, vol){
  var a = audio(); if (!a) return;
  var s = a.createBufferSource();
  s.buffer = noiseBuf(dur, function(x){ return Math.sin(Math.PI*x) * (.35 + .65*Math.abs(Math.sin(x*37))); });
  var bp = a.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 1750; bp.Q.value = 5.5;
  var lfo = a.createOscillator(), lg = a.createGain();
  lfo.frequency.value = 2.6; lg.gain.value = 620;
  lfo.connect(lg); lg.connect(bp.frequency); lfo.start();
  var g = a.createGain(); g.gain.value = vol || .07;
  s.connect(bp); bp.connect(g);
  var pn = a.createStereoPanner ? a.createStereoPanner() : null;
  if (pn){
    pn.pan.setValueAtTime(rnd(-.9, .9), now());
    pn.pan.linearRampToValueAtTime(rnd(-.9, .9), now()+dur);
    g.connect(pn); pn.connect(master); send(pn, .7, .3);
  } else { g.connect(master); send(g, .7, .3); }
  s.start(); lfo.stop(now()+dur+.1);
}
/* ---- montee ---- */
function riser(sec, peak){
  var a = audio(); if (!a) return;
  var s = a.createBufferSource(); s.buffer = noiseBuf(sec, function(x){ return Math.pow(x, 1.7); });
  var bp = a.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 2.4;
  bp.frequency.setValueAtTime(190, now());
  bp.frequency.exponentialRampToValueAtTime(5600, now()+sec);
  var g = a.createGain();
  g.gain.setValueAtTime(.0001, now());
  g.gain.exponentialRampToValueAtTime(peak || .3, now()+sec*.93);
  g.gain.linearRampToValueAtTime(0, now()+sec);
  s.connect(bp); bp.connect(g); g.connect(master); send(g, .35);
  s.start();
}
/* ---- inspiration inversee avant un choc ---- */
function inhale(sec, vol){
  var a = audio(); if (!a) return;

  var bp = a.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 1.2;

  bp.frequency.exponentialRampToValueAtTime(3400, now()+sec);

/* ---- impact ---- */
function boom(vol){
  var a = audio(); if (!a) return;
  var o = a.createOscillator(), g = a.createGain();

  o.frequency.setValueAtTime(142, now());

  var s = a.createBufferSource(); s.buffer = noiseBuf(.26, function(x){ return Math.pow(1-x, 2.2); });
  var lp = a.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 820;
  var ng = a.createGain(); ng.gain.value = (vol||.7)*.55;
  s.connect(lp); lp.connect(ng); ng.connect(master); send(ng, .65);

/* ---- chute de sub ---- */
function subDrop(sec, vol){
  var a = audio(); if (!a) return;
  var o = a.createOscillator(), g = a.createGain();

  o.frequency.setValueAtTime(96, now());
  o.frequency.exponentialRampToValueAtTime(21, now()+sec);
  g.gain.setValueAtTime(vol || .4, now());
  g.gain.linearRampToValueAtTime(.0001, now()+sec);
  o.connect(g); g.connect(master);

/* ---- claquement ---- */
function crack(vol, cut){
  var a = audio(); if (!a) return;
  var s = a.createBufferSource(); s.buffer = noiseBuf(.09, function(x){ return Math.pow(1-x, 3.2); });
  var lp = a.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = cut || 6500;

/* ---- metal qui resonne ---- */
function metal(vol){
  var a = audio(); if (!a) return;
  [1, 1.41, 1.93, 2.71, 3.39, 4.17].forEach(function(r, i){
    var o = a.createOscillator(), g = a.createGain();

    g.gain.linearRampToValueAtTime((vol||.1)/(i+2), now()+.008);

/* ---- bois qui craque ---- */
function woodCrack(n){
  var a = audio(); if (!a) return;
  for (var i=0;i<(n||5);i++){
    (function(d){
      var t = now() + d;
      var s = a.createBufferSource(); s.buffer = noiseBuf(.035, function(x){ return Math.pow(1-x, 5); });
      var bp = a.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = rnd(700, 2400); bp.Q.value = 4;
      var g = a.createGain(); g.gain.value = rnd(.05, .14);
      s.connect(bp); bp.connect(g);
      out(g, .5, 0, rnd(-.85, .85));
      s.start(t);

/* ---- raclement ---- */
function scrape(sec, vol){
  var a = audio(); if (!a) return;

/* ---- neon ---- */

var buzzN = null;

var stepSide = 1;

  s.start();

/* ---- saturation ---- */
function shaper(amount){
  var ws = AC.createWaveShaper(), n = 1024, c = new Float32Array(n), k = amount;
  for (var i=0;i<n;i++){
    var x = i*2/n - 1;
    c[i] = (3+k)*x*20*Math.PI/180 / (Math.PI + k*Math.abs(x));
  }
  ws.curve = c; ws.oversample = "4x";
  return ws;
}
/* ---- le cri ---- */

  var a = audio(); if (!a) return;

  var og = a.createGain(); og.gain.value = .42;
  var lp = a.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 7000;
  ws.connect(lp); lp.connect(og); og.connect(master); send(og, .45);
  [742, 901, 1138, 1397, 1822, 2341].forEach(function(f, i){
    var o = a.createOscillator(), g = a.createGain(), lfo = a.createOscillator(), lg = a.createGain();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(f*.9, now());
    o.frequency.linearRampToValueAtTime(f*1.1, now()+.5);
    lfo.type = "sine"; lfo.frequency.value = 7.5 + i*1.7; lg.gain.value = f*.035;
    lfo.connect(lg); lg.connect(o.frequency); lfo.start();
    var v = .17/(i*.45+1);
    g.gain.setValueAtTime(.0001, now());
    g.gain.linearRampToValueAtTime(v, now()+.014);
    g.gain.setValueAtTime(v, now()+.42);
    g.gain.exponentialRampToValueAtTime(.0001, now()+.72);
    o.connect(g); g.connect(ws);
    o.start(); o.stop(now()+.8); lfo.stop(now()+.8);
  });
  var s = a.createBufferSource(); s.buffer = noiseBuf(.7, function(x){ return Math.pow(1-x, 1.3); });
  var hp = a.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 850;
  var ng = a.createGain(); ng.gain.value = .26;
  s.connect(hp); hp.connect(ng); ng.connect(ws);

}

}

   TOILES, FISSURES, CRASSE — generees
   ===================================================================== */
function webPath(cx, cy, r, a0, a1, rays, rings){
  var d = "", i, k, A = [];
  for (i=0;i<=rays;i++) A.push(a0 + (a1-a0)*i/rays);
  A.forEach(function(a){
    d += "M" + cx.toFixed(1) + " " + cy.toFixed(1) +
         "L" + (cx + Math.cos(a)*r).toFixed(1) + " " + (cy + Math.sin(a)*r).toFixed(1);
  });
  for (k=1;k<=rings;k++){
    var rr = r * (k/(rings+.4)) * rnd(.9, 1.06);
    for (i=0;i<rays;i++){
      var p0 = [cx + Math.cos(A[i])*rr, cy + Math.sin(A[i])*rr];
      var p1 = [cx + Math.cos(A[i+1])*rr, cy + Math.sin(A[i+1])*rr];
      var mid = [(p0[0]+p1[0])/2, (p0[1]+p1[1])/2];
      var sag = rr * .13;
      var cm = [cx + (mid[0]-cx)*(1 - sag/rr), cy + (mid[1]-cy)*(1 - sag/rr)];
      d += "M" + p0[0].toFixed(1) + " " + p0[1].toFixed(1) +
           "Q" + cm[0].toFixed(1) + " " + cm[1].toFixed(1) + " " + p1[0].toFixed(1) + " " + p1[1].toFixed(1);
    }
  }
  return d;
}
function crackPath(x, y, len, ang, depth){
  var d = "M" + x + " " + y, cx = x, cy = y, a = ang, i;
  var seg = len / 7;
  for (i=0;i<7;i++){
    a += rnd(-.42, .42);
    cx += Math.cos(a)*seg; cy += Math.sin(a)*seg;
    d += "L" + cx.toFixed(1) + " " + cy.toFixed(1);
  }
  if (depth > 0){
    d += " " + crackPath(cx, cy, len*.45, a + rnd(.5, 1.1), depth-1);
    d += " " + crackPath(cx, cy, len*.38, a - rnd(.5, 1.1), depth-1);
  }
  return d;
}

(function(){
  var cv = $("dust"), x = cv.getContext("2d"), P = [], W = 0, H = 0;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  function size(){ W = cv.width = Math.round(innerWidth*dpr); H = cv.height = Math.round(innerHeight*dpr); }
  size(); addEventListener("resize", size);
  for (var i=0;i<150;i++){
    P.push({x:Math.random(), y:Math.random(), r:Math.random()*1.9+.35,
            vx:(Math.random()-.5)*.00016, vy:-Math.random()*.0002-.00003,
            a:Math.random()*.5+.1, p:Math.random()*6.28});
  }
  (function loop(){
    x.clearRect(0,0,W,H);
    var t = Date.now()/1000, st = getComputedStyle(body);
    var lum = parseFloat(st.getPropertyValue("--lum")) || 0;
    var bm  = parseFloat(st.getPropertyValue("--beam")) || 0;
    var age = parseFloat(st.getPropertyValue("--age")) || 0;
    var tx  = (parseFloat(st.getPropertyValue("--tx")) || 50)/100;
    var ty  = (parseFloat(st.getPropertyValue("--ty")) || 60)/100;
    var ar  = W/H;
    if (lum > .02 || bm > .02){
      for (var i=0;i<P.length;i++){
        var p = P[i];
        p.x += p.vx + Math.sin(t*.45 + p.p)*.00011;
        p.y += p.vy * (1 + age*2.2);
        if (p.y < -.02){ p.y = 1.02; p.x = Math.random(); }
        if (p.x < -.02) p.x = 1.02; if (p.x > 1.02) p.x = -.02;
        var vis;
        if (bm > .02){
          var dx = (p.x - tx)*ar, dy = p.y - ty;
          var fall = 1 - Math.min(1, Math.sqrt(dx*dx + dy*dy)/.34);
          vis = bm * Math.pow(Math.max(0, fall), 1.5) * .95;
        } else {
          var band = .5 + .5*Math.max(0, 1 - Math.abs(p.x - .3)/.34);
          vis = lum * band * (.3 + age*.5);
        }
        if (vis < .01) continue;
        x.beginPath();
        x.arc(p.x*W, p.y*H, p.r*dpr*(1.5 + age), 0, 6.2832);
        x.fillStyle = "rgba(255,240,212," + (p.a*vis).toFixed(3) + ")";
        x.fill();
      }
    }
    requestAnimationFrame(loop);
  })();
})();
