<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; media-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>Intro — Évolution de l'âge</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#000;overscroll-behavior:none}
body{font-family:ui-sans-serif,-apple-system,"Helvetica Neue",Arial,sans-serif;color:#eee;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-tap-highlight-color:transparent;
  --lum:0;          /* lumiere ambiante de la scene */
  --age:0;          /* degradation */
  --tx:50%; --ty:60%;   /* position du faisceau */
  --beam:0;         /* intensite du faisceau */
  --camx:0px; --camy:0px; --camz:1; --camr:0deg;
}

/* ================= CAMERA ================= */
#cam{position:fixed;inset:-6%;
  transform:translate3d(var(--camx),var(--camy),0) scale(var(--camz)) rotate(var(--camr));
  will-change:transform}

/* ================= DECORS ================= */
.set{position:absolute;inset:0;opacity:0;visibility:hidden}
.set.on{opacity:1;visibility:visible}
.layer{position:absolute;inset:0;will-change:transform}
svg.art{position:absolute;inset:0;width:100%;height:100%}

/* lumiere ambiante appliquee au decor */
.lit{opacity:var(--lum);transition:opacity .07s linear}

/* faisceau de torche : masque + halo */
.torch{
  --m:radial-gradient(circle closest-side,#000 0%,rgba(0,0,0,.74) 40%,transparent 75%);
  -webkit-mask-image:var(--m); mask-image:var(--m);
  -webkit-mask-size:92vmin 92vmin; mask-size:92vmin 92vmin;
  -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
  -webkit-mask-position:var(--tx) var(--ty); mask-position:var(--tx) var(--ty);
  transition:-webkit-mask-position 1.2s cubic-bezier(.42,0,.22,1),
             mask-position 1.2s cubic-bezier(.42,0,.22,1)}
#beam{position:fixed;inset:0;z-index:8;pointer-events:none;opacity:var(--beam);
  background:radial-gradient(circle 32vmin at var(--tx) var(--ty),
    rgba(255,242,214,.3),rgba(255,232,196,.09) 44%,transparent 70%);
  mix-blend-mode:screen;
  transition:background 1.2s cubic-bezier(.42,0,.22,1),opacity .6s linear}
#shake{animation:none}
.jitter{animation:jit .18s steps(2) infinite}
@keyframes jit{0%{transform:translate(0,0)}50%{transform:translate(.22vmin,-.18vmin)}100%{transform:translate(-.14vmin,.2vmin)}}

/* ================= EFFETS ================= */
#dust,#grain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#dust{z-index:7}
#grain{z-index:9;mix-blend-mode:overlay;opacity:calc(.09 + var(--age)*.3);
  background-repeat:repeat;animation:gr .5s steps(1) infinite}
@keyframes gr{0%{background-position:0 0}25%{background-position:-23px 17px}
  50%{background-position:41px -31px}75%{background-position:-11px -47px}100%{background-position:29px 13px}}

#vig{position:fixed;inset:0;z-index:10;pointer-events:none;
  background:radial-gradient(ellipse calc(94% - var(--age)*30%) calc(94% - var(--age)*32%) at 50% 50%,transparent 36%,#000 100%);
  transition:background 1.4s linear}

#chroma{position:fixed;inset:0;z-index:11;pointer-events:none;opacity:0;mix-blend-mode:screen;
  background:linear-gradient(90deg,rgba(255,40,40,.5),transparent 18%,transparent 82%,rgba(40,120,255,.5))}
#chroma.hit{animation:ch .4s ease-out}
@keyframes ch{0%{opacity:.5}100%{opacity:0}}

#flash{position:fixed;inset:0;z-index:17;background:#fff;opacity:0;pointer-events:none}
#flash.hit{animation:fl .3s ease-out}
@keyframes fl{0%{opacity:0}4%{opacity:1}20%{opacity:.45}100%{opacity:0}}
#flash.soft{animation:fls .9s ease-out}
@keyframes fls{0%{opacity:0}10%{opacity:.8}100%{opacity:0}}

#fade{position:fixed;inset:0;z-index:16;background:#000;opacity:1;pointer-events:none;
  transition:opacity .8s linear}

/* ================= SILHOUETTE ================= */
#manWrap{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);
  height:55%;aspect-ratio:.4545/1;opacity:0;z-index:6}
#manWrap.in{animation:manIn 3.2s cubic-bezier(.2,.75,.25,1) forwards}
@keyframes manIn{
  0%{opacity:0;transform:translateX(-50%) translateY(4%) scale(.82)}
  45%{opacity:1}
  100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
#manWrap.old{animation:old 2.6s cubic-bezier(.3,0,.3,1) forwards}
@keyframes old{
  to{transform:translateX(-50%) translateY(3.5%) scale(.9) skewX(-2.4deg)}}
#man{position:absolute;inset:0;overflow:visible}
#breath{transform-origin:50% 42%;animation:br 4.4s ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(1,1)}50%{transform:scale(1.014,1.008)}}
#head{transform-origin:50% 100%;animation:look 11s ease-in-out infinite}
@keyframes look{0%,62%,100%{transform:rotate(0)}70%{transform:rotate(-4.5deg)}86%{transform:rotate(2deg)}}
#armR{transform-origin:78% 32%;animation:arm 7.5s ease-in-out infinite}
@keyframes arm{0%,70%,100%{transform:rotate(0)}80%{transform:rotate(-7deg)}}
#manShadow{position:absolute;left:50%;bottom:-2%;width:62%;height:7%;
  transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,.85),transparent 72%);
  filter:blur(1.4vmin)}

/* ================= TEXTE ================= */
#subs{position:fixed;left:0;right:0;bottom:10%;z-index:13;text-align:center;padding:0 7vw}
#sub{display:inline-block;font-size:min(4vmin,5.4vw);font-weight:300;line-height:1.38;
  color:#f4f1ea;text-shadow:0 .4vmin 2.6vmin rgba(0,0,0,.95),0 0 .8vmin rgba(0,0,0,.8);opacity:0}
#sub.on{animation:subIn .8s cubic-bezier(.16,1,.3,1) forwards}
#sub.off{animation:subOut .5s ease-in forwards}
@keyframes subIn{from{opacity:0;transform:translateY(1.2vmin);filter:blur(.6vmin)}to{opacity:1;transform:none;filter:none}}
@keyframes subOut{to{opacity:0;transform:translateY(-.8vmin);filter:blur(.3vmin)}}

#card{position:fixed;inset:0;z-index:14;display:flex;align-items:center;justify-content:center;
  pointer-events:none;text-align:center;padding:8vw}
#cardT{font-size:min(3vmin,4.4vw);font-weight:300;letter-spacing:.42em;text-transform:uppercase;
  color:#cfc8ba;opacity:0}
#cardT.on{animation:cardIn 3.4s ease-in-out forwards}
@keyframes cardIn{0%{opacity:0;letter-spacing:.6em}22%{opacity:.85;letter-spacing:.42em}
  74%{opacity:.85}100%{opacity:0;letter-spacing:.3em}}

#ages{position:fixed;inset:0;z-index:13;display:flex;align-items:center;justify-content:center;pointer-events:none}
#ageN{font-size:min(32vmin,38vw);font-weight:150;letter-spacing:-.045em;line-height:1;
  font-variant-numeric:tabular-nums;color:#fff;opacity:0;
  text-shadow:0 0 9vmin rgba(0,0,0,.85)}
#ageN.hit{animation:hit .68s cubic-bezier(.16,1,.3,1)}
@keyframes hit{0%{opacity:0;transform:scale(1.6);filter:blur(2.4vmin)}
  18%{opacity:1;transform:scale(1);filter:none}76%{opacity:1}100%{opacity:0;transform:scale(.96)}}

/* ================= FIN ================= */
#end{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:#000;opacity:0;pointer-events:none;
  text-align:center;padding:7vw}
#end.on{opacity:1;pointer-events:auto;transition:opacity 1.1s ease-out}
#end .k{font-size:min(1.8vmin,2.8vw);letter-spacing:.5em;text-transform:uppercase;opacity:0;color:#8e8a82}
#end h1{margin-top:2.4vmin;font-size:min(9vmin,11vw);font-weight:200;letter-spacing:-.03em;line-height:1;opacity:0}
#end h1 em{font-style:normal;background:linear-gradient(100deg,#c9a4ff,#ff9ec4 46%,#ffc07a);
  -webkit-background-clip:text;background-clip:text;color:transparent}
#end a{margin-top:7vmin;font-size:min(2vmin,3.2vw);letter-spacing:.22em;text-transform:uppercase;
  text-decoration:none;color:#000;background:#eee;padding:1.8vmin 4.2vmin;border-radius:99px;opacity:0}
.fin{animation:fin 1.1s cubic-bezier(.16,1,.3,1) forwards}
@keyframes fin{from{opacity:0;transform:translateY(1.8vmin)}to{opacity:1;transform:none}}

/* ================= LANCEMENT ================= */
#go{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:#000;cursor:pointer;text-align:center;padding:7vw}
#go.gone{opacity:0;pointer-events:none;transition:opacity .9s}
#go .t{font-size:min(5.4vmin,7vw);font-weight:200;letter-spacing:-.02em}
#go .d{margin-top:2.6vmin;font-size:min(2.1vmin,3.2vw);font-weight:300;letter-spacing:.2em;
  text-transform:uppercase;opacity:.38}
#go .pulse{margin-top:6vmin;width:min(9vmin,13vw);height:min(9vmin,13vw);border-radius:50%;
  border:1px solid rgba(255,255,255,.3);animation:pl 2.4s ease-in-out infinite}
@keyframes pl{0%,100%{transform:scale(1);opacity:.4}50%{transform:scale(1.16);opacity:1}}

#armL{transform-origin:22% 32%;animation:arm 9.2s ease-in-out infinite reverse}

@media (prefers-reduced-motion:reduce){#breath,#head,#armR,#armL,.pulse,.jitter{animation:none}}
</style>
</head>
<body>

<div id="cam">

  <!-- ===== DECOR 1 : LA PORTE ===== -->
  <div class="set" id="set-door">
    <div class="layer lit" id="doorLayer">
      <svg class="art" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">

          <rect x="672" y="256" width="256" height="156"/>

        <!-- plaque + numero -->
        <rect x="1012" y="300" width="112" height="78" rx="3" fill="#1b1713" stroke="#50422f" stroke-width="2"/>
        <text x="1068" y="352" font-family="ui-sans-serif,Helvetica,Arial" font-size="42" font-weight="700"
              fill="#9a8straight" text-anchor="middle" opacity=".85" style="fill:#9a8a6f">B12</text>
        <!-- poignee -->
        <rect x="952" y="470" width="54" height="15" rx="7" fill="#8d7c5e"/>
        <circle cx="958" cy="478" r="13" fill="#6f6149"/>
        <!-- affichette qui pend -->
        <g transform="rotate(-6 560 330)">
          <rect x="500" y="290" width="120" height="160" fill="#241f18" stroke="#3c3326" stroke-width="2"/>
          <g stroke="#7b705c" stroke-width="3" opacity=".3">
            <path d="M516 322 h88 M516 346 h66 M516 370 h88 M516 394 h48"/>
          </g>
        </g>
      </svg>
    </div>
  </div>

  <!-- ===== DECOR 2 : LA SALLE ===== -->
  <div class="set" id="set-room">
    <!-- fond : mur, tableau, fenetre, horloge -->
    <div class="layer lit" id="bg">
      <svg class="art" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#2d2825"/><stop offset="1" stop-color="#0c0b0a"/>
          </linearGradient>
          <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#191510"/><stop offset="1" stop-color="#050504"/>
          </linearGradient>
          <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1e2c25"/><stop offset="1" stop-color="#111a15"/>
          </linearGradient>
          <radialGradient id="godray" cx=".5" cy="0" r="1">
            <stop offset="0" stop-color="#ffe9c0" stop-opacity=".22"/>
            <stop offset="1" stop-color="#ffe9c0" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <rect width="1600" height="900" fill="url(#wall)"/>
        <polygon points="0,900 1600,900 1180,470 420,470" fill="url(#floor)"/>
        <g stroke="#2b2620" stroke-width="1.1" opacity=".45">
          <line x1="0" y1="900" x2="470" y2="470"/><line x1="330" y1="900" x2="610" y2="470"/>
          <line x1="760" y1="900" x2="770" y2="470"/><line x1="1230" y1="900" x2="990" y2="470"/>
          <line x1="1600" y1="900" x2="1130" y2="470"/>
        </g>
        <!-- tableau -->
        <rect x="548" y="292" width="504" height="178" rx="4" fill="url(#board)" stroke="#3d342a" stroke-width="2"/>
        <rect x="548" y="470" width="504" height="13" fill="#2a2319"/>
        <g stroke="#7b876f" stroke-width="2" opacity=".3" stroke-linecap="round" fill="none">
          <path d="M586 338 h132 M586 366 h88 M586 394 h152 M586 422 h70"/>
          <circle cx="878" cy="372" r="40"/><path d="M838 372 h80 M878 332 v80"/>
          <path d="M952 336 l46 58 M998 336 l-46 58"/>
          <path d="M770 420 q30 -26 60 0 t60 0"/>
        </g>
        <!-- craies sur le rebord -->
        <g fill="#cfc7b4" opacity=".5">
          <rect x="600" y="474" width="26" height="6" rx="3"/><rect x="640" y="474" width="18" height="6" rx="3"/>
        </g>
        <!-- fenetre a stores -->
        <rect x="80" y="238" width="232" height="318" rx="3" fill="#0a1526" stroke="#362e25" stroke-width="3"/>
        <g stroke="#9ab8e6" stroke-width="5" opacity=".28">
          <line x1="84" y1="264" x2="308" y2="264"/><line x1="84" y1="302" x2="308" y2="302"/>
          <line x1="84" y1="340" x2="308" y2="340"/><line x1="84" y1="378" x2="308" y2="378"/>
          <line x1="84" y1="416" x2="308" y2="416"/><line x1="84" y1="454" x2="308" y2="454"/>
          <line x1="84" y1="492" x2="308" y2="492"/><line x1="84" y1="530" x2="308" y2="530"/>
        </g>
        <!-- poster decolle -->
        <g transform="rotate(2.5 1388 356)">
          <rect x="1312" y="250" width="152" height="212" fill="#282118" stroke="#3d3429" stroke-width="2"/>
          <g opacity=".26" stroke="#8d7f6c" stroke-width="2" fill="none">
            <ellipse cx="1388" cy="306" rx="26" ry="32"/><path d="M1388 338 v72 M1388 368 l-26 24 M1388 368 l26 24"/>
          </g>
        </g>
        <path d="M1312 250 l34 28 l-34 20 z" fill="#0b0a09"/>
        <!-- horloge -->
        <g id="clock" transform="translate(1182 206)">
          <circle r="58" fill="#161310" stroke="#4a3e31" stroke-width="4"/>
          <circle r="47" fill="none" stroke="#2d261f" stroke-width="1.5"/>
          <g stroke="#7e7667" stroke-width="3" stroke-linecap="round">
            <line y1="-45" y2="-37"/><line x1="45" x2="37"/><line y1="45" y2="37"/><line x1="-45" x2="-37"/>
          </g>
          <line id="hh" y1="7" y2="-27" stroke="#d2c9b7" stroke-width="5" stroke-linecap="round"/>
          <line id="mm" y1="9" y2="-41" stroke="#d2c9b7" stroke-width="3.4" stroke-linecap="round"/>
          <circle r="4" fill="#d2c9b7"/>
        </g>
        <!-- papiers au sol -->
        <g fill="#2a251d" opacity=".75">
          <rect x="300" y="820" width="78" height="54" rx="2" transform="rotate(-14 339 847)"/>
          <rect x="1180" y="842" width="92" height="60" rx="2" transform="rotate(9 1226 872)"/>
          <rect x="690" y="868" width="70" height="48" rx="2" transform="rotate(-5 725 892)"/>
        </g>
      </svg>
      <!-- rais de lumiere -->
      <svg class="art" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="mix-blend-mode:screen">
        <g opacity=".5">
          <polygon points="84,250 310,250 700,900 240,900" fill="url(#godray)" opacity=".5"/>
          <polygon points="120,300 300,300 620,900 300,900" fill="url(#godray)" opacity=".4"/>
        </g>
      </svg>
    </div>

    <!-- premier plan : les tables, qui bougent plus vite -->
    <div class="layer lit" id="fg">
      <svg class="art" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <g fill="#241e18" stroke="#3c3228" stroke-width="2">
          <g transform="translate(470 500) rotate(-5)"><rect x="-95" y="-20" width="190" height="34" rx="3"/><rect x="-80" y="14" width="12" height="60" rx="2"/><rect x="68" y="14" width="12" height="60" rx="2"/></g>
          <g transform="translate(830 512) rotate(3)"><rect x="-100" y="-20" width="200" height="35" rx="3"/><rect x="-85" y="15" width="12" height="62" rx="2"/><rect x="73" y="15" width="12" height="62" rx="2"/></g>
          <g transform="translate(1170 498) rotate(-2)"><rect x="-92" y="-19" width="184" height="33" rx="3"/><rect x="-78" y="14" width="11" height="58" rx="2"/><rect x="67" y="14" width="11" height="58" rx="2"/></g>
          <g transform="translate(300 648) rotate(7)"><rect x="-122" y="-24" width="244" height="42" rx="4"/><rect x="-102" y="18" width="14" height="80" rx="2"/><rect x="88" y="18" width="14" height="80" rx="2"/></g>
          <g transform="translate(1310 662) rotate(-8)"><rect x="-126" y="-25" width="252" height="44" rx="4"/><rect x="-106" y="19" width="14" height="82" rx="2"/><rect x="92" y="19" width="14" height="82" rx="2"/></g>
          <!-- chaise renversee -->
          <g transform="translate(1030 790) rotate(104)">
            <rect x="-44" y="-8" width="88" height="13" rx="3"/><rect x="-40" y="5" width="11" height="52" rx="2"/>
            <rect x="29" y="5" width="11" height="52" rx="2"/><rect x="-40" y="-70" width="11" height="62" rx="2"/>

    <!-- la silhouette -->
    <div id="manWrap">
      <div id="manShadow"></div>
      <svg id="man" viewBox="0 0 200 440" aria-hidden="true">
        <defs>

            <stop offset="0"   stop-color="#ffe7c0" stop-opacity=".55"/>

          </linearGradient>
        </defs>
        <g id="breath">

            <path d="M100 16 C78 16 61 32 59 54 C58 67 61 79 67 87 L75 97 L125 97 L133 87
                     C139 79 142 67 141 54 C139 32 122 16 100 16 Z" fill="#000"/>
            <path d="M100 16 C78 16 61 32 59 54 C58 67 61 79 67 87 L75 97"
                  fill="none" stroke="url(#rim)" stroke-width="2.6"/>
          </g>
          <path id="torso" fill="#000"
            d="M100 90 C86 90 76 94 71 100 L58 106 C42 113 33 126 30 145 L21 222
               C19 235 25 242 35 243 L41 243 L46 404 C46 415 52 422 62 422 L75 422
               C85 422 90 415 90 404 L97 286 L103 286 L110 404 C110 415 115 422 125 422
               L138 422 C148 422 154 415 154 404 L159 243 L165 243 C175 242 181 235 179 222
               L170 145 C167 126 158 113 142 106 L129 100 C124 94 114 90 100 90 Z"/>
          <path fill="none" stroke="url(#rim)" stroke-width="2.6"
            d="M100 90 C86 90 76 94 71 100 L58 106 C42 113 33 126 30 145 L21 222
               C19 235 25 242 35 243 L41 243 L46 404 C46 415 52 422 62 422"/>
          <path id="armL" fill="#000"
            d="M33 144 C26 150 23 159 22 170 L16 240 C15 250 19 256 26 256
               C33 256 37 251 38 242 L46 174 Z"/>
          <path id="armR" fill="#000"
            d="M167 144 C174 150 177 159 178 170 L184 240 C185 250 181 256 174 256
               C167 256 163 251 162 242 L154 174 Z"/>
        </g>
      </svg>
    </div>
  </div>

</div>

<canvas id="dust"></canvas>
<canvas id="grain"></canvas>
<div id="beam"></div>
<div id="vig"></div>
<div id="chroma"></div>
<div id="fade"></div>
<div id="flash"></div>

<div id="card"><div id="cardT"></div></div>
<div id="subs"><span id="sub"></span></div>
<div id="ages"><div id="ageN">20</div></div>

<div id="end">
  <div class="k" id="eK">Escape game</div>
  <h1 id="eH">Évolution de <em>l'âge</em></h1>
  <a href="../stroop/" id="eA">Entrer dans la première salle</a>
</div>

<div id="go">
  <div class="t">Intro</div>
  <div class="d">Touchez pour lancer · son compris</div>
  <div class="pulse"></div>
</div>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var body = document.body, T = [];
function at(ms, fn){ T.push(setTimeout(fn, ms)); }
function css(k, v){ body.style.setProperty(k, v); }

/* =====================================================================
   SON — tout est synthetise, aucun fichier d'effet
   ===================================================================== */
var AC = null, master = null, hall = null, hallIn = null, voiceBus = null;

function audio(){
  if (AC) return AC;
  var C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
  AC = new C();

  var comp = AC.createDynamicsCompressor();
  comp.threshold.value = -16; comp.knee.value = 24; comp.ratio.value = 3.4;
  comp.attack.value = .006; comp.release.value = .22;
  comp.connect(AC.destination);

  master = AC.createGain(); master.gain.value = .9; master.connect(comp);

  /* reverberation de salle, partagee */
  hall = AC.createConvolver(); hall.buffer = impulse(1.9, 2.8);
  var hw = AC.createGain(); hw.gain.value = .5;
  hall.connect(hw); hw.connect(comp);
  hallIn = AC.createGain(); hallIn.gain.value = 1; hallIn.connect(hall);

  voiceBus = AC.createGain(); voiceBus.gain.value = 1;
  return AC;
}
function impulse(sec, decay){
  var sr = AC.sampleRate, len = Math.floor(sr*sec), b = AC.createBuffer(2, len, sr);
  for (var c=0;c<2;c++){
    var d = b.getChannelData(c);
    for (var i=0;i<len;i++){
      var x = i/len;
      var early = (i > sr*.011 && i < sr*.055) ? 1.8 : 1;
      d[i] = (Math.random()*2-1) * Math.pow(1-x, decay) * early * .55;
    }
  }
  return b;
}
function noiseBuf(sec, shape){
  var sr = AC.sampleRate, len = Math.max(1, Math.floor(sr*sec)), b = AC.createBuffer(1, len, sr);
  var d = b.getChannelData(0);
  for (var i=0;i<len;i++){
    var x = i/len;
    d[i] = (Math.random()*2-1) * (shape ? shape(x) : (1-x));
  }
  return b;
}
function send(node, amt){ if (hallIn && amt){ var g = AC.createGain(); g.gain.value = amt; node.connect(g); g.connect(hallIn); } }

/* --- nappe de fond, evolutive --- */
var droneGains = [];
function drone(){
  var a = audio(); if (!a) return;
  [[41,.17],[61.5,.12],[82,.07],[123,.035]].forEach(function(p){
    var o = a.createOscillator(), g = a.createGain(), lp = a.createBiquadFilter();
    o.type = "sine"; o.frequency.value = p[0];
    lp.type = "lowpass"; lp.frequency.value = 220;
    g.gain.value = 0;
    o.connect(lp); lp.connect(g); g.connect(master);
    o.start();
    g.gain.linearRampToValueAtTime(p[1], a.currentTime + 4);
    droneGains.push({g:g, v:p[1], o:o});
  });
}
function droneTo(mult, sec){
  if (!AC) return;
  droneGains.forEach(function(d){
    try { d.g.gain.linearRampToValueAtTime(d.v*mult, AC.currentTime + sec); } catch(e){}
  });
}
function droneStop(){
  if (!AC) return;
  droneGains.forEach(function(d){
    try { d.g.gain.linearRampToValueAtTime(0, AC.currentTime + 1.4); d.o.stop(AC.currentTime + 2); } catch(e){}
  });
  droneGains = [];
}

/* --- montee de tension --- */
function riser(sec, peak){
  var a = audio(); if (!a) return;
  var s = a.createBufferSource(); s.buffer = noiseBuf(sec, function(x){ return Math.pow(x, 1.6); });
  var bp = a.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 2.2;
  bp.frequency.setValueAtTime(220, a.currentTime);
  bp.frequency.exponentialRampToValueAtTime(5200, a.currentTime + sec);
  var g = a.createGain();
  g.gain.setValueAtTime(.0001, a.currentTime);
  g.gain.exponentialRampToValueAtTime(peak || .3, a.currentTime + sec*.92);
  g.gain.linearRampToValueAtTime(0, a.currentTime + sec);
  s.connect(bp); bp.connect(g); g.connect(master); send(g, .35);
  s.start();
}
/* --- impact grave --- */
function boom(vol){
  var a = audio(); if (!a) return;
  var o = a.createOscillator(), g = a.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(138, a.currentTime);
  o.frequency.exponentialRampToValueAtTime(29, a.currentTime + .7);
  g.gain.setValueAtTime(vol || .62, a.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + 1.1);
  o.connect(g); g.connect(master); send(g, .5);
  o.start(); o.stop(a.currentTime + 1.2);
  var s = a.createBufferSource(); s.buffer = noiseBuf(.22, function(x){ return Math.pow(1-x, 2.4); });
  var lp = a.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 900;
  var ng = a.createGain(); ng.gain.value = (vol || .62)*.5;
  s.connect(lp); lp.connect(ng); ng.connect(master); send(ng, .6);
  s.start();
}
/* --- claquement sec, flash --- */
function crack(vol, cut){
  var a = audio(); if (!a) return;
  var s = a.createBufferSource(); s.buffer = noiseBuf(.09, function(x){ return Math.pow(1-x, 3.2); });
  var lp = a.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = cut || 6500;
  var g = a.createGain(); g.gain.value = vol || .3;
  s.connect(lp); lp.connect(g); g.connect(master); send(g, .55);
  s.start();
}
/* --- grésillement de neon --- */
function flickerSnd(){
  var a = audio(); if (!a) return;
  var s = a.createBufferSource(); s.buffer = noiseBuf(.06, function(x){ return (Math.random()>.4?1:.2)*(1-x); });
  var bp = a.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 3400; bp.Q.value = 3;
  var g = a.createGain(); g.gain.value = .22;
  s.connect(bp); bp.connect(g); g.connect(master); send(g, .4);
  s.start();
}
var buzzNodes = null;
function buzzOn(){
  var a = audio(); if (!a || buzzNodes) return;
  var o = a.createOscillator(), g = a.createGain(), bp = a.createBiquadFilter();
  o.type = "sawtooth"; o.frequency.value = 100;
  bp.type = "bandpass"; bp.frequency.value = 2500; bp.Q.value = 7;
  g.gain.value = 0;
  o.connect(bp); bp.connect(g); g.connect(master);
  o.start(); g.gain.linearRampToValueAtTime(.02, a.currentTime + .5);
  buzzNodes = {o:o, g:g};
}
function buzzOff(){
  if (!AC || !buzzNodes) return;
  try { buzzNodes.g.gain.linearRampToValueAtTime(0, AC.currentTime + .6); buzzNodes.o.stop(AC.currentTime + .8); } catch(e){}
  buzzNodes = null;
}
/* --- pas sur le lino --- */
function step(vol){
  var a = audio(); if (!a) return;
  var s = a.createBufferSource(); s.buffer = noiseBuf(.13, function(x){ return Math.pow(1-x, 4); });
  var lp = a.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1500;
  var hp = a.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 160;
  var g = a.createGain(); g.gain.value = vol || .2;
  s.connect(lp); lp.connect(hp); hp.connect(g); g.connect(master); send(g, .7);
  s.start();
}
/* --- porte qui grince --- */
function creak(sec){
  var a = audio(); if (!a) return;
  var o = a.createOscillator(), g = a.createGain(), bp = a.createBiquadFilter(), lfo = a.createOscillator(), lg = a.createGain();
  o.type = "sawtooth"; o.frequency.setValueAtTime(128, a.currentTime);
  o.frequency.linearRampToValueAtTime(196, a.currentTime + sec);
  bp.type = "bandpass"; bp.frequency.value = 1500; bp.Q.value = 9;
  lfo.frequency.value = 11; lg.gain.value = 38;
  lfo.connect(lg); lg.connect(o.frequency); lfo.start();
  g.gain.setValueAtTime(.0001, a.currentTime);
  g.gain.linearRampToValueAtTime(.09, a.currentTime + sec*.3);
  g.gain.linearRampToValueAtTime(.0001, a.currentTime + sec);
  o.connect(bp); bp.connect(g); g.connect(master); send(g, .6);
  o.start(); o.stop(a.currentTime + sec + .1); lfo.stop(a.currentTime + sec + .1);
}
/* --- craie --- */
function chalk(){
  var a = audio(); if (!a) return;
  var s = a.createBufferSource(); s.buffer = noiseBuf(.3, function(x){ return (1-x)*(.4 + .6*Math.abs(Math.sin(x*48))); });
  var bp = a.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 4200; bp.Q.value = 2.4;
  var g = a.createGain(); g.gain.value = .11;
  s.connect(bp); bp.connect(g); g.connect(master); send(g, .5);
  s.start();
}
/* --- respiration --- */
function breath(vol){
  var a = audio(); if (!a) return;
  var s = a.createBufferSource(); s.buffer = noiseBuf(.75, function(x){ return Math.sin(Math.PI*x); });
  var bp = a.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 760; bp.Q.value = .9;
  var g = a.createGain(); g.gain.value = vol || .09;
  s.connect(bp); bp.connect(g); g.connect(master); send(g, .5);
  s.start();
}
/* --- horloge --- */
function tick(hi, vol){
  var a = audio(); if (!a) return;
  var o = a.createOscillator(), g = a.createGain();
  o.type = "square"; o.frequency.value = hi ? 2300 : 1550;
  g.gain.value = 0;
  o.connect(g); g.connect(master); send(g, .3);
  var t = a.currentTime;
  g.gain.linearRampToValueAtTime(vol || .05, t + .004);
  g.gain.exponentialRampToValueAtTime(.0001, t + .05);
  o.start(t); o.stop(t + .06);
}
/* --- souffle de transition --- */
function whoosh(sec){
  var a = audio(); if (!a) return;
  var s = a.createBufferSource(); s.buffer = noiseBuf(sec, function(x){ return Math.sin(Math.PI*x); });
  var bp = a.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 1.1;
  bp.frequency.setValueAtTime(3000, a.currentTime);
  bp.frequency.exponentialRampToValueAtTime(260, a.currentTime + sec);
  var g = a.createGain(); g.gain.value = .3;
  s.connect(bp); bp.connect(g); g.connect(master); send(g, .5);
  s.start();
}

/* =====================================================================
   VOIX — trois repliques. Depose voix-1.m4a, voix-2.m4a, voix-3.m4a
   dans ce dossier et elles sont jouees automatiquement.
   ===================================================================== */
var vbuf = {};
function loadVoices(){
  var a = audio(); if (!a) return;
  [1,2,3].forEach(function(n){
    var x = new XMLHttpRequest();
    x.open("GET", "voix-" + n + ".m4a", true);
    x.responseType = "arraybuffer";
    x.onload = function(){
      if (x.status !== 200) return;
      a.decodeAudioData(x.response, function(b){ vbuf[n] = b; }, function(){});
    };
    try { x.send(); } catch(e){}
  });
}
function duck(on){
  if (!master || !AC) return;
  try {
    master.gain.cancelScheduledValues(AC.currentTime);
    master.gain.linearRampToValueAtTime(on ? .34 : .9, AC.currentTime + .3);
  } catch(e){}
}
function voice(n){
  if (!AC || !vbuf[n]) return;
  var s = AC.createBufferSource();
  s.buffer = vbuf[n];
  var hp = AC.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 95;
  var pr = AC.createBiquadFilter(); pr.type = "peaking"; pr.frequency.value = 2600; pr.Q.value = .9; pr.gain.value = 3;
  var g = AC.createGain(); g.gain.value = 1;
  s.connect(hp); hp.connect(pr); pr.connect(g); g.connect(master); send(g, .3);
  duck(true); s.onended = function(){ duck(false); };
  s.start();
}

/* =====================================================================
   GRAIN + POUSSIERE
   ===================================================================== */
(function(){
  var n = 192, c = document.createElement("canvas");
  c.width = c.height = n;
  var x = c.getContext("2d"), im = x.createImageData(n,n), d = im.data;
  for (var i=0;i<d.length;i+=4){ var v=(Math.random()*255)|0; d[i]=d[i+1]=d[i+2]=v; d[i+3]=255; }
  x.putImageData(im,0,0);
  $("grain").style.backgroundImage = "url(" + c.toDataURL("image/png") + ")";
})();

(function(){
  var cv = $("dust"), x = cv.getContext("2d"), P = [], W = 0, H = 0;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  function size(){
    W = cv.width  = Math.round(innerWidth  * dpr);
    H = cv.height = Math.round(innerHeight * dpr);
  }
  size(); addEventListener("resize", size);
  for (var i=0;i<140;i++){
    P.push({x:Math.random(), y:Math.random(), r:Math.random()*1.9+.35,
            vx:(Math.random()-.5)*.00016, vy:-Math.random()*.0002-.00003,
            a:Math.random()*.5+.1, p:Math.random()*6.28});
  }
  (function loop(){
    x.clearRect(0,0,W,H);
    var t = Date.now()/1000;
    var st  = getComputedStyle(body);
    var lum = parseFloat(st.getPropertyValue("--lum")) || 0;
    var bm  = parseFloat(st.getPropertyValue("--beam")) || 0;
    var tx  = (parseFloat(st.getPropertyValue("--tx")) || 50) / 100;
    var ty  = (parseFloat(st.getPropertyValue("--ty")) || 60) / 100;
    var ar  = W / H;
    if (lum > .02 || bm > .02){
      for (var i=0;i<P.length;i++){
        var p = P[i];
        p.x += p.vx + Math.sin(t*.45 + p.p)*.00011;
        p.y += p.vy;
        if (p.y < -.02){ p.y = 1.02; p.x = Math.random(); }
        if (p.x < -.02) p.x = 1.02; if (p.x > 1.02) p.x = -.02;
        var vis;
        if (bm > .02){
          /* dans le faisceau de la torche, et nulle part ailleurs */
          var dx = (p.x - tx) * ar, dy = p.y - ty;
          var fall = 1 - Math.min(1, Math.sqrt(dx*dx + dy*dy) / .34);
          vis = bm * Math.pow(Math.max(0, fall), 1.5) * .95;
        } else {
          /* sous le neon : surtout dans les rais venant de la fenetre */
          var band = .5 + .5 * Math.max(0, 1 - Math.abs(p.x - .3) / .34);
          vis = lum * band * .3;
        }
        if (vis < .01) continue;
        x.beginPath();
        x.arc(p.x*W, p.y*H, p.r*dpr*1.5, 0, 6.2832);
        x.fillStyle = "rgba(255,240,212," + (p.a*vis).toFixed(3) + ")";
        x.fill();
      }
    }
    requestAnimationFrame(loop);
  })();
})();

/* =====================================================================
   HORLOGE A L'ENVERS
   ===================================================================== */
var clockOn = false, cAng = 0, cSpeed = 1;
(function spin(){
  if (clockOn){
    cAng -= cSpeed;
    var m = $("mm"), h = $("hh");
    if (m) m.setAttribute("transform", "rotate(" + cAng + ")");
    if (h) h.setAttribute("transform", "rotate(" + (cAng/12) + ")");
  }
  requestAnimationFrame(spin);
})();

/* =====================================================================
   OUTILS DE MISE EN SCENE
   ===================================================================== */
function lum(v){ css("--lum", v); }
function beam(v){ css("--beam", v); }
function torchTo(x, y){ css("--tx", x); css("--ty", y); }
function cam(x, y, z, r, ms, ease){
  var c = $("cam");
  c.style.transition = "transform " + ms + "ms " + (ease || "cubic-bezier(.4,0,.25,1)");
  css("--camx", x); css("--camy", y); css("--camz", z); css("--camr", (r||0) + "deg");
}
function parallax(bgF, fgF){
  var x = parseFloat(getComputedStyle(body).getPropertyValue("--camx")) || 0;
  $("bg").style.transform = "translateX(" + (-x*bgF) + "px)";
  $("fg").style.transform = "translateX(" + (-x*fgF) + "px)";
}
function set(id){
  ["set-door","set-room"].forEach(function(s){ $(s).classList.toggle("on", s === id); });
}
function torchOn(el, on){ $(el).classList.toggle("torch", on); }
function blast(soft){
  var f = $("flash");
  f.className = ""; void f.offsetWidth;
  f.classList.add(soft ? "soft" : "hit");
}
function chroma(){
  var c = $("chroma");
  c.className = ""; void c.offsetWidth; c.classList.add("hit");
}
function fade(v, ms){
  var f = $("fade");
  f.style.transition = "opacity " + ms + "ms linear";
  f.style.opacity = v;
}
function say(txt, n){
  var s = $("sub");
  s.className = ""; void s.offsetWidth;
  s.textContent = txt;
  s.classList.add("on");
  if (n) voice(n);
}
function unsay(){ var s = $("sub"); s.classList.remove("on"); s.classList.add("off"); }
function card(txt){
  var c = $("cardT");
  c.className = ""; void c.offsetWidth;
  c.textContent = txt;
  c.classList.add("on");
}

/* =====================================================================
   LE FILM
   ===================================================================== */
function run(){
  drone();

  /* ---------- 0 → 4 s : le noir, on entend avant de voir ---------- */
  at(400,  function(){ breath(.11); });
  at(1200, function(){ card("Après la fermeture"); });
  at(1800, function(){ step(.14); });
  at(2500, function(){ step(.16); });
  at(3200, function(){ step(.19); breath(.09); });

  /* ---------- 4 → 11 s : la porte ---------- */
  at(4000, function(){
    set("set-door"); torchOn("doorLayer", true);
    lum(.95); beam(1); torchTo("62%", "52%");
    fade(0, 900);
    crack(.26, 5200); blast(true);
    cam("0px","0px",1.04,0,100);
  });
  at(4300, function(){ cam("0px","0px",1.14,0,6200); });
  at(5100, function(){ torchTo("70%", "36%"); step(.17); });   /* la plaque B12 */
  at(6300, function(){ torchTo("42%", "40%"); step(.15); });   /* l'affichette */
  at(7400, function(){ torchTo("60%", "56%"); });              /* la poignee */
  at(8200, function(){ creak(1.5); riser(2.6, .26); });
  at(8600, function(){ cam("0px","0px",1.55,0,2300,"cubic-bezier(.6,0,.8,1)"); });
  at(9900, function(){ whoosh(.9); });
  at(10350, function(){ fade(1, 420); });

  /* ---------- 11 → 20 s : la salle, a la torche ---------- */
  at(10900, function(){
    set("set-room"); torchOn("bg", true); torchOn("fg", true);
    lum(.9); beam(1); torchTo("50%", "74%");
    cam("0px","0px",1.06,0,100);
    fade(0, 700); step(.2);
  });
  at(11300, function(){ cam("-40px","0px",1.1,0,9000); });
  at(11900, function(){ torchTo("22%", "44%"); step(.16); });     /* la fenetre */
  at(13300, function(){ torchTo("56%", "40%"); chalk(); });       /* le tableau */
  at(14700, function(){ torchTo("76%", "24%"); tick(false,.07); });/* l'horloge */
  at(15500, function(){ clockOn = true; tick(false,.07); });
  at(16100, function(){ torchTo("50%", "58%"); riser(1.8, .22); });

  /* le neon prend le relais */
  at(17300, function(){
    torchOn("bg", false); torchOn("fg", false);
    beam(0); lum(0);
  });
  at(17500, function(){ lum(1);  flickerSnd(); blast(); at(90, function(){ lum(0); }); });
  at(17800, function(){ lum(.35); flickerSnd(); at(60, function(){ lum(0); }); });
  at(18200, function(){ lum(1);  flickerSnd(); crack(.22, 4200); at(120, function(){ lum(.1); }); });
  at(18600, function(){
    lum(.92); buzzOn(); droneTo(1.25, 2);
    cam("0px","0px",1.16,0,14000);
  });
  [19400, 20800, 23100, 26200, 29000].forEach(function(t){
    at(t, function(){ lum(.5); flickerSnd(); });
    at(t + 60, function(){ lum(.92); });
  });
  var tk = 19000;
  while (tk < 31000){ (function(x){ at(x, function(){ tick(false, .045); }); })(tk); tk += 1000; }

  /* ---------- 20 → 31 s : l'ombre parle ---------- */
  at(19600, function(){
    $("manWrap").classList.add("in");
    riser(1.4, .2); breath(.1);
  });
  at(21400, function(){ say("Tu entres ici à vingt ans.", 1); });
  at(24200, unsay);
  at(24700, function(){ say("Chaque salle t’en prendra vingt de plus.", 2); });
  at(27800, unsay);
  at(28300, function(){ say("À la dernière, tu auras quatre-vingts ans.", 3); });
  at(31200, unsay);

  /* ---------- 31 → 39 s : le temps s'emballe ---------- */
  at(31400, function(){ riser(2.6, .38); droneTo(1.6, 2.4); });
  var ages = [[32000,20],[32850,40],[33650,65],[34450,80]];
  ages.forEach(function(p, i){
    at(p[0], function(){
      var n = $("ageN");
      n.textContent = p[1];
      n.className = ""; void n.offsetWidth; n.classList.add("hit");
      css("--age", (i+1)/4);
      cSpeed = 1 + i*9;
      crack(.3, 2200); tick(true, .08); chroma();
      if (i === 1) $("manWrap").classList.add("old");
      if (i >= 2){ blast(); }
    });
  });
  at(34900, function(){ $("cam").classList.add("jitter"); });
  at(35200, function(){ riser(1.6, .42); });
  /* stroboscope final */
  [35300,35420,35540,35680,35820,35980,36160,36360].forEach(function(t, i){
    at(t, function(){ lum(i % 2 ? .15 : 1); flickerSnd(); });
  });
  at(36600, function(){
    $("cam").classList.remove("jitter");
    lum(0); beam(0); clockOn = false; buzzOff();
    boom(.8); whoosh(1.2); droneStop();
    css("--age", 0);
    blast();
  });

  /* ---------- 37 → 43 s : le titre ---------- */
  at(37400, function(){ $("end").classList.add("on"); });
  at(37900, function(){ $("eK").classList.add("fin"); });
  at(38250, function(){ $("eH").classList.add("fin"); boom(.3); });
  at(39200, function(){ $("eA").classList.add("fin"); });
}

/* parallaxe suivie en continu */
(function px(){ parallax(.35, 1.25); requestAnimationFrame(px); })();

/* =====================================================================
   LANCEMENT
   ===================================================================== */
var started = false;
function start(){
  if (started) return; started = true;
  audio(); loadVoices();
  $("go").classList.add("gone");
  at(900, run);
}
$("go").addEventListener("click", start);
document.addEventListener("keydown", function(e){
  if (e.code === "Space" || e.key === "Enter"){ e.preventDefault(); start(); return; }
  if (e.key && e.key.toLowerCase() === "f"){
    e.preventDefault();
    if (document.fullscreenElement) document.exitFullscreen();
