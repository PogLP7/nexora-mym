<!-- ===== REDIRECTION IMMEDIATE (ajoutee le 19/10/2026) =====
     Un seul clic depuis la bio : ce script part AVANT le rendu, le visiteur
     ne voit jamais cette page. Elle reste en dessous comme repli.
     Le clic est logge dans Orbit sans bloquer le depart (keepalive) ; si Orbit
     ne repond pas ou si le slug n'est pas encore en base, la redirection part
     quand meme -- le tracking n'est jamais un point de panne.
     Source : ?c=insta, ?c=story, ?c=bio... (defaut : bio).
     Pour repasser en vraie landing : supprimer ce bloc, le bouton remarche. -->
<script>
(function(){
  var DEST  = "https://t.me/marionprive";
  var SLUG  = "marion-tg-bio";
  var ORBIT = "https://bvcnbtbdfkoiefuedxem.supabase.co/functions/v1/go";
  try{
    var c = (new URLSearchParams(location.search).get("c") || "bio");
    var u = ORBIT + "?l=" + encodeURIComponent(SLUG) + "&c=" + encodeURIComponent(c) + "&x=1";
    if (window.fetch) { fetch(u, {mode:"no-cors", cache:"no-store", keepalive:true}); }
    else { (new Image()).src = u; }
  }catch(e){}
  location.replace(DEST);
})();
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --fm:ui-monospace,"SF Mono",Menlo,monospace;
  /* DA Vault — registre alycia : noir dense, accent émeraude unique */
  --g1:#10B981;--g2:#34D399;
  --bg:#05080A;--ink:#fff;--mut:rgba(255,255,255,.55)
}
html,body{min-height:100%}
body{
  font-family:var(--f);-webkit-font-smoothing:antialiased;color:var(--ink);
  background:
    radial-gradient(120% 55% at 50% -10%,rgba(16,185,129,.22),transparent 60%),
    var(--bg);
  display:flex;flex-direction:column;align-items:center;
  padding:24px 16px 36px;min-height:100vh;
  /* masqué tant que le filtre pays n'a pas tranché — révélé par le script */
  visibility:hidden
}
.card{width:100%;max-width:440px;animation:in .5s cubic-bezier(.16,1,.3,1) both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.photo{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:4/5;
  border:2px solid rgba(16,185,129,.45);background:#0a1512;
  box-shadow:0 18px 50px rgba(0,0,0,.6),0 0 60px rgba(16,185,129,.12)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:center 18%;display:block}
.photo::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to top,rgba(5,8,10,.82),transparent 44%);pointer-events:none}

.id{position:absolute;left:16px;right:16px;bottom:14px;z-index:2}
.name{display:flex;align-items:center;gap:7px}
.name b{font-size:26px;font-weight:850;letter-spacing:-.015em;text-shadow:0 2px 14px rgba(0,0,0,.7)}
.vf{width:18px;height:18px;flex:0 0 auto}
.chan{font-family:var(--fm);font-size:12.5px;color:rgba(255,255,255,.72);margin-top:2px}

.city{display:block;font-size:11px;font-weight:800;letter-spacing:.16em;
  text-transform:uppercase;color:var(--g1);margin:16px 0 6px;min-height:13px}
.hook{font-size:19px;font-weight:850;line-height:1.38;letter-spacing:-.01em}
.hook b{color:var(--g1)}
.sub{font-size:14px;color:var(--mut);line-height:1.45;margin-top:7px}

.cta{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  text-decoration:none;color:#04221A;font-weight:850;font-size:16.5px;
  text-transform:uppercase;letter-spacing:.02em;border-radius:16px;padding:18px;
  margin-top:20px;background:var(--g1);
  box-shadow:0 12px 32px rgba(16,185,129,.34);
  position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent;
  transition:transform .15s ease,box-shadow .15s ease}
.cta:active{transform:scale(.98);box-shadow:0 6px 18px rgba(16,185,129,.3)}
.cta .sh{position:absolute;top:0;left:-40%;width:40%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);
  animation:sh 3.4s cubic-bezier(.16,1,.3,1) infinite}
@keyframes sh{0%{left:-45%}55%,100%{left:130%}}

.foot{display:flex;align-items:center;justify-content:center;margin-top:18px;
  padding-top:13px;border-top:1px solid rgba(255,255,255,.09);
  font-size:10px;font-family:var(--fm);letter-spacing:.05em;color:rgba(255,255,255,.38)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<div class="card">

  <div class="photo">
    <img id="hero" alt="Marion" fetchpriority="high">
    <script>
      /* Pool de photos — une au hasard à chaque ouverture.
         Ajoute les fichiers ici, ils doivent être à côté de index.html. */

</div>

<script>
/* ============ CONFIG — tout se règle ici ============ */

/* La cible est le CANAL, jamais le profil DM (@marionpv).
   Un clic qui atterrit sur la fiche profil du compte DM ne produit
   aucune adhésion et aucun événement Wysper.
   Voir telegram-marion/orbit-liens-marion.sql. */
var DEST = "https://t.me/marionprive";
/* Variante tracking (log orbit_clicks puis 302 — les 3 slugs sont déjà actifs) :
   var DEST = "https://bvcnbtbdfkoiefuedxem.supabase.co/functions/v1/go?l=marion-tg-bio&x=1"; */

var CITY_HOOK = true;

/* --- Filtre géographique (même liste que la landing Amandine) --- */
var GEO_ON    = true;
var GEO_ALLOW = ["FR", "BE", "CH", "CA", "LU", "MC", "AD"];
var GEO_FAIL_OPEN = false;
var GEO_REDIRECT = "";
/* ==================================================== */

(function () {
  var c = new URLSearchParams(location.search).get("c");
  var dest = DEST;
  if (dest.indexOf("t.me/") === -1) {
    if (c) { dest += (dest.indexOf("?") > -1 ? "&" : "?") + "c=" + encodeURIComponent(c); }
    if (window.__photo) { dest += (dest.indexOf("?") > -1 ? "&" : "?") + "p=" + encodeURIComponent(window.__photo); }
  }
  document.getElementById("cta").href = dest;

  function withTimeout(url, ms) {
    return new Promise(function (ok, ko) {
      var done = false;
      var t = setTimeout(function () { if (!done) { done = true; ko(); } }, ms);
      fetch(url, { mode: "cors", cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (j) { if (!done) { done = true; clearTimeout(t); ok(j); } })
        .catch(function () { if (!done) { done = true; clearTimeout(t); ko(); } });
    });
  }

  function lookup() {
    return withTimeout("https://ipwho.is/", 4000)
      .then(function (g) {
        if (!g || g.success === false || !g.country_code) { throw 0; }
        return { cc: String(g.country_code).toUpperCase(), city: g.city || "" };
      })
      .catch(function () {
        return withTimeout("https://get.geojs.io/v1/ip/country.json", 4000)
          .then(function (g) {
            if (!g || !g.country) { throw 0; }
            return { cc: String(g.country).toUpperCase(), city: "" };
          });
      });
  }

  function block() {
    if (GEO_REDIRECT) { location.replace(GEO_REDIRECT); return; }
    document.body.innerHTML =
      '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px">' +
      '<div style="text-align:center;max-width:320px">' +
      '<div style="font-size:15px;font-weight:800;margin-bottom:8px">Page indisponible</div>' +
      '<div style="font-size:13.5px;line-height:1.5;color:rgba(255,255,255,.55)">' +
      "Ce contenu n'est pas accessible depuis ton pays." +
      "</div></div></div>";
    document.body.style.visibility = "visible";
  }

  function reveal(city) {
    if (city && CITY_HOOK) {
      document.getElementById("city").textContent = city + " 🤍";
    }
    document.body.style.visibility = "visible";
  }

  /* Sur Cloudflare Pages, _middleware.js a déjà filtré le pays côté serveur
     et injecté la ville : aucun appel API, aucun quota. */
  if (window.__GEO) {
    reveal(window.__GEO.city || "");
  } else if (!GEO_ON) {
    reveal("");
    lookup().then(function (g) { if (g.city) { reveal(g.city); } }).catch(function () {});
  } else {
    lookup()
      .then(function (g) {
        if (GEO_ALLOW.indexOf(g.cc) === -1) { block(); } else { reveal(g.city); }
      })
      .catch(function () {
        if (GEO_FAIL_OPEN) { reveal(""); } else { block(); }
      });
  }
})();
</script>
