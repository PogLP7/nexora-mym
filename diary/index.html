async function doExport() {
  const btn = $('#expBtn');
  const from = $('#expFrom').value;
  const to   = $('#expTo').value;
  const fmt  = $('#expFormat').value;
  const status = $('#expStatus').value;
  if (!from || !to) { toast('Renseigne les 2 dates', 'err'); return; }
  btn.disabled = true; const oldLabel = btn.textContent; btn.textContent = 'Préparation…';
  try {
    // 1) Fiches sur la période
    let entriesQ = sb.from('diary_daily_entries')
      .select('id, responsable_id, date, status, submitted_at, auto_submitted, reopened_count')
      .gte('date', from).lte('date', to).order('date');
    if (status !== 'all') entriesQ = entriesQ.eq('status', status);
    const { data: entries, error: ee } = await entriesQ;
    if (ee) throw ee;
    if (!entries.length) { toast('Aucune fiche sur cette période', 'ok'); return; }
    const entryIds = entries.map(e => e.id);
    const respIds  = Array.from(new Set(entries.map(e => e.responsable_id)));

    // 2) Nommages + checks + reels + alertes en parallèle
    const [{ data: resps }, { data: poleChecks }, { data: clipperChecks }, { data: allClippers }, { data: allPoles }, { data: allReels }, { data: allAlerts }] = await Promise.all([
      sb.from('diary_responsables').select('id, nom, email').in('id', respIds),
      sb.from('diary_pole_checks').select('*').in('daily_entry_id', entryIds),
      sb.from('diary_clipper_checks').select('*').in('daily_entry_id', entryIds),
      sb.from('diary_clippers').select('id, nom, pole_id'),
      sb.from('diary_poles').select('id, nom'),
      sb.from('diary_reels_perf').select('*'),
      sb.from('diary_alerts').select('*').in('daily_entry_id', entryIds),
    ]);
    const rN = Object.fromEntries((resps||[]).map(r => [r.id, r.nom]));
    const cN = Object.fromEntries((allClippers||[]).map(c => [c.id, c.nom]));
    const pN = Object.fromEntries((allPoles||[]).map(p => [p.id, p.nom]));
    const eDate = Object.fromEntries(entries.map(e => [e.id, { date: e.date, resp: rN[e.responsable_id] || '', status: e.status }]));
    const reelsByCheck = {};
    (allReels||[]).forEach(r => (reelsByCheck[r.clipper_check_id] ||= []).push(r));

    let filename, blob;
    if (fmt === 'json') {
      const payload = {
        exported_at: new Date().toISOString(),
        from, to, status,
        counts: { entries: entries.length, pole_checks: poleChecks.length, clipper_checks: clipperChecks.length, alerts: allAlerts.length },
        entries: entries.map(e => ({
          ...e,
          responsable: rN[e.responsable_id],
          pole_checks: (poleChecks||[]).filter(pc => pc.daily_entry_id === e.id)
            .map(pc => ({ ...pc, pole: pN[pc.pole_id] })),
          clipper_checks: (clipperChecks||[]).filter(cc => cc.daily_entry_id === e.id)
            .map(cc => ({
              ...cc,
              clipper: cN[cc.clipper_id],
              reels_perf: reelsByCheck[cc.id] || [],
            })),
          alerts: (allAlerts||[]).filter(a => a.daily_entry_id === e.id)
            .map(a => ({ ...a, clipper: cN[a.clipper_id] })),
        })),
      };
      blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      filename = `nexora-diary_${from}_${to}.json`;
    } else if (fmt === 'csv_pole') {
      const keys = ['posting','cadence','habillage','aucun_compte_banni','contenu_telegram_ok','clics_suivis','reels_performants_remontes','clipper_aide','retour_envoye'];
      const headers = ['date','responsable','pole','statut', ...keys, 'retour_ro','updated_at'];
      const rows = [headers];
      (poleChecks||[]).forEach(pc => {
        const e = eDate[pc.daily_entry_id]; if (!e) return;
        rows.push([e.date, e.resp, pN[pc.pole_id] || '', e.status,
          ...keys.map(k => pc[k] ? 'OUI' : 'NON'),
          (pc.retour_ro || '').replace(/\r?\n/g,' '), pc.updated_at || '']);
      });
      blob = new Blob(['﻿' + toCsv(rows)], { type: 'text/csv;charset=utf-8' });
      filename = `nexora-diary-pole_${from}_${to}.csv`;
    } else {
      const keys = ['habillage_complet','lien_ok','trois_reels_postes','story_postee','voyants_verts','contenu_telegram_dispo'];
      const headers = ['date','responsable','pole','clipper','statut', ...keys,
                       'compte_banni','contenu_manquant','en_difficulte','note_libre','nb_reels_perf','urls_reels_perf'];
      const rows = [headers];
      (clipperChecks||[]).forEach(cc => {
        const e = eDate[cc.daily_entry_id]; if (!e) return;
        const clip = (allClippers||[]).find(c => c.id === cc.clipper_id);
        const pole = clip ? pN[clip.pole_id] || '' : '';
        const reels = reelsByCheck[cc.id] || [];
        rows.push([e.date, e.resp, pole, cN[cc.clipper_id] || '', e.status,
          ...keys.map(k => cc[k] ? 'OUI' : 'NON'),
          cc.compte_banni ? 'OUI' : 'NON',
          cc.contenu_manquant ? 'OUI' : 'NON',
          cc.en_difficulte ? 'OUI' : 'NON',
          (cc.note_libre || '').replace(/\r?\n/g,' '),
          reels.length,
          reels.map(r => r.url).filter(Boolean).join(' | '),
        ]);
      });
      blob = new Blob(['﻿' + toCsv(rows)], { type: 'text/csv;charset=utf-8' });
      filename = `nexora-diary-clippers_${from}_${to}.csv`;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast(`Export ${filename} téléchargé ✓`, 'ok');
  } catch (e) {
    toast(`Erreur : ${e.message || e}`, 'err');
  } finally {
    btn.disabled = false; btn.textContent = oldLabel;
  }
}

function toCsv(rows) {
  return rows.map(r => r.map(cell => {
    const s = cell === null || cell === undefined ? '' : String(cell);
    return /[",\n;]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  }).join(',')).join('\n');
}

async function requestSyncFromBot() {
  const btn = $('#rosterSyncReq');
  if (btn) { btn.disabled = true; btn.textContent = 'Envoi…'; }
  try {
    const { data, error } = await sb.functions.invoke('diary-request-sync', { body: {} });
    if (error) {
      const detail = error?.context?.body ? JSON.stringify(error.context.body).slice(0, 200) : (error.message || String(error));
      toast(`Erreur : ${detail}`, 'err');
      return;
    }
    if (data?.ok) {
      toast(`Ping envoyé à Titouan sur Telegram ✓`, 'ok');
    } else {
      toast(data?.error ? `Erreur : ${data.error}` : 'Réponse inattendue', 'err');
    }
  } catch (e) {
    toast(`Erreur : ${e.message || e}`, 'err');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '📣 Demander une sync au bot'; }
  }
}

// ----- PWA : install du service worker (offline shell + installable) -----
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW register failed', err));
  });
}
</script>
