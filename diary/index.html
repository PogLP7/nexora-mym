<title>Diary · Nexora</title>
<style>
  :root {
    --bg: #0a0d14;
    --bg-2: #0e1218;
    --panel: #12171f;
    --panel-2: #171d27;
    --panel-3: #1c2330;
    --border: #232a35;
    --border-2: #2b3341;
    --text: #eaf0f7;
    --muted: #8a94a4;
    --dim: #5e6675;
    --accent: #7dd3fc;
    --accent-2: #38bdf8;
    --accent-3: #6366f1;
    --violet: #a78bfa;
    --pink: #f472b6;
    --green: #22c55e;
    --green-glow: rgba(34,197,94,.4);
    --amber: #f59e0b;
    --red: #ef4444;
    --gold: #fbbf24;
    --grad-brand: linear-gradient(135deg, #7dd3fc 0%, #a78bfa 60%, #f472b6 100%);
    --grad-panel: linear-gradient(160deg, #171d27 0%, #12171f 100%);
    --grad-success: linear-gradient(135deg, #22c55e 0%, #10b981 100%);
    --grad-header: radial-gradient(1200px 500px at 10% -10%, rgba(125,211,252,.10), transparent),
                   radial-gradient(900px 500px at 100% 0%, rgba(167,139,250,.08), transparent);
    --shadow-sm: 0 2px 8px rgba(0,0,0,.25);
    --shadow: 0 8px 30px rgba(0,0,0,.35);
    --shadow-glow: 0 0 30px rgba(125,211,252,.15);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "SF Pro Text", Segoe UI, Roboto, sans-serif;
    font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; background: var(--grad-header);
    pointer-events: none;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code { background: rgba(255,255,255,.06); padding: 1px 6px; border-radius: 5px; font-size: 90%; }

  /* HEADER */
  header.top { position: sticky; top: 0; z-index: 10; background: rgba(10,13,20,.85);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header.top .brand { font-weight: 700; letter-spacing: .3px; font-size: 15px;
    background: var(--grad-brand); -webkit-background-clip: text; background-clip: text; color: transparent; }
  header.top .brand span.dot { color: var(--accent); }
  header.top .spacer { flex: 1; }
  header.top .who { color: var(--muted); font-size: 13px; }
  header.top .btn-out { background: transparent; border: 1px solid var(--border); color: var(--muted);
    padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: all .15s; }
  header.top .btn-out:hover { color: var(--text); border-color: var(--accent); background: rgba(125,211,252,.06); }

  main { max-width: 960px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -.2px; font-weight: 700; }
  h2 { font-size: 15px; margin: 24px 0 10px; color: var(--muted); letter-spacing: 1px;
    text-transform: uppercase; font-weight: 600; }
  h3 { font-size: 15px; margin: 0; font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; }
  .dim { color: var(--dim); font-size: 12px; }

  /* CARDS */
  .card { background: var(--grad-panel); border: 1px solid var(--border); border-radius: 16px;
    padding: 20px; margin-bottom: 14px; box-shadow: var(--shadow); transition: border-color .2s; }
  .card:hover { border-color: var(--border-2); }
  .card.compact { padding: 14px 16px; }
  .card.hero { padding: 24px; background:
    radial-gradient(600px 300px at 10% 0%, rgba(125,211,252,.14), transparent 60%),
    radial-gradient(500px 300px at 100% 100%, rgba(167,139,250,.12), transparent 60%),
    var(--grad-panel);
    border: 1px solid rgba(125,211,252,.25); }
  .row { display: flex; gap: 10px; align-items: center; }
  .row.between { justify-content: space-between; }
  .row.wrap { flex-wrap: wrap; }

  /* TABS (nav + pole) */
  .tabs { display: flex; gap: 6px; margin: 6px 0 12px; overflow-x: auto; }
  .tab { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--muted); cursor: pointer; white-space: nowrap;
    font-size: 14px; transition: all .15s; }
  .tab:hover { color: var(--text); border-color: var(--border-2); }
  .tab.active { color: var(--text); border-color: var(--accent);
    background: linear-gradient(180deg, rgba(125,211,252,.12), rgba(125,211,252,.04));
    box-shadow: inset 0 0 0 1px rgba(125,211,252,.15); }

  /* HERO / STATS BAR (fiche du jour) */
  .day-hero { display: grid; grid-template-columns: auto 1fr auto; gap: 20px; align-items: center;
    padding: 20px 24px; }
  .day-hero .ring-wrap { position: relative; width: 88px; height: 88px; }
  .day-hero .ring-wrap .center { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; font-weight: 700; font-size: 20px; line-height: 1;
    color: var(--text); }
  .day-hero .ring-wrap .center small { font-size: 10px; color: var(--muted); font-weight: 500;
    margin-top: 2px; letter-spacing: .5px; text-transform: uppercase; }
  .day-hero .title-block h1 { font-size: 24px; }
  .day-hero .streak { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px;
    background: linear-gradient(135deg, rgba(251,191,36,.15), rgba(244,114,182,.15));
    border: 1px solid rgba(251,191,36,.35); border-radius: 999px;
    font-size: 12px; font-weight: 600; color: #fde68a; }
  .day-hero .streak.hot { animation: pulse-gold 2s ease-in-out infinite; }
  @keyframes pulse-gold {
    0%,100% { box-shadow: 0 0 0 0 rgba(251,191,36,0); }
    50% { box-shadow: 0 0 0 6px rgba(251,191,36,.08); }
  }

  /* Progress RING */
  .ring { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; }
  .ring .track { stroke: var(--border); stroke-width: 8; }
  .ring .fill { stroke: url(#gradRing); stroke-width: 8; stroke-linecap: round;
    transition: stroke-dashoffset .5s cubic-bezier(.4,0,.2,1); }
  .ring.small { width: 44px; height: 44px; }
  .ring.small .track, .ring.small .fill { stroke-width: 6; }
  .ring.full .fill { stroke: url(#gradRingSuccess); }

  /* CHECKS */
  .checklist { display: grid; gap: 8px; }
  .check {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px;
    background: var(--panel-2); cursor: pointer; user-select: none;
    transition: transform .15s cubic-bezier(.4,0,.2,1), border-color .15s, background .2s, box-shadow .2s;
  }
  .check:hover { border-color: var(--border-2); background: var(--panel-3); }
  .check:active { transform: scale(.985); }
  .check input { margin-top: 3px; width: 20px; height: 20px; accent-color: var(--green); cursor: pointer; }
  .check.checked {
    border-color: rgba(34,197,94,.5);
    background: linear-gradient(180deg, rgba(34,197,94,.08), rgba(34,197,94,.02));
    box-shadow: inset 0 0 0 1px rgba(34,197,94,.08);
  }
  .check.checked .label { color: var(--text); }
  .check.just-checked { animation: check-pop .35s cubic-bezier(.34,1.56,.64,1); }
  @keyframes check-pop {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.03); box-shadow: 0 0 0 8px rgba(34,197,94,.12); }
    100% { transform: scale(1); box-shadow: inset 0 0 0 1px rgba(34,197,94,.08); }
  }
  .check .label { flex: 1; }
  .check .hint { color: var(--muted); font-size: 12px; margin-top: 2px; }

  /* RED TOGGLES (chip + checkbox visible) */
  .toggles-red { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  .tgl-red {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 14px 7px 9px; border-radius: 999px; font-size: 13px; cursor: pointer;
    border: 1.5px solid rgba(239,68,68,.45);
    background: rgba(239,68,68,.07); color: #fca5a5;
    font-weight: 500;
    transition: border-color .15s, background .15s, color .15s, transform .1s, box-shadow .2s;
  }
  .tgl-red::before {
    content: ''; width: 16px; height: 16px; border-radius: 4px;
    border: 1.5px solid #fca5a5;
    background: transparent center/12px 12px no-repeat;
    flex-shrink: 0; transition: all .15s;
  }
  .tgl-red:hover { border-color: rgba(239,68,68,.75); background: rgba(239,68,68,.14); color: #fecaca; }
  .tgl-red:hover::before { border-color: #fecaca; }
  .tgl-red:active { transform: scale(.97); }
  .tgl-red:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(239,68,68,.32); }
  .tgl-red.on {
    border-color: var(--red);
    background: linear-gradient(135deg, rgba(239,68,68,.28), rgba(239,68,68,.14));
    color: #fff; font-weight: 600;
    box-shadow: 0 0 0 3px rgba(239,68,68,.08);
    animation: shake .4s ease;
  }
  .tgl-red.on::before {
    background-color: var(--red); border-color: var(--red);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='4 10 8 14 16 6'/></svg>");
  }
  .tgl-red:disabled { opacity: .5; cursor: not-allowed; }
  .tgl-red:disabled:hover { border-color: rgba(239,68,68,.45); background: rgba(239,68,68,.07); color: #fca5a5; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-2px); }
    50% { transform: translateX(2px); }
    80% { transform: translateX(-1px); }
  }

  /* FORMS */
  textarea, input[type=text], input[type=email], input[type=url], input[type=date] {
    width: 100%; background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; font: inherit; resize: vertical; transition: border-color .15s;
  }
  textarea:focus, input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(125,211,252,.12); }
  select {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; font: inherit;
  }

  /* BUTTONS */
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px;
    background: linear-gradient(135deg, var(--accent-2), var(--accent-3));
    color: white; border: none; border-radius: 12px;
    font-weight: 600; cursor: pointer; font-size: 14px;
    box-shadow: 0 4px 14px rgba(56,189,248,.25); transition: transform .15s, box-shadow .15s, filter .15s; }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(56,189,248,.35); filter: brightness(1.08); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn.ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    box-shadow: none; }
  .btn.ghost:hover { border-color: var(--accent); background: var(--panel-3); }
  .btn.success { background: var(--grad-success); box-shadow: 0 4px 14px rgba(34,197,94,.3); }
  .btn.success:hover { box-shadow: 0 6px 22px rgba(34,197,94,.4); }
  .btn.danger { background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow: 0 4px 14px rgba(239,68,68,.3); }
  .btn.xl { padding: 14px 28px; font-size: 15px; border-radius: 14px; }

  /* CLIPPER CARDS */
  .clipper-card { border: 1px solid var(--border); border-radius: 14px;
    background: var(--grad-panel); margin-bottom: 10px; overflow: hidden;
    transition: border-color .2s, box-shadow .2s, transform .15s; }
  .clipper-card:hover { border-color: var(--border-2); box-shadow: var(--shadow-sm); }
  .clipper-card.done { border-color: rgba(34,197,94,.35);
    background: linear-gradient(160deg, rgba(34,197,94,.06) 0%, var(--panel-2) 60%); }
  .clipper-card.danger { border-color: rgba(239,68,68,.4);
    background: linear-gradient(160deg, rgba(239,68,68,.05) 0%, var(--panel-2) 60%); }
  .clipper-card.celebrate { animation: celebrate .8s cubic-bezier(.34,1.56,.64,1); }
  @keyframes celebrate {
    0%   { transform: scale(1); }
    30%  { transform: scale(1.02); box-shadow: 0 0 0 8px rgba(34,197,94,.15); }
    100% { transform: scale(1); }
  }
  .clipper-head { padding: 12px 16px; display: flex; align-items: center; gap: 12px;
    cursor: pointer; }
  .clipper-head .chev { color: var(--muted); font-size: 14px; transition: transform .2s;
    display: inline-block; }
  .clipper-card.open .clipper-head .chev { transform: rotate(90deg); }
  .clipper-head .name { font-weight: 600; font-size: 15px; }
  .clipper-head .badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge { font-size: 11px; padding: 3px 10px; border-radius: 999px;
    background: rgba(239,68,68,.15); color: #fecaca; border: 1px solid rgba(239,68,68,.4); font-weight: 500; }
  .badge.done { background: rgba(34,197,94,.15); color: #bbf7d0; border-color: rgba(34,197,94,.4); }
  .clipper-body { display: none; padding: 14px 16px; border-top: 1px solid var(--border); }
  .clipper-card.open .clipper-body { display: block; animation: expand .25s ease-out; }
  @keyframes expand { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

  /* REELS */
  .reels-list { display: grid; gap: 8px; margin-top: 8px; }
  .reel-row { display: grid; grid-template-columns: 2fr 3fr auto; gap: 8px; align-items: center; }
  .reel-row .btn.icon { padding: 8px 10px; }

  /* SAVE INDICATOR */
  .save-pill { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .save-pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--dim); transition: background .2s, box-shadow .2s; }
  .save-pill.saved::before { background: var(--green); box-shadow: 0 0 8px rgba(34,197,94,.5); }
  .save-pill.saving::before { background: var(--amber); animation: pulse-dot .8s ease-in-out infinite; }
  .save-pill.error::before { background: var(--red); }
  @keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

  /* BANNERS */
  .banner { padding: 12px 16px; border-radius: 12px; margin-bottom: 14px;
    display: flex; gap: 10px; align-items: center; font-size: 14px; }
  .banner.draft { background: linear-gradient(135deg, rgba(245,158,11,.10), rgba(245,158,11,.03));
    border: 1px solid rgba(245,158,11,.35); color: #fde68a; }
  .banner.locked { background: linear-gradient(135deg, rgba(34,197,94,.10), rgba(34,197,94,.03));
    border: 1px solid rgba(34,197,94,.35); color: #bbf7d0; }
  .banner.error { background: linear-gradient(135deg, rgba(239,68,68,.12), rgba(239,68,68,.04));
    border: 1px solid rgba(239,68,68,.4); color: #fecaca; }

  /* TABLES */
  .table { width: 100%; border-collapse: collapse; }
  .table th, .table td { text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--border); font-size: 14px; }
  .table th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .8px; }
  .table tr:hover td { background: rgba(255,255,255,.02); }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; }
  .pill.draft { background: rgba(245,158,11,.15); color: #fde68a; }
  .pill.submitted { background: rgba(34,197,94,.15); color: #bbf7d0; }
  .empty { color: var(--muted); text-align: center; padding: 40px 20px; }

  /* KPI STAT TILES */
  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px; margin: 4px 0 14px; }
  .stat { padding: 14px 16px; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 12px; }
  .stat .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; }
  .stat .v { font-size: 22px; font-weight: 700; margin-top: 4px; }
  .stat.accent .v { background: var(--grad-brand); -webkit-background-clip: text;
    background-clip: text; color: transparent; }

  /* LOGIN */
  .login-wrap { max-width: 400px; margin: 80px auto; }
  .login-wrap .card { padding: 32px; }
  .login-wrap .brand-big { font-size: 28px; font-weight: 700; margin-bottom: 6px;
    background: var(--grad-brand); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .login-wrap .sub { margin-bottom: 24px; font-size: 14px; }
  .login-wrap input { margin-bottom: 14px; }

  /* TOAST */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 18px; box-shadow: var(--shadow); font-size: 14px; z-index: 100;
    animation: toast-in .25s cubic-bezier(.34,1.56,.64,1); }
  .toast.ok { border-color: rgba(34,197,94,.5); box-shadow: 0 4px 20px rgba(34,197,94,.15); }
  .toast.err { border-color: rgba(239,68,68,.5); box-shadow: 0 4px 20px rgba(239,68,68,.15); }
  @keyframes toast-in { from { opacity: 0; transform: translateX(-50%) translateY(10px); }
                        to   { opacity: 1; transform: translateX(-50%) translateY(0); } }

  /* HEATMAP (historique) */
  .hm-months { display: grid; gap: 3px; margin-left: 22px; margin-bottom: 4px; }
  .hm-month { font-size: 10px; color: var(--muted); text-align: left; grid-row: 1;
    text-transform: capitalize; }
  .hm-grid { display: grid; gap: 3px; margin-left: 22px; position: relative; }
  .hm-grid::before { content: "L\A M\A M\A J\A V\A S\A D";
    white-space: pre; position: absolute; left: -18px; top: 0;
    font-size: 9px; color: var(--muted); line-height: 17px; letter-spacing: 0; }
  .hm-col { display: grid; grid-template-rows: repeat(7, 14px); gap: 3px; }
  .hm-cell { width: 14px; height: 14px; border-radius: 3px; cursor: pointer;
    transition: transform .12s, box-shadow .12s; }
  .hm-cell:hover { transform: scale(1.35); z-index: 2; box-shadow: 0 0 0 1px var(--accent); }
  .hm-cell.hm-future { background: transparent !important; border: 1px dashed var(--border);
    box-sizing: border-box; cursor: default; }
  .hm-cell.hm-future:hover { transform: none; box-shadow: none; }

  /* CONFETTI CANVAS */
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 200; }

  /* CELEBRATION OVERLAY */
  .celebrate-overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    z-index: 150; pointer-events: none; animation: overlay-in .3s ease; }
  @keyframes overlay-in { from { opacity: 0; } to { opacity: 1; } }
  .celebrate-overlay .msg { padding: 24px 40px; border-radius: 20px;
    background: linear-gradient(135deg, rgba(34,197,94,.9), rgba(16,185,129,.9));
    color: white; font-size: 22px; font-weight: 700; letter-spacing: -.2px;
    box-shadow: 0 20px 60px rgba(34,197,94,.4); animation: bounce-in .5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes bounce-in { 0% { transform: scale(.3); opacity: 0; }
                         60% { transform: scale(1.05); opacity: 1; }
                         100% { transform: scale(1); } }

  @media (max-width: 640px) {
    main { padding: 12px; }
    header.top { padding: 10px 12px; }
    header.top .tabs { order: 5; width: 100%; }
    .day-hero { grid-template-columns: auto 1fr; padding: 16px; gap: 14px; }
    .day-hero .streak { grid-column: 1 / -1; justify-self: start; }
    .reel-row { grid-template-columns: 1fr; }
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    h1 { font-size: 22px; }
  }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gradRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#7dd3fc"/>
      <stop offset="60%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="gradRingSuccess" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
</head>

// ----- Progress ring SVG -----
function progressRing(done, total, opts = {}) {
  const size = opts.size || 88;
  const stroke = opts.stroke || 8;
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const pct = total ? Math.min(1, done / total) : 0;
  const off = c * (1 - pct);
  const fullClass = pct >= 1 ? 'full' : '';
  return `
    <svg class="ring ${fullClass}" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
      <circle class="track" cx="${size/2}" cy="${size/2}" r="${r}"/>
      <circle class="fill" cx="${size/2}" cy="${size/2}" r="${r}"
              stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
    </svg>`;
}

// ----- Confetti (petit moteur canvas, aucune dépendance) -----
function confetti(opts = {}) {
  const cv = $('#confetti');
  const ctx = cv.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  cv.width  = innerWidth  * dpr;
  cv.height = innerHeight * dpr;
  cv.style.width  = innerWidth + 'px';
  cv.style.height = innerHeight + 'px';
  ctx.scale(dpr, dpr);
  const colors = opts.colors || ['#7dd3fc','#a78bfa','#f472b6','#fbbf24','#22c55e','#38bdf8'];
  const count = opts.count || 140;
  const originX = opts.originX ?? innerWidth / 2;
  const originY = opts.originY ?? innerHeight / 3;
  const spread = opts.spread || Math.PI * 1.6;
  const startAngle = -Math.PI/2 - spread/2;
  const particles = Array.from({length: count}).map((_, i) => {
    const a = startAngle + Math.random() * spread;
    const speed = 6 + Math.random() * 8;
    return {
      x: originX, y: originY,
      vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
      w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
      c: colors[i % colors.length],
      rot: Math.random() * Math.PI, vr: (Math.random() - .5) * .3,
      alpha: 1,
    };
  });
  let raf;
  const start = performance.now();
  function tick(t) {
    const elapsed = t - start;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    particles.forEach(p => {
      p.vy += 0.22; p.vx *= 0.995;
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      p.alpha = Math.max(0, 1 - elapsed / 2600);
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.globalAlpha = p.alpha; ctx.fillStyle = p.c;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    });
    if (elapsed < 2600) raf = requestAnimationFrame(tick);
    else ctx.clearRect(0, 0, innerWidth, innerHeight);
  }
  raf = requestAnimationFrame(tick);
}

function celebrate(msg, opts = {}) {
  confetti(opts);

    const overlay = el(`<div class="celebrate-overlay"><div class="msg">${msg}</div></div>`);

}

// ----- Insights / coaching (14 derniers jours) -----
async function computeInsights() {
  const to = new Date(); const from = new Date(); from.setDate(from.getDate() - 13);
  const isoFrom = from.toISOString().slice(0,10);
  const isoTo = to.toISOString().slice(0,10);
  const { data: entries } = await sb.from('diary_daily_entries')
    .select('id, date').eq('responsable_id', state.me.id).gte('date', isoFrom).lte('date', isoTo);
  if (!entries || !entries.length) return [];
  const ids = entries.map(e => e.id);
  const dateOf = Object.fromEntries(entries.map(e => [e.id, e.date]));
  const [{ data: poleChecks }, { data: clipperChecks }, { data: clippers }] = await Promise.all([
    sb.from('diary_pole_checks').select('*').in('daily_entry_id', ids),
    sb.from('diary_clipper_checks').select('*').in('daily_entry_id', ids),
    sb.from('diary_clippers').select('id, nom, actif').eq('actif', true),
  ]);
  const clipName = Object.fromEntries((clippers||[]).map(c => [c.id, c.nom]));
  const poleKeys = [['posting','Posting'],['cadence','Cadence'],['habillage','Habillage'],['aucun_compte_banni','Aucun banni'],['contenu_telegram_ok','Contenu Telegram'],['clics_suivis','Clics/paliers'],['reels_performants_remontes','Reels perfs remontés'],['clipper_aide','Aider clipper'],['retour_envoye','Retour RO']];
  const clipperKeys = ['habillage_complet','lien_ok','trois_reels_postes','story_postee','voyants_verts','contenu_telegram_dispo'];
  const in7 = (iso) => { const d = new Date(iso); const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-7); return d >= cutoff; };
  const in14prev = (iso) => { const d = new Date(iso); const start = new Date(); start.setDate(start.getDate()-13); const mid = new Date(); mid.setDate(mid.getDate()-7); return d >= start && d < mid; };

  const insights = [];

  // 1) Contrôles pôle jamais cochés ces 7 derniers jours (parmi ceux avec au moins 1 pole_check dans les 7j)
  const pcInLast7 = (poleChecks||[]).filter(pc => in7(dateOf[pc.daily_entry_id]));
  if (pcInLast7.length >= 3) {
    for (const [k, label] of poleKeys) {
      const oui = pcInLast7.filter(pc => pc[k]).length;
      if (oui === 0) {
        insights.push({ kind: 'warn', text: `Tu n'as jamais coché <b>« ${label} »</b> ces 7 derniers jours — tu le fais vraiment ?` });
        break; // 1 seul max pour pas noyer
      }
    }
  }

  // 2) Clipper à moins de 40% sur 7 derniers jours
  const ccByClipper7 = {};
  (clipperChecks||[]).forEach(cc => {
    if (!in7(dateOf[cc.daily_entry_id])) return;
    const b = ccByClipper7[cc.clipper_id] ||= { done: 0, total: 0 };
    clipperKeys.forEach(k => { b.total++; if (cc[k]) b.done++; });
  });
  const strugglers = Object.entries(ccByClipper7)
    .filter(([, v]) => v.total >= 12) // au moins 2 jours
    .map(([id, v]) => ({ id, pct: Math.round(v.done*100/v.total), nom: clipName[id] || '?' }))
    .filter(x => x.pct < 40)
    .sort((a, b) => a.pct - b.pct);
  if (strugglers.length) {
    const s = strugglers[0];
    insights.push({ kind: 'warn', text: `<b>${s.nom}</b> à seulement <b>${s.pct}%</b> cette semaine — appel/message à passer ?` });
  }

  // 3) Comparaison semaine actuelle vs précédente
  const sumRange = (fn) => {
    let d = 0, t = 0;
    (poleChecks||[]).forEach(pc => { if (fn(dateOf[pc.daily_entry_id])) poleKeys.forEach(([k]) => { t++; if (pc[k]) d++; }); });
    (clipperChecks||[]).forEach(cc => { if (fn(dateOf[cc.daily_entry_id])) clipperKeys.forEach(k => { t++; if (cc[k]) d++; }); });
    return t ? d*100/t : null;
  };
  const p7 = sumRange(in7);
  const p14 = sumRange(in14prev);
  if (p7 !== null && p14 !== null && Math.abs(p7 - p14) >= 3) {
    const delta = Math.round(p7 - p14);
    if (delta > 0) insights.push({ kind: 'good', text: `🚀 Semaine à <b>${Math.round(p7)}%</b> — <b>+${delta}pts</b> vs la précédente. Bien joué !` });
    else insights.push({ kind: 'warn', text: `📉 Semaine à <b>${Math.round(p7)}%</b> — <b>${delta}pts</b> vs la précédente. À redresser.` });
  }

  return insights.slice(0, 3);
}

// ----- Streak (jours consécutifs avec fiche clôturée) -----
async function computeStreak() {
  const { data } = await sb.from('diary_daily_entries')
    .select('date, status')
    .eq('responsable_id', state.me.id)
    .eq('status', 'submitted')
    .order('date', { ascending: false })
    .limit(60);
  if (!data || !data.length) return 0;
  const set = new Set(data.map(r => r.date));
  const d = new Date();
  let streak = 0;
  // On tolère : si aujourd'hui pas encore clôturée, on démarre à hier.
  const today = todayIso();
  if (!set.has(today)) d.setDate(d.getDate() - 1);
  for (;;) {
    const iso = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if (!set.has(iso)) break;
    streak++;
    d.setDate(d.getDate() - 1);
  }
  return streak;
}

// ----- Router -----
const routes = {
  '#/login':   renderLogin,
  '#/diary':   renderDiary,
  '#/history': renderHistory,
  '#/ops':     renderOps,
};
// Route dynamique : `#/diary/YYYY-MM-DD` → renderDiary avec date passée en context
function resolveRoute(hash) {
  if (!hash) return { view: renderDiary, arg: null };
  const m = hash.match(/^#\/diary\/(\d{4}-\d{2}-\d{2})$/);
  if (m) return { view: renderDiary, arg: m[1] };
  return { view: routes[hash] || renderDiary, arg: null };
}

async function route() {
  const hash = location.hash || '#/diary';
  const { view, arg } = resolveRoute(hash);

  // Auth gate
  if (hash !== '#/login') {
    const { data } = await sb.auth.getSession();
    state.session = data.session;
    if (!state.session) { location.hash = '#/login'; return; }
    if (!state.me) await loadMe();
  }

  updateChrome();
  const main = $('#app');
  main.innerHTML = '';
  try { await view(main, arg); }
  catch (err) { console.error(err); main.innerHTML = `<div class="banner error">Erreur : ${err.message || err}</div>`; }
}

window.addEventListener('hashchange', route);
window.addEventListener('DOMContentLoaded', route);

sb.auth.onAuthStateChange((evt, session) => {
  state.session = session;
  // Only redirect on explicit sign-in from the login page (not on INITIAL_SESSION/TOKEN_REFRESHED).
  if (evt === 'SIGNED_IN' && location.hash === '#/login') location.hash = '#/diary';
});

// ----- Chrome (header) -----
function updateChrome() {
  const bar = $('#topbar');
  if (!state.session) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  $('#who').textContent = state.me ? `${state.me.nom} · ${state.me.email}` : '';
  $$('.tab').forEach(t => t.classList.toggle('active', t.dataset.nav === location.hash));
  $$('.ops-only').forEach(el => el.style.display = state.me?.role === 'ops' || state.me?.role === 'admin' ? '' : 'none');
}

$$('[data-nav]', document).forEach(b => b.addEventListener('click', () => location.hash = b.dataset.nav));
$('#logoutBtn').addEventListener('click', async () => {
  await sb.auth.signOut();
  state.me = null; state.session = null;
  location.hash = '#/login';
});

// ----- Data loading -----
async function loadMe() {
  const email = state.session.user.email;
  const { data, error } = await sb.from('diary_responsables')
    .select('id, email, nom, role').eq('auth_user_id', state.session.user.id).maybeSingle();
  if (error) throw error;
  if (!data) {
    // Fallback : chercher par email et lier auth_user_id
    const { data: byEmail } = await sb.from('diary_responsables')
      .select('id, email, nom, role').eq('email', email).maybeSingle();
    if (!byEmail) throw new Error(`Aucun responsable configuré pour ${email}. Contacte l'admin.`);
    await sb.from('diary_responsables').update({ auth_user_id: state.session.user.id }).eq('id', byEmail.id);
    state.me = byEmail;
  } else {
    state.me = data;
  }
}

async function loadPolesAndClippers() {
  const { data: poles, error: pe } = await sb.from('diary_poles')
    .select('id, nom').eq('responsable_id', state.me.id).is('archived_at', null).order('nom');
  if (pe) throw pe;
  state.poles = poles;

  const poleIds = poles.map(p => p.id);
  state.clippersByPole = Object.fromEntries(poleIds.map(id => [id, []]));

  if (poleIds.length) {
    const { data: clippers, error: ce } = await sb.from('diary_clippers')
      .select('id, nom, pole_id, actif').in('pole_id', poleIds).eq('actif', true).is('archived_at', null).order('nom');
    if (ce) throw ce;
    clippers.forEach(c => state.clippersByPole[c.pole_id].push(c));
  }

  if (!state.currentPoleId && poles[0]) state.currentPoleId = poles[0].id;
}

async function loadOrCreateEntry(date = todayIso(), createIfMissing = true) {
  let { data: entry, error } = await sb.from('diary_daily_entries')
    .select('*').eq('responsable_id', state.me.id).eq('date', date).maybeSingle();
  if (error) throw error;
  if (!entry && createIfMissing) {
    const { data: created, error: ce } = await sb.from('diary_daily_entries')
      .insert({ responsable_id: state.me.id, date }).select().single();
    if (ce) throw ce;
    entry = created;
  }
  state.entry = entry;
  return entry;
}

async function loadOrCreatePoleCheck(poleId) {
  let { data, error } = await sb.from('diary_pole_checks')
    .select('*').eq('daily_entry_id', state.entry.id).eq('pole_id', poleId).maybeSingle();
  if (error) throw error;
  if (!data) {
    const { data: created, error: ce } = await sb.from('diary_pole_checks')
      .insert({ daily_entry_id: state.entry.id, pole_id: poleId }).select().single();
    if (ce) throw ce;
    data = created;
  }
  state.poleCheck = data;
  return data;
}

async function loadOrCreateClipperChecks(poleId) {
  const clippers = state.clippersByPole[poleId] || [];
  if (!clippers.length) { state.clipperChecks = {}; state.reelsByCheck = {}; return; }
  const clipperIds = clippers.map(c => c.id);
  const { data: existing, error } = await sb.from('diary_clipper_checks')
    .select('*').eq('daily_entry_id', state.entry.id).in('clipper_id', clipperIds);
  if (error) throw error;
  const byClip = Object.fromEntries(existing.map(r => [r.clipper_id, r]));
  const missing = clippers.filter(c => !byClip[c.id]);
  if (missing.length) {
    const rows = missing.map(c => ({ daily_entry_id: state.entry.id, clipper_id: c.id }));
    const { data: created, error: ce } = await sb.from('diary_clipper_checks').insert(rows).select();
    if (ce) throw ce;
    created.forEach(r => byClip[r.clipper_id] = r);
  }
  state.clipperChecks = byClip;

  const checkIds = Object.values(byClip).map(r => r.id);
  const { data: reels } = await sb.from('diary_reels_perf').select('*').in('clipper_check_id', checkIds).order('created_at');
  state.reelsByCheck = {};
  checkIds.forEach(id => state.reelsByCheck[id] = []);
  (reels || []).forEach(r => state.reelsByCheck[r.clipper_check_id].push(r));
}

          <input type="email" name="email" placeholder="ton.email@nexora.fr" required autocomplete="email">
          <button class="btn" type="submit" style="width:100%; justify-content:center;">Envoyer le lien</button>
        </form>
        <div id="loginMsg" class="sub" style="margin-top:12px;"></div>
      </div>
    </div>`;
  $('#loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = new FormData(e.target).get('email').trim().toLowerCase();
    $('#loginMsg').textContent = 'Envoi en cours…';

    $('#loginMsg').textContent = error ? `Erreur : ${error.message}` : `Lien envoyé à ${email}. Vérifie ta boîte.`;
  });
}

async function renderDiary(main, date = null) {
  await loadPolesAndClippers();
  const targetDate = date || todayIso();
  const isPast = date && date < todayIso();
  await loadOrCreateEntry(targetDate, !isPast);

  if (!state.poles.length) {
    main.innerHTML = `<div class="card empty">Aucun pôle n'est rattaché à ton compte. Contacte l'admin.</div>`;
    return;
  }
  if (isPast && !state.entry) {
    main.innerHTML = `
      <div class="card empty">
        Pas de fiche pour le ${fmtDate(targetDate)}.
        <div style="margin-top:12px;"><a href="#/history">← Retour à l'historique</a></div>
      </div>`;
    return;
  }

  const locked = state.entry.status === 'submitted';
  const [streak, insights] = await Promise.all([computeStreak(), isPast ? Promise.resolve([]) : computeInsights()]);
  const totalClippers = state.poles.reduce((n, p) => n + (state.clippersByPole[p.id]?.length || 0), 0);
  // Compte des alertes rouges ouvertes pour ce responsable (aujourd'hui + tous jours).
  const { count: openAlerts } = await sb.from('diary_alerts')
    .select('id', { count: 'exact', head: true })
    .eq('responsable_id', state.me.id).is('resolved_at', null);
  // Fiche d'hier existe-t-elle et est-elle clôturée ? (pour bouton "Reprendre d'hier")
  const yester = (() => { const d = new Date(); d.setDate(d.getDate()-1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; })();
  const canImportYesterday = !locked && !isPast && state.entry?.status === 'draft';

  main.innerHTML = `
    <div class="card hero day-hero">
      <div class="ring-wrap" id="heroRing">
        ${progressRing(0, 1, { size: 88 })}
        <div class="center"><span id="heroPct">0%</span><small>Aujourd'hui</small></div>
      </div>
      <div class="title-block">
        <h1>${fmtDate(state.entry.date)}${isPast ? ' <span class="dim" style="font-size:14px;">(consultation)</span>' : ''}</h1>
        <div class="sub">${state.me.nom} · ${state.poles.length} pôle${state.poles.length>1?'s':''} · ${totalClippers} clipper${totalClippers>1?'s':''}</div>
        <div class="row wrap" style="margin-top:10px; gap:8px;">
          ${streak > 0 && !isPast ? `<span class="streak ${streak>=3?'hot':''}">🔥 ${streak} jour${streak>1?'s':''} d'affilée</span>` : ''}
          ${openAlerts > 0 && !isPast ? `<span class="streak" style="background:linear-gradient(135deg, rgba(239,68,68,.2), rgba(239,68,68,.08)); border-color:rgba(239,68,68,.4); color:#fecaca;">⚠ ${openAlerts} alerte${openAlerts>1?'s':''} rouge${openAlerts>1?'s':''}</span>` : ''}
          <span id="savePill" class="save-pill"></span>
        </div>
      </div>
      <div style="align-self:flex-start; display:flex; flex-direction:column; gap:6px;">
        ${isPast ? `<a href="#/diary" class="btn ghost" style="padding:6px 12px;">← Aujourd'hui</a>` : ''}
        ${locked
          ? `<button class="btn ghost" id="reopenBtn">↺ Rouvrir</button>`
          : ``}
        ${canImportYesterday ? `<button class="btn ghost" id="importYesterdayBtn" style="padding:6px 12px;">↩ Reprendre d'hier</button>` : ''}
      </div>
    </div>

    ${locked
      ? `<div class="banner locked">✓ Clôturée${state.entry.auto_submitted ? ' automatiquement à 06h' : ''} le ${new Date(state.entry.submitted_at).toLocaleString('fr-FR')}. Lecture seule.</div>`
      : isPast
        ? `<div class="banner draft">Fiche du passé — lecture seule. <a href="#/diary" style="color:inherit; text-decoration:underline;">Retour à aujourd'hui</a>.</div>`
        : state.entry.reopened_count > 0
          ? `<div class="banner draft">Brouillon (rouverte ${state.entry.reopened_count}×). Termine puis clôture en bas.</div>`
          : ``}

    ${insights.length ? `
      <div class="card" style="padding:14px 18px;">
        <div class="sub" style="margin-bottom:8px; font-weight:600; letter-spacing:.3px;">💡 Insights de la semaine</div>
        <div style="display:grid; gap:6px;">
          ${insights.map(i => `
            <div class="row" style="gap:10px; padding:8px 12px; border-radius:10px;
                                    background:${i.kind==='good'?'rgba(34,197,94,.08)':'rgba(245,158,11,.08)'};
                                    border:1px solid ${i.kind==='good'?'rgba(34,197,94,.3)':'rgba(245,158,11,.3)'};">
              <div style="flex:1; font-size:14px; color:${i.kind==='good'?'#bbf7d0':'#fde68a'};">${i.text}</div>
            </div>`).join('')}
        </div>
      </div>` : ''}

    <div class="tabs" id="poleTabs">
      ${state.poles.map(p => `<button class="tab ${p.id === state.currentPoleId ? 'active' : ''}" data-pole="${p.id}">${p.nom}</button>`).join('')}
    </div>

    <div id="poleContent"></div>

    ${locked || isPast ? '' : `
      <div class="card" style="text-align:center; background: transparent; border-style: dashed;">
        <button class="btn xl success" id="submitBtn">✓ Clôturer la journée</button>
        <div class="sub" style="margin-top:8px;">Sauvegardée automatiquement. Clôture pour figer et notifier le RO.</div>
      </div>`}
  `;

  $$('#poleTabs .tab').forEach(b => b.addEventListener('click', () => {
    state.currentPoleId = b.dataset.pole;
    renderDiary(main, date);
  }));

  if (!locked && !isPast) {
    $('#submitBtn').addEventListener('click', submitEntry);
  }
  if (locked) $('#reopenBtn')?.addEventListener('click', reopenEntry);
  if (canImportYesterday) $('#importYesterdayBtn')?.addEventListener('click', () => importFromYesterday(main));

  await renderPoleContent(locked || isPast);
  updateHeroStats();
}

// Copie les checks du pôle + clippers d'hier dans la fiche du jour (brouillon).
async function importFromYesterday(main) {
  const d = new Date(); d.setDate(d.getDate() - 1);
  const yester = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  if (!confirm(`Reprendre les cases cochées du ${fmtDate(yester)} pour toutes les fiches d'aujourd'hui ?\n\nÇa écrase ce que tu as déjà coché aujourd'hui.`)) return;
  toast('Import en cours…', 'ok');
  try {
    // 1) Récupère la fiche d'hier + ses checks
    const { data: yEntry } = await sb.from('diary_daily_entries')
      .select('id').eq('responsable_id', state.me.id).eq('date', yester).maybeSingle();
    if (!yEntry) { toast('Pas de fiche hier', 'err'); return; }
    const [{ data: yPoleChecks }, { data: yClipperChecks }] = await Promise.all([
      sb.from('diary_pole_checks').select('*').eq('daily_entry_id', yEntry.id),
      sb.from('diary_clipper_checks').select('*').eq('daily_entry_id', yEntry.id),
    ]);
    const poleKeys = ['posting','cadence','habillage','aucun_compte_banni','contenu_telegram_ok','clics_suivis','reels_performants_remontes','clipper_aide','retour_envoye'];
    const clipperKeys = ['habillage_complet','lien_ok','trois_reels_postes','story_postee','voyants_verts','contenu_telegram_dispo'];
    // 2) Assure que les pole_checks + clipper_checks existent pour tous les pôles/clippers d'aujourd'hui
    for (const p of state.poles) {
      state.currentPoleId = p.id;
      await loadOrCreatePoleCheck(p.id);
      await loadOrCreateClipperChecks(p.id);
    }
    // 3) Applique le mapping pole → pole (par pole_id)
    const yPoleByPoleId = Object.fromEntries((yPoleChecks||[]).map(pc => [pc.pole_id, pc]));
    for (const p of state.poles) {
      const src = yPoleByPoleId[p.id];
      if (!src) continue;
      const patch = {};
      poleKeys.forEach(k => patch[k] = src[k]);
      await sb.from('diary_pole_checks').update(patch)
        .eq('daily_entry_id', state.entry.id).eq('pole_id', p.id);
    }
    // 4) Applique le mapping clipper → clipper (par clipper_id)
    const yClipByClipId = Object.fromEntries((yClipperChecks||[]).map(cc => [cc.clipper_id, cc]));
    for (const [clipId, cc] of Object.entries(state.clipperChecks || {})) {
      const src = yClipByClipId[clipId];
      if (!src) continue;
      const patch = {};
      clipperKeys.forEach(k => patch[k] = src[k]);
      await sb.from('diary_clipper_checks').update(patch).eq('id', cc.id);
    }
    toast('Repris d\'hier ✓', 'ok');
    await renderDiary(main);
  } catch (e) {
    toast(`Erreur : ${e.message || e}`, 'err');
  }
}

// Recalcule la ring globale + %  affichée dans le hero.
function updateHeroStats() {
  const pc = state.poleCheck;
  if (!pc) return;
  const poleKeys = ['posting','cadence','habillage','aucun_compte_banni','contenu_telegram_ok',
                    'clics_suivis','reels_performants_remontes','clipper_aide','retour_envoye'];
  const poleDone = poleKeys.filter(k => pc[k]).length;
  const clipperKeys = ['habillage_complet','lien_ok','trois_reels_postes','story_postee','voyants_verts','contenu_telegram_dispo'];
  let cDone = 0, cTotal = 0;
  Object.values(state.clipperChecks || {}).forEach(cc => {
    cTotal += clipperKeys.length;
    cDone  += clipperKeys.filter(k => cc[k]).length;
  });
  const total = poleKeys.length + cTotal;
  const done  = poleDone + cDone;
  const pct = total ? Math.round(done * 100 / total) : 0;
  const heroRing = $('#heroRing');
  if (heroRing) {
    heroRing.innerHTML = `${progressRing(done, total, { size: 88 })}
      <div class="center"><span id="heroPct">${pct}%</span><small>Aujourd'hui</small></div>`;
  }
}

function renderClipperCardHtml(clipper, cc, locked) {
  const items = [
    ['habillage_complet', 'Habillage complet (bio, photo, à la une FAQ · ME · LIFESTYLE)'],
    ['lien_ok', 'Lien présent et fonctionnel sur le compte privé'],
    ['trois_reels_postes', '3 reels postés (+ carrousel si c\'est le jour)'],
    ['story_postee', 'Story postée'],
    ['voyants_verts', 'Voyants au vert (aucun orange/rouge)'],
    ['contenu_telegram_dispo', 'Contenu disponible dans les sous-canaux Telegram'],
  ];
  const done  = items.filter(([k]) => cc[k]).length;
  const total = items.length;
  const isDone = done === total && !cc.compte_banni && !cc.contenu_manquant && !cc.en_difficulte;
  const isDanger = cc.compte_banni || cc.contenu_manquant || cc.en_difficulte;
  const badges = [];
  if (isDone) badges.push('<span class="badge done">✓ Complet</span>');
  if (cc.compte_banni) badges.push('<span class="badge">⚠ Banni</span>');
  if (cc.contenu_manquant) badges.push('<span class="badge">⚠ Contenu manquant</span>');
  if (cc.en_difficulte) badges.push('<span class="badge">⚠ Difficulté</span>');

  const reels = state.reelsByCheck[cc.id] || [];

  return `
    <div class="clipper-card ${isDone ? 'done' : ''} ${isDanger ? 'danger' : ''}" data-clipper="${clipper.id}">
      <div class="clipper-head">
        <div class="ring-wrap" style="width:44px; height:44px;">${progressRing(done, total, { size: 44, stroke: 6 })}</div>
        <div style="flex:1;">
          <div class="name">${clipper.nom}</div>
          <div class="dim">${done}/${total} contrôles</div>
        </div>
        <div class="badges">${badges.join('')}</div>
        <div class="chev">▶</div>
      </div>
      <div class="clipper-body">
        <div class="checklist">
          ${items.map(([k, label]) => `
            <label class="check ${cc[k] ? 'checked' : ''}">
              <input type="checkbox" data-clip-check="${k}" ${cc[k] ? 'checked' : ''} ${locked ? 'disabled' : ''}>
              <div class="label">${label}</div>
            </label>
          `).join('')}
        </div>

        <div class="toggles-red">
          <button class="tgl-red ${cc.compte_banni ? 'on' : ''}" data-clip-red="compte_banni" ${locked ? 'disabled' : ''}>⚠ Compte banni</button>
          <button class="tgl-red ${cc.contenu_manquant ? 'on' : ''}" data-clip-red="contenu_manquant" ${locked ? 'disabled' : ''}>⚠ Contenu manquant</button>
          <button class="tgl-red ${cc.en_difficulte ? 'on' : ''}" data-clip-red="en_difficulte" ${locked ? 'disabled' : ''}>⚠ En difficulté</button>
        </div>

        <div style="margin-top:10px;">
          <div class="sub" style="margin-bottom:4px;">Note du jour</div>
          <textarea data-clip-note rows="2" ${locked ? 'disabled' : ''} placeholder="Contexte, blocages, objectifs…">${cc.note_libre || ''}</textarea>
        </div>

        <div style="margin-top:14px;">
          <div class="row between" style="margin-bottom:6px;">
            <div class="sub">Reels performants à remonter</div>
            ${locked ? '' : `<button class="btn ghost" data-add-reel style="padding:6px 10px; font-size:13px;">+ Ajouter</button>`}
          </div>
          <div class="reels-list" data-reels="${cc.id}">
            ${reels.map(r => renderReelRow(r, locked)).join('')}
          </div>
        </div>
      </div>
    </div>
  `;
}

function renderReelRow(r, locked) {
  return `
    <div class="reel-row" data-reel="${r.id}">
      <input type="url" data-reel-url placeholder="https://…" value="${(r.url||'').replace(/"/g,'&quot;')}" ${locked ? 'disabled' : ''}>
      <input type="text" data-reel-note placeholder="Pourquoi ça performe" value="${(r.note||'').replace(/"/g,'&quot;')}" ${locked ? 'disabled' : ''}>
      ${locked ? '' : `<button class="btn ghost icon" data-reel-del>✕</button>`}
    </div>
  `;
}

// ----- Save handlers -----
async function onPoleCheckChange(input) {
  const key = input.dataset.poleCheck;
  const val = input.checked;
  const chk = input.closest('.check');
  chk.classList.toggle('checked', val);
  if (val) { chk.classList.add('just-checked'); setTimeout(() => chk.classList.remove('just-checked'), 400); }
  await savePoleField(key, val);
  updateHeroStats();
}

async function savePoleField(key, val) {
  setSaveState('saving');
  const { error } = await sb.from('diary_pole_checks').update({ [key]: val }).eq('id', state.poleCheck.id);
  if (error) { setSaveState('error'); toast(error.message, 'err'); return; }
  state.poleCheck[key] = val;
  setSaveState('saved');
}

async function onClipperCheckChange(clipperId, input) {
  const cc = state.clipperChecks[clipperId];
  const key = input.dataset.clipCheck;
  const val = input.checked;
  const chk = input.closest('.check');
  chk.classList.toggle('checked', val);
  if (val) { chk.classList.add('just-checked'); setTimeout(() => chk.classList.remove('just-checked'), 400); }
  setSaveState('saving');
  const { error } = await sb.from('diary_clipper_checks').update({ [key]: val }).eq('id', cc.id);
  if (error) { setSaveState('error'); toast(error.message, 'err'); return; }
  cc[key] = val;
  const clipperKeys = ['habillage_complet','lien_ok','trois_reels_postes','story_postee','voyants_verts','contenu_telegram_dispo'];
  const wasCompleted = clipperKeys.every(k => cc[k]);
  updateClipperProgress(clipperId);
  updateHeroStats();
  setSaveState('saved');
  // Célébration quand un clipper vient d'atteindre 6/6
  if (val && wasCompleted && !cc.compte_banni && !cc.contenu_manquant && !cc.en_difficulte) {
    const card = document.querySelector(`.clipper-card[data-clipper="${clipperId}"]`);
    if (card) {
      card.classList.add('done', 'celebrate');
      setTimeout(() => card.classList.remove('celebrate'), 900);
      const rect = card.getBoundingClientRect();
      confetti({ count: 60, originX: rect.left + rect.width/2, originY: rect.top + 30, spread: Math.PI });
    }
  }
}

async function saveClipperField(clipperId, key, val) {
  const cc = state.clipperChecks[clipperId];
  setSaveState('saving');
  const { error } = await sb.from('diary_clipper_checks').update({ [key]: val }).eq('id', cc.id);
  if (error) { setSaveState('error'); toast(error.message, 'err'); return; }
  cc[key] = val;
  setSaveState('saved');
}

async function toggleClipperRed(clipperId, key) {
  const cc = state.clipperChecks[clipperId];
  const val = !cc[key];
  setSaveState('saving');
  const { error } = await sb.from('diary_clipper_checks').update({ [key]: val }).eq('id', cc.id);
  if (error) { setSaveState('error'); toast(error.message, 'err'); return; }
  cc[key] = val;
  setSaveState('saved');
  // Ré-render la card pour màj badges/tgl visuel
  const card = document.querySelector(`.clipper-card[data-clipper="${clipperId}"]`);
  const wasOpen = card.classList.contains('open');
  const clipper = (state.clippersByPole[state.currentPoleId] || []).find(c => c.id === clipperId);
  const html = renderClipperCardHtml(clipper, cc, state.entry.status === 'submitted');
  const fresh = el(html);
  if (wasOpen) fresh.classList.add('open');
  card.replaceWith(fresh);
  bindClipperCard(fresh);
}

function bindClipperCard(card) {
  const clipperId = card.dataset.clipper;
  $('.clipper-head', card).addEventListener('click', () => card.classList.toggle('open'));
  $$('[data-clip-check]', card).forEach(inp => {
    inp.addEventListener('click', (e) => e.stopPropagation());
    inp.addEventListener('change', () => onClipperCheckChange(clipperId, inp));
  });
  $$('[data-clip-red]', card).forEach(btn => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); toggleClipperRed(clipperId, btn.dataset.clipRed); });
  });
  $('[data-clip-note]', card)?.addEventListener('input', (e) => {
    e.stopPropagation();
    debounce(`note-${clipperId}`, 500, () => saveClipperField(clipperId, 'note_libre', e.target.value));
  });
  $('[data-add-reel]', card)?.addEventListener('click', (e) => { e.stopPropagation(); addReel(clipperId); });
  bindReelRows(card);
}

function bindReelRows(card) {
  const clipperId = card.dataset.clipper;
  const cc = state.clipperChecks[clipperId];
  $$('.reel-row', card).forEach(row => {
    const id = row.dataset.reel;
    $('[data-reel-url]', row)?.addEventListener('input', (e) => {
      debounce(`reel-url-${id}`, 500, () => sb.from('diary_reels_perf').update({ url: e.target.value }).eq('id', id));
    });
    $('[data-reel-note]', row)?.addEventListener('input', (e) => {
      debounce(`reel-note-${id}`, 500, () => sb.from('diary_reels_perf').update({ note: e.target.value }).eq('id', id));
    });
    $('[data-reel-del]', row)?.addEventListener('click', async () => {
      await sb.from('diary_reels_perf').delete().eq('id', id);
      state.reelsByCheck[cc.id] = (state.reelsByCheck[cc.id] || []).filter(r => r.id !== id);
      row.remove();
    });
  });
}

async function addReel(clipperId) {
  const cc = state.clipperChecks[clipperId];
  const { data, error } = await sb.from('diary_reels_perf')
    .insert({ clipper_check_id: cc.id, url: '', note: '' }).select().single();
  if (error) { toast(error.message, 'err'); return; }
  state.reelsByCheck[cc.id] = state.reelsByCheck[cc.id] || [];
  state.reelsByCheck[cc.id].push(data);
  const card = document.querySelector(`.clipper-card[data-clipper="${clipperId}"]`);
  const list = $(`[data-reels="${cc.id}"]`, card);
  const row = el(renderReelRow(data, false));
  list.appendChild(row);
  bindReelRows(card);
  $('[data-reel-url]', row).focus();
}

function updateClipperProgress(clipperId) {
  const cc = state.clipperChecks[clipperId];
  const items = ['habillage_complet','lien_ok','trois_reels_postes','story_postee','voyants_verts','contenu_telegram_dispo'];
  const done = items.filter(k => cc[k]).length;
  const card = document.querySelector(`.clipper-card[data-clipper="${clipperId}"]`);
  if (!card) return;
  const ringWrap = $('.ring-wrap', card);
  if (ringWrap) ringWrap.innerHTML = progressRing(done, items.length, { size: 44, stroke: 6 });
  const dim = $('.dim', card);
  if (dim) dim.textContent = `${done}/${items.length} contrôles`;
  card.classList.toggle('done', done === items.length && !cc.compte_banni && !cc.contenu_manquant && !cc.en_difficulte);
}

async function submitEntry() {
  if (!confirm('Clôturer la fiche du jour ? Tu pourras la rouvrir plus tard si besoin.')) return;
  const { error } = await sb.from('diary_daily_entries')
    .update({ status: 'submitted', submitted_at: new Date().toISOString(), auto_submitted: false })
    .eq('id', state.entry.id);
  if (error) { toast(error.message, 'err'); return; }
  const streak = await computeStreak();
  const msg = streak >= 7
    ? `🔥 ${streak+1} jours d'affilée !`
    : streak >= 3
    ? `🚀 ${streak+1} jours de série !`
    : streak >= 1
    ? `✅ Fiche du jour bouclée !`
    : `✅ Bien joué !`;
  celebrate(msg, { count: 180 });
  await renderDiary($('#app'));
}

async function reopenEntry() {
  if (!confirm('Rouvrir la fiche pour la modifier ?')) return;
  const { error } = await sb.from('diary_daily_entries')
    .update({
      status: 'draft',
      reopened_at: new Date().toISOString(),
      reopened_count: (state.entry.reopened_count || 0) + 1,
    })
    .eq('id', state.entry.id);
  if (error) { toast(error.message, 'err'); return; }
  toast('Fiche rouverte', 'ok');
  await renderDiary($('#app'));
}

// ----- Historique -----
async function renderHistory(main) {
  const { data, error } = await sb.from('diary_daily_entries')
    .select('id, date, status, submitted_at, auto_submitted')
    .eq('responsable_id', state.me.id)
    .order('date', { ascending: false }).limit(120);
  if (error) throw error;

  // Compute conformité par entrée pour colorer les cellules
  const ids = data.map(e => e.id);
  const [{ data: poleChecks }, { data: clipperChecks }] = await Promise.all([
    ids.length ? sb.from('diary_pole_checks').select('daily_entry_id, posting,cadence,habillage,aucun_compte_banni,contenu_telegram_ok,clics_suivis,reels_performants_remontes,clipper_aide,retour_envoye').in('daily_entry_id', ids) : Promise.resolve({data:[]}),
    ids.length ? sb.from('diary_clipper_checks').select('daily_entry_id, habillage_complet,lien_ok,trois_reels_postes,story_postee,voyants_verts,contenu_telegram_dispo').in('daily_entry_id', ids) : Promise.resolve({data:[]}),
  ]);
  const poleKeys = ['posting','cadence','habillage','aucun_compte_banni','contenu_telegram_ok','clics_suivis','reels_performants_remontes','clipper_aide','retour_envoye'];
  const clipperKeys = ['habillage_complet','lien_ok','trois_reels_postes','story_postee','voyants_verts','contenu_telegram_dispo'];
  const pctByEntry = {};
  ids.forEach(id => pctByEntry[id] = { done: 0, total: 0 });
  (poleChecks||[]).forEach(pc => { poleKeys.forEach(k => { pctByEntry[pc.daily_entry_id].total++; if (pc[k]) pctByEntry[pc.daily_entry_id].done++; }); });
  (clipperChecks||[]).forEach(cc => { clipperKeys.forEach(k => { pctByEntry[cc.daily_entry_id].total++; if (cc[k]) pctByEntry[cc.daily_entry_id].done++; }); });
  const entryByDate = {};
  data.forEach(e => { entryByDate[e.date] = { ...e, pct: pctByEntry[e.id]?.total ? Math.round(pctByEntry[e.id].done*100/pctByEntry[e.id].total) : 0 }; });

  // Heatmap 12 semaines (84 jours). Colonnes = semaines, lignes = jours (Lun→Dim).
  const NB_SEM = 12;
  const today = new Date(); today.setHours(0,0,0,0);
  const dow = (today.getDay() + 6) % 7; // 0 = lundi
  // Fin = dimanche de cette semaine, début = fin - 12*7 + 1
  const end = new Date(today); end.setDate(end.getDate() + (6 - dow));
  const start = new Date(end); start.setDate(start.getDate() - NB_SEM * 7 + 1);
  const cells = [];
  for (let w = 0; w < NB_SEM; w++) {
    const col = [];
    for (let d = 0; d < 7; d++) {
      const dt = new Date(start); dt.setDate(dt.getDate() + w*7 + d);
      const iso = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
      const e = entryByDate[iso];
      col.push({ iso, e, future: dt > today });
    }
    cells.push(col);
  }
  const cellHtml = (c) => {
    const label = c.iso;
    let cls = 'hm-cell', bg = 'var(--border)';
    if (c.future) { cls += ' hm-future'; }
    else if (c.e) {
      const p = c.e.pct;
      const alpha = 0.15 + (p/100)*0.85;
      bg = c.e.status === 'submitted'
        ? `rgba(34,197,94,${alpha.toFixed(2)})`
        : `rgba(245,158,11,${alpha.toFixed(2)})`;
    }
    const title = c.e
      ? `${label} · ${c.e.status === 'submitted' ? 'Clôturée' : 'Brouillon'} · ${c.e.pct}%`
      : `${label} · pas de fiche`;
    const click = c.e ? `onclick="location.hash='#/diary/${c.iso}'"` : '';
    return `<div class="${cls}" ${click} title="${title}" style="background:${bg};"></div>`;
  };
  const monthLabels = cells.map((col, i) => {
    const first = new Date(col[0].iso);
    if (first.getDate() <= 7) {
      const m = first.toLocaleDateString('fr-FR', { month: 'short' });
      return `<div class="hm-month" style="grid-column:${i+1};">${m}</div>`;
    }
    return '';
  }).join('');

  main.innerHTML = `
    <h1>Historique</h1>
    <div class="sub" style="margin-bottom:12px;">12 dernières semaines — clique un jour pour ouvrir la fiche.</div>

    <div class="card">
      <div class="hm-months" style="grid-template-columns: repeat(${NB_SEM}, 14px);">${monthLabels}</div>
      <div class="hm-grid" style="grid-template-columns: repeat(${NB_SEM}, 14px);">
        ${cells.map(col => `<div class="hm-col">${col.map(cellHtml).join('')}</div>`).join('')}
      </div>
      <div class="row" style="margin-top:14px; gap:12px; align-items:center; font-size:12px; color:var(--muted);">
        <span>Moins</span>
        <div style="display:flex; gap:3px;">
          <div class="hm-cell" style="background:var(--border);"></div>
          <div class="hm-cell" style="background:rgba(34,197,94,.20);"></div>
          <div class="hm-cell" style="background:rgba(34,197,94,.45);"></div>
          <div class="hm-cell" style="background:rgba(34,197,94,.70);"></div>
          <div class="hm-cell" style="background:rgba(34,197,94,1);"></div>
        </div>
        <span>Plus</span>
        <div style="width:12px;"></div>
        <div class="hm-cell" style="background:rgba(245,158,11,.5);"></div><span>Brouillon</span>
        <div class="hm-cell" style="background:rgba(34,197,94,.7);"></div><span>Clôturée</span>
      </div>
    </div>

    <h2>Détail des fiches</h2>
    <div class="card compact">
      ${!data.length
        ? `<div class="empty">Aucune fiche encore.</div>`
        : `<table class="table">
            <thead><tr><th>Date</th><th>Statut</th><th>Conformité</th><th>Clôturée</th></tr></thead>
            <tbody>
              ${data.map(e => `
                <tr style="cursor:pointer;" onclick="location.hash='#/diary/${e.date}'">
                  <td>${fmtDate(e.date)}</td>
                  <td><span class="pill ${e.status}">${e.status === 'draft' ? 'Brouillon' : (e.auto_submitted ? 'Clôturée (auto)' : 'Clôturée')}</span></td>
                  <td>${entryByDate[e.date]?.pct ?? 0}%</td>
                  <td>${e.submitted_at ? new Date(e.submitted_at).toLocaleString('fr-FR') : '—'}</td>
                </tr>`).join('')}
            </tbody>
           </table>`}
    </div>`;
}

// ----- Ops dashboard -----
async function renderOps(main) {
  if (state.me.role !== 'ops' && state.me.role !== 'admin') {
    main.innerHTML = `<div class="card empty">Accès réservé au Responsable des Opérations.</div>`;
    return;
  }
  const today = todayIso();
  const [{ data: alerts }, { data: entries }, { data: clippersRaw }, { data: polesRaw }] = await Promise.all([
    sb.from('diary_alerts')
      .select('id, type, created_at, clipper_id, responsable_id, resolved_at')
      .is('resolved_at', null).order('created_at', { ascending: false }),
    sb.from('diary_daily_entries')
      .select('id, date, status, submitted_at, responsable_id')
      .eq('date', today).order('submitted_at', { ascending: false, nullsFirst: false }),
    sb.from('diary_clippers')
      .select('id, nom, pole_id, actif, updated_at, archived_at')
      .eq('actif', true).order('nom'),
    sb.from('diary_poles').select('id, nom').is('archived_at', null).order('nom'),
  ]);

  const respIds = Array.from(new Set([...(alerts||[]).map(a => a.responsable_id), ...(entries||[]).map(e => e.responsable_id)]));
  const clipperIds = Array.from(new Set((alerts||[]).map(a => a.clipper_id).filter(Boolean)));
  const [{ data: resps }, { data: clips }] = await Promise.all([
    respIds.length ? sb.from('diary_responsables').select('id, nom').in('id', respIds) : Promise.resolve({ data: [] }),
    clipperIds.length ? sb.from('diary_clippers').select('id, nom').in('id', clipperIds) : Promise.resolve({ data: [] }),
  ]);
  const respName = Object.fromEntries((resps||[]).map(r => [r.id, r.nom]));
  const clipName = Object.fromEntries((clips||[]).map(c => [c.id, c.nom]));

  const clippersByPole = {};
  (polesRaw||[]).forEach(p => clippersByPole[p.id] = { pole: p, clippers: [] });
  (clippersRaw||[]).forEach(c => {
    if (clippersByPole[c.pole_id]) clippersByPole[c.pole_id].clippers.push(c);
  });
  const lastSync = (clippersRaw||[]).reduce((m, c) => c.updated_at > m ? c.updated_at : m, '');
  const totalActif = (clippersRaw||[]).length;

  main.innerHTML = `
    <h1>Dashboard Ops</h1>
    <div class="sub" style="margin-bottom:14px;">Fiches du jour, alertes ouvertes, état du roster.</div>

    <h2>Alertes ouvertes (${(alerts||[]).length})</h2>
    ${!(alerts||[]).length
      ? `<div class="card empty">Aucune alerte 🎉</div>`
      : `<div class="card compact"><table class="table">
          <thead><tr><th>Type</th><th>Clipper</th><th>Responsable</th><th>Depuis</th><th></th></tr></thead>
          <tbody>
            ${alerts.map(a => `
              <tr>
                <td><span class="badge">${a.type}</span></td>
                <td>${clipName[a.clipper_id] || '—'}</td>
                <td>${respName[a.responsable_id] || '—'}</td>
                <td>${new Date(a.created_at).toLocaleString('fr-FR')}</td>
                <td><button class="btn ghost" data-resolve="${a.id}" style="padding:4px 10px; font-size:13px;">Résoudre</button></td>
              </tr>`).join('')}
          </tbody>
         </table></div>`}

    <h2>Fiches du jour (${(entries||[]).length})</h2>
    <div class="card compact">
      ${!(entries||[]).length
        ? `<div class="empty">Aucune fiche remplie aujourd'hui.</div>`
        : `<table class="table">
            <thead><tr><th>Responsable</th><th>Statut</th><th>Clôturée</th></tr></thead>
            <tbody>
              ${entries.map(e => `
                <tr>
                  <td>${respName[e.responsable_id] || '—'}</td>
                  <td><span class="pill ${e.status}">${e.status === 'draft' ? 'Brouillon' : 'Clôturée'}</span></td>
                  <td>${e.submitted_at ? new Date(e.submitted_at).toLocaleString('fr-FR') : '—'}</td>
                </tr>`).join('')}
            </tbody>
           </table>`}
    </div>

    <h2>Analytics · 30 derniers jours</h2>
    <div class="card" id="analyticsCard">
      <div class="empty">Chargement…</div>
    </div>

    <h2>Export data</h2>
    <div class="card">
      <div class="row wrap" style="gap:12px; align-items:end;">
        <div>
          <div class="sub" style="margin-bottom:4px;">Du</div>
          <input type="date" id="expFrom" value="${(() => { const d=new Date(); d.setDate(d.getDate()-30); return d.toISOString().slice(0,10); })()}">
        </div>
        <div>
          <div class="sub" style="margin-bottom:4px;">Au</div>
          <input type="date" id="expTo" value="${todayIso()}">
        </div>
        <div>
          <div class="sub" style="margin-bottom:4px;">Format</div>
          <select id="expFormat">
            <option value="csv">CSV (par contrôle clipper)</option>
            <option value="csv_pole">CSV (par contrôle pôle)</option>
            <option value="json">JSON complet (fiches + checks + alertes)</option>
          </select>
        </div>
        <div>
          <div class="sub" style="margin-bottom:4px;">Statut</div>
          <select id="expStatus">
            <option value="all">Toutes</option>
            <option value="submitted">Clôturées seulement</option>
            <option value="draft">Brouillons seulement</option>
          </select>
        </div>
        <button class="btn" id="expBtn">⬇ Télécharger</button>
      </div>
      <div class="sub" style="margin-top:10px; font-size:12px;">
        Le CSV inclut date, responsable, pôle, clipper, chacun des contrôles (OUI/NON),
        note libre, toggles rouges, reels perfs. Idéal pour ouvrir dans Excel/Sheets ou
        alimenter un dashboard externe.
      </div>
    </div>

    <h2>Roster clippers (${totalActif} actifs)</h2>
    <div class="card">
      <div class="row between" style="margin-bottom:10px;">
        <div class="sub">
          ${lastSync
            ? `Dernière MAJ : ${new Date(lastSync).toLocaleString('fr-FR')}`
            : 'Aucune sync encore.'}
        </div>
        <div class="row" style="gap:8px;">
          <button class="btn ghost" id="rosterReload" style="padding:6px 12px; font-size:13px;">🔄 Recharger</button>
          <button class="btn" id="rosterSyncReq" style="padding:6px 12px; font-size:13px;">📣 Demander une sync au bot</button>
        </div>
      </div>
      ${!Object.values(clippersByPole).some(x => x.clippers.length)
        ? `<div class="empty">Aucun clipper actif rattaché à un pôle.</div>`
        : `<table class="table">
            <thead><tr><th>Pôle</th><th>Nb</th><th>Clippers</th></tr></thead>
            <tbody>
              ${Object.values(clippersByPole).map(({pole, clippers}) => `
                <tr>
                  <td><b>${pole.nom}</b></td>
                  <td>${clippers.length}</td>
                  <td class="sub">${clippers.map(c => c.nom).join(', ') || '—'}</td>
                </tr>`).join('')}
            </tbody>
           </table>`}
      <div class="sub" style="margin-top:10px; font-size:12px;">
        Le bot Telegram pousse automatiquement les clippers à chaque
        <code>/attribu</code>. Pour resync manuel (rattraper ancien roster
        ou déclencher un archivage), tape <code>/diarysync</code> dans le bot,
        ou clique sur le bouton ci-dessus pour recevoir un rappel Telegram.
      </div>
    </div>
  `;

  $('#rosterReload', main).addEventListener('click', () => renderOps(main));
  $('#rosterSyncReq', main).addEventListener('click', requestSyncFromBot);
  $('#expBtn', main).addEventListener('click', doExport);
  renderAnalytics().catch(e => console.error('analytics', e));

  // Live : re-render dès qu'une alerte est créée / résolue / une fiche mise à jour.
  if (state.opsChannel) sb.removeChannel(state.opsChannel);
  state.opsChannel = sb.channel('ops-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'diary_alerts' }, () => {
      toast('Alerte mise à jour — refresh', 'ok');
      renderOps(main);
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'diary_daily_entries' }, () => {
      renderOps(main);
    })
    .subscribe();

  $$('[data-resolve]', main).forEach(btn => btn.addEventListener('click', async () => {
    const id = btn.dataset.resolve;
    const { error } = await sb.from('diary_alerts')
      .update({ resolved_at: new Date().toISOString(), resolved_by: state.me.id }).eq('id', id);
    if (error) return toast(error.message, 'err');
    toast('Alerte résolue', 'ok');
    renderOps(main);
  }));
}

// ----- Analytics (dashboard Ops) -----
async function renderAnalytics() {
  const wrap = $('#analyticsCard');
  if (!wrap) return;
  const to = new Date(); const from = new Date(); from.setDate(from.getDate() - 29);
  const isoFrom = from.toISOString().slice(0, 10);
  const isoTo   = to.toISOString().slice(0, 10);
  const { data: entries, error: ee } = await sb.from('diary_daily_entries')
    .select('id, date').gte('date', isoFrom).lte('date', isoTo);
  if (ee) { wrap.innerHTML = `<div class="banner error">${ee.message}</div>`; return; }
  if (!entries.length) { wrap.innerHTML = `<div class="empty">Pas encore de données sur cette période.</div>`; return; }
  const ids = entries.map(e => e.id);
  const [{ data: poleChecks }, { data: clipperChecks }, { data: clippers }] = await Promise.all([
    sb.from('diary_pole_checks').select('*').in('daily_entry_id', ids),
    sb.from('diary_clipper_checks').select('*').in('daily_entry_id', ids),
    sb.from('diary_clippers').select('id, nom'),
  ]);
  const clipName = Object.fromEntries((clippers||[]).map(c => [c.id, c.nom]));
  const dateOf = Object.fromEntries(entries.map(e => [e.id, e.date]));
  const poleKeys = ['posting','cadence','habillage','aucun_compte_banni','contenu_telegram_ok','clics_suivis','reels_performants_remontes','clipper_aide','retour_envoye'];
  const clipperKeys = ['habillage_complet','lien_ok','trois_reels_postes','story_postee','voyants_verts','contenu_telegram_dispo'];

  // Aggrégat par jour
  const byDay = {};   // date → {done, total}
  for (let d = new Date(from); d <= to; d.setDate(d.getDate() + 1)) {
    const iso = d.toISOString().slice(0, 10);
    byDay[iso] = { done: 0, total: 0 };
  }
  (poleChecks||[]).forEach(pc => {
    const iso = dateOf[pc.daily_entry_id]; if (!iso || !byDay[iso]) return;
    poleKeys.forEach(k => { byDay[iso].total++; if (pc[k]) byDay[iso].done++; });
  });
  (clipperChecks||[]).forEach(cc => {
    const iso = dateOf[cc.daily_entry_id]; if (!iso || !byDay[iso]) return;
    clipperKeys.forEach(k => { byDay[iso].total++; if (cc[k]) byDay[iso].done++; });
  });

  // Aggrégat par clipper (30j)
  const byClip = {};  // clipper_id → {done, total}
  (clipperChecks||[]).forEach(cc => {
    if (!dateOf[cc.daily_entry_id]) return;
    const b = byClip[cc.clipper_id] ||= { done: 0, total: 0, nom: clipName[cc.clipper_id] || '?' };
    clipperKeys.forEach(k => { b.total++; if (cc[k]) b.done++; });
  });
  const clipRanking = Object.entries(byClip)
    .filter(([, v]) => v.total >= 6)   // au moins 1 fiche
    .map(([, v]) => ({ ...v, pct: v.done / v.total * 100 }))
    .sort((a, b) => b.pct - a.pct);
  const top3  = clipRanking.slice(0, 3);
  const flop3 = clipRanking.slice(-3).reverse();

  // Chart : point pour chaque jour où total > 0
  const days = Object.entries(byDay).map(([d, v]) => ({ d, pct: v.total ? v.done / v.total * 100 : null }));
  const daysNonNull = days.filter(x => x.pct !== null);
  const avg = daysNonNull.length ? Math.round(daysNonNull.reduce((s, x) => s + x.pct, 0) / daysNonNull.length) : 0;
  const best = daysNonNull.length ? Math.round(Math.max(...daysNonNull.map(x => x.pct))) : 0;
  const nbFiches = entries.length;
  const nbClot = (await sb.from('diary_daily_entries').select('id',{count:'exact', head:true}).in('id', ids).eq('status','submitted')).count || 0;

  // Build SVG line chart
  const W = 720, H = 180, PAD = { l: 34, r: 12, t: 14, b: 22 };
  const iw = W - PAD.l - PAD.r, ih = H - PAD.t - PAD.b;
  const n = days.length;
  const xOf = (i) => PAD.l + (n > 1 ? (i * iw / (n - 1)) : iw / 2);
  const yOf = (p) => PAD.t + ih - (p / 100) * ih;
  // Ligne + area (segments : si null, on saute)
  let pathD = '', areaD = '', prevX = null;
  days.forEach((x, i) => {
    if (x.pct === null) { prevX = null; return; }
    const px = xOf(i), py = yOf(x.pct);
    if (prevX === null) { pathD += `M ${px} ${py} `; areaD += `M ${px} ${yOf(0)} L ${px} ${py} `; }
    else { pathD += `L ${px} ${py} `; areaD += `L ${px} ${py} `; }
    prevX = px;
  });
  // Fermer l'area jusqu'à la ligne 0
  if (areaD) {
    const lastIdxWithVal = days.map((x,i)=>x.pct!==null?i:-1).filter(i=>i>=0).pop();
    const lastX = xOf(lastIdxWithVal);
    areaD += `L ${lastX} ${yOf(0)} Z`;
  }
  const dots = days.map((x, i) => x.pct !== null
    ? `<circle cx="${xOf(i)}" cy="${yOf(x.pct)}" r="3" fill="#a78bfa"/>` : '').join('');
  const xLabels = [0, Math.floor(n/2), n-1].filter(i => days[i]).map(i =>
    `<text x="${xOf(i)}" y="${H-6}" text-anchor="middle" fill="#8a94a4" font-size="10">${days[i].d.slice(5)}</text>`
  ).join('');
  const yLabels = [0, 50, 100].map(p =>
    `<text x="${PAD.l-6}" y="${yOf(p)+3}" text-anchor="end" fill="#8a94a4" font-size="10">${p}%</text>
     <line x1="${PAD.l}" y1="${yOf(p)}" x2="${W-PAD.r}" y2="${yOf(p)}" stroke="#232a35" stroke-dasharray="2,3"/>`
  ).join('');

  wrap.innerHTML = `
    <div class="stats-row">
      <div class="stat accent"><div class="k">Conformité moyenne</div><div class="v">${avg}%</div></div>
      <div class="stat"><div class="k">Meilleur jour</div><div class="v">${best}%</div></div>
      <div class="stat"><div class="k">Fiches remplies</div><div class="v">${nbFiches}</div></div>
      <div class="stat"><div class="k">Clôturées</div><div class="v">${nbClot}<span class="dim" style="font-size:14px; font-weight:500;"> / ${nbFiches}</span></div></div>
    </div>
    <div style="margin-top:14px; overflow-x:auto;">
      <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="max-width:100%;">
        <defs>
          <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#a78bfa" stop-opacity=".35"/>
            <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
          </linearGradient>
        </defs>
        ${yLabels}
        ${areaD ? `<path d="${areaD}" fill="url(#areaGrad)"/>` : ''}
        ${pathD ? `<path d="${pathD}" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>` : ''}
        ${dots}
        ${xLabels}
      </svg>
    </div>
    <div class="row wrap" style="gap:20px; margin-top:14px;">
      <div style="flex:1; min-width:240px;">
        <div class="sub" style="margin-bottom:6px; font-weight:600; color:#bbf7d0;">🏆 Top 3 clippers</div>
        ${!top3.length ? `<div class="dim">—</div>` : `<div class="checklist">
          ${top3.map(c => `
            <div class="row between" style="padding:8px 12px; background:var(--panel-2); border:1px solid rgba(34,197,94,.3); border-radius:10px;">
              <span>${c.nom}</span>
              <b style="color:#86efac;">${Math.round(c.pct)}%</b>
            </div>`).join('')}
        </div>`}
      </div>
      <div style="flex:1; min-width:240px;">
        <div class="sub" style="margin-bottom:6px; font-weight:600; color:#fecaca;">⚠ Flop 3 clippers</div>
        ${!flop3.length ? `<div class="dim">—</div>` : `<div class="checklist">
          ${flop3.map(c => `
            <div class="row between" style="padding:8px 12px; background:var(--panel-2); border:1px solid rgba(239,68,68,.3); border-radius:10px;">
              <span>${c.nom}</span>
              <b style="color:#fca5a5;">${Math.round(c.pct)}%</b>
            </div>`).join('')}
        </div>`}
      </div>
    </div>
  `;
}
