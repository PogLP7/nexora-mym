<!-- ===== REDIRECTION IMMEDIATE (ajoutee le 19/10/2026) =====
     Un seul clic depuis la bio : ce script part AVANT le rendu, le visiteur
     ne voit jamais cette page. Elle reste en dessous comme repli.
     Le clic est logge dans Orbit sans bloquer le depart (keepalive) ; si Orbit
     ne repond pas ou si le slug n'est pas encore en base, la redirection part
     quand meme -- le tracking n'est jamais un point de panne.
     Source : ?c=insta, ?c=story, ?c=bio... (defaut : bio).
     Pour repasser en vraie landing : supprimer ce bloc, le bouton remarche. -->
<script>
(function(){
  var DEST  = "https://t.me/amandineprive";
  var SLUG  = "amandine-tg-insta";
  var ORBIT = "https://bvcnbtbdfkoiefuedxem.supabase.co/functions/v1/go";
  try{
    var c = (new URLSearchParams(location.search).get("c") || "bio");
    var u = ORBIT + "?l=" + encodeURIComponent(SLUG) + "&c=" + encodeURIComponent(c) + "&x=1";
    if (window.fetch) { fetch(u, {mode:"no-cors", cache:"no-store", keepalive:true}); }
    else { (new Image()).src = u; }
  }catch(e){}
  location.replace(DEST);
})();
</script>

<style>

<body>
<div class="card">

  <span class="loc" id="locwrap" style="display:none"><span class="pin"></span> <span id="loc"></span></span>

  <div class="photo">
    <img id="hero" alt="Amandine" fetchpriority="high">
    <script>
      /* Pool de photos — une au hasard à chaque ouverture.
         Ajoute/retire des fichiers ici, ils doivent être à côté de index.html. */
      var POOL = ["p1.jpg", "p2.jpg", "p3.jpg"];
      var PICK = POOL[Math.floor(Math.random() * POOL.length)];
      document.getElementById("hero").src = PICK;
      /* mémorisé pour l'attribution : on saura quelle photo a produit le clic */
      window.__photo = PICK.replace(".jpg", "");
    </script>
    <span class="cnt" id="cnt">4 000 abonnés</span>
    <div class="id">
      <div class="name"><b>Amandine</b>
        <svg class="vf" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#3b9eff"/><path d="M8 12.3l2.6 2.6L16 9.4" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>

  <div class="hook" id="hook">Mon côté privé, sans filtre.<br><b>Je réponds à tout</b>&nbsp;🤍</div>

    <div class="b"><div class="n" id="h">00</div><div class="u">h</div></div>

    <div class="b"><div class="n" id="s">49</div><div class="u">sec</div></div>
  </div>

  <a class="cta" id="cta" href="#" rel="noopener"><span class="sh"></span>💬 M'écrire en privé</a>

  <div class="foot"><span>🔞 +18 · privé</span></div>
</div>

<script>
/* ============ CONFIG — tout se règle ici ============ */
var DEST = "https://t.me/amandineprive";
/* Variantes :
   OF direct   : var DEST = "https://onlyfans.com/amandinedlc";
   avec tracking (log orbit_clicks puis 302, slug deja prepare dans orbit-liens.sql) :
                 var DEST = "https://bvcnbtbdfkoiefuedxem.supabase.co/functions/v1/go?l=amandine-tg-insta&x=1"; */

var ALT = [
  /* {label:"Telegram", url:"https://t.me/XXXXX", icon:"tg"}, */
  /* {label:"Instagram", url:"https://instagram.com/XXXXX", icon:"ig"} */
];
var SUBS = "4 000 abonnés";
var CITY_HOOK = true;   /* la ville du visiteur passe en surtitre du hook */
var COUNTDOWN_ON = false;   /* true = reaffiche le bloc "gratuit pendant" */
var COUNTDOWN = 59 * 60 + 49;

/* --- Filtre géographique (repris de la restriction GeoFilter GMS) --- */
var GEO_ON    = true;
var GEO_ALLOW = ["FR", "BE", "CH", "CA", "LU", "MC", "AD"];
/* FR France · BE Belgique · CH Suisse · CA Canada · LU Luxembourg · MC Monaco · AD Andorre */

/* Que faire si AUCUNE des deux API géo ne répond ?
   false = on bloque (on protège, au prix de quelques visiteurs légitimes perdus)
   true  = on laisse passer (on convertit, au prix du filtre qui saute) */
var GEO_FAIL_OPEN = false;

/* Visiteur hors zone : laisser "" pour la page de blocage,
   ou mettre une URL pour le rediriger ailleurs. */
var GEO_REDIRECT = "";
/* ==================================================== */

(function () {
  /* --- CTA : garde le param clippeur (?c=) pour l'attribution --- */
  var c = new URLSearchParams(location.search).get("c");
  var dest = DEST;
  /* t.me ignore les query params : on n'ajoute le clippeur que sur une cible qui sait le lire */
  if (dest.indexOf("t.me/") === -1) {
    if (c) { dest += (dest.indexOf("?") > -1 ? "&" : "?") + "c=" + encodeURIComponent(c); }
    /* quelle photo était affichée au moment du clic */
    if (window.__photo) { dest += (dest.indexOf("?") > -1 ? "&" : "?") + "p=" + encodeURIComponent(window.__photo); }
  }
  document.getElementById("cta").href = dest;

  document.getElementById("cnt").textContent = SUBS;

  /* --- Liens secondaires --- */
  var ICONS = {
    tg: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.3 18.9 19c-.2 1-.8 1.2-1.7.8l-4.6-3.4-2.2 2.1c-.3.3-.5.5-1 .5l.3-4.6 8.5-7.7c.4-.3-.1-.5-.6-.2L7.2 13 2.7 11.6c-1-.3-1-1 .2-1.4l17.6-6.8c.8-.3 1.5.2 1.4 1.1z"/></svg>',
    ig: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.6" cy="6.4" r="1.2" fill="currentColor" stroke="none"/></svg>',
    tt: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 2h-3v13.3a2.7 2.7 0 1 1-2.7-2.7c.3 0 .5 0 .8.1V9.6a6 6 0 1 0 5 5.9V9.2a6.7 6.7 0 0 0 3.9 1.2V7.3a3.8 3.8 0 0 1-4-3.5z"/></svg>'
  };
  var box = document.getElementById("alt"), html = "";
  for (var i = 0; i < ALT.length; i++) {
    var a = ALT[i];
    html += '<a href="' + a.url + '" rel="noopener">' + (ICONS[a.icon] || "") + a.label + "</a>";
  }
  box.innerHTML = html;
  if (!ALT.length) { box.style.display = "none"; }

  /* --- Géo : filtre pays + ville du hook, en un seul appel --------------
     Deux sources en cascade, toutes deux CORS et sans quota serré.
     ipapi.co a été retiré : son offre gratuite est rate-limitée et renvoyait
     déjà des erreurs, ce qui aurait ouvert le filtre sous charge.           */

  function withTimeout(url, ms) {
    return new Promise(function (ok, ko) {
      var done = false;
      var t = setTimeout(function () { if (!done) { done = true; ko(); } }, ms);
      fetch(url, { mode: "cors", cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (j) { if (!done) { done = true; clearTimeout(t); ok(j); } })
        .catch(function () { if (!done) { done = true; clearTimeout(t); ko(); } });
    });
  }

  function lookup() {
    /* 1er : pays + ville */
    return withTimeout("https://ipwho.is/", 4000)
      .then(function (g) {
        if (!g || g.success === false || !g.country_code) { throw 0; }
        return { cc: String(g.country_code).toUpperCase(), city: g.city || "" };
      })
      /* 2e : pays seul, si le premier tombe */
      .catch(function () {
        return withTimeout("https://get.geojs.io/v1/ip/country.json", 4000)
          .then(function (g) {
            if (!g || !g.country) { throw 0; }
            return { cc: String(g.country).toUpperCase(), city: "" };
          });
      });
  }

  function block() {
    if (GEO_REDIRECT) { location.replace(GEO_REDIRECT); return; }
    document.body.innerHTML =
      '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px">' +
      '<div style="text-align:center;max-width:320px">' +
      '<div style="font-size:15px;font-weight:800;margin-bottom:8px">Page indisponible</div>' +
      '<div style="font-size:13.5px;line-height:1.5;color:rgba(255,255,255,.55)">' +
      "Ce contenu n'est pas accessible depuis ton pays." +
      "</div></div></div>";
    document.body.style.visibility = "visible";
  }

  function reveal(city) {
    if (city) {
      document.getElementById("loc").textContent = city;
      if (CITY_HOOK) {
        document.getElementById("hook").insertAdjacentHTML("afterbegin",
          '<span class="city">' + city + ' 🔥</span>');
      } else {
        document.getElementById("locwrap").style.display = "inline-flex";
      }
    }
    document.body.style.visibility = "visible";
  }

  /* Sur Cloudflare Pages, _middleware.js a déjà filtré le pays côté serveur
     et injecté la ville : aucun appel API à faire, aucun quota à subir. */
  if (window.__GEO) {
    reveal(window.__GEO.city || "");
  } else if (!GEO_ON) {
    reveal("");
    lookup().then(function (g) { if (g.city) { reveal(g.city); } }).catch(function () {});
  } else {
    lookup()
      .then(function (g) {
        if (GEO_ALLOW.indexOf(g.cc) === -1) { block(); } else { reveal(g.city); }
      })
      .catch(function () {
        /* aucune source n'a répondu */
        if (GEO_FAIL_OPEN) { reveal(""); } else { block(); }
      });
  }

  /* --- Compte à rebours --- */
  if (!COUNTDOWN_ON) {
    document.querySelector(".cdlab").style.display = "none";
    document.querySelector(".cd").style.display = "none";
    document.getElementById("cta").style.marginTop = "4px";
    return;
  }
  var t = COUNTDOWN;
  function p(n) { return (n < 10 ? "0" : "") + n; }
  function r() {
    document.getElementById("h").textContent = p(Math.floor(t / 3600));
    document.getElementById("m").textContent = p(Math.floor(t % 3600 / 60));
    document.getElementById("s").textContent = p(t % 60);
  }
  r();
  setInterval(function () { t = t > 0 ? t - 1 : COUNTDOWN; r(); }, 1000);
})();
</script>
