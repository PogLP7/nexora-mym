<!doctype html><html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#061412">
<title>Amandine</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --fm:ui-monospace,"SF Mono",Menlo,monospace;
  --g1:#3FD07E;--g2:#25E8C3;
  --bg:#061412;--ink:#fff;--mut:rgba(255,255,255,.55)
}
html,body{min-height:100%}
body{
  font-family:var(--f);-webkit-font-smoothing:antialiased;color:var(--ink);
  background:radial-gradient(120% 50% at 50% -10%,rgba(63,208,126,.20),transparent 60%),var(--bg);
  display:flex;flex-direction:column;align-items:center;
  padding:30px 16px 36px;min-height:100vh;
  visibility:hidden
}
.card{width:100%;max-width:400px;text-align:center;
  animation:in .5s cubic-bezier(.16,1,.3,1) both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.city{display:block;font-size:10.5px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:16px;min-height:12px}

.av{width:104px;height:104px;border-radius:50%;margin:0 auto 15px;position:relative;z-index:2}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:center 20%;
  display:block;box-shadow:0 0 0 2px var(--g1),0 0 34px rgba(63,208,126,.42)}
.av::before{content:"";position:absolute;left:50%;top:50%;width:240px;height:240px;
  transform:translate(-50%,-50%);border-radius:50%;z-index:-1;pointer-events:none;
  background:radial-gradient(circle,rgba(63,208,126,.34),transparent 68%);
  animation:halo 3.6s ease-in-out infinite}
@keyframes halo{0%,100%{opacity:.7;transform:translate(-50%,-50%) scale(.92)}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}}

h1{font-size:23px;font-weight:800;letter-spacing:-.015em}
.line{font-size:14px;color:var(--mut);margin-top:6px;line-height:1.5}

.links{display:flex;flex-direction:column;gap:10px;margin-top:26px}
.links a{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff;
  font-size:15px;font-weight:600;text-align:left;
  padding:15px 16px;border-radius:14px;
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.11);
  -webkit-tap-highlight-color:transparent;
  transition:background .15s ease,transform .12s ease}
.links a:active{background:rgba(255,255,255,.1);transform:scale(.99)}
.links a .ic{width:19px;height:19px;flex:0 0 auto;opacity:.85}
.links a .ar{margin-left:auto;opacity:.3;font-size:16px}

/* la destination principale, mise en avant sans nommer de plateforme */
.links a.main{color:#06201A;background:var(--g1);border-color:transparent;
  font-weight:800;box-shadow:0 10px 28px rgba(63,208,126,.3)}
.links a.main .ic,.links a.main .ar{opacity:.85}
.links a.main:active{background:var(--g2)}

.foot{margin-top:24px;padding-top:14px;border-top:1px solid rgba(255,255,255,.08);
  font-size:10px;font-family:var(--fm);letter-spacing:.05em;color:rgba(255,255,255,.26)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<div class="card">

  <span class="city" id="city"></span>

  <div class="av"><img id="hero" alt="Amandine" fetchpriority="high">
    <script>
      var POOL = ["p1.jpg", "p2.jpg", "p3.jpg"];
      document.getElementById("hero").src = POOL[Math.floor(Math.random() * POOL.length)];
    </script>
  </div>

  <h1>Amandine</h1>
  <div class="line">Mes réseaux et mon contenu, au même endroit.</div>

  <div class="links" id="links"></div>

  <div class="foot">Amandine · 2026</div>
</div>

<script>
/* ============ CONFIG ============

   Structure reprise de la grille GetMySocial pour les créateurs 18+ :
   plusieurs destinations réelles, libellés sans nom de plateforme pour
   la destination adulte, et celle-ci placée derrière la porte 18+ de /t/
   plutôt qu'en clair dans le HTML.

   Le lien Telegram n'apparaît QUE dans /t/index.html, après confirmation d'âge.
*/

var LINKS = [
  /* Décision 24/10 : la page ne ramène QUE sur le canal Telegram.
     Si un compte Insta actif existe un jour, c'est ici qu'il va. */
  /* { label: "Instagram",  url: "https://instagram.com/A_REMPLIR", icon: "ig" }, */
  /* { label: "TikTok",     url: "https://tiktok.com/@A_REMPLIR",   icon: "tt" }, */
  { label: "Accès privé", url: "t/", icon: "lock", main: true }
];

var CITY_HOOK = true;

/* --- Filtre pays ---
   ⚠️ En JavaScript, il ne s'applique PAS à un crawler : il faut le passer
   côté serveur (voir MIGRATION-CLOUDFLARE.md). */
var GEO_ON    = true;
var GEO_ALLOW = ["FR", "BE", "CH", "CA", "LU", "MC", "AD"];
var GEO_FAIL_OPEN = false;
/* ================================= */

(function () {
  var ICONS = {
    ig:   '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.6" cy="6.4" r="1.2" fill="currentColor" stroke="none"/></svg>',
    tt:   '<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 2h-3v13.3a2.7 2.7 0 1 1-2.7-2.7c.3 0 .5 0 .8.1V9.6a6 6 0 1 0 5 5.9V9.2a6.7 6.7 0 0 0 3.9 1.2V7.3a3.8 3.8 0 0 1-4-3.5z"/></svg>',
    gift: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M3 12h18M12 8v13"/><path d="M12 8S10.5 3 8 3a2.5 2.5 0 0 0 0 5zM12 8s1.5-5 4-5a2.5 2.5 0 0 1 0 5z"/></svg>',
    lock: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>'
  };

  var c = new URLSearchParams(location.search).get("c");
  var html = "";
  for (var i = 0; i < LINKS.length; i++) {
    var L = LINKS[i], u = L.url;
    if (!u) { continue; }   /* ligne non renseignée : on ne l'affiche pas */
    if (L.main && c) { u += "?c=" + encodeURIComponent(c); }
    html += '<a class="' + (L.main ? "main" : "") + '" href="' + u + '" rel="noopener">'
          + (ICONS[L.icon] || "") + L.label + '<span class="ar">›</span></a>';
  }
  document.getElementById("links").innerHTML = html;

  function withTimeout(url, ms) {
    return new Promise(function (ok, ko) {
      var done = false;
      var t = setTimeout(function () { if (!done) { done = true; ko(); } }, ms);
      fetch(url, { mode: "cors", cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (j) { if (!done) { done = true; clearTimeout(t); ok(j); } })
        .catch(function () { if (!done) { done = true; clearTimeout(t); ko(); } });
    });
  }

  function lookup() {
    return withTimeout("https://ipwho.is/", 4000)
      .then(function (g) {
        if (!g || g.success === false || !g.country_code) { throw 0; }
        return { cc: String(g.country_code).toUpperCase(), city: g.city || "" };
      })
      .catch(function () {
        return withTimeout("https://get.geojs.io/v1/ip/country.json", 4000)
          .then(function (g) {
            if (!g || !g.country) { throw 0; }
            return { cc: String(g.country).toUpperCase(), city: "" };
          });
      });
  }

  function block() {
    document.body.innerHTML =
      '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px">' +
      '<div style="text-align:center;max-width:320px">' +
      '<div style="font-size:15px;font-weight:700;margin-bottom:8px">Page indisponible</div>' +
      '<div style="font-size:13.5px;line-height:1.5;color:rgba(255,255,255,.55)">' +
      "Cette page n'est pas accessible depuis ton pays." +
      "</div></div></div>";
    document.body.style.visibility = "visible";
  }

  function reveal(city) {
    if (city && CITY_HOOK) { document.getElementById("city").textContent = city; }
    document.body.style.visibility = "visible";
  }

  if (window.__GEO) {
    reveal(window.__GEO.city || "");
  } else if (!GEO_ON) {
    reveal("");
  } else {
    lookup()
      .then(function (g) {
        if (GEO_ALLOW.indexOf(g.cc) === -1) { block(); } else { reveal(g.city); }
      })
      .catch(function () { if (GEO_FAIL_OPEN) { reveal(""); } else { block(); } });
  }
})();
</script>
</body></html>
